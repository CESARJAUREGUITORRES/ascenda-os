name: WA-L10 R6 conversation UX patch

on:
  push:
    branches:
      - wa-l10-r6-conversation-ux-fastlane-20260905
    paths:
      - .github/workflows/wa-l10-r6-patch.yml
      - ci/wa-l10/r6_patch_tmp.py
      - ci/wa-l10/r6_test_fix_tmp.py

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wa-l10-r6-conversation-ux-fastlane-20260905
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply scoped R6 patch
        run: |
          python ci/wa-l10/r6_patch_tmp.py
          python ci/wa-l10/r6_test_fix_tmp.py
          python -c "from pathlib import Path; p=Path('app/wa-l10-autonomous-bridge.test.js'); p.write_text(p.read_text().rstrip()+'\\n')"
      - name: R6 syntax and focused regression gates
        run: |
          node --check app/wa4-copilot.js
          node --check app/wa-l10-autonomous-bridge.js
          node --check app/server-wa4.js
          node --test ci/wa4-ai-sales-router/r6-conversation-ux-fastlane.test.js
          node --test ci/wa4-ai-sales-router/ai-router.test.js
          node --test app/wa-l10-autonomous-bridge.test.js
          node ci/wa-l10/autonomous_bridge_contract.test.js
      - name: Commit scoped R6 product patch
        run: |
          git config user.name "ascenda-r6-bot"
          git config user.email "ascenda-r6-bot@users.noreply.github.com"
          git add app/wa4-copilot.js app/wa-l10-autonomous-bridge.js app/server-wa4.js app/wa-l10-autonomous-bridge.test.js ci/wa-l10/autonomous_bridge_contract.test.js ci/wa4-ai-sales-router/r6-conversation-ux-fastlane.test.js ci/wa4-ai-sales-router/ai-router.test.js
          git diff --cached --check
          git commit -m "WA-L10 R6: restore Sofia UX, typing indicator and deterministic price fast lane"
          git push origin HEAD:wa-l10-r6-conversation-ux-fastlane-20260905
