name: sales-panel-patch
on:
  push:
    branches:
      - feat/sales-top-products-services-20260813
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sales-top-products-services-20260813
          fetch-depth: 0
      - name: apply
        run: |
          if git log -1 --pretty=%B | grep -Fq '[sales-panel-patched]'; then exit 0; fi
          python scripts/patch_sales_panel_20260813.py
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('app/public/admin-sales.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',t,re.S)
          if not scripts: raise SystemExit('No script block found')
          Path('/tmp/admin-sales.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/admin-sales.js
          git diff --check
          git config user.name 'ASCENDA OS Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add app/public/admin-sales.html
          git commit -m 'feat(sales): add top products services and lighter detail [sales-panel-patched]'
          git push origin HEAD:feat/sales-top-products-services-20260813
