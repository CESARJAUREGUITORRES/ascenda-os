name: One-shot Import Sales Confirmation Patch

on:
  push:
    branches:
      - fix/import-sales-confirmation
    paths:
      - scripts/one_shot_patch_import_sales_confirmation.mjs
      - .github/workflows/one-shot-import-sales-confirmation.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Patch app.html safely
        run: node scripts/one_shot_patch_import_sales_confirmation.mjs
      - name: Remove one-shot patch machinery
        run: rm -f scripts/one_shot_patch_import_sales_confirmation.mjs .github/workflows/one-shot-import-sales-confirmation.yml
      - name: Commit patched app only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add guarded confirmation before importing sales"
          git push origin HEAD:${{ github.ref_name }}
