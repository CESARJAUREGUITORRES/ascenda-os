name: ASC-PERF PRC Event Driven Patch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/asc-perf-prc-event-driven-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/asc-perf-prc-event-driven-20260824
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply exact PRC event-driven patch
        shell: powershell
        run: |
          @'
          const fs=require('fs');
          const path='app/public/rev-prc1-product-resolution-center.js';
          function replaceOne(oldText,newText){
            const src=fs.readFileSync(path),oldBuf=Buffer.from(oldText,'ascii'),newBuf=Buffer.from(newText,'ascii');
            const first=src.indexOf(oldBuf);
            if(first<0)throw new Error('PRC target not found: '+oldText.slice(0,120));
            if(src.indexOf(oldBuf,first+1)>=0)throw new Error('PRC target not unique: '+oldText.slice(0,120));
            fs.writeFileSync(path,Buffer.concat([src.subarray(0,first),newBuf,src.subarray(first+oldBuf.length)]));
          }
          replaceOne(
            "function ensureButton(){\r\n  injectStyles();var host=buttonHost();if(!host)return;\r\n  var b=document.getElementById('prc1-products-review-btn');\r\n  if(!b){b=document.createElement('button');b.id='prc1-products-review-btn';b.type='button';b.className='prc1-btn';b.textContent='",
            "function ensureButton(){\r\n  injectStyles();var host=buttonHost();if(!host)return;\r\n  var b=document.getElementById('prc1-products-review-btn'),created=false;\r\n  if(!b){created=true;b=document.createElement('button');b.id='prc1-products-review-btn';b.type='button';b.className='prc1-btn';b.textContent='");
          replaceOne(
            "  if(Date.now()-lastBadgeLoad>3000)refreshBadge();\r\n}",
            "  if(created)refreshBadge();\r\n}");
          replaceOne(
            "rpc('aos_product_batch_review_v1',{p_ventas:ventas}).then(function(br){decorateImportPreview(br,0);}).catch(function(){});",
            "rpc('aos_product_batch_review_v1',{p_ventas:ventas}).then(function(br){decorateImportPreview(br,0);refreshBadge();}).catch(function(){});");
          replaceOne(
            "run();try{new MutationObserver(run).observe(document.documentElement||document.body,{childList:true,subtree:true});}catch(e){}try{window.addEventListener('focus',function(){ensureButton();refreshBadge();});}catch(e){}",
            "run();try{new MutationObserver(run).observe(document.documentElement||document.body,{childList:true,subtree:true});}catch(e){}try{window.addEventListener('focus',function(){ensureButton();});}catch(e){}");

          const txt=fs.readFileSync(path,'utf8');
          if(!txt.includes('if(created)refreshBadge();'))throw new Error('PRC mount-scoped badge refresh missing');
          if(txt.includes("focus',function(){ensureButton();refreshBadge();"))throw new Error('PRC focus network refresh remains');
          if(txt.includes('Date.now()-lastBadgeLoad>3000'))throw new Error('PRC mutation-driven throttle remains');
          if(!txt.includes('decorateImportPreview(br,0);refreshBadge();'))throw new Error('PRC import event refresh missing');
          const passive=(txt.match(/new MutationObserver\(run\)/g)||[]).length;
          if(passive!==1)throw new Error('Expected one DOM-only PRC observer');
          '@ | node -
          node --check app/public/rev-prc1-product-resolution-center.js
      - name: Verify bounded diff and commit
        shell: powershell
        run: |
          git diff --numstat -- app/public/rev-prc1-product-resolution-center.js
          $names=@(git diff --name-only)
          if($names.Count -ne 1 -or $names[0] -ne 'app/public/rev-prc1-product-resolution-center.js'){throw "Unexpected PRC diff: $names"}
          git config user.name 'ASCENDA PERF Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/public/rev-prc1-product-resolution-center.js
          git commit -m 'perf(prc): make badge refresh event driven'
          git push origin HEAD:perf/asc-perf-prc-event-driven-20260824
