name: K1 CURRENT v4 sync main

on:
  push:
    branches: [security/kronia-k1-current-main-20260817-v4]
    paths:
      - '.github/workflows/k1-v4-sync-main.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: k1-v4-sync-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: security/kronia-k1-current-main-20260817-v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Merge latest main and revalidate K1 CURRENT contracts
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          printf 'K1_SYNC_MAIN_SHA=%s\n' "$MAIN_SHA" | tee /tmp/k1-sync-main.txt

          git config user.name 'ASCENDA Zero-Cost Bot'
          git config user.email 'actions@users.noreply.github.com'
          git merge --no-edit origin/main

          # Build artifacts are never source-of-truth.
          find app ci scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          find app ci scripts -type f -name '*.pyc' -delete
          git rm -r --cached --ignore-unmatch app/__pycache__ ci/kronia-k1-phase2/__pycache__ || true

          git diff --check
          node --check app/server-k1.js
          node --check app/server-phase-s.js
          node --check app/server-f5.js
          node --check app/server-wa4.js
          node --check app/server-wa3.js
          node --check app/server-wa2.js
          node --check app/server-f4.js
          node --check app/public/k1-browser-security.js
          node --check chrome-extension/kronia-core.js
          node --check chrome-extension/k1-extension-auth.js
          node --check chrome-extension/content-script.js
          node --check chrome-extension/popup.js
          node ci/phase5-historical-identity/f5_upload_contract.js

          python3 -m py_compile app/k1_phase2_materialize.py ci/kronia-k1-phase2/runtime_contract.py ci/kronia-k1-phase2/security_static_contract.py
          (cd app && python3 k1_phase2_materialize.py)
          python3 ci/kronia-k1-phase2/runtime_contract.py
          python3 ci/kronia-k1-phase2/security_static_contract.py
          rm -f app/k1-phase2-runtime-manifest.json
          find app ci scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          find app ci scripts -type f -name '*.pyc' -delete

          grep -q "sentinel-sentry-init.cjs.*server-k1.js" app/railway.json
          grep -q "server-phase-s.js" app/server-k1.js
          grep -q "server-f5.js" app/server-phase-s.js
          grep -q 'KRONIA_K1_CURRENT_SENSITIVE_READ_BOUNDARY=PASS' ci/kronia-k1-phase2/001_k1_phase2_certificate.sql

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "ci(k1): sync CURRENT main ${MAIN_SHA} and remove build residue"
          fi
          git push origin HEAD:security/kronia-k1-current-main-20260817-v4
          echo 'KRONIA_K1_CURRENT_V4_MAIN_SYNC=PASS'
