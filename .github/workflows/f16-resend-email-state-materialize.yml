name: F16 Resend Email State Materialize

on:
  push:
    branches:
      - hotfix/f16-resend-email-state-probe-20260815
    paths:
      - '.github/workflows/f16-resend-email-state-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Zero-Cost runner health
        run: |
          python3 scripts/ci/enforce-zero-cost-policy.py
          bash scripts/ci/runner-healthcheck.sh
      - name: Materialize fixed synthetic email state probe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/f16-live-canary.js')
          s=p.read_text()
          anchor="""      if (body.confirm !== CANARY_CONFIRM) return jsonResponse(res, 400, { ok: false, error: 'CANARY_CONFIRMATION_REQUIRED' })\n"""
          block="""      if (body.confirm === 'INSPECT_RESEND_CANARY_EMAIL_STATE') {\n        var email = await requester('https://api.resend.com/emails/a642351f-6cdb-4a81-963e-860037dfd2b5', {\n          method: 'GET',\n          timeout: 15000,\n          headers: { Authorization: 'Bearer ' + resendKey }\n        })\n        if (!(email.status >= 200 && email.status < 300) || !email.body) {\n          return jsonResponse(res, 502, { ok: false, error: 'RESEND_EMAIL_STATE_FAILED', provider_status: email.status || 0 })\n        }\n        var to = Array.isArray(email.body.to) ? email.body.to.map(function(v) { return String(v).toLowerCase() }) : []\n        return jsonResponse(res, 200, {\n          ok: true,\n          provider: 'RESEND',\n          last_event: String(email.body.last_event || ''),\n          canary_recipient_match: to.length === 1 && to[0] === CANARY_TO.toLowerCase(),\n          canary_subject_match: String(email.body.subject || '') === CANARY_SUBJECT\n        })\n      }\n"""
          if block.strip() not in s:
              if anchor not in s:
                  raise SystemExit('F16_EMAIL_STATE_ANCHOR_MISSING')
              s=s.replace(anchor,block+anchor,1)
          p.write_text(s)
          PY
      - name: Expose runner Node
        run: bash scripts/ci/expose-runner-node.sh
      - name: Certify sanitized scope
        shell: bash
        run: |
          set -euo pipefail
          node --check app/f16-live-canary.js
          node ci/phase16/test_email_gateway.js
          grep -F 'INSPECT_RESEND_CANARY_EMAIL_STATE' app/f16-live-canary.js
          grep -F 'a642351f-6cdb-4a81-963e-860037dfd2b5' app/f16-live-canary.js
          ! grep -E "html: email.body|text: email.body|headers: email.body|signing_secret:|key_prefix|key_length" app/f16-live-canary.js
          echo 'F16_RESEND_EMAIL_STATE_PROBE=PASS'
      - name: Commit probe if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/f16-live-canary.js
          git diff --cached --quiet && exit 0
          git commit -m 'diag(f16): inspect fixed Resend canary email state'
          git push origin HEAD:hotfix/f16-resend-email-state-probe-20260815
