name: WA-L10 R4 continuity patch rerun4

on:
  push:
    branches:
      - wa-l10-r4-continuity-presentation-fix-20260905
    paths:
      - .github/workflows/wa-l10-r4-patch-rerun4.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wa-l10-r4-continuity-presentation-fix-20260905
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply scoped patch and sanitize generated tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          wf=Path('.github/workflows/wa-l10-r4-patch.yml').read_text()
          start="          python - <<'PY'\n"
          end="          PY\n"
          block=wf.split(start,1)[1].split(end,1)[0]
          lines=[line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          exec(compile('\n'.join(lines)+'\n','wa-l10-r4-patch.py','exec'),{})
          p=Path('ci/wa4-ai-sales-router/r4-continuity-presentation.test.js')
          t=p.read_text()
          if t.startswith('\\'):
              t=t[1:]
          t=t.replace("assert.match(draft.reply,/S\\\\/ 999/);","assert.ok(draft.reply.includes('S/ 999'));")
          t=t.replace("assert.match(draft.reply,/S\\\\/ 799/);","assert.ok(draft.reply.includes('S/ 799'));")
          old="assert.ok(out.startsWith(copilot.APPROVED_FIRST_CONTACT_PREFIX+'\\\\n\\\\n'));"
          new="assert.ok(out.startsWith(copilot.APPROVED_FIRST_CONTACT_PREFIX));assert.equal(out.charCodeAt(copilot.APPROVED_FIRST_CONTACT_PREFIX.length),10);"
          if old not in t:
              raise SystemExit('NEWLINE_ASSERTION_ANCHOR_MISSING')
          t=t.replace(old,new,1)
          p.write_text(t)
          PY
      - name: R4 syntax and canonical tests
        run: |
          node --check app/wa4-copilot.js
          node --check ci/wa4-ai-sales-router/r4-continuity-presentation.test.js
          node --test ci/wa4-ai-sales-router/r4-continuity-presentation.test.js
          node --test ci/wa4-ai-sales-router/ai-router.test.js
      - name: Commit scoped product patch
        shell: bash
        run: |
          git config user.name "ascenda-r4-bot"
          git config user.email "ascenda-r4-bot@users.noreply.github.com"
          git add app/wa4-copilot.js ci/wa4-ai-sales-router/r4-continuity-presentation.test.js ci/wa4-ai-sales-router/ai-router.test.js
          git diff --cached --check
          git commit -m "WA-L10 R4: preserve conversation continuity and approved presentation"
          git push origin HEAD:wa-l10-r4-continuity-presentation-fix-20260905
