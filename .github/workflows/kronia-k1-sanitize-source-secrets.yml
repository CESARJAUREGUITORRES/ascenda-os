name: KronIA K1 One-Shot Source Sanitizer

on:
  push:
    branches: ['security/kronia-k1-clean-20260815']
    paths:
      - 'scripts/security/k1_sanitize_source_secrets.py'
      - '.github/workflows/kronia-k1-sanitize-source-secrets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kronia-k1-clean-source-sanitize
  cancel-in-progress: false

jobs:
  sanitize-source:
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/kronia-k1-clean-20260815
          fetch-depth: 1
      - name: Sanitize exact inherited source patterns
        run: |
          set -euo pipefail
          python3 scripts/security/k1_sanitize_source_secrets.py
          git diff --check
          node --check app/server.js
          ! grep -nE "process\.env\.RESEND_API_KEY[[:space:]]*\|\|[[:space:]]*['\"][^'\"]+" app/server.js
          ! grep -nE "const[[:space:]]+VERIFY_TOKEN[[:space:]]*=[[:space:]]*['\"][^'\"]+" app/server.js
      - name: CAS commit sanitized source
        run: |
          set -euo pipefail
          if git diff --quiet -- app/server.js; then echo 'K1_SOURCE_SECRET_COMMIT=NO_CHANGE'; exit 0; fi
          git fetch origin security/kronia-k1-clean-20260815
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/security/kronia-k1-clean-20260815)"
          git config user.name 'ascenda-zero-cost-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/server.js
          git commit -m 'security(k1): remove inherited hardcoded provider secret fallbacks'
          git push origin HEAD:security/kronia-k1-clean-20260815
          echo 'K1_SOURCE_SECRET_COMMIT=PASS'
