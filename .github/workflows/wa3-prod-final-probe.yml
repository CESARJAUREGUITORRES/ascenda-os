name: ASCENDA WA-3 Final Production Probe

on:
  push:
    branches: ['probe/wa3-prod-smoke-final-20260815']

permissions:
  contents: read

jobs:
  probe:
    name: WA-3 production smoke
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 10
    steps:
      - name: Enforce FAST self-hosted runner
        shell: powershell
        run: |
          if ('${{ runner.environment }}' -ne 'self-hosted') { throw 'Probe must be self-hosted' }
          Write-Host "Runner: $env:RUNNER_NAME"
      - name: Probe WA-3, WA-2 and WA-1 production boundaries
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $base='https://ascenda-os-production.up.railway.app'
          function Http([string]$name,[string[]]$tail,[int]$expected,[string]$requiredHeader='') {
            $h=Join-Path $env:RUNNER_TEMP ($name+'-h.txt')
            $b=Join-Path $env:RUNNER_TEMP ($name+'-b.txt')
            $args=@('-sS','--connect-timeout','10','--max-time','20','-D',$h,'-o',$b,'-w','%{http_code}')+$tail
            $codeText=& curl.exe @args
            if($LASTEXITCODE -ne 0){throw "$name curl failed $LASTEXITCODE"}
            $code=[int]$codeText
            $headers=Get-Content $h -Raw
            Write-Host "$name status=$code"
            if($code -ne $expected){throw "$name expected $expected got $code"}
            if($requiredHeader -and $headers -notmatch $requiredHeader){throw "$name missing required header"}
            return $b
          }
          $boot=Http 'wa3-bootstrap-unauth' @("$base/api/wa3/bootstrap") 403 '(?im)^X-Ascenda-WA3-Routing:\s*v1\s*$'
          $htmlBody=Http 'wa3-page' @("$base/admin-whatsapp.html") 200 '(?im)^X-Ascenda-WA3-Routing:\s*v1\s*$'
          $html=Get-Content $htmlBody -Raw
          if($html -notmatch 'WA-3\s*·\s*Boxes, Routing & Human Handoff'){throw 'WA-3 UI marker missing'}
          if($html -notmatch 'FORZADO OFF'){throw 'WA-3 AI fail-closed marker missing'}
          Http 'wa2-inbox-unauth' @("$base/api/wa/inbox") 403 '(?im)^X-Ascenda-WA2-Inbox:\s*v1\s*$' | Out-Null
          Http 'wa1-invalid-verify' @("$base/webhook?hub.mode=subscribe&hub.verify_token=__wa3_probe_invalid__&hub.challenge=wa3") 403 '(?im)^X-Ascenda-WA-Gateway:\s*v1\s*$' | Out-Null
          Http 'wa1-unsigned-post' @('-X','POST','-H','Content-Type: application/json','--data-binary','{}',"$base/webhook") 401 '(?im)^X-Ascenda-WA-Gateway:\s*v1\s*$' | Out-Null
          Write-Host 'WA-3 deployed; WA-3 auth fail-closed; WA-2/WA-1 boundaries intact.'
