name: F16 Resend Secret Match Materialize

on:
  push:
    branches:
      - hotfix/f16-resend-secret-match-probe-20260815
    paths:
      - '.github/workflows/f16-resend-secret-match-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Zero-Cost runner health
        run: |
          python3 scripts/ci/enforce-zero-cost-policy.py
          bash scripts/ci/runner-healthcheck.sh
      - name: Materialize secret-match boolean only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/f16-live-canary.js')
          s=p.read_text()
          old="""        var target = rows.filter(function(row) { return String(row && row.endpoint || '') === PROD_WEBHOOK_URL }).map(function(row) {\n          var events = Array.isArray(row.events) ? row.events.map(String).sort() : []\n          return {\n            endpoint_match: true,\n            status: String(row.status || ''),\n            events: events,\n            email_delivered_subscribed: events.indexOf('email.delivered') !== -1\n          }\n        })\n        return jsonResponse(res, 200, {\n          ok: true,\n          provider: 'RESEND',\n          matching_webhooks: target.length,\n          webhooks: target\n        })"""
          new="""        var matches = rows.filter(function(row) { return String(row && row.endpoint || '') === PROD_WEBHOOK_URL })\n        var target = []\n        for (var hi = 0; hi < matches.length; hi++) {\n          var row = matches[hi] || {}\n          var events = Array.isArray(row.events) ? row.events.map(String).sort() : []\n          var secretMatch = null\n          if (row.id && process.env.RESEND_WEBHOOK_SECRET) {\n            var hook = await requester('https://api.resend.com/webhooks/' + encodeURIComponent(String(row.id)), {\n              method: 'GET',\n              timeout: 15000,\n              headers: { Authorization: 'Bearer ' + resendKey }\n            })\n            var providerSecret = hook.status < 300 && hook.body ? String(hook.body.signing_secret || '') : ''\n            var localSecret = String(process.env.RESEND_WEBHOOK_SECRET || '')\n            if (providerSecret && localSecret) {\n              var a = Buffer.from(providerSecret)\n              var b = Buffer.from(localSecret)\n              secretMatch = a.length === b.length && a.length > 0\n              if (secretMatch) {\n                var diff = 0\n                for (var si = 0; si < a.length; si++) diff |= a[si] ^ b[si]\n                secretMatch = diff === 0\n              }\n            } else {\n              secretMatch = false\n            }\n          }\n          target.push({\n            endpoint_match: true,\n            status: String(row.status || ''),\n            events: events,\n            email_delivered_subscribed: events.indexOf('email.delivered') !== -1,\n            signing_secret_matches_runtime: secretMatch\n          })\n        }\n        return jsonResponse(res, 200, {\n          ok: true,\n          provider: 'RESEND',\n          matching_webhooks: target.length,\n          webhooks: target\n        })"""
          if old not in s:
              raise SystemExit('F16_SECRET_MATCH_ANCHOR_MISSING')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Expose runner Node
        run: bash scripts/ci/expose-runner-node.sh
      - name: Certify no secret disclosure
        shell: bash
        run: |
          set -euo pipefail
          node --check app/f16-live-canary.js
          node ci/phase16/test_email_gateway.js
          grep -F 'signing_secret_matches_runtime' app/f16-live-canary.js
          grep -F "hook.body.signing_secret" app/f16-live-canary.js
          ! grep -E "providerSecret:|localSecret:|signing_secret: providerSecret|signing_secret: localSecret|key_prefix|key_length" app/f16-live-canary.js
          echo 'F16_RESEND_SECRET_MATCH_PROBE=PASS'
      - name: Commit probe if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/f16-live-canary.js
          git diff --cached --quiet && exit 0
          git commit -m 'diag(f16): compare active Resend signing secret inside runtime'
          git push origin HEAD:hotfix/f16-resend-secret-match-probe-20260815
