name: ASCENDA REV-F6.2 Customer Lifecycle

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/*rev_f6_2*'
      - 'supabase/rollbacks/*rev_f6_2*'
      - 'ci/rev-f6-2/**'
      - 'docs/control/REV_F6_2*'
      - 'docs/control/ASCENDA_WORKSTREAM_LOCK_CURRENT.md'
      - '.github/workflows/rev-f6-2-customer-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rev-f6-2-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  fast-contracts:
    name: F6.2 FAST lifecycle contract
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enforce FAST lane
        shell: powershell
        run: |
          if ('${{ runner.environment }}' -ne 'self-hosted') { throw 'FAST lane must be self-hosted' }
      - name: Static lifecycle contract
        shell: powershell
        run: node ci/rev-f6-2/static_contract.js

  db-security-semantic:
    name: F6.2 DB/security/semantic contracts
    needs: fast-contracts
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 25
    env:
      DB_URL: postgresql://postgres:postgres@127.0.0.1:59642/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Enforce Zero-Cost DB runner
        run: |
          set -euo pipefail
          test "${{ runner.environment }}" = "self-hosted"
          python3 scripts/ci/enforce-zero-cost-policy.py
      - name: Configure isolated Supabase
        working-directory: ci/zero-cost-staging
        run: |
          set -euo pipefail
          sed -i 's/project_id = "ascenda-zero-cost-staging"/project_id = "ascenda-rev-f6-2"/' supabase/config.toml
          sed -i 's/port = 54321/port = 59641/' supabase/config.toml
          sed -i 's/port = 54322/port = 59642/' supabase/config.toml
          sed -i 's/shadow_port = 54320/shadow_port = 59640/' supabase/config.toml
      - name: Start isolated Postgres
        working-directory: ci/zero-cost-staging
        run: |
          set -euo pipefail
          supabase stop --no-backup || true
          docker ps -aq --filter 'name=ascenda-rev-f6-2' | xargs -r docker rm -f || true
          rm -rf supabase/.temp supabase/.branches
          supabase db start
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 59642 -U postgres >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Build F6.1 synthetic prerequisite schema
        run: psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-f6-1/schema_contract.sql
      - name: Add F6.2 deterministic lifecycle fixture
        run: psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-f6-2/fixture.sql
      - name: Apply certified F6.0 prerequisite
        run: psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260820013500_rev_f6_0_data_contract_v1.sql
      - name: Apply certified F6.1 prerequisite
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260820022000_rev_f6_1_patient_commercial_360_v2.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260820022500_rev_f6_1_alias_normalization_fix.sql
      - name: Apply exact F6.2 release chain
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260820034000_rev_f6_2_customer_lifecycle_v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260820035500_rev_f6_2_lima_date_active_subject_fix.sql
      - name: F6.2 lifecycle/security/semantic invariants
        run: psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-f6-2/tests/001_customer_lifecycle.sql
      - name: Full idempotent replay
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260820034000_rev_f6_2_customer_lifecycle_v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260820035500_rev_f6_2_lima_date_active_subject_fix.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-f6-2/tests/001_customer_lifecycle.sql
      - name: Recovery restores certified F6.1 fail-closed boundary
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/rollbacks/20260820034000_rev_f6_2_customer_lifecycle_v1_recovery.sql
          test "$(psql "$DB_URL" -X -qAt -c "select to_regprocedure('public.aos_rev_customer_lifecycle_v1(text,text,date)') is null")" = "t"
          test "$(psql "$DB_URL" -X -qAt -c "select to_regprocedure('public.aos_rev_business_date_lima_v1()') is null")" = "f"
          test "$(psql "$DB_URL" -X -qAt -c "select to_regprocedure('public.aos_patient_commercial_360_v2(text,text,text)') is not null")" = "t"
          test "$(psql "$DB_URL" -X -qAt -c "select has_function_privilege('anon','public.aos_patient_commercial_360_v2(text,text,text)','EXECUTE')")" = "t"
          test "$(psql "$DB_URL" -X -qAt -c "select has_function_privilege('anon','public.aos_paciente_360(text)','EXECUTE')")" = "f"
          test "$(psql "$DB_URL" -X -qAt -c "select has_function_privilege('service_role','public.aos_rev_f6_data_contract_v1()','EXECUTE')")" = "t"
      - name: Stop isolated Supabase
        if: always()
        working-directory: ci/zero-cost-staging
        run: supabase stop --no-backup || true
