name: Sentinel F5 Availability Foundation Certificate

on:
  pull_request:
    branches: [main]
    paths: &f5_paths
      - 'app/server-phase-s.js'
      - 'sentinel/availability/**'
      - 'ci/sentinel/phase5_availability_contract.js'
      - 'docs/control/SENTINEL_F5_*.md'
      - 'docs/control/SENTINEL_ROADMAP_V1.md'
      - '.github/workflows/sentinel-phase5-availability.yml'
  push:
    branches: ['main','feature/**','fix/**']
    paths: *f5_paths

permissions:
  contents: read

concurrency:
  group: sentinel-f5-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract-fast:
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diff hygiene
        shell: powershell
        run: git diff --check
      - name: State syntax
        shell: powershell
        run: |
          node --check sentinel/availability/state-machine.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: F5 hybrid availability contract
        shell: powershell
        run: node ci/sentinel/phase5_availability_contract.js

  uptime-kuma-container-smoke:
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 15
    env:
      KUMA_IMAGE: louislam/uptime-kuma:2
    steps:
      - uses: actions/checkout@v4
      - name: Enforce Zero-Cost runner policy
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = "Linux"
          docker version >/dev/null
          python3 --version
      - name: Validate local observer scripts and gap fixtures
        run: |
          set -euo pipefail
          bash -n sentinel/availability/creactive/deploy-docker-observer.sh
          python3 -m py_compile sentinel/availability/local-observer-agent.py
          python3 - <<'PY'
          import importlib.util
          p='sentinel/availability/local-observer-agent.py'
          spec=importlib.util.spec_from_file_location('observer',p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          now=m.parse_iso('2026-08-16T12:10:00Z')
          gap=m.compute_coverage_gap('2026-08-16T12:00:00Z',now,120)
          assert gap and gap['seconds']==600 and gap['state']=='UNKNOWN' and gap['retroactive_health_claim'] is False
          assert m.compute_coverage_gap('2026-08-16T12:09:00Z',now,120) is None
          safe=m.safe_health_shape({'ok':True,'service':'ascenda-phase-s','child_alive':True,'inner_ready':True,'email':'x','token':'y'})
          assert sorted(safe.keys())==['child_alive','inner_ready','ok','service']
          print('SENTINEL_F5_GAP_FIXTURE=PASS')
          PY
      - name: Validate versioned compose artifact statically
        run: |
          set -euo pipefail
          grep -q 'image: louislam/uptime-kuma:2' sentinel/availability/compose.yaml
          grep -q '127.0.0.1:3001:3001' sentinel/availability/compose.yaml
          grep -q 'uptime-kuma-data:/app/data' sentinel/availability/compose.yaml
          grep -q 'no-new-privileges:true' sentinel/availability/compose.yaml
          grep -q 'restart: unless-stopped' sentinel/availability/compose.yaml
          ! grep -Eq '(SENTRY_DSN|SUPABASE_SERVICE_ROLE_KEY|RESEND_API_KEY|Bearer )' sentinel/availability/compose.yaml
          ! grep -q 'network_mode: host' sentinel/availability/compose.yaml
          ! grep -q '/var/run/docker.sock' sentinel/availability/compose.yaml
      - name: Start disposable Uptime Kuma with Docker
        run: |
          set -euo pipefail
          NAME="sentinel-f5-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          VOLUME="${NAME}-data"
          echo "KUMA_NAME=$NAME" >> "$GITHUB_ENV"
          echo "KUMA_VOLUME=$VOLUME" >> "$GITHUB_ENV"
          docker volume create "$VOLUME" >/dev/null
          docker run -d \
            --name "$NAME" \
            --security-opt no-new-privileges:true \
            -p 127.0.0.1::3001 \
            -v "$VOLUME:/app/data" \
            "$KUMA_IMAGE" >/tmp/sentinel-f5-container-id.txt
          PORT="$(docker inspect -f '{{(index (index .NetworkSettings.Ports "3001/tcp") 0).HostPort}}' "$NAME")"
          test -n "$PORT"
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS --max-time 3 "http://127.0.0.1:${PORT}/" >/tmp/sentinel-f5-kuma.html; then ok=1; break; fi
            if ! docker ps --format '{{.Names}}' | grep -qx "$NAME"; then break; fi
            sleep 2
          done
          test "$ok" = 1
          test -s /tmp/sentinel-f5-kuma.html
          echo 'SENTINEL_F5_KUMA_CONTAINER_SMOKE=PASS'
      - name: Destroy disposable observer and volume
        if: always()
        run: |
          if [ -n "${KUMA_NAME:-}" ]; then docker rm -f "$KUMA_NAME" >/dev/null 2>&1 || true; fi
          if [ -n "${KUMA_VOLUME:-}" ]; then docker volume rm -f "$KUMA_VOLUME" >/dev/null 2>&1 || true; fi

  deploy-creactive-local-observer:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 12
    needs: [uptime-kuma-container-smoke]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy persistent Docker-native observer
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = "Linux"
          test "$(hostname)" = "CREACTIVE"
          docker version >/dev/null
          python3 --version
          bash sentinel/availability/creactive/deploy-docker-observer.sh
      - name: Verify persistent observer state
        run: |
          set -euo pipefail
          test "$(docker inspect -f '{{.State.Running}}' sentinel-uptime-kuma)" = "true"
          test "$(docker inspect -f '{{.State.Running}}' sentinel-local-observer)" = "true"
          test -s "$HOME/.local/share/ascenda-sentinel/availability/state/resume-report.json"
          curl -fsS --max-time 5 http://127.0.0.1:3001/ >/dev/null
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path.home()/'.local/share/ascenda-sentinel/availability/state/resume-report.json'
          d=json.loads(p.read_text())
          assert d['observer']=='CREACTIVE'
          assert d['local_observer_state']=='ONLINE'
          assert d['retroactive_claims_forbidden'] is True
          assert d['current_health'] in ('HEALTHY','DEGRADED')
          print('SENTINEL_F5_CREACTIVE_PERSISTENT_OBSERVER=PASS')
          PY
