name: WA S11 Live Sync Meta Auth
on:
  push:
    branches:
      - wa-s11-live-sync-meta-auth-20260817
    paths:
      - 'ci/phase-s/apply_s11_live_sync_meta_auth.js'
      - 'ci/phase-s/wa_s11_live_sync_meta_auth_contract.js'
      - '.github/workflows/wa-s11-live-sync-meta-auth.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wa-s11-live-sync-meta-auth-20260817
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply S11 runtime changes
        shell: powershell
        run: |
          node ci/phase-s/apply_s11_live_sync_meta_auth.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/server-wa3.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/server-phase-s.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/public/wa-native-panel.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/public/wa-shell-integration.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ci/phase-s/wa_s11_live_sync_meta_auth_contract.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit S11 runtime
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/server-wa3.js app/server-phase-s.js app/public/wa-native-panel.js app/public/wa-shell-integration.js
          if (git diff --cached --quiet) { Write-Host 'No runtime changes'; exit 0 }
          git commit -m 'fix(wa): add live heartbeat and Meta auth readiness'
          git push origin HEAD:wa-s11-live-sync-meta-auth-20260817
