name: ASC-PERF 5B Agent Cron Patch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/asc-perf-5b-agent-cron-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/asc-perf-5b-agent-cron-20260824
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply raw-byte exact PERF-5B patch
        shell: powershell
        run: |
          @'
          const fs = require('fs');
          const p = 'app/server.js';
          const src = fs.readFileSync(p);
          const oldBuf = Buffer.from("sbFetch('/rest/v1/aos_agentes?select=*&activo=eq.true&tipo_ejecucion=eq.cron')", 'ascii');
          const newBuf = Buffer.from("sbFetch('/rest/v1/aos_agentes?select=id,nombre,emoji,cron_intervalo,ultima_actividad,system_prompt,motor_ai,modelo&activo=eq.true&tipo_ejecucion=eq.cron')", 'ascii');
          const first = src.indexOf(oldBuf);
          if (first < 0) throw new Error('PERF-5B exact target not found');
          if (src.indexOf(oldBuf, first + 1) >= 0) throw new Error('PERF-5B target is not unique');
          const out = Buffer.concat([src.subarray(0, first), newBuf, src.subarray(first + oldBuf.length)]);
          if (out.indexOf(oldBuf) >= 0) throw new Error('PERF-5B broad cron read remains');
          fs.writeFileSync(p, out);
          '@ | node -
          node --check app/server.js
      - name: Verify one-line diff and commit
        shell: powershell
        run: |
          $stat = git diff --numstat -- app/server.js
          Write-Host $stat
          if ($stat -notmatch '^1\s+1\s+app/server\.js$') { throw "PERF-5B must be exactly 1+/1-, got: $stat" }
          $changed = git diff -- app/server.js
          if ($changed -notmatch 'select=id,nombre,emoji,cron_intervalo,ultima_actividad,system_prompt,motor_ai,modelo') { throw 'PERF-5B compact cron read missing from diff' }
          git config user.name 'ASCENDA PERF Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/server.js
          git commit -m 'perf(agents): narrow recurrent cron agent read'
          git push origin HEAD:perf/asc-perf-5b-agent-cron-20260824
