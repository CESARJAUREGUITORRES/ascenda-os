name: ASC-PERF 5B Agent Cron Patch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/asc-perf-5b-agent-cron-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/asc-perf-5b-agent-cron-20260824
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply byte-safe exact PERF-5B patch
        shell: powershell
        run: |
          @'
          const fs = require('fs');
          const p = 'app/server.js';
          const s = fs.readFileSync(p, 'utf8');
          const oldText = "sbFetch('/rest/v1/aos_agentes?select=*&activo=eq.true&tipo_ejecucion=eq.cron')";
          const newText = "sbFetch('/rest/v1/aos_agentes?select=id,nombre,emoji,cron_intervalo,ultima_actividad,system_prompt,motor_ai,modelo&activo=eq.true&tipo_ejecucion=eq.cron')";
          const count = s.split(oldText).length - 1;
          if (count !== 1) throw new Error(`PERF-5B exact-match expected 1 occurrence, found ${count}`);
          const out = s.replace(oldText, newText);
          if (out.includes(oldText)) throw new Error('PERF-5B broad cron read remains');
          fs.writeFileSync(p, out, 'utf8');
          '@ | node -
          node --check app/server.js
      - name: Verify minimal diff and commit
        shell: powershell
        run: |
          git diff --numstat -- app/server.js
          $changed = git diff -- app/server.js
          if ($changed -notmatch 'select=id,nombre,emoji,cron_intervalo,ultima_actividad,system_prompt,motor_ai,modelo') { throw 'PERF-5B compact cron read missing from diff' }
          git config user.name 'ASCENDA PERF Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/server.js
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'PERF-5B produced no diff' }
          git commit -m 'perf(agents): narrow recurrent cron agent read'
          git push origin HEAD:perf/asc-perf-5b-agent-cron-20260824
