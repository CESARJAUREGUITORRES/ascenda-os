name: WA S5 Native Live Probe
on:
  push:
    branches:
      - diag/wa-s5-native-live-probe-20260817
jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production WA S5 assets
        run: node ci/wa-s5-live-probe.js
