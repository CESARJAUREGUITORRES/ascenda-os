name: WA-4C Runtime Canary (ephemeral branch)

on:
  push:
    branches:
      - 'wa4c/runtime-canary-20260828'

permissions:
  contents: read

env:
  EXPECTED_PROD_SHA: 075b8802ad96e397b66e4997d51a1c4740dc8de2

jobs:
  runtime-canary:
    name: WA-4C · Railway + REST + models + 2FA fail-closed
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 15
    steps:
      - name: Railway outer health
        run: |
          set -euo pipefail
          echo "expected_prod_sha=$EXPECTED_PROD_SHA"
          BASE='https://ascenda-os-production.up.railway.app'
          getent hosts ascenda-os-production.up.railway.app
          code=$(curl --silent --show-error --location --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 -o /tmp/outer-health.json -w '%{http_code}' "$BASE/health")
          echo "outer_health_http=$code"
          cat /tmp/outer-health.json
          test "$code" = '200'

      - name: WA-4 model readiness
        run: |
          set -euo pipefail
          BASE='https://ascenda-os-production.up.railway.app'
          code=$(curl --silent --show-error --location --retry 3 --retry-all-errors --connect-timeout 10 --max-time 45 -o /tmp/wa4-health.json -w '%{http_code}' "$BASE/api/wa4/health")
          echo "wa4_health_http=$code"
          cat /tmp/wa4-health.json
          test "$code" = '200'
          python3 -c "import json; j=json.load(open('/tmp/wa4-health.json')); h=j.get('health') or {}; a=h.get('active') or {}; assert j.get('ok') is True; assert j.get('auto_send') is False; assert h.get('configured') is True, h; assert h.get('copilot_ready') is True, h; assert a.get('fast') is True and a.get('reasoning') is True and a.get('safety') is True, a; assert h.get('error') is None, h; print(json.dumps({'configured':h.get('configured'),'copilot_ready':h.get('copilot_ready'),'active':a,'checked_at':h.get('checked_at'),'error':h.get('error')},indent=2))"

      - name: Bootstrap remains 2FA fail-closed without token
        if: ${{ always() }}
        run: |
          set -euo pipefail
          BASE='https://ascenda-os-production.up.railway.app'
          code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 -o /tmp/bootstrap-no-token.json -w '%{http_code}' "$BASE/api/wa4/bootstrap")
          echo "bootstrap_no_token_http=$code"
          cat /tmp/bootstrap-no-token.json
          test "$code" = '403'
          python3 -c "import json; j=json.load(open('/tmp/bootstrap-no-token.json')); assert j.get('ok') is False and j.get('error')=='WA4_2FA_PANEL_REQUIRED',j"

      - name: Suggest remains 2FA fail-closed without token
        if: ${{ always() }}
        run: |
          set -euo pipefail
          BASE='https://ascenda-os-production.up.railway.app'
          CID='00000000-0000-4000-8000-000000000001'
          code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 -X POST -H 'Content-Type: application/json' -d '{}' -o /tmp/suggest-no-token.json -w '%{http_code}' "$BASE/api/wa4/conversations/$CID/suggest")
          echo "suggest_no_token_http=$code"
          cat /tmp/suggest-no-token.json
          test "$code" = '403'
          python3 -c "import json; j=json.load(open('/tmp/suggest-no-token.json')); assert j.get('ok') is False and j.get('error')=='WA4_2FA_PANEL_REQUIRED',j"
