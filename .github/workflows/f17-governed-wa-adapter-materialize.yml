name: F17 Governed WA Adapter Materialize

on:
  push:
    branches:
      - feature/f17-governed-wa-adapter-20260817
    paths:
      - 'ci/f17/materialize_governed_wa_adapter.js'
      - 'ci/f17/test_governed_wa_adapter.js'
      - 'app/f17-whatsapp-adapter.js'
      - '.github/workflows/f17-governed-wa-adapter-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit contract
        shell: powershell
        run: node ci/f17/test_governed_wa_adapter.js
      - name: Materialize F4 adapter
        shell: powershell
        run: node ci/f17/materialize_governed_wa_adapter.js
      - name: Runtime/security assertions
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node --check app/server-f4.js
          node --check app/f17-whatsapp-adapter.js
          $src=Get-Content app/server-f4.js -Raw
          if($src -notmatch 'F17_WA.prepare'){throw 'policy gate missing'}
          if($src -notmatch 'WEBHOOK_REPLAY_VALIDATED'){throw 'replay gate missing'}
          if($src -notmatch 'CANARY_PASSED'){throw 'canary gate missing'}
          if($src -notmatch "split\('\.'\).length===3"){throw 'Supabase secret-key compatibility missing'}
          $adapter=Get-Content app/f17-whatsapp-adapter.js -Raw
          if($adapter -match 'message_body|text\.body|caption|raw_referral:'){throw 'generic F17 adapter must not persist message content'}
          $changed=git diff --name-only
          if(($changed|Measure-Object).Count -ne 1 -or $changed -ne 'app/server-f4.js'){throw "unexpected materialized scope: $changed"}
      - name: Commit materialized F4
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'ASCENDA F17 Bot'
          git config user.email 'f17-bot@users.noreply.github.com'
          git add app/server-f4.js
          git commit -m 'feat(f17): govern WhatsApp send and signed provider events'
          git push origin HEAD:feature/f17-governed-wa-adapter-20260817
