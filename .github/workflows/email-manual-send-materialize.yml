name: ASCENDA Email Manual Send Materializer

on:
  push:
    branches:
      - hotfix/email-manual-send-20260815
    paths:
      - 'scripts/ops/patch-email-manual-send.js'
      - '.github/workflows/email-manual-send-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expose trusted runner Node
        shell: bash
        run: bash scripts/ci/expose-runner-node.sh

      - name: Apply deterministic Email UI patch
        shell: bash
        run: node scripts/ops/patch-email-manual-send.js

      - name: Validate browser script syntax
        shell: bash
        run: |
          node --check email-admin-check.tmp.js
          rm -f email-admin-check.tmp.js

      - name: Re-run F16 gateway contracts
        shell: bash
        run: |
          node ci/phase16/test_email_gateway.js
          node ci/phase16/test_email_gateway_policy.js

      - name: Verify minimal production scope
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "app/public/admin-email.html"
          grep -F 'onclick="openManualEmail()"' app/public/admin-email.html
          grep -F "emCall('LEGACY_SEND'" app/public/admin-email.html
          grep -F "rpcSilent('aos_email_dashboard'" app/public/admin-email.html
          ! grep -E 're_[A-Za-z0-9]{20,}' app/public/admin-email.html
          echo 'EMAIL_MANUAL_SEND_SCOPE=PASS'

      - name: Commit materialized UI only
        shell: bash
        run: |
          git config user.name 'ASCENDA CI'
          git config user.email 'ascenda-ci@users.noreply.github.com'
          git add app/public/admin-email.html
          test "$(git diff --cached --name-only | tr -d '\r')" = "app/public/admin-email.html"
          git commit -m 'fix(email): expose governed manual send and quiet dashboard fallback'
          git push origin HEAD:hotfix/email-manual-send-20260815
