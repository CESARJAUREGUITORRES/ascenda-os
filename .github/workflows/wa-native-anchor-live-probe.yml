name: WA Native Anchor Live Probe
on:
  push:
    branches:
      - diag/wa-native-anchor-live-20260817
jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify live Phase S WhatsApp S8 native panel
        run: node .github/scripts/wa-s8-live-probe.js