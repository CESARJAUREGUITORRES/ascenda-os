name: WA Native Anchor Live Probe
on:
  push:
    branches:
      - diag/wa-native-anchor-live-20260817
jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify live Phase S WhatsApp S8 native panel
        shell: powershell
        run: |
          $code = @'
          const base='https://ascenda-os-production.up.railway.app';
          const ok=(v,m)=>{if(!v)throw new Error(m)};
          async function text(path,opts){const r=await fetch(base+path,Object.assign({cache:'no-store'},opts||{}));return {r,body:await r.text()};}
          (async()=>{
            let x=await text('/health?probe=wa-s8-20260817');
            ok(x.r.ok,'health '+x.r.status);
            ok(x.body.includes('ascenda-phase-s'),'Phase S marker missing');

            x=await text('/app?probe=wa-s8-20260817');
            ok(x.r.ok,'app '+x.r.status);
            ok((x.r.headers.get('x-ascenda-phase-s-shell')||'')==='native-wa-anchor-v1','shell marker missing');
            ok(x.body.includes('wa-native-panel.js?v=20260817-wa-native-s8-p01'),'S8 native panel anchor missing');
            ok(x.body.includes('wa-shell-integration.js?v=20260817-wa-shell-s8-p01'),'S8 shell cache-buster missing');

            x=await text('/wa-native-panel.js?probe=wa-s8-20260817');
            ok(x.r.ok,'native panel '+x.r.status);
            ok(x.body.includes('AOS_WA_NATIVE'),'native module marker missing');
            ok(x.body.includes("h.set('X-AOS-App-Token',t)"),'strong token header missing');
            ok(x.body.includes("'/send'"),'send path missing');
            ok(x.body.includes('Lead 360 · base operativa'),'Lead & Routing UI missing');
            ok(x.body.includes('wa8-left-toggle')&&x.body.includes('wa8-right-toggle'),'collapsible controls missing');

            x=await text('/wa-shell-integration.js?probe=wa-s8-20260817');
            ok(x.r.ok,'shell js '+x.r.status);
            ok(x.body.includes('AOS_WA_NATIVE'),'native mount missing');
            ok(!x.body.includes('WA_IFRAME_URL'),'old iframe runtime still live');
            ok(!x.body.includes('<iframe'),'iframe markup still live');
            ok(!x.body.includes('installRecovery'),'old recovery still live');

            x=await text('/api/wa3/bootstrap?probe=wa-s8-20260817');
            ok(x.r.status===403,'anonymous WA3 must remain closed: '+x.r.status);
            ok(x.body.includes('WA3_2FA_PANEL_REQUIRED'),'anonymous gate changed');
            console.log('WA_S8_NATIVE_PANEL_LIVE=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          '@
          $probe = Join-Path $env:RUNNER_TEMP 'wa-s8-live-probe.js'
          Set-Content -Path $probe -Value $code -Encoding UTF8
          node $probe