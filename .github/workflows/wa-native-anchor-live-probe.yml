name: WA Native Anchor Live Probe
on:
  push:
    branches:
      - diag/wa-native-anchor-live-20260817
jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify live Phase S WhatsApp S6 bridge
        shell: bash
        run: |
          node <<'NODE'
          const base='https://ascenda-os-production.up.railway.app';
          const ok=(v,m)=>{if(!v)throw new Error(m)};
          async function text(path,opts){const r=await fetch(base+path,Object.assign({cache:'no-store'},opts||{}));return {r,body:await r.text()};}
          (async()=>{
            let x=await text('/health?probe=wa-s6-20260817'); ok(x.r.ok,'health '+x.r.status); ok(x.body.includes('ascenda-phase-s'),'Phase S marker missing');
            x=await text('/app?probe=wa-s6-20260817'); ok(x.r.ok,'app '+x.r.status); ok((x.r.headers.get('x-ascenda-phase-s-shell')||'')==='native-wa-anchor-v1','shell marker missing');
            x=await text('/wa-native-bootstrap-prelude.js?probe=wa-s6-20260817'); ok(x.r.ok,'prelude '+x.r.status); ok(x.body.includes("CACHE_NAME='aos-phase2-auth'"),'cache auth missing'); ok(x.body.includes("version:'S6'"),'S6 marker missing'); ok(x.body.includes('wa-lead360'),'Lead 360 missing'); ok(x.body.includes('wa-left-closed')&&x.body.includes('wa-right-closed'),'collapse UI missing'); ok(x.body.includes("h.set('X-AOS-App-Token'"),'direct WA3 auth missing');
            x=await text('/admin-whatsapp.html?probe=wa-s6-20260817',{redirect:'manual'}); ok(x.r.status===302,'redirect '+x.r.status);
            console.log('WA_S6_NATIVE_AUTH_UI_LIVE=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
