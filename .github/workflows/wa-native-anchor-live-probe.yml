name: WA Native Anchor Live Probe
on:
  push:
    branches:
      - diag/wa-native-anchor-live-20260817
jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify live Phase S WhatsApp anchor
        shell: bash
        run: |
          node <<'NODE'
          const base='https://ascenda-os-production.up.railway.app';
          const ok=(v,m)=>{if(!v)throw new Error(m)};
          async function text(path,opts){
            const r=await fetch(base+path,Object.assign({cache:'no-store'},opts||{}));
            const body=await r.text();
            return {r,body};
          }
          (async()=>{
            let x=await text('/health?probe=wa-anchor-20260817');
            ok(x.r.ok,'health probe failed '+x.r.status);
            ok(x.body.includes('ascenda-phase-s'),'Phase S marker missing');

            x=await text('/app?probe=wa-anchor-20260817');
            ok(x.r.ok,'app probe failed '+x.r.status);
            ok((x.r.headers.get('x-ascenda-phase-s-shell')||'')==='native-wa-anchor-v1','native shell response header missing');
            ok(x.body.includes('wa-shell-integration.js?v=20260817-wa-shell-p04'),'p04 WhatsApp shell anchor missing from live app');

            x=await text('/admin-whatsapp.html?embedded=1&probe=wa-anchor-20260817');
            ok(x.r.ok,'embedded WA probe failed '+x.r.status);
            ok((x.r.headers.get('x-ascenda-phase-s-shell')||'')==='native-wa-anchor-v1','embedded WA native anchor header missing');
            ok(x.body.includes('wa-native-bootstrap-prelude.js?v=20260817-s5-p02'),'p02 native bootstrap prelude missing from embedded WA page');

            x=await text('/admin-whatsapp.html?probe=wa-anchor-20260817',{redirect:'manual'});
            ok(x.r.status===302,'standalone WA route did not redirect: '+x.r.status);
            ok((x.r.headers.get('location')||'').includes('/app.html#admin-whatsapp'),'standalone WA redirect target incorrect');
            console.log('WA_NATIVE_ANCHOR_LIVE=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
