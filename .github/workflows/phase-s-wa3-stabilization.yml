name: ASCENDA PHASE S WA3 Stabilization

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/server-phase-s-f17.js'
      - 'app/server-phase-s.js'
      - 'app/server-f17.js'
      - 'app/auth-resend-reconcile.js'
      - 'app/railway.json'
      - 'app/supabase-quota-circuit.js'
      - 'app/supabase-quota-circuit-preload.cjs'
      - 'app/server-f5.js'
      - 'app/server-wa4.js'
      - 'app/server-wa3.js'
      - 'app/server-wa2.js'
      - 'app/server-f4.js'
      - 'app/wa-gateway.js'
      - 'app/public/wa-shell-integration.js'
      - 'app/public/wa-native-panel.js'
      - 'ci/phase-s/**'
      - 'ci/performance/wa-supabase-quota-circuit-contract.js'
      - 'ci/phase16/test_auth_resend_reconcile.js'
      - 'ci/phase4-revenue/**'
      - 'ci/wa2-conversation-live-inbox/**'
      - 'ci/wa3-boxes-routing-handoff/**'
      - 'ci/wa4-ai-sales-router/**'
      - 'ci/phase5-historical-identity/**'
      - 'docs/control/WHATSAPP_PHASE_S_*'
      - 'docs/control/WHATSAPP_REVENUE_HUB_EXPANSION_*'
      - 'docs/control/WHATSAPP_REVENUE_HUB_WA_CLOSEOUT_*'
      - '.github/workflows/phase-s-wa3-stabilization.yml'
  push:
    branches: ['phase-s/wa3-stabilization-human-outbound']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-s-wa3-stabilization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: FAST Phase S full runtime-chain certification
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enforce self-hosted FAST lane
        shell: powershell
        run: |
          if ('${{ runner.environment }}' -ne 'self-hosted') { throw 'Phase S must run on a self-hosted runner' }
          Write-Host "Runner: $env:RUNNER_NAME"
          node --version

      - name: Runtime syntax
        shell: powershell
        run: |
          $files = @(
            'app/server-phase-s-f17.js',
            'app/server-phase-s.js',
            'app/server-f17.js',
            'app/auth-resend-reconcile.js',
            'app/supabase-quota-circuit.js',
            'app/supabase-quota-circuit-preload.cjs',
            'app/server-f5.js',
            'app/server-wa4.js',
            'app/server-wa3.js',
            'app/server-wa2.js',
            'app/server-f4.js',
            'app/wa-gateway.js',
            'app/public/wa-shell-integration.js',
            'app/public/wa-native-panel.js',
            'ci/phase-s/wa_native_s8_contract.js',
            'ci/phase-s/wa_customer_window_s10_contract.js',
            'ci/phase-s/wa_s11_live_sync_meta_auth_contract.js',
            'ci/performance/wa-supabase-quota-circuit-contract.js',
            'ci/phase16/test_auth_resend_reconcile.js'
          )
          foreach ($file in $files) {
            node --check $file
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Phase S boundary contract
        shell: powershell
        run: |
          node ci/phase-s/phase-s_contract.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: WA S8 native workspace contract
        shell: powershell
        run: |
          node ci/phase-s/wa_native_s8_contract.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: WA S10 customer-window contract
        shell: powershell
        run: |
          node ci/phase-s/wa_customer_window_s10_contract.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: WA S11 live-sync and Meta-auth contract
        shell: powershell
        run: |
          node ci/phase-s/wa_s11_live_sync_meta_auth_contract.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: WA Supabase quota circuit contract
        shell: powershell
        run: |
          node ci/performance/wa-supabase-quota-circuit-contract.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Auth Resend private-vault regression
        shell: powershell
        run: |
          node ci/phase16/test_auth_resend_reconcile.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: WA-1 gateway regression
        shell: powershell
        run: |
          node --test ci/wa1-secure-gateway/wa-gateway.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: F4 runtime topology contract
        shell: powershell
        run: |
          node ci/phase4-revenue/ui_contract.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: F5 private-boundary topology contract
        shell: powershell
        run: |
          node ci/phase5-historical-identity/f5_upload_contract.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Security invariants
        shell: powershell
        run: |
          $s = Get-Content app/server-phase-s.js -Raw
          $s152 = Get-Content app/server-phase-s-f17.js -Raw
          $f17 = Get-Content app/server-f17.js -Raw
          $sync = Get-Content app/auth-resend-reconcile.js -Raw
          $quota = Get-Content app/supabase-quota-circuit-preload.cjs -Raw
          $cfg = Get-Content app/railway.json -Raw | ConvertFrom-Json
          $rawStart = [string]$cfg.deploy.startCommand
          $studioPrefix = 'env AOS_STUDIO_BACKGROUND_ENABLED=false '
          if (-not $rawStart.StartsWith($studioPrefix)) { throw 'Studio background must remain HARD-OFF while ASC-PERF owns the mutable lane' }
          $start = $rawStart.Substring($studioPrefix.Length)
          if ($start.StartsWith('NODE_OPTIONS=')) { $start = 'env ' + $start }
          if ($s -notmatch 'aos_wa3_actor_v1') { throw 'WA3 actor authorization missing' }
          if ($s -notmatch 'human_send_enabled:false') { throw 'human send fail-closed default missing' }
          if ($s -notmatch 'auto_routing_enabled:false') { throw 'auto routing fail-closed default missing' }
          if ($s -notmatch 'ai_send_enabled:false') { throw 'AI send fail-closed default missing' }
          if ($s -notmatch "p==='/api/auth/v3/login'") { throw 'Auth V3 reconcile gate missing' }
          if ($s -notmatch 'WA_CUSTOMER_WINDOW_CLOSED') { throw 'WA 24h customer window gate missing' }
          if ($sync -notmatch 'aos_integration_secrets_v1') { throw 'Private integration vault target missing' }
          if ($sync -match '/rest/v1/aos_integraciones(?:\?|["''])') { throw 'Public integration catalog must not receive provider secret' }
          if (($s + $sync + $s152 + $f17 + $quota) -match '(SUPABASE_SERVICE_ROLE_KEY|RESEND_API_KEY|WHATSAPP_ACCESS_TOKEN)\s*=\s*["''][^"'']+["'']') { throw 'hard-coded secret detected' }
          if ($quota -notmatch 'Phase-S\|WA3V2\|F17') { throw 'WA quota circuit runtime allowlist missing' }
          if ($quota -match 'SUPABASE_SERVICE_ROLE_KEY') { throw 'WA quota preload must not inspect service-role credential' }
          $phaseSEntries = @(
            'node server-phase-s.js',
            "env NODE_OPTIONS='--require ./sentinel-sentry-init.cjs' node server-phase-s.js",
            "env NODE_OPTIONS='--require ./sentinel-sentry-init.cjs --require ./email-runtime-env-compat.cjs' node server-phase-s.js",
            "env NODE_OPTIONS='--require ./sentinel-sentry-init.cjs --require ./email-runtime-env-compat.cjs --require ./supabase-quota-circuit-preload.cjs' node server-phase-s.js"
          )
          $s152Entries = @(
            'node server-phase-s-f17.js',
            "env NODE_OPTIONS='--require ./sentinel-sentry-init.cjs' node server-phase-s-f17.js",
            "env NODE_OPTIONS='--require ./sentinel-sentry-init.cjs --require ./email-runtime-env-compat.cjs' node server-phase-s-f17.js",
            "env NODE_OPTIONS='--require ./sentinel-sentry-init.cjs --require ./email-runtime-env-compat.cjs --require ./supabase-quota-circuit-preload.cjs' node server-phase-s-f17.js"
          )
          $directOk = $phaseSEntries -contains $start
          $bootstrapOk = ($s152Entries -contains $start) -and
            ($s152 -match "a\[0\]==='server-f5\.js'") -and
            ($s152 -match "a\[0\]='server-f17\.js'") -and
            ($s152 -match "require\('./server-phase-s\.js'\)") -and
            ($f17 -match "\['server-f5\.js'\]")
          if (-not ($directOk -or $bootstrapOk)) { throw 'Railway certified Phase S/F17 start command missing' }
          if ($start -like "env NODE_OPTIONS='*'") {
            if ([string]$cfg.build.buildCommand -match 'NODE_OPTIONS') { throw 'Runtime preload must not contaminate build' }
          }

      - name: Delegated Linux contracts remain canonical
        shell: powershell
        run: |
          Write-Host 'Phase S adds no DB migration or schema object.'
          Write-Host 'Python and DB/RLS/pgTAP contracts remain owned by Linux Zero-Cost workflows.'
          $required = @(
            'ci/phase4-revenue/ui_contract.py',
            'ci/wa2-conversation-live-inbox/ui_contract.py',
            'ci/wa3-boxes-routing-handoff/ui_contract.py',
            'ci/wa4-ai-sales-router/ui_contract.py'
          )
          foreach ($file in $required) { if (-not (Test-Path $file)) { throw "Delegated contract missing: $file" } }

      - name: Phase S gate summary
        shell: powershell
        run: |
          Write-Host 'PHASE S NODE/RUNTIME GATE PASS'
          Write-Host 'WA S8 NATIVE WORKSPACE CONTRACT PASS'
          Write-Host 'WA S10 CUSTOMER-WINDOW CONTRACT PASS'
          Write-Host 'WA S11 LIVE-SYNC + META-AUTH CONTRACT PASS'
          Write-Host 'WA SUPABASE QUOTA CIRCUIT CONTRACT PASS'
          Write-Host 'AUTH RESEND PRIVATE-VAULT RECONCILIATION GATE PASS'
          Write-Host 'Production validation remaining: Supabase quota reset + deploy health + provider readiness + authenticated human outbound canary inside an open 24h window.'
