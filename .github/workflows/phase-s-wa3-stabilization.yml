name: ASCENDA PHASE S WA3 Stabilization

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/server-phase-s.js'
      - 'app/railway.json'
      - 'app/server-f5.js'
      - 'app/server-wa4.js'
      - 'app/server-wa3.js'
      - 'app/server-wa2.js'
      - 'app/server-f4.js'
      - 'app/wa-gateway.js'
      - 'ci/phase-s/**'
      - 'docs/control/WHATSAPP_PHASE_S_*'
      - 'docs/control/WHATSAPP_REVENUE_HUB_EXPANSION_*'
      - '.github/workflows/phase-s-wa3-stabilization.yml'
  push:
    branches: ['phase-s/wa3-stabilization-human-outbound']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-s-wa3-stabilization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: Phase S native bootstrap and human-send boundary
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enforce Zero-Cost runner policy
        run: |
          set -euo pipefail
          test "${{ runner.environment }}" = "self-hosted"
          python3 scripts/ci/enforce-zero-cost-policy.py

      - name: Runtime syntax
        run: |
          set -euo pipefail
          node --check app/server-phase-s.js
          node --check app/server-f5.js
          node --check app/server-wa4.js
          node --check app/server-wa3.js
          node --check app/server-wa2.js
          node --check app/server-f4.js
          node --check app/wa-gateway.js

      - name: Phase S contracts
        run: node ci/phase-s/phase-s_contract.js

      - name: Preserve WA gateway and inbox regressions
        run: |
          set -euo pipefail
          node --test ci/wa1-secure-gateway/wa-gateway.test.js
          python3 ci/wa2-conversation-live-inbox/ui_contract.py
          python3 ci/wa3-boxes-routing-handoff/ui_contract.py

      - name: Security invariants
        run: |
          set -euo pipefail
          grep -q "aos_wa3_actor_v1" app/server-phase-s.js
          grep -q "human_send_enabled:false" app/server-phase-s.js
          grep -q "auto_routing_enabled:false" app/server-phase-s.js
          grep -q "ai_send_enabled:false" app/server-phase-s.js
          ! grep -Eq "(SUPABASE_SERVICE_ROLE_KEY|WHATSAPP_ACCESS_TOKEN)\s*=\s*['\"][^'\"]+['\"]" app/server-phase-s.js
          grep -q '"startCommand": "node server-phase-s.js"' app/railway.json

      - name: Phase S gate summary
        run: |
          echo 'PHASE S STATIC GATE PASS'
          echo 'Production gates remaining: native reload canary, human outbound, Meta delivery/read receipt.'
