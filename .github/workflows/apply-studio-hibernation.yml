name: Apply Studio Hibernation Guard

on:
  push:
    branches:
      - fix/studio-hibernation-guard

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/studio-hibernation-guard
          fetch-depth: 0

      - name: Apply deterministic Studio hibernation patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('app/server.js')
          s = p.read_text(encoding='utf-8')
          old = """// PERFORMANCE GUARD: Studio mantiene publicación automática con anti-solapamiento.
var _studioSchedulerRunning = false
function guardedStudioSchedulerRun() {
  if (_studioSchedulerRunning || !bgCanRun()) return
  _studioSchedulerRunning = true
  try { studioSchedulerRun() } catch(e) { bgFail(); console.error('[STUDIO-CRON] Guard error:', e.message) }
  setTimeout(function(){ _studioSchedulerRunning = false }, 45000)
}
setInterval(guardedStudioSchedulerRun, 120000)
setTimeout(guardedStudioSchedulerRun, 10000)
console.log('[STUDIO-CRON] Scheduler protegido — revisión cada 120s')"""
          new = """// PERFORMANCE GUARD v1.2 — Studio background hibernado por defecto.
// El panel, tablas, assets y funciones de Studio permanecen intactos.
// Reactivación controlada: AOS_STUDIO_BACKGROUND_ENABLED=true + redeploy.
var STUDIO_BACKGROUND_ENABLED = /^(1|true|yes|on)$/i.test(String(process.env.AOS_STUDIO_BACKGROUND_ENABLED || 'false'))
var _studioSchedulerRunning = false
function guardedStudioSchedulerRun() {
  if (!STUDIO_BACKGROUND_ENABLED || _studioSchedulerRunning || !bgCanRun()) return
  _studioSchedulerRunning = true
  try { studioSchedulerRun() } catch(e) { bgFail(); console.error('[STUDIO-CRON] Guard error:', e.message) }
  setTimeout(function(){ _studioSchedulerRunning = false }, 45000)
}
if (STUDIO_BACKGROUND_ENABLED) {
  setInterval(guardedStudioSchedulerRun, 120000)
  setTimeout(guardedStudioSchedulerRun, 10000)
  console.log('[STUDIO-CRON] ACTIVE — revisión protegida cada 120s')
} else {
  console.log('[STUDIO-CRON] HIBERNATED — background OFF; panel y datos preservados')
}"""
          if new in s:
              print('Studio hibernation already applied')
          elif old not in s:
              raise SystemExit('Expected Studio scheduler block not found; refusing non-deterministic edit')
          else:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('Studio hibernation patch applied')
          PY

      - name: Validate JavaScript and invariants
        run: |
          node --check app/server.js
          grep -q "AOS_STUDIO_BACKGROUND_ENABLED" app/server.js
          grep -q "STUDIO-CRON] HIBERNATED" app/server.js
          python3 - <<'PY'
          from pathlib import Path
          s = Path('app/server.js').read_text(encoding='utf-8')
          assert "process.env.AOS_STUDIO_BACKGROUND_ENABLED || 'false'" in s
          assert "if (STUDIO_BACKGROUND_ENABLED)" in s
          assert s.count('setInterval(guardedStudioSchedulerRun, 120000)') == 1
          print('Studio hibernation invariants OK')
          PY

      - name: Commit patched runtime if changed
        run: |
          if git diff --quiet -- app/server.js; then
            echo "No runtime changes to commit"
            exit 0
          fi
          git config user.name "ASCENDA Performance Guard"
          git config user.email "actions@users.noreply.github.com"
          git add app/server.js
          git commit -m "perf: hibernate Studio background scheduler by default"
          git push origin HEAD:fix/studio-hibernation-guard
