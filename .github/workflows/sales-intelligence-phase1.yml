name: ASCENDA Sales Intelligence Phase 1

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/staging-server.js'
      - 'app/railway.staging.json'
      - 'app/public/admin-sales-intelligence.html'
      - 'app/public/admin-sales-intelligence-staging.html'
      - 'app/public/login.html'
      - 'app/public/admin-team.html'
      - 'app/public/app.html'
      - 'ci/phase1-sales-intelligence/**'
      - '.github/workflows/sales-intelligence-phase1.yml'
  push:
    branches:
      - 'feat/sales-intelligence-v2-phase1-canary'
      - 'security/**'
      - 'infra/**'
    paths:
      - 'app/staging-server.js'
      - 'app/railway.staging.json'
      - 'app/public/admin-sales-intelligence.html'
      - 'app/public/admin-sales-intelligence-staging.html'
      - 'app/public/login.html'
      - 'app/public/admin-team.html'
      - 'app/public/app.html'
      - 'ci/phase1-sales-intelligence/**'
      - '.github/workflows/sales-intelligence-phase1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sales-intelligence-phase1-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ui-fixture:
    name: FAST UI fixture / isolated runtime smoke
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package.json

      - name: Enforce FAST lane
        shell: powershell
        run: |
          if ('${{ runner.environment }}' -ne 'self-hosted') { throw 'Sales Intelligence FAST lane must be self-hosted' }
          Write-Host "FAST runner: $env:RUNNER_NAME / $env:RUNNER_OS"
          node --version

      - name: Install app dependencies
        shell: powershell
        working-directory: app
        run: npm.cmd install --no-audit --no-fund

      - name: Validate Node parity UI fixture contract
        shell: powershell
        run: |
          node --check ci/phase1-sales-intelligence/ui_contract.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ci/phase1-sales-intelligence/ui_contract.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate Railway staging config
        shell: powershell
        run: |
          node -e "const c=require('./app/railway.staging.json'); if(c.deploy.startCommand!=='node staging-server.js'||c.deploy.healthcheckPath!=='/health') process.exit(1); console.log('PHASE1_RAILWAY_CONFIG=PASS')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate static staging isolation
        shell: powershell
        run: |
          node --check app/staging-server.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $server = Get-Content 'app/staging-server.js' -Raw
          if ($server -match 'supabase\.co|aos_ventas|aos_pacientes|aos_agenda') { throw 'Staging server contains production/data coupling' }
          Write-Host 'PHASE1_STAGING_ISOLATION=PASS'

      - name: Validate embedded script syntax
        shell: powershell
        run: |
          $files = @(
            'app/public/admin-sales-intelligence.html',
            'app/public/admin-sales-intelligence-staging.html',
            'app/public/login.html',
            'app/public/admin-team.html'
          )
          $root = Join-Path $env:RUNNER_TEMP 'ascenda-phase1-js'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          foreach ($src in $files) {
            $text = Get-Content $src -Raw
            $matches = [regex]::Matches($text, '(?is)<script[^>]*>(.*?)</script>')
            if ($matches.Count -eq 0) { throw "No scripts found in $src" }
            for ($i=0; $i -lt $matches.Count; $i++) {
              $name = [IO.Path]::GetFileNameWithoutExtension($src) + '-' + $i + '.js'
              $out = Join-Path $root $name
              [IO.File]::WriteAllText($out, $matches[$i].Groups[1].Value, (New-Object Text.UTF8Encoding($false)))
              node --check $out
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          Write-Host 'PHASE1_EMBEDDED_JS=PASS'

      - name: Isolated runtime / shadow / write-block smoke
        shell: powershell
        working-directory: app
        run: |
          $env:PORT = '4173'
          $outLog = Join-Path $env:RUNNER_TEMP 'ascenda-phase1-server.out.log'
          $errLog = Join-Path $env:RUNNER_TEMP 'ascenda-phase1-server.err.log'
          $proc = Start-Process -FilePath 'node' -ArgumentList 'staging-server.js' -PassThru -RedirectStandardOutput $outLog -RedirectStandardError $errLog
          try {
            $healthy = $false
            for ($i=0; $i -lt 30; $i++) {
              try {
                $r = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:4173/health' -TimeoutSec 2
                if ($r.StatusCode -eq 200 -and $r.Content -match 'staging-fixture') { $healthy = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $healthy) {
              if (Test-Path $outLog) { Get-Content $outLog }
              if (Test-Path $errLog) { Get-Content $errLog }
              throw 'PHASE1_RUNTIME_HEALTH=FAIL'
            }
            Write-Host 'PHASE1_RUNTIME_HEALTH=PASS'

            $head = Invoke-WebRequest -UseBasicParsing -Method Head -Uri 'http://127.0.0.1:4173/admin-sales-intelligence-staging.html'
            $envHeader = [string]$head.Headers['X-ASCENDA-ENV']
            if ($envHeader -ne 'staging-fixture') { throw "Missing staging fixture response header: $envHeader" }
            $si = (Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:4173/admin-sales-intelligence.html').Content
            $staging = (Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:4173/admin-sales-intelligence-staging.html').Content
            if (-not $si.Contains('Sales Intelligence V3')) { throw 'Production SI V3 surface marker missing' }
            if (-not $staging.Contains('ASCENDA Sales Intelligence')) { throw 'Staging SI title missing' }
            if (-not $staging.Contains('window.__ASCENDA_STAGING_FIXTURE__=true')) { throw 'Staging fixture marker missing over HTTP' }
            Write-Host 'PHASE1_HTTP_SHADOW=PASS'

            $code = 0
            try {
              $post = Invoke-WebRequest -UseBasicParsing -Method Post -Uri 'http://127.0.0.1:4173/admin-sales-intelligence-staging.html'
              $code = [int]$post.StatusCode
            } catch {
              if ($_.Exception.Response) { $code = [int]$_.Exception.Response.StatusCode }
            }
            if ($code -ne 405) { throw "Expected HTTP 405 for POST, got $code" }
            Write-Host 'PHASE1_WRITE_METHODS_BLOCKED=PASS'
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
