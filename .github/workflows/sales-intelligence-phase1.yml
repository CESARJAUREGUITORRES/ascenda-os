name: ASCENDA Sales Intelligence Phase 1

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/staging-server.js'
      - 'app/railway.staging.json'
      - 'app/public/admin-sales-intelligence.html'
      - 'app/public/admin-sales-intelligence-staging.html'
      - 'app/public/login.html'
      - 'app/public/admin-team.html'
      - 'app/public/app.html'
      - 'ci/phase1-sales-intelligence/**'
      - '.github/workflows/sales-intelligence-phase1.yml'
  push:
    branches:
      - 'feat/sales-intelligence-v2-phase1-canary'
      - 'security/**'
      - 'infra/**'
    paths:
      - 'app/staging-server.js'
      - 'app/railway.staging.json'
      - 'app/public/admin-sales-intelligence.html'
      - 'app/public/admin-sales-intelligence-staging.html'
      - 'app/public/login.html'
      - 'app/public/admin-team.html'
      - 'app/public/app.html'
      - 'ci/phase1-sales-intelligence/**'
      - '.github/workflows/sales-intelligence-phase1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sales-intelligence-phase1-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ui-fixture:
    name: FAST UI fixture / isolated runtime smoke
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce FAST lane
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT}" = "self-hosted"
          echo "FAST runner: ${RUNNER_NAME} / ${RUNNER_OS}"

      - name: Install app dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Validate UI fixture contract
        run: python ci/phase1-sales-intelligence/ui_contract.py

      - name: Validate Railway staging config
        run: |
          set -euo pipefail
          node -e "const c=require('./app/railway.staging.json'); if(c.deploy.startCommand!=='node staging-server.js'||c.deploy.healthcheckPath!=='/health') process.exit(1); console.log('PHASE1_RAILWAY_CONFIG=PASS')"

      - name: Validate static staging isolation
        run: |
          set -euo pipefail
          node --check app/staging-server.js
          if grep -qi 'supabase\.co\|aos_ventas\|aos_pacientes\|aos_agenda' app/staging-server.js; then
            echo 'Staging server contains production/data coupling'
            exit 1
          fi
          echo 'PHASE1_STAGING_ISOLATION=PASS'

      - name: Validate embedded script syntax
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, tempfile
          files=['app/public/admin-sales-intelligence.html','app/public/admin-sales-intelligence-staging.html','app/public/login.html','app/public/admin-team.html']
          root=Path(tempfile.gettempdir())/'ascenda-phase1-js'
          root.mkdir(parents=True,exist_ok=True)
          out=[]
          for src in files:
              text=Path(src).read_text(encoding='utf-8')
              scripts=re.findall(r'<script[^>]*>(.*?)</script>',text,re.S|re.I)
              if not scripts:
                  raise SystemExit(f'No scripts found in {src}')
              for i,s in enumerate(scripts):
                  p=root/f'{Path(src).stem}-{i}.js'
                  p.write_text(s,encoding='utf-8')
                  out.append(str(p))
          (root/'files.txt').write_text('\n'.join(out),encoding='utf-8')
          print(root/'files.txt')
          PY
          FILES="$(python -c "import tempfile; from pathlib import Path; print(Path(tempfile.gettempdir())/'ascenda-phase1-js'/'files.txt')")"
          while IFS= read -r f; do node --check "$f"; done <"$FILES"

      - name: Start isolated static runtime and verify health
        working-directory: app
        run: |
          set -euo pipefail
          LOG="${RUNNER_TEMP}/ascenda-phase1-server.log"
          PID="${RUNNER_TEMP}/ascenda-phase1-server.pid"
          PORT=4173 node staging-server.js >"$LOG" 2>&1 &
          echo $! >"$PID"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/health | grep -q 'staging-fixture'; then
              echo 'PHASE1_RUNTIME_HEALTH=PASS'
              exit 0
            fi
            sleep 1
          done
          cat "$LOG"
          exit 1

      - name: HTTP shadow surface gate
        run: |
          set -euo pipefail
          curl -fsSI http://127.0.0.1:4173/admin-sales-intelligence-staging.html | grep -qi 'X-ASCENDA-ENV: staging-fixture'
          curl -fsS http://127.0.0.1:4173/admin-sales-intelligence.html >"${RUNNER_TEMP}/si.html"
          curl -fsS http://127.0.0.1:4173/admin-sales-intelligence-staging.html >"${RUNNER_TEMP}/si-staging.html"
          grep -q 'Sales Intelligence V2' "${RUNNER_TEMP}/si.html"
          grep -q 'ASCENDA Sales Intelligence' "${RUNNER_TEMP}/si-staging.html"
          grep -q 'window.__ASCENDA_STAGING_FIXTURE__=true' "${RUNNER_TEMP}/si-staging.html"
          echo 'PHASE1_HTTP_SHADOW=PASS'

      - name: Reject write methods in staging runtime
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:4173/admin-sales-intelligence-staging.html)
          test "$code" = '405'
          echo 'PHASE1_WRITE_METHODS_BLOCKED=PASS'

      - name: Stop isolated staging runtime
        if: always()
        run: |
          PID="${RUNNER_TEMP}/ascenda-phase1-server.pid"
          if [ -f "$PID" ]; then kill $(cat "$PID") 2>/dev/null || true; fi
