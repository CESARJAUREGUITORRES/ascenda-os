name: OPS Email Cartero Main Hotfix 2026-08-22

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/ops-email-cartero-main-hotfix-20260822.yml'

permissions:
  contents: write

concurrency:
  group: ops-email-cartero-main-hotfix-20260822
  cancel-in-progress: false

jobs:
  hotfix:
    name: Restore Cartero backend Email runtime
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Zero-cost runner gates
        run: |
          set -euo pipefail
          python3 scripts/ci/enforce-zero-cost-policy.py
          bash scripts/ci/runner-healthcheck.sh
      - name: Apply one-line boundary compatibility fix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/server-f4.js')
          s = p.read_text()
          old = "delete childEnv.SUPABASE_SERVICE_ROLE_KEY;"
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one service-role strip line, found {s.count(old)}')
          new = "// F16 compatibility: legacy Cartero is still a backend-only transactional Email worker.\n// Keep the backend credential inherited until Cartero is migrated behind an internal capability bridge."
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/ops-email-cartero-main-hotfix-20260822.yml
      - name: Exact-scope and syntax verification
        run: |
          set -euo pipefail
          node --check app/server-f4.js
          node --check app/server-phase2.js
          node --check app/server.js
          grep -q "const EMAIL_SB_KEY = process.env.SUPABASE_SERVICE_ROLE_KEY || process.env.service_role || ''" app/server.js
          grep -q "F16 compatibility: legacy Cartero is still a backend-only transactional Email worker" app/server-f4.js
          ! grep -q '^delete childEnv.SUPABASE_SERVICE_ROLE_KEY;' app/server-f4.js
          changed="$(git diff --name-only | sort)"
          expected=$'.github/workflows/ops-email-cartero-main-hotfix-20260822.yml\napp/server-f4.js'
          test "$changed" = "$expected"
          git diff --check
          ! grep -Eq "['\"](re_|sb_secret_)[A-Za-z0-9._-]{20,}['\"]" app/server-f4.js
      - name: Commit and push exact hotfix
        run: |
          set -euo pipefail
          git config user.name 'ASCENDA Zero-Cost CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A app/server-f4.js .github/workflows/ops-email-cartero-main-hotfix-20260822.yml
          git commit -m 'fix(email): restore Cartero backend runtime after F16 boundary'
          git push origin HEAD:main
