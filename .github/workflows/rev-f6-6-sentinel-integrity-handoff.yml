name: ASCENDA REV-F6.6 Sentinel Data-Integrity Handoff

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/*rev_f6_6*'
      - 'supabase/rollbacks/*rev_f6_6*'
      - 'ci/rev-f6-6/**'
      - 'docs/control/REV_F6_6*'
      - 'docs/control/SENTINEL_SIGNAL_CONTRACTS_REV_F6_6_V1.json'
      - 'docs/control/ASCENDA_WORKSTREAM_LOCK_CURRENT.md'
      - '.github/workflows/rev-f6-6-sentinel-integrity-handoff.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rev-f6-6-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  fast-contracts:
    name: F6.6 FAST zero-PII + Sentinel regression
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Enforce FAST lane
        shell: powershell
        run: if ('${{ runner.environment }}' -ne 'self-hosted') { throw 'FAST lane must be self-hosted' }
      - name: Diff hygiene
        shell: powershell
        run: git diff --check
      - name: F6.6 static contract
        shell: powershell
        run: node ci/rev-f6-6/static_contract.js
      - name: Existing Sentinel F8 contract regression
        shell: powershell
        run: |
          node ci/sentinel/phase8_incident_engine_contract.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ci/sentinel/phase8_incident_engine_synthetic.js
  db-security-semantic:
    name: F6.6 DB/security/semantic/replay/recovery
    needs: fast-contracts
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 40
    env:
      DB_URL: postgresql://postgres:postgres@127.0.0.1:59862/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: {version: 2.101.0}
      - name: Enforce Zero-Cost DB runner
        run: |
          set -euo pipefail
          test "${{ runner.environment }}" = "self-hosted"
          python3 scripts/ci/enforce-zero-cost-policy.py
      - name: Configure isolated Supabase
        working-directory: ci/zero-cost-staging
        run: |
          set -euo pipefail
          sed -i 's/project_id = "ascenda-zero-cost-staging"/project_id = "ascenda-rev-f6-6"/' supabase/config.toml
          sed -i 's/port = 54321/port = 59861/' supabase/config.toml
          sed -i 's/port = 54322/port = 59862/' supabase/config.toml
          sed -i 's/shadow_port = 54320/shadow_port = 59860/' supabase/config.toml
      - name: Start isolated Postgres
        working-directory: ci/zero-cost-staging
        run: |
          set -euo pipefail
          supabase stop --no-backup || true
          docker ps -aq --filter 'name=ascenda-rev-f6-6' | xargs -r docker rm -f || true
          rm -rf supabase/.temp supabase/.branches
          supabase db start
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 59862 -U postgres >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Build F6.1 synthetic prerequisite schema
        run: psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-f6-1/schema_contract.sql
      - name: Add F6.2 lifecycle fixture
        run: psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-f6-2/fixture.sql
      - name: Add F6.3 confidence fixture
        run: psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-f6-3/fixture.sql
      - name: Apply F6.0
        run: psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260820013500_rev_f6_0_data_contract_v1.sql
      - name: Apply F6.1
        run: |
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260820022000_rev_f6_1_patient_commercial_360_v2.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260820022500_rev_f6_1_alias_normalization_fix.sql
      - name: Apply F6.2
        run: |
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260820034000_rev_f6_2_customer_lifecycle_v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260820035500_rev_f6_2_lima_date_active_subject_fix.sql
      - name: Capture and apply F6.3
        run: |
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-f6-3/capture_baseline.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260820172500_rev_f6_3_identity_confidence_metric_trust_v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-f6-3/tests/001_identity_confidence_metric_trust.sql
      - name: Fixture and apply F6.4
        run: |
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-f6-4/fixture.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-f6-4/capture_baseline.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260820190000_rev_f6_4_sales_intelligence_3_v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260820191000_rev_f6_4_live_performance_baseline_decouple_v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260820191500_rev_f6_4_dashboard_cache_performance_v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-f6-4/tests/001_sales_intelligence_3.sql
      - name: Apply and validate F6.5
        run: |
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-f6-5/capture_baseline.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260820195500_rev_f6_5_historical_sales_plugin_v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260820204500_rev_f6_5_rev_f6_0_fingerprint_isolation_v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -c "update public.ci_f65_protected_baseline set f63_fp=public.aos_rev_f6_3_contract_v1()->>'contract_fingerprint', f64_fp=public.aos_rev_f6_4_contract_v1()->>'contract_fingerprint';"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-f6-5/fixtures_A_J.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-f6-5/tests/001_historical_sales_plugin.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-f6-5/tests/002_cross_workstream_fingerprint_isolation.sql
      - name: F6.6 compatibility fixture + existing F8
        run: |
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-f6-6/fixture.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260816233500_sentinel_f8_incident_engine.sql
      - name: Capture protected pre-F6.6 boundary
        run: |
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          create table public.ci_f66_protected_baseline as select (select count(*)::bigint from public.aos_pacientes) patients,(select count(*)::bigint from public.aos_ventas) sales,(select count(*)::bigint from public.aos_product_sale_fact_current_v1) f3,(select count(*)::bigint from public.aos_cartera_reconciliacion) f4,public.aos_rev_f6_data_contract_v1()->>'contract_fingerprint' f60,public.aos_rev_f6_3_contract_v1()->>'contract_fingerprint' f63,public.aos_rev_f6_4_contract_v1()->>'contract_fingerprint' f64,public.aos_rev_f6_5_contract_v1()->>'contract_fingerprint' f65;
          SQL
      - name: Apply REV-F6.6 exact migration
        run: psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260820215500_rev_f6_6_sentinel_integrity_handoff_v1.sql
      - name: Synthetic A-X + ACL + zero-PII + F8 compatibility
        run: psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-f6-6/tests/001_sentinel_integrity_handoff.sql
      - name: Protected truth and fingerprints unchanged
        run: |
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          do $$ declare b record; begin select * into b from public.ci_f66_protected_baseline; if b.patients<>(select count(*) from public.aos_pacientes) then raise exception 'PATIENT_MUTATION'; end if; if b.sales<>(select count(*) from public.aos_ventas) then raise exception 'SALES_MUTATION'; end if; if b.f3<>(select count(*) from public.aos_product_sale_fact_current_v1) then raise exception 'F3_MUTATION'; end if; if b.f4<>(select count(*) from public.aos_cartera_reconciliacion) then raise exception 'F4_MUTATION'; end if; if b.f60<>public.aos_rev_f6_data_contract_v1()->>'contract_fingerprint' then raise exception 'F60_DRIFT'; end if; if b.f63<>public.aos_rev_f6_3_contract_v1()->>'contract_fingerprint' then raise exception 'F63_DRIFT'; end if; if b.f64<>public.aos_rev_f6_4_contract_v1()->>'contract_fingerprint' then raise exception 'F64_DRIFT'; end if; if b.f65<>public.aos_rev_f6_5_contract_v1()->>'contract_fingerprint' then raise exception 'F65_DRIFT'; end if; end $$;
          SQL
      - name: Performance bounded
        run: |
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          do $$ declare t0 timestamptz; ms numeric; x jsonb; begin t0:=clock_timestamp(); x:=public.aos_sentinel_rev_f6_6_integrity_health_v1(); ms:=extract(epoch from (clock_timestamp()-t0))*1000; if ms>=1000 then raise exception 'F6_6_HEALTH_TOO_SLOW:%ms',ms; end if; end $$;
          SQL
      - name: Full idempotent migration replay
        run: |
          fp1="$(psql "$DB_URL" -X -qAt -c "select public.aos_rev_f6_6_contract_v1()->>'contract_fingerprint'")"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260820215500_rev_f6_6_sentinel_integrity_handoff_v1.sql
          fp2="$(psql "$DB_URL" -X -qAt -c "select public.aos_rev_f6_6_contract_v1()->>'contract_fingerprint'")"
          test "$fp1" = "$fp2"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-f6-6/tests/001_sentinel_integrity_handoff.sql
      - name: Recovery restores pre-F6.6 boundary
        run: |
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/rollbacks/20260820215500_rev_f6_6_sentinel_integrity_handoff_v1_recovery.sql
          test "$(psql "$DB_URL" -X -qAt -c "select to_regprocedure('public.aos_rev_f6_6_contract_v1()') is null")" = "t"
          test "$(psql "$DB_URL" -X -qAt -c "select to_regprocedure('public.aos_sentinel_rev_f6_6_integrity_health_v1()') is null")" = "t"
      - name: Stop isolated Supabase
        if: always()
        working-directory: ci/zero-cost-staging
        run: supabase stop --no-backup || true
