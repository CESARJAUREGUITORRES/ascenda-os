name: CLINIC Login V4 Patch and Gate
on:
  push:
    branches:
      - feat/clinic-login-v4-20260915

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/clinic-login-v4-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch login presentation only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/public/login.html')
          s=p.read_text()
          css='<link rel="stylesheet" href="/clinic-login-v4.css?v=20260915-1">'
          js='<script src="/clinic-login-v4.js?v=20260915-1"></script>'
          replacements={
            '<title>AscendaOS — Iniciar sesión</title>':'<title>ASCENDA CLINIC — Iniciar sesión</title>',
            '<meta name="application-name" content="AscendaOS">':'<meta name="application-name" content="ASCENDA CLINIC">',
            '<meta name="apple-mobile-web-app-title" content="AscendaOS">':'<meta name="apple-mobile-web-app-title" content="ASCENDA CLINIC">',
            '<div class="brand">ASCENDA<span>OS</span></div>':'<div class="brand">ASCENDA <span>CLINIC</span></div>',
            'alt="AscendaOS"':'alt="ASCENDA CLINIC"',
            '>Ingresar al sistema</button>':'>Ingresar</button>',
            '>AscendaOS · acceso seguro v3</div>':'>ASCENDA CLINIC · acceso seguro</div>',
            '>📲 Instalar AscendaOS</div>':'>📲 Instalar ASCENDA CLINIC</div>',
          }
          for old,new in replacements.items():
            if old in s:
              s=s.replace(old,new,1)
            elif new not in s:
              raise SystemExit('Missing both old and new presentation anchor: '+old)
          if css not in s:
            s=s.replace('</head>',css+'</head>',1)
          if js not in s:
            s=s.replace('</body>',js+'</body>',1)
          p.write_text(s)
          PY
      - name: Validate external Login V4 JavaScript
        run: node --check app/public/clinic-login-v4.js
      - name: Validate manifest and visual contract
        run: |
          node - <<'NODE'
          const fs=require('fs')
          const manifest=JSON.parse(fs.readFileSync('app/public/manifest.json','utf8'))
          const html=fs.readFileSync('app/public/login.html','utf8')
          const js=fs.readFileSync('app/public/clinic-login-v4.js','utf8')
          function ok(v,m){if(!v)throw new Error(m)}
          ok(manifest.name==='ASCENDA CLINIC','manifest visible name')
          ok(manifest.id==='/app'&&manifest.scope==='/'&&manifest.start_url==='/app','technical PWA identity must remain stable')
          ok(html.includes('/clinic-login-v4.css?v=20260915-1'),'visual CSS hook missing')
          ok(html.includes('/clinic-login-v4.js?v=20260915-1'),'visual JS hook missing')
          ok(html.includes('ASCENDA <span>CLINIC</span>'),'visible CLINIC brand missing')
          ok(html.includes('id="login">Ingresar</button>'),'Ingresar CTA missing')
          ok(html.includes('autocomplete="one-time-code"'),'Auth V3 OTP semantics changed')
          ok(html.includes("PENDING_KEY='aos_auth_pending_v1'"),'pending 2FA restore contract changed')
          ok(js.includes("otp-cell")&&js.includes("otp-segmented"),'segmented OTP visual adapter missing')
          ok(js.includes("MutationObserver"),'OTP dynamic render observer missing')
          console.log('CLINIC Login V4 static gate: PASS')
          NODE
      - name: Existing APP-PWA V2 contract
        run: node ci/app-pwa-v2/contract.js
      - name: Commit presentation patch to branch
        run: |
          if git diff --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/public/login.html
          git commit -m "CLINIC BRAND L0: wire Login V4 presentation"
          git push origin HEAD:feat/clinic-login-v4-20260915
