name: TEMP Marketing production smoke

on:
  push:
    branches:
      - smoke/marketing-v421-production-20260821
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 8
    steps:
      - name: Production health and Marketing assets
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://ascenda-os-production.up.railway.app'
          $health = Invoke-WebRequest -UseBasicParsing -Uri "$base/health" -TimeoutSec 30
          if ($health.StatusCode -ne 200) { throw "health status $($health.StatusCode)" }
          Write-Host "health=200"

          $ctl = Invoke-WebRequest -UseBasicParsing -Uri "$base/admin-marketing-v2.js?smoke=20260821" -TimeoutSec 30
          if ($ctl.StatusCode -ne 200) { throw "controller status $($ctl.StatusCode)" }
          if ($ctl.Content -notmatch "2026-08-21-v4\.2\.1") { throw 'V4.2.1 release marker missing in production controller' }
          if ($ctl.Content -notmatch "L\(loadAll,1200\)") { throw 'staggered V4.2 load marker missing' }
          Write-Host "controller=v4.2.1"

          $panel = Invoke-WebRequest -UseBasicParsing -Uri "$base/admin-marketing.html?smoke=20260821" -TimeoutSec 30
          if ($panel.StatusCode -ne 200) { throw "panel status $($panel.StatusCode)" }
          $marker = 'Operational tables must not wait for LTV/history.'
          $count = ([regex]::Matches($panel.Content, [regex]::Escape($marker))).Count
          if ($count -lt 2) { throw "operational decoupling marker count=$count" }
          $posOps = $panel.Content.IndexOf('rAn(d.porAnuncio||[]);rCamp(d.porTratamiento||[]);rVL(d.ventasLeads||[]);rVF(d.ventasLeadsFuera||[]);')
          $posLtv = $panel.Content.IndexOf("rpc('aos_ltv_cohortes'")
          if ($posOps -lt 0 -or $posLtv -lt 0 -or $posOps -gt $posLtv) { throw 'operational render is not before LTV call' }
          Write-Host "panel=operational-first"
