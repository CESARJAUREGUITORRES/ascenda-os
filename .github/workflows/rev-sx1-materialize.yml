name: TEMP REV-SX1 Materialize
on:
  push:
    branches: [feature/rev-sx1-sales-explorer]
    paths: ['.github/workflows/rev-sx1-materialize.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rev-sx1-sales-explorer
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Normalize SX1 entrypoint
        shell: powershell
        run: |
          @'
          const fs=require('fs');
          const p='app/public/f4-revenue-ops.js';
          let s=fs.readFileSync(p,'utf8');
          if(!s.includes('function patchSalesExplorerEntrypoints')) throw new Error('SX1 entrypoint missing');
          s=s.replace("mark.textContent='â†—'","mark.textContent='\\u2197'");
          s=s.replace("mark.textContent='↗'","mark.textContent='\\u2197'");
          fs.writeFileSync(p,s,'utf8');
          '@ | Set-Content -Path $env:RUNNER_TEMP\sx1-clean.js -Encoding utf8
          node $env:RUNNER_TEMP\sx1-clean.js
          node --check app/public/f4-revenue-ops.js
      - name: Commit if changed
        shell: powershell
        run: |
          if (-not (git status --porcelain)) { Write-Host 'No changes'; exit 0 }
          git config user.name 'ascenda-ci'
          git config user.email 'ascenda-ci@users.noreply.github.com'
          git add app/public/f4-revenue-ops.js
          git commit -m 'REV-SX1: normalize explorer entrypoint marker'
          git push origin HEAD:feature/rev-sx1-sales-explorer
