name: TEMP REV-SX1 Materialize
on:
  push:
    branches: [feature/rev-sx1-sales-explorer]
    paths: ['.github/workflows/rev-sx1-materialize.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rev-sx1-sales-explorer
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch F4 bridge deterministically
        shell: powershell
        run: |
          @'
          const fs=require('fs');
          const p='app/public/f4-revenue-ops.js';
          let s=fs.readFileSync(p,'utf8');
          if(s.includes('function patchSalesExplorerEntrypoints')) { console.log('SX1 entrypoint already materialized'); process.exit(0); }
          const route=`\n  if(name==='aos_sales_explorer_history_v1'){\n    var xb=parseBody(init);xb.p_token=token();\n    return postRpc(url,init,'aos_sales_explorer_history_v1',xb).then(function(r){if(missing(r))return nativeFetch(input,init);return r});\n  }\n`;
          const routeAnchor="\n  if(name==='aos_cartera_gateway'){";
          if(!s.includes(routeAnchor)) throw new Error('SX1 route anchor missing');
          s=s.replace(routeAnchor,route+routeAnchor);
          const helpers=`\nvar sx1Loader=null;\nfunction openSalesExplorer(kind){\n  if(window.AOS_SX1&&typeof window.AOS_SX1.open==='function'){window.AOS_SX1.open(kind);return}\n  if(!sx1Loader){\n    sx1Loader=new Promise(function(resolve,reject){\n      var sc=document.createElement('script');sc.src='/rev-sx1-sales-explorer.js?v=20260822-sx1-v1';sc.async=true;\n      sc.onload=resolve;sc.onerror=function(){sx1Loader=null;reject(new Error('SX1_ASSET_LOAD_FAILED'))};document.head.appendChild(sc);\n    });\n  }\n  sx1Loader.then(function(){if(window.AOS_SX1&&window.AOS_SX1.open)window.AOS_SX1.open(kind)}).catch(function(e){console.error('[REV-SX1]',e)});\n}\nfunction patchSalesExplorerEntrypoints(){\n  [['vs-top-serv','SERVICE'],['vs-top-prod','PRODUCT']].forEach(function(pair){\n    var body=document.getElementById(pair[0]);if(!body)return;var card=body.closest?body.closest('.crd'):null,title=card&&card.querySelector('.ct');\n    if(!title||title.getAttribute('data-sx1')==='1')return;\n    title.setAttribute('data-sx1','1');title.setAttribute('role','button');title.setAttribute('tabindex','0');title.style.cursor='pointer';title.title='Abrir Sales Explorer';\n    var mark=document.createElement('span');mark.textContent='↗';mark.style.cssText='font-size:10px;color:#0A4FBF;margin-left:4px';title.appendChild(mark);\n    function go(){openSalesExplorer(pair[1])}title.addEventListener('click',go);title.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();go()}});\n  });\n}\n\n`;
          const helperAnchor='function patchSales(){';
          if(!s.includes(helperAnchor)) throw new Error('SX1 helper anchor missing');
          s=s.replace(helperAnchor,helpers+helperAnchor+'\n  patchSalesExplorerEntrypoints();');
          fs.writeFileSync(p,s,'utf8');
          console.log('REV-SX1 lazy entrypoint materialized');
          '@ | Set-Content -Path $env:RUNNER_TEMP\sx1-patch.js -Encoding utf8
          node $env:RUNNER_TEMP\sx1-patch.js
          node --check app/public/f4-revenue-ops.js
      - name: Commit materialized bridge
        shell: powershell
        run: |
          if (-not (git status --porcelain)) { Write-Host 'No changes'; exit 0 }
          git config user.name 'ascenda-ci'
          git config user.email 'ascenda-ci@users.noreply.github.com'
          git add app/public/f4-revenue-ops.js
          git commit -m 'REV-SX1: lazy-load Sales Explorer from ranking titles'
          git push origin HEAD:feature/rev-sx1-sales-explorer
