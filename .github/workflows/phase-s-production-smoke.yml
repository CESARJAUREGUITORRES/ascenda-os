name: PHASE S Production Smoke

on:
  push:
    branches: ['phase-s/production-smoke-20260815']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-s-production-smoke
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 6
    steps:
      - name: Probe production Phase S
        shell: powershell
        run: |
          $origin = 'https://ascenda-os-production.up.railway.app'
          $ready = $false
          for ($i = 1; $i -le 24; $i++) {
            $body = & curl.exe -sS --max-time 15 "$origin/health"
            $curlCode = $LASTEXITCODE
            if ($curlCode -eq 0 -and $body) {
              Write-Host "HEALTH_ATTEMPT_${i}=$body"
              try {
                $health = $body | ConvertFrom-Json
                if ($health.ok -eq $true -and $health.service -eq 'ascenda-phase-s' -and $health.child_alive -eq $true -and $health.inner_ready -eq $true) {
                  $ready = $true
                  break
                }
              } catch {
                Write-Host "Health JSON not ready yet"
              }
            } else {
              Write-Host "HEALTH_ATTEMPT_${i}=curl_exit_$curlCode"
            }
            Start-Sleep -Seconds 8
          }
          if (-not $ready) { throw 'PHASE_S_PRODUCTION_HEALTH_NOT_READY' }
          Write-Host 'PHASE_S_HEALTH=PASS'

          $appStatus = & curl.exe -sS -o NUL -w '%{http_code}' --max-time 20 "$origin/app"
          Write-Host "APP_STATUS=$appStatus"
          if ($appStatus -ne '200') { throw "ASCENDA_APP_BAD_STATUS_$appStatus" }

          $gateStatus = & curl.exe -sS -o NUL -w '%{http_code}' --max-time 15 "$origin/api/phase-s/status"
          Write-Host "PHASE_S_UNAUTH_STATUS=$gateStatus"
          if ($gateStatus -ne '403') { throw "PHASE_S_UNAUTH_GATE_EXPECTED_403_GOT_$gateStatus" }
          Write-Host 'PHASE_S_PRODUCTION_SMOKE=PASS'
