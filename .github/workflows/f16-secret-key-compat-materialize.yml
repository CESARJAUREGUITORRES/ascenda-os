name: F16 Secret Key Compatibility Materialize

on:
  push:
    branches:
      - hotfix/f16-supabase-secret-key-compat-20260815
    paths:
      - .github/workflows/f16-secret-key-compat-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Zero-Cost health
        run: |
          python3 scripts/ci/enforce-zero-cost-policy.py
          bash scripts/ci/runner-healthcheck.sh
      - name: Expose trusted runner Node
        run: bash scripts/ci/expose-runner-node.sh
      - name: Apply deterministic compatibility patch
        run: python3 scripts/ci/f16_secret_key_compat_patch.py
      - name: Safety assertions
        run: |
          set -euo pipefail
          node --check app/email-gateway.js
          node --check app/f16-live-canary.js
          node --check app/server.js
          node ci/phase16/test_email_gateway.js
          grep -Fq 'f16SupabaseHeaders' app/server.js
          grep -Fq 'sb_(?:secret|publishable)_' app/email-gateway.js
          grep -Fq 'sb_(?:secret|publishable)_' app/f16-live-canary.js
          git diff --check
      - name: Commit compatibility patch
        run: |
          set -euo pipefail
          git config user.name 'ASCENDA Zero-Cost CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/email-gateway.js app/f16-live-canary.js app/server.js
          git commit -m 'fix(f16): support Supabase sb_secret server keys'
          git push origin HEAD:${GITHUB_REF_NAME}
