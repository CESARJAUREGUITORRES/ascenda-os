name: F16 Secret Key Compatibility Materialize

on:
  push:
    branches: ['hotfix/f16-supabase-secret-key-compat-20260815']
    paths:
      - '.github/workflows/f16-secret-key-compat-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Zero-Cost health
        run: |
          python3 scripts/ci/enforce-zero-cost-policy.py
          bash scripts/ci/runner-healthcheck.sh
      - name: Expose trusted runner Node
        run: bash scripts/ci/expose-runner-node.sh
      - name: Patch Supabase server-key header compatibility
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # email-gateway.js
          p = Path('app/email-gateway.js')
          s = p.read_text()
          old = "    var headers = { apikey: serviceKey, Authorization: 'Bearer ' + serviceKey }\n    if (prefer) headers.Prefer = prefer\n"
          new = "    var headers = { apikey: serviceKey }\n    if (!/^sb_(?:secret|publishable)_/.test(serviceKey)) headers.Authorization = 'Bearer ' + serviceKey\n    if (prefer) headers.Prefer = prefer\n"
          if s.count(old) != 1:
              raise SystemExit('email-gateway service header anchor not unique')
          p.write_text(s.replace(old, new, 1))

          # f16-live-canary.js
          p = Path('app/f16-live-canary.js')
          s = p.read_text()
          old = """    return requester(sbUrl + path, {
      method: method || 'GET',
      headers: { apikey: serviceKey, Authorization: 'Bearer ' + serviceKey },
      timeout: 15000
    }, body)
"""
          new = """    var headers = { apikey: serviceKey }
    if (!/^sb_(?:secret|publishable)_/.test(serviceKey)) headers.Authorization = 'Bearer ' + serviceKey
    return requester(sbUrl + path, {
      method: method || 'GET',
      headers: headers,
      timeout: 15000
    }, body)
"""
          if s.count(old) != 1:
              raise SystemExit('live-canary service header anchor not unique')
          p.write_text(s.replace(old, new, 1))

          # server.js legacy Email backend only
          p = Path('app/server.js')
          s = p.read_text()
          anchor = """function f16RequireEmailBackend(endpoint) {
  if (/^\\/rest\\/v1\\/aos_emails?_/.test(String(endpoint || '')) && !EMAIL_SB_KEY) {
    throw new Error('EMAIL_SERVICE_ROLE_NOT_CONFIGURED')
  }
}

"""
          replacement = anchor + """function f16SupabaseHeaders(dbKey, extra) {
  var headers = { 'apikey': dbKey }
  if (!/^sb_(?:secret|publishable)_/.test(String(dbKey || ''))) headers.Authorization = 'Bearer ' + dbKey
  return Object.assign(headers, extra || {})
}

"""
          if s.count(anchor) != 1:
              raise SystemExit('server header helper anchor not unique')
          s = s.replace(anchor, replacement, 1)
          replacements = {
            "headers: { 'apikey': dbKey, 'Authorization': 'Bearer ' + dbKey, 'Content-Type': 'application/json', 'Prefer': 'return=minimal', 'Content-Length': Buffer.byteLength(data) }": "headers: f16SupabaseHeaders(dbKey, { 'Content-Type': 'application/json', 'Prefer': 'return=minimal', 'Content-Length': Buffer.byteLength(data) })",
            "headers: { 'apikey': dbKey, 'Authorization': 'Bearer ' + dbKey }": "headers: f16SupabaseHeaders(dbKey)",
            "headers: { 'apikey': dbKey, 'Authorization': 'Bearer ' + dbKey, 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(data), 'Prefer': 'return=minimal' }": "headers: f16SupabaseHeaders(dbKey, { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(data), 'Prefer': 'return=minimal' })"
          }
          for old_text, new_text in replacements.items():
              if s.count(old_text) != 1:
                  raise SystemExit('server service header anchor not unique: ' + old_text[:40])
              s = s.replace(old_text, new_text, 1)
          p.write_text(s)
          PY
      - name: Safety assertions
        run: |
          set -euo pipefail
          node --check app/email-gateway.js
          node --check app/f16-live-canary.js
          node --check app/server.js
          node ci/phase16/test_email_gateway.js
          grep -q "sb_(?:secret|publishable)_" app/email-gateway.js
          grep -q "sb_(?:secret|publishable)_" app/f16-live-canary.js
          grep -q "f16SupabaseHeaders" app/server.js
          git diff --check
      - name: Commit compatibility patch
        run: |
          set -euo pipefail
          git config user.name 'ASCENDA Zero-Cost CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/email-gateway.js app/f16-live-canary.js app/server.js
          git commit -m 'fix(f16): support Supabase sb_secret server keys'
          git push origin HEAD:${GITHUB_REF_NAME}
