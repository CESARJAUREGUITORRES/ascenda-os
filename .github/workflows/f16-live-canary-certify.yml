name: F16 Live Canary Certification

on:
  push:
    branches:
      - hotfix/f16-supabase-secret-key-compat-20260815
    paths:
      - .github/workflows/f16-live-canary-certify.yml

permissions:
  contents: read

jobs:
  fast-runtime-a:
    name: FAST runtime and unit contract
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Runtime syntax and Email gateway tests
        shell: powershell
        run: |
          node --check app/f16-live-canary.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/email-gateway.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/server.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ci/phase16/test_email_gateway.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'F16_FAST_SECRET_KEY_RUNTIME=PASS'

  fast-runtime-b:
    name: FAST Supabase key compatibility security
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify new secret-key and legacy JWT compatibility
        shell: powershell
        run: |
          $gateway = Get-Content app/email-gateway.js -Raw
          $canary = Get-Content app/f16-live-canary.js -Raw
          $server = Get-Content app/server.js -Raw
          foreach ($text in @($gateway,$canary,$server)) {
            if (-not $text.Contains('sb_(?:secret|publishable)_')) { throw 'Opaque Supabase key discriminator missing' }
          }
          if (-not $gateway.Contains("var headers = { apikey: serviceKey }")) { throw 'Gateway apikey-only base header missing' }
          if (-not $canary.Contains("var headers = { apikey: serviceKey }")) { throw 'Canary apikey-only base header missing' }
          if (-not $server.Contains('f16SupabaseHeaders')) { throw 'Server compatibility helper missing' }
          if ($gateway -match "apikey: serviceKey, Authorization") { throw 'Gateway still sends opaque secret as unconditional Bearer' }
          if ($canary -match "apikey: serviceKey, Authorization") { throw 'Canary still sends opaque secret as unconditional Bearer' }
          if ($server -match "'apikey': dbKey, 'Authorization': 'Bearer ' \+ dbKey") { throw 'Server legacy Email backend still has unconditional Bearer' }
          if ($gateway -match 'sb_secret_[A-Za-z0-9_-]{10,}') { throw 'Supabase secret committed' }
          if ($canary -match 'sb_secret_[A-Za-z0-9_-]{10,}') { throw 'Supabase secret committed' }
          if ($server -match 'sb_secret_[A-Za-z0-9_-]{10,}') { throw 'Supabase secret committed' }
          if (-not $canary.Contains('delivered+ascenda-f16-20260815@resend.dev')) { throw 'Fixed simulator recipient missing' }
          if (-not $canary.Contains('SIGNED_WEBHOOK_REPLAY_DEDUPED')) { throw 'Signed replay proof missing' }
          Write-Host 'F16_FAST_SECRET_KEY_SECURITY=PASS'

  zero-cost-db:
    name: Zero-Cost F16 contracts and release gates
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 25
    env:
      BASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      F16_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/phase16_secret_key_compat
    steps:
      - uses: actions/checkout@v4
      - name: Zero-Cost policy and runner health
        run: |
          python3 scripts/ci/enforce-zero-cost-policy.py
          bash scripts/ci/runner-healthcheck.sh
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Start isolated PostgreSQL
        working-directory: ci/zero-cost-staging
        run: supabase db start
      - name: Create isolated database
        run: |
          set -euo pipefail
          psql "$BASE_DB_URL" -X -v ON_ERROR_STOP=1 -c "drop database if exists phase16_secret_key_compat with (force)"
          psql "$BASE_DB_URL" -X -v ON_ERROR_STOP=1 -c "create database phase16_secret_key_compat"
      - name: Compile certified F16 schema
        run: |
          set -euo pipefail
          psql "$F16_DB_URL" -X -v ON_ERROR_STOP=1 -f ci/phase16/schema_contract.sql
          psql "$F16_DB_URL" -X -v ON_ERROR_STOP=1 -f ci/phase16/legacy_email_schema_contract.sql
          for f in \
            20260814200500_cia_phase16_email_governed_schema_v1.sql \
            20260814200600_cia_phase16_email_contracts_v1.sql \
            20260814220000_cia_phase16_email_delivery_contracts_v2.sql \
            20260814220100_cia_phase16_email_render_context_hardening.sql \
            20260814220200_cia_phase16_legacy_email_acl_hardening.sql \
            20260814220300_cia_phase16_verify_app_session_v1.sql \
            20260815221000_cia_phase16_resend_outcome_coverage_v3.sql; do
            psql "$F16_DB_URL" -X -v ON_ERROR_STOP=1 -f "supabase/migrations/$f"
          done
          supabase db lint --db-url "$F16_DB_URL" --schema public --level error
      - name: Existing provider, suppression and release contracts
        run: |
          set -euo pipefail
          psql "$F16_DB_URL" -X -v ON_ERROR_STOP=1 -f ci/phase16/test_phase16_contracts.sql
          psql "$F16_DB_URL" -X -v ON_ERROR_STOP=1 -f ci/phase16/test_phase16_delivery_contracts.sql
          psql "$F16_DB_URL" -X -v ON_ERROR_STOP=1 -f ci/phase16/test_phase16_resend_outcomes_v3.sql
          test "$(psql "$F16_DB_URL" -X -qAt -c "select has_function_privilege('anon','public.aos_cia_email_release_mark_v1(text,boolean,text)','EXECUTE')")" = "f"
          echo 'F16_ZERO_COST_SECRET_KEY_DB=PASS'
      - name: Full rollback and zero residue
        run: |
          set -euo pipefail
          psql "$F16_DB_URL" -X -v ON_ERROR_STOP=1 -f ci/phase16/rollback_phase16.sql | tee /tmp/f16_rollback.log
          grep -q 'CIA_PHASE16_ROLLBACK=PASS' /tmp/f16_rollback.log
          psql "$F16_DB_URL" -X -v ON_ERROR_STOP=1 -f ci/phase16/rollback_phase16_legacy_acl.sql | tee /tmp/f16_acl_rollback.log
          grep -q 'CIA_PHASE16_LEGACY_ACL_ROLLBACK=PASS' /tmp/f16_acl_rollback.log
          echo 'F16_ZERO_COST_SECRET_KEY_ROLLBACK=PASS'
      - name: Cleanup
        if: always()
        run: |
          psql "$BASE_DB_URL" -X -c "drop database if exists phase16_secret_key_compat with (force)" || true
          cd ci/zero-cost-staging && supabase stop --no-backup || true
