name: F16 Resend Webhook Metadata Probe Materialize

on:
  push:
    branches:
      - hotfix/f16-resend-webhook-metadata-probe-20260815
    paths:
      - '.github/workflows/f16-resend-webhook-metadata-probe-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Zero-Cost runner health
        run: |
          python3 scripts/ci/enforce-zero-cost-policy.py
          bash scripts/ci/runner-healthcheck.sh
      - name: Materialize sanitized provider metadata probe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/f16-live-canary.js')
          s=p.read_text()
          old="""      if (body.confirm !== CANARY_CONFIRM) return jsonResponse(res, 400, { ok: false, error: 'CANARY_CONFIRMATION_REQUIRED' })\n\n      var provider = await requester('https://api.resend.com/emails', {"""
          new="""      if (body.confirm === 'INSPECT_RESEND_WEBHOOK_CONFIG') {\n        var hooks = await requester('https://api.resend.com/webhooks', {\n          method: 'GET',\n          timeout: 15000,\n          headers: { Authorization: 'Bearer ' + resendKey }\n        })\n        if (!(hooks.status >= 200 && hooks.status < 300)) {\n          return jsonResponse(res, 502, { ok: false, error: 'RESEND_WEBHOOK_LIST_FAILED', provider_status: hooks.status || 0 })\n        }\n        var rows = hooks.body && Array.isArray(hooks.body.data) ? hooks.body.data : []\n        var target = rows.filter(function(row) { return String(row && row.endpoint || '') === PROD_WEBHOOK_URL }).map(function(row) {\n          var events = Array.isArray(row.events) ? row.events.map(String).sort() : []\n          return {\n            endpoint_match: true,\n            status: String(row.status || ''),\n            events: events,\n            email_delivered_subscribed: events.indexOf('email.delivered') !== -1\n          }\n        })\n        return jsonResponse(res, 200, {\n          ok: true,\n          provider: 'RESEND',\n          matching_webhooks: target.length,\n          webhooks: target\n        })\n      }\n      if (body.confirm !== CANARY_CONFIRM) return jsonResponse(res, 400, { ok: false, error: 'CANARY_CONFIRMATION_REQUIRED' })\n\n      var provider = await requester('https://api.resend.com/emails', {"""
          if old not in s:
              raise SystemExit('F16_METADATA_PROBE_ANCHOR_MISSING')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Expose runner Node
        run: bash scripts/ci/expose-runner-node.sh
      - name: Certify sanitized scope
        shell: bash
        run: |
          set -euo pipefail
          node --check app/f16-live-canary.js
          node ci/phase16/test_email_gateway.js
          grep -F "INSPECT_RESEND_WEBHOOK_CONFIG" app/f16-live-canary.js
          grep -F "https://api.resend.com/webhooks" app/f16-live-canary.js
          ! grep -E "signing_secret|whsec_|key_prefix|key_length" app/f16-live-canary.js
          echo 'F16_RESEND_METADATA_PROBE=PASS'
      - name: Commit probe if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/f16-live-canary.js
          git diff --cached --quiet && exit 0
          git commit -m 'diag(f16): add sanitized Resend webhook metadata probe'
          git push origin HEAD:hotfix/f16-resend-webhook-metadata-probe-20260815
