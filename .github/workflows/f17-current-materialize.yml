name: F17 CURRENT materializer

on:
  push:
    branches: ['fix/f17-current-history-runtime-20260817-v1']
    paths:
      - '.github/workflows/f17-current-materialize.yml'
      - 'scripts/ci/f17_current_materialize.sh'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/f17-current-materialize.yml'
      - 'scripts/ci/f17_current_materialize.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: f17-current-materialize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 12
    steps:
      - name: Repair workspace
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/work" alpine:3.20 sh -lc "chown -R $(id -u):$(id -g) /work 2>/dev/null || true"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Materialize F17 CURRENT
        run: |
          set -euo pipefail
          if test -f supabase/migrations/20260816031658_cia_phase17_multichannel_contracts_v1.sql; then
            echo 'F17_CURRENT_ALREADY_MATERIALIZED=PASS'
            exit 0
          fi
          bash scripts/ci/f17_current_materialize.sh
      - name: Commit exact materialized candidate
        run: |
          set -euo pipefail
          git config user.name 'ASCENDA Zero-Cost CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'F17_CURRENT_NO_DIFF=PASS'
            exit 0
          fi
          git commit -m 'fix(f17): reconcile live history and effective runtime boundary'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
