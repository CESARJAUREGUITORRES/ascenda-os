name: ASCENDA F5 Recovery Safety

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/f5-recovery-worker.js'
      - 'app/server-f5.js'
      - 'ci/phase5-historical-identity/f5_recovery_contract.js'
      - '.github/workflows/f5-recovery-safety.yml'
  push:
    branches: ['fix/**','feature/**','security/**']
    paths:
      - 'app/f5-recovery-worker.js'
      - 'app/server-f5.js'
      - 'ci/phase5-historical-identity/f5_recovery_contract.js'
      - '.github/workflows/f5-recovery-safety.yml'

permissions:
  contents: read

jobs:
  recovery-safety:
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        shell: powershell
        run: |
          node --check app/f5-recovery-worker.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/server-f5.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check ci/phase5-historical-identity/f5_recovery_contract.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fail-closed recovery contract
        shell: powershell
        run: |
          node ci/phase5-historical-identity/f5_recovery_contract.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  recovery-env-presence:
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Presence only — never print secret values
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then echo 'F5_HAS_SUPABASE_SERVICE_ROLE_KEY=true'; else echo 'F5_HAS_SUPABASE_SERVICE_ROLE_KEY=false'; fi
          if [ -n "${service_role:-}" ]; then echo 'F5_HAS_SERVICE_ROLE_ALIAS=true'; else echo 'F5_HAS_SERVICE_ROLE_ALIAS=false'; fi
          if [ -n "${SUPABASE_URL:-}" ]; then echo 'F5_HAS_SUPABASE_URL=true'; else echo 'F5_HAS_SUPABASE_URL=false'; fi
