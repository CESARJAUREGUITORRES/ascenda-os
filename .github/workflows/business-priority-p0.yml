name: Business Priority P0

on:
  pull_request:
    paths:
      - 'app/business-priority-preload.js'
      - 'app/supabase-quota-circuit-preload.cjs'
      - 'app/public/browser-business-priority-v1.js'
      - 'app/public/f4-production-canary-hotfix.js'
      - 'ci/performance/business-priority-p0.test.js'
      - 'ci/performance/business-priority-race.test.js'
      - 'ci/performance/foreground-priority-incident-mode.test.js'
      - 'ci/performance/cross-panel-pressure-p0432.test.js'
      - 'supabase/migrations/20260902202000_p0432_db_hotpath_refresh_removal_v1.sql'
      - 'supabase/rollbacks/20260902202000_p0432_db_hotpath_refresh_removal_v1_recovery.sql'
      - '.github/workflows/business-priority-p0.yml'
  push:
    branches: ['main','perf/p0-business-priority-lazy-calendar-20260901','perf/p0432-cross-panel-pressure-20260902','perf/p0432-db-hotpath-refresh-removal-20260902']
    paths:
      - 'app/business-priority-preload.js'
      - 'app/supabase-quota-circuit-preload.cjs'
      - 'app/public/browser-business-priority-v1.js'
      - 'app/public/f4-production-canary-hotfix.js'
      - 'ci/performance/business-priority-p0.test.js'
      - 'ci/performance/business-priority-race.test.js'
      - 'ci/performance/foreground-priority-incident-mode.test.js'
      - 'ci/performance/cross-panel-pressure-p0432.test.js'
      - 'supabase/migrations/20260902202000_p0432_db_hotpath_refresh_removal_v1.sql'
      - 'supabase/rollbacks/20260902202000_p0432_db_hotpath_refresh_removal_v1_recovery.sql'
      - '.github/workflows/business-priority-p0.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, ascenda-zero-cost-v2]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax
        run: |
          node --check app/business-priority-preload.js
          node --check app/supabase-quota-circuit-preload.cjs
          node --check app/public/browser-business-priority-v1.js
          node --check app/public/f4-production-canary-hotfix.js
          node --check ci/performance/business-priority-race.test.js
          node --check ci/performance/foreground-priority-incident-mode.test.js
          node --check ci/performance/cross-panel-pressure-p0432.test.js
      - name: Regression gates
        run: node --test ci/performance/business-priority-p0.test.js ci/performance/business-priority-race.test.js ci/performance/foreground-priority-incident-mode.test.js ci/performance/cross-panel-pressure-p0432.test.js
      - name: Existing Call Center performance gates
        run: node --test ci/wa4c-full-local/p0-callcenter-agenda-performance.test.js
