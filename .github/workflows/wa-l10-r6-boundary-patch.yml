name: WA-L10 R6 provider boundary patch

on:
  push:
    branches:
      - wa-l10-r6-conversation-ux-fastlane-20260905
    paths:
      - .github/workflows/wa-l10-r6-boundary-patch.yml
      - ci/wa-l10/r6_boundary_patch_tmp.py

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wa-l10-r6-conversation-ux-fastlane-20260905
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply provider-boundary correction
        run: python ci/wa-l10/r6_boundary_patch_tmp.py
      - name: R6 provider-boundary and functional gates
        run: |
          node --check app/server-wa4.js
          node --check app/server-f4.js
          node --check app/wa-l10-autonomous-bridge.js
          node --test ci/wa4-ai-sales-router/r6-conversation-ux-fastlane.test.js
          node --test ci/wa4-ai-sales-router/ai-router.test.js
          node --test app/wa-l10-autonomous-bridge.test.js
          node ci/wa-l10/autonomous_bridge_contract.test.js
          python ci/wa4-ai-sales-router/ui_contract.py
      - name: Commit scoped product correction
        run: |
          git config user.name "ascenda-r6-bot"
          git config user.email "ascenda-r6-bot@users.noreply.github.com"
          git add app/server-wa4.js app/server-f4.js ci/wa-l10/autonomous_bridge_contract.test.js ci/wa4-ai-sales-router/r6-conversation-ux-fastlane.test.js
          git diff --cached --check
          git commit -m "WA-L10 R6: keep typing transport inside canonical F4 provider boundary"
          git push origin HEAD:wa-l10-r6-conversation-ux-fastlane-20260905
