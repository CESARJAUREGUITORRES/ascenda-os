name: ASCENDA F4 Cartera Auth V3 Chain

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/*f4_cartera_gateway_v2_auth_chain*'
      - 'supabase/rollbacks/*f4_revenue_cartera_gateway_v2_auth_chain*'
      - 'ci/phase4-revenue/tests/002_cartera_auth_v3_chain.sql'
      - '.github/workflows/f4-cartera-auth-chain-hotfix.yml'
  push:
    branches: ['fix/f4-cartera-v2-auth-chain-20260815']
    paths:
      - 'supabase/migrations/*f4_cartera_gateway_v2_auth_chain*'
      - 'supabase/rollbacks/*f4_revenue_cartera_gateway_v2_auth_chain*'
      - 'ci/phase4-revenue/tests/002_cartera_auth_v3_chain.sql'
      - '.github/workflows/f4-cartera-auth-chain-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f4-cartera-auth-chain-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  zero-cost-contract:
    name: ZERO-COST Cartera Auth V3 chain
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 25
    env:
      DB_URL: postgresql://postgres:postgres@127.0.0.1:60322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Enforce self-hosted Zero-Cost lane
        run: |
          set -euo pipefail
          test "${{ runner.environment }}" = "self-hosted"
          echo "Runner: $RUNNER_NAME"

      - name: Configure isolated Supabase
        working-directory: ci/zero-cost-staging
        run: |
          set -euo pipefail
          sed -i 's/project_id = "ascenda-zero-cost-staging"/project_id = "ascenda-f4-cartera-auth-chain"/' supabase/config.toml
          sed -i 's/port = 54321/port = 60321/' supabase/config.toml
          sed -i 's/port = 54322/port = 60322/' supabase/config.toml
          sed -i 's/shadow_port = 54320/shadow_port = 60320/' supabase/config.toml

      - name: Start isolated Supabase
        working-directory: ci/zero-cost-staging
        run: |
          set -euo pipefail
          supabase stop --no-backup || true
          docker ps -aq --filter 'name=ascenda-f4-cartera-auth-chain' | xargs -r docker rm -f || true
          rm -rf supabase/.temp supabase/.branches
          supabase db start
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 60322 -U postgres >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo 'Isolated Postgres did not become ready' >&2
          exit 1

      - name: Build F4 synthetic contract
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/phase4-revenue/schema_contract.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -c "alter table public.aos_cotizaciones add column if not exists numero_cotizacion text"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260814223000_f4_revenue_operations_core_v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260814223100_f4_cartera_candidates_v2.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260815191500_f4_cartera_gateway_v2_auth_chain_hotfix.sql

      - name: Database lint
        working-directory: ci/zero-cost-staging
        run: supabase db lint --local --schema public --level error

      - name: Auth V3 chain contract
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/phase4-revenue/tests/002_cartera_auth_v3_chain.sql | tee /tmp/f4-cartera-auth-chain.txt
          grep -q 'F4_CARTERA_AUTH_V3_CHAIN=PASS' /tmp/f4-cartera-auth-chain.txt

      - name: Recovery is fail-closed
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/rollbacks/20260815191500_f4_revenue_cartera_gateway_v2_auth_chain_hotfix.rollback.sql
          test "$(psql "$DB_URL" -X -qAt -c "select has_function_privilege('anon','public.aos_cartera_gateway(text,text,text,integer,integer)','EXECUTE')")" = "f"
          test "$(psql "$DB_URL" -X -qAt -c "select has_function_privilege('anon','public.aos_cartera_gateway_v2(text,text,text,integer,integer)','EXECUTE')")" = "t"
          def="$(psql "$DB_URL" -X -qAt -c "select pg_get_functiondef('public.aos_cartera_gateway_v2(text,text,text,integer,integer)'::regprocedure)")"
          printf '%s' "$def" | grep -q 'aos_f4_actor'
          if printf '%s' "$def" | grep -q 'aos_cartera_gateway('; then
            echo 'Recovery restored broken legacy delegation' >&2
            exit 1
          fi

      - name: Stop isolated Supabase
        if: always()
        working-directory: ci/zero-cost-staging
        run: supabase stop --no-backup || true
