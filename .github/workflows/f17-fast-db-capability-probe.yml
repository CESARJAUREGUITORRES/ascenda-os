name: F17 FAST DB Capability Probe

on:
  push:
    branches: ['ops/f17-fast-db-probe-20260815']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe native and WSL zero-cost DB tooling
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          Write-Host "runner=$env:RUNNER_NAME"
          foreach($cmd in @('docker','wsl','psql','supabase')) {
            $c=Get-Command $cmd -ErrorAction SilentlyContinue
            if($c){ Write-Host ("NATIVE {0}=YES" -f $cmd) } else { Write-Host ("NATIVE {0}=NO" -f $cmd) }
          }
          if(Get-Command wsl -ErrorAction SilentlyContinue){
            cmd /c "wsl.exe -l -q" 2>$null
            Write-Host ("WSL_LIST_EXIT="+$LASTEXITCODE)
            cmd /c "wsl.exe -e sh -lc \"echo WSL_EXEC=YES; uname -a; for c in docker psql postgres initdb supabase python3; do if command -v `$c >/dev/null 2>&1; then echo WSL_CAP_`$c=YES; else echo WSL_CAP_`$c=NO; fi; done; exit 0\""
            Write-Host ("WSL_EXEC_EXIT="+$LASTEXITCODE)
          }
          Write-Host 'F17_FAST_DB_CAPABILITY_PROBE_COMPLETE'
          exit 0