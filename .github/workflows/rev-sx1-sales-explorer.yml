name: ASCENDA REV-SX1 Sales Explorer Read-Only
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/*rev_sx1*'
      - 'app/public/rev-sx1-sales-explorer.js'
      - 'app/public/f4-revenue-ops.js'
      - 'ci/rev-sx1/**'
      - '.github/workflows/rev-sx1-sales-explorer.yml'
  push:
    branches: ['feature/rev-sx1-sales-explorer']
    paths:
      - 'supabase/migrations/*rev_sx1*'
      - 'app/public/rev-sx1-sales-explorer.js'
      - 'app/public/f4-revenue-ops.js'
      - 'ci/rev-sx1/**'
      - '.github/workflows/rev-sx1-sales-explorer.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rev-sx1-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  fast-ui:
    name: SX1 UI / zero-load regression
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax + read-only contracts
        shell: powershell
        run: |
          node --check app/public/rev-sx1-sales-explorer.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/public/f4-revenue-ops.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check ci/rev-sx1/ui_contract.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ci/rev-sx1/ui_contract.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: No initial Sales data request added
        shell: powershell
        run: |
          $sales = Get-Content 'app/public/admin-sales.html' -Raw
          if ($sales -match 'rev-sx1-sales-explorer.js') { throw 'SX1 asset must not preload with Sales' }
          $bridge = Get-Content 'app/public/f4-revenue-ops.js' -Raw
          if ($bridge -notmatch 'openSalesExplorer') { throw 'Lazy click loader missing' }
          if ($bridge -notmatch 'patchSalesExplorerEntrypoints') { throw 'Ranking click entrypoints missing' }
  db-read-contract:
    name: SX1 DB / security / performance
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 30
    env:
      DB_URL: postgresql://postgres:postgres@127.0.0.1:59522/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Enforce zero-cost runner
        run: |
          set -euo pipefail
          test "${{ runner.environment }}" = "self-hosted"
          python3 scripts/ci/enforce-zero-cost-policy.py
      - name: Configure isolated Supabase ports
        working-directory: ci/zero-cost-staging
        run: |
          set -euo pipefail
          sed -i 's/project_id = "ascenda-zero-cost-staging"/project_id = "ascenda-rev-sx1"/' supabase/config.toml
          sed -i 's/port = 54321/port = 59521/' supabase/config.toml
          sed -i 's/port = 54322/port = 59522/' supabase/config.toml
          sed -i 's/shadow_port = 54320/shadow_port = 59520/' supabase/config.toml
      - name: Start isolated Supabase
        working-directory: ci/zero-cost-staging
        run: |
          set -euo pipefail
          supabase stop --no-backup || true
          docker ps -aq --filter 'name=ascenda-rev-sx1' | xargs -r docker rm -f || true
          rm -rf supabase/.temp supabase/.branches
          supabase db start
          for i in $(seq 1 40); do
            if pg_isready -h 127.0.0.1 -p 59522 -U postgres >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo 'REV-SX1 isolated Postgres did not become ready on 59522' >&2
          exit 1
      - name: Build production-shaped prerequisites
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/phase4-revenue/schema_contract.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-prc1/prereq.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260814223000_f4_revenue_operations_core_v1.sql
      - name: Apply exact REV-SX1 read migration
        run: psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260822024500_rev_sx1_sales_explorer_read_v1.sql
      - name: Database lint
        working-directory: ci/zero-cost-staging
        run: supabase db lint --local --schema public --level error
      - name: pgTAP reconciliation / zero-write contract
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -c "create extension if not exists pgtap with schema extensions"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-sx1/001_sales_explorer.sql | tee /tmp/sx1-pgtap.txt
          grep -q '1..15' /tmp/sx1-pgtap.txt
          if grep -q 'not ok' /tmp/sx1-pgtap.txt; then exit 1; fi
          if grep -q 'Looks like you planned' /tmp/sx1-pgtap.txt; then exit 1; fi
      - name: Browser ACL remains token-gated
        run: |
          set -euo pipefail
          test "$(psql "$DB_URL" -X -qAt -c "select has_function_privilege('anon','public.aos_sales_explorer_history_v1(text,text,integer,integer,text,text,text,text)','EXECUTE')")" = "t"
          test "$(psql "$DB_URL" -X -qAt -c "select has_function_privilege('public','public.aos_sales_explorer_history_v1(text,text,integer,integer,text,text,text,text)','EXECUTE')")" = "f"
          test "$(psql "$DB_URL" -X -qAt -c "select public.aos_sales_explorer_history_v1('bad','PRODUCT',2026,8,'MES','SAN ISIDRO','','')->>'error'")" = "UNAUTHORIZED"
      - name: Performance hard gate on ~1600 synthetic sales
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-sx1/perf_fixture.sql
          psql "$DB_URL" -X -qAt -c "explain (analyze,format json) select public.aos_sales_explorer_history_v1('SX1-PERF-TOKEN','PRODUCT',2026,8,'MES','','','SX1:PERF-A')" > /tmp/sx1-product.json
          psql "$DB_URL" -X -qAt -c "explain (analyze,format json) select public.aos_sales_explorer_history_v1('SX1-PERF-TOKEN','SERVICE',2026,8,'MES','','','HIFU')" > /tmp/sx1-service.json
          python3 - <<'PY'
          import json
          for name in ('product','service'):
              with open(f'/tmp/sx1-{name}.json') as f: data=json.load(f)
              ms=float(data[0]['Execution Time'])
              print(f'{name} execution_ms={ms:.3f}')
              if ms >= 500: raise SystemExit(f'PERFORMANCE_GATE_FAILED {name} {ms}ms')
          PY
      - name: Stop isolated Supabase
        if: always()
        working-directory: ci/zero-cost-staging
        run: supabase stop --no-backup || true
