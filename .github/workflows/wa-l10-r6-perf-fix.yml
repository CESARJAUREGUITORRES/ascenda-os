name: WA-L10 R6 performance correction

on:
  push:
    branches:
      - wa-l10-r6-conversation-ux-fastlane-20260905
    paths:
      - .github/workflows/wa-l10-r6-perf-fix.yml
      - ci/wa-l10/r6_perf_fix_tmp.py

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wa-l10-r6-conversation-ux-fastlane-20260905
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply performance correction
        run: python ci/wa-l10/r6_perf_fix_tmp.py
      - name: R6 functional and performance gates
        run: |
          node --check app/wa4-copilot.js
          node --test ci/wa4-ai-sales-router/r6-conversation-ux-fastlane.test.js
          node --test ci/wa4-ai-sales-router/ai-router.test.js
          node --test app/wa-l10-autonomous-bridge.test.js
          node ci/wa-l10/autonomous_bridge_contract.test.js
          RUNNER_TEMP=/tmp node tools/perf-audit/runtime-census.mjs app sentinel > /tmp/r6-perf-census.log
          node ci/performance/performance-guard.mjs /tmp/asc-perf-runtime-census.json
      - name: Commit scoped product correction
        run: |
          git config user.name "ascenda-r6-bot"
          git config user.email "ascenda-r6-bot@users.noreply.github.com"
          git add app/wa4-copilot.js ci/wa4-ai-sales-router/r6-conversation-ux-fastlane.test.js
          git diff --cached --check
          git commit -m "WA-L10 R6: keep fast lane outside recurrent network budget"
          git push origin HEAD:wa-l10-r6-conversation-ux-fastlane-20260905
