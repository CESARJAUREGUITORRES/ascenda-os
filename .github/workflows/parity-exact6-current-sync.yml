name: Parity exact-6 CURRENT sync

on:
  push:
    branches:
      - 'fix/migration-history-parity-20260817-v1'
    paths:
      - '.github/workflows/parity-exact6-current-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parity-exact6-current-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 8
    steps:
      - name: Repair workspace
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/work" alpine:3.20 sh -lc "chown -R $(id -u):$(id -g) /work 2>/dev/null || true"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge CURRENT main without rewriting repair
        run: |
          set -euo pipefail
          git config user.name 'ASCENDA Zero-Cost CI'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          current="$(git rev-parse origin/main)"
          echo "CURRENT_MAIN=$current"
          git merge --no-edit origin/main
          git merge-base --is-ancestor origin/main HEAD
          git diff --check HEAD^..HEAD || true
      - name: Verify six repaired filenames and zero old names
        run: |
          set -euo pipefail
          for f in \
            20260815215930_cia_phase16_email_governed_schema_v1.sql \
            20260815220040_cia_phase16_email_contracts_v1.sql \
            20260815220329_cia_phase16_email_render_context_hardening.sql \
            20260815220344_cia_phase16_verify_app_session_v1.sql \
            20260815220458_cia_phase16_legacy_email_acl_hardening.sql \
            20260815221343_cia_phase16_resend_outcome_coverage_v3.sql; do
            test -f "supabase/migrations/$f"
          done
          test ! -e supabase/migrations/20260814200500_cia_phase16_email_governed_schema_v1.sql
          test ! -e supabase/migrations/20260814200600_cia_phase16_email_contracts_v1.sql
          test ! -e supabase/migrations/20260814220100_cia_phase16_email_render_context_hardening.sql
          test ! -e supabase/migrations/20260814220300_cia_phase16_verify_app_session_v1.sql
          test ! -e supabase/migrations/20260814220200_cia_phase16_legacy_email_acl_hardening.sql
          test ! -e supabase/migrations/20260815221000_cia_phase16_resend_outcome_coverage_v3.sql
      - name: Push synchronized candidate
        run: |
          set -euo pipefail
          git push origin HEAD:${GITHUB_REF_NAME}
