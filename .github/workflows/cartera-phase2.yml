name: ASCENDA Cartera Phase 2

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/*cartera_phase2*'
      - 'supabase/rollbacks/*cartera_phase2*'
      - 'ci/phase2-cartera/**'
      - 'app/public/admin-cartera.html'
      - 'app/public/app.html'
      - 'app/public/caja.html'
      - '.github/workflows/cartera-phase2.yml'
  push:
    branches: ['agent/**','feature/**','fix/**','security/**','infra/**']
    paths:
      - 'supabase/migrations/*cartera_phase2*'
      - 'supabase/rollbacks/*cartera_phase2*'
      - 'ci/phase2-cartera/**'
      - 'app/public/admin-cartera.html'
      - 'app/public/app.html'
      - 'app/public/caja.html'
      - '.github/workflows/cartera-phase2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cartera-phase2-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  fast-ui:
    name: FAST Cartera UI/runtime contract
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 5
    outputs:
      db_required: ${{ steps.scope.outputs.db_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Classify change scope
        id: scope
        shell: powershell
        run: |
          $base = '${{ github.event.pull_request.base.sha }}'
          if (-not $base) { $base = '${{ github.event.before }}' }
          if (-not $base -or $base -match '^0+$') { $base = 'HEAD^' }
          $files = @(git diff --name-only $base $env:GITHUB_SHA)
          $db = $false
          foreach ($f in $files) {
            if ($f -like 'supabase/migrations/*cartera_phase2*' -or
                $f -like 'supabase/rollbacks/*cartera_phase2*' -or
                $f -like 'ci/phase2-cartera/*' -or
                $f -like 'ci/phase2-cartera/**' -or
                $f -eq '.github/workflows/cartera-phase2.yml') { $db = $true }
          }
          "db_required=$($db.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Cartera DB required: $db"

      - name: Validate Node parity UI contract
        shell: powershell
        run: |
          node --check ci/phase2-cartera/ui_contract.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ci/phase2-cartera/ui_contract.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  isolated-contract:
    needs: fast-ui
    if: needs.fast-ui.outputs.db_required == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 20
    env:
      DB_URL: postgresql://postgres:postgres@127.0.0.1:55322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Configure isolated Supabase ports
        working-directory: ci/zero-cost-staging
        run: |
          set -euo pipefail
          sed -i 's/project_id = "ascenda-zero-cost-staging"/project_id = "ascenda-phase2-base"/' supabase/config.toml
          sed -i 's/port = 54321/port = 55321/' supabase/config.toml
          sed -i 's/port = 54322/port = 55322/' supabase/config.toml
          sed -i 's/shadow_port = 54320/shadow_port = 55320/' supabase/config.toml

      - name: Start isolated Supabase
        working-directory: ci/zero-cost-staging
        run: |
          set -euo pipefail
          supabase stop --no-backup || true
          supabase db start

      - name: Build synthetic schema and prerequisite contracts
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/zero-cost-staging/schema_contract.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260813164711_fix_otros_service_type.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260813173000_sales_intelligence_v2_summary.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260813174500_sales_intelligence_v2_summary_optimize.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260814021609_fix_2fa_context_canary.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260814024619_sales_intelligence_admin_activation.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/phase2-cartera/schema_contract.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/phase2-cartera/fixture_pre_migration.sql

      - name: Compile Cartera Phase 2 migration
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260814034401_cartera_phase2_reconciliation.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260814050000_cartera_phase2_security_cleanup.sql
          test "$(psql "$DB_URL" -X -qAt -c "select count(*) from public.aos_cartera_reconciliacion")" = "4"
          test "$(psql "$DB_URL" -X -qAt -c "select has_function_privilege('anon','public.aos_abonar_cotizacion(text,numeric,text,text,text,text,text,text,text,text,text)','EXECUTE')")" = "f"
          test "$(psql "$DB_URL" -X -qAt -c "select has_function_privilege('anon','public.aos_abonar_cotizacion_v2(text,uuid,text,numeric,text,text,text,text,text)','EXECUTE')")" = "t"

      - name: Database lint
        working-directory: ci/zero-cost-staging
        run: supabase db lint --local --schema public --level error

      - name: pgTAP Cartera contract
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -c "create extension if not exists pgtap with schema extensions"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/phase2-cartera/tests/004_cartera_phase2.sql | tee /tmp/cartera-pgtap.txt
          grep -q '1..96' /tmp/cartera-pgtap.txt
          if grep -q 'Looks like you planned' /tmp/cartera-pgtap.txt; then exit 1; fi
          if grep -q 'not ok' /tmp/cartera-pgtap.txt; then exit 1; fi

      - name: Stop isolated Supabase
        if: always()
        working-directory: ci/zero-cost-staging
        run: supabase stop --no-backup || true
