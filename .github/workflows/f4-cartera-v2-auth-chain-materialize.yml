name: ASCENDA F4 Cartera V2 Auth Chain Materializer

on:
  push:
    branches: ['fix/f4-cartera-v2-auth-chain-20260815']
    paths:
      - 'scripts/ci/materialize-f4-cartera-v2-auth-chain.js'
      - '.github/workflows/f4-cartera-v2-auth-chain-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: f4-cartera-v2-auth-chain-materialize-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  materialize:
    name: FAST materialize Cartera V2 Auth V3 chain
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/f4-cartera-v2-auth-chain-20260815
          fetch-depth: 0

      - name: Materialize deterministic runtime and CI fix
        shell: powershell
        run: |
          node scripts/ci/materialize-f4-cartera-v2-auth-chain.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate materialized runtime contract
        shell: powershell
        run: |
          node --check app/public/f4-revenue-ops.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check ci/phase4-revenue/ui_contract.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ci/phase4-revenue/ui_contract.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit materialized files
        shell: powershell
        run: |
          $paths = @(
            'app/public/f4-revenue-ops.js',
            'ci/phase4-revenue/ui_contract.js',
            '.github/workflows/phase4-revenue-operations.yml'
          )
          git diff --quiet -- $paths
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'F4_CARTERA_V2_AUTH_CHAIN=ALREADY_CURRENT'
            exit 0
          }
          git config user.name ascenda-ci
          git config user.email ascenda-ci@users.noreply.github.com
          git add -- $paths
          git commit -m 'fix(f4): route Cartera read through Auth V3 V2 gateway'
          git push origin HEAD:fix/f4-cartera-v2-auth-chain-20260815
