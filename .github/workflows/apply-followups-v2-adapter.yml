name: Apply followups V2 adapter

on:
  push:
    branches:
      - fix/call-center-followups-v2-adapter

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply exact patch
        shell: pwsh
        run: node scripts/apply_followups_v2_adapter.mjs
      - name: Syntax check
        shell: pwsh
        run: node --check app/public/calls.js
      - name: Commit patched file when changed
        shell: pwsh
        run: |
          if (git status --porcelain app/public/calls.js) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/public/calls.js
            git commit -m "fix(call-center): preserve followup origin in adapter"
            git push origin HEAD:fix/call-center-followups-v2-adapter
          } else {
            Write-Host "No patch changes needed"
          }
