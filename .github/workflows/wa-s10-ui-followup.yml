name: WA S10 UI Follow-up Apply
on:
  push:
    branches:
      - wa-s10-customer-window-final-20260817
    paths:
      - 'ci/phase-s/apply_s10_ui_followup.js'
      - '.github/workflows/wa-s10-ui-followup.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wa-s10-customer-window-final-20260817
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply UI follow-up
        shell: powershell
        run: |
          node ci/phase-s/apply_s10_ui_followup.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/public/wa-native-panel.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ci/phase-s/wa_customer_window_s10_contract.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit UI runtime
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/public/wa-native-panel.js
          if (git diff --cached --quiet) { Write-Host 'No UI runtime changes'; exit 0 }
          git commit -m 'fix(wa): refresh customer window state and show Meta details'
          git push origin HEAD:wa-s10-customer-window-final-20260817
