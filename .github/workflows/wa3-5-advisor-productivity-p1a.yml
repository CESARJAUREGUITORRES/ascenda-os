name: ASCENDA WA-3.5 P1A Advisor Productivity

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/public/wa-multiagent-final-panel.js'
      - 'ci/wa3-5-advisor-productivity/p1a_contract.js'
      - 'ci/wa3-5-revenue-inbox/p0_contract.js'
      - 'ci/wa3-boxes-routing-handoff/ui_contract_v2.js'
      - 'ci/wa3-boxes-routing-handoff/ui_contract_final.js'
      - '.github/workflows/wa3-5-advisor-productivity-p1a.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wa35-advisor-productivity-p1a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p1a:
    name: ZERO-COST · Advisor Productivity P1A
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enforce Zero-Cost lane
        run: |
          set -euo pipefail
          test "${{ runner.environment }}" = "self-hosted"
          python3 scripts/ci/enforce-zero-cost-policy.py
      - name: Syntax
        run: |
          set -euo pipefail
          node --check app/public/wa-multiagent-final-panel.js
          node --check ci/wa3-5-advisor-productivity/p1a_contract.js
      - name: P1A advisor productivity contract
        run: node ci/wa3-5-advisor-productivity/p1a_contract.js
      - name: Preserve P0 Revenue Inbox contract
        run: node ci/wa3-5-revenue-inbox/p0_contract.js
      - name: Preserve certified WA-3 UI authority
        run: |
          set -euo pipefail
          node ci/wa3-boxes-routing-handoff/ui_contract_v2.js
          node ci/wa3-boxes-routing-handoff/ui_contract_final.js
      - name: P1A boundary
        run: echo "Quick replies and drafts are advisor UX only; internal notes and LIVE integration remain governed separately."
