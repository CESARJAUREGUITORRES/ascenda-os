name: CIA Distribution Planner V1 Gate
on:
  pull_request:
    branches: [main, cia-audience-workspace-v3]
    paths:
      - 'app/public/cia-audience-workspace-v3.js'
      - 'supabase/migrations/20260918022500_cia_distribution_planner_v1.sql'
      - 'supabase/migrations/20260919003000_cia_distribution_ux_v2.sql'
      - 'ci/cia-distribution-planner-v1/**'
      - '.github/workflows/cia-distribution-planner-v1-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Distribution Planner syntax
        shell: powershell
        run: |
          node --check app/public/cia-audience-workspace-v3.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Distribution Planner contract
        shell: powershell
        run: |
          node ci/cia-distribution-planner-v1/contract.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
