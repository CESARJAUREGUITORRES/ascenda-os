name: TEMP REV-SX1 SQL Fix
on:
  push:
    branches: [feature/rev-sx1-sales-explorer]
    paths: ['.github/workflows/rev-sx1-sql-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rev-sx1-sales-explorer
          fetch-depth: 0
      - name: Correct PostgreSQL interval syntax
        shell: powershell
        run: |
          $p='supabase/migrations/20260822024500_rev_sx1_sales_explorer_read_v1.sql'
          $s=Get-Content $p -Raw
          $old="interval '1 month-1 day'"
          $new="(interval '1 month' - interval '1 day')"
          if ($s -notmatch [regex]::Escape($old)) { throw 'SX1 interval pattern missing' }
          $s=$s.Replace($old,$new)
          [IO.File]::WriteAllText($p,$s,[Text.UTF8Encoding]::new($false))
      - name: Commit corrected migration
        shell: powershell
        run: |
          git config user.name 'ascenda-ci'
          git config user.email 'ascenda-ci@users.noreply.github.com'
          git add supabase/migrations/20260822024500_rev_sx1_sales_explorer_read_v1.sql
          git commit -m 'fix(REV-SX1): correct month-end interval expression'
          git push origin HEAD:feature/rev-sx1-sales-explorer
