name: K1 CURRENT security hardening materializer

on:
  push:
    branches: [security/kronia-k1-current-final-v3-20260815]
    paths:
      - '.github/workflows/k1-private-secret-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: security/kronia-k1-current-final-v3-20260815

      - name: Materialize CURRENT K1 security hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/k1_private_secret_fix.py
          python3 scripts/ci/k1_sensitive_read_fix.py

          git diff --check
          python3 -m py_compile \
            ci/kronia-k1-phase2/runtime_contract.py \
            scripts/ci/k1_private_secret_fix.py \
            scripts/ci/k1_sensitive_read_fix.py
          node --check app/public/k1-browser-security.js

          grep -q 'from public.aos_integration_secrets_v1 s' supabase/migrations/20260814170000_kronia_k1_private_credentials_auth_v3.sql
          grep -q 'from public.aos_integration_secrets_v1 s' supabase/migrations/20260814171800_kronia_k1_auth_v3_branded_alignment.sql
          ! grep -q 'select i.api_key into v_api_key from public.aos_integraciones' supabase/migrations/20260814170000_kronia_k1_private_credentials_auth_v3.sql
          ! grep -q 'select i.api_key into v_api_key' supabase/migrations/20260814171800_kronia_k1_auth_v3_branded_alignment.sql
          grep -q 'insert into public.aos_integration_secrets_v1' supabase/migrations/20260814171000_kronia_k1_app_token_control_plane.sql
          grep -q 'aos_team_feed_v3' supabase/migrations/20260814171000_kronia_k1_app_token_control_plane.sql
          grep -q 'revoke all on table public.aos_team_full from public,anon,authenticated' supabase/migrations/20260814171000_kronia_k1_app_token_control_plane.sql
          grep -q "u.pathname==='/rest/v1/aos_team_full'" app/public/k1-browser-security.js
          ! grep -q 'aos_si_token' app/public/admin-team.html
          grep -q 'aos_app_token' app/public/admin-team.html
          grep -q 'KRONIA_K1_CURRENT_SENSITIVE_READ_BOUNDARY=PASS' ci/kronia-k1-phase2/001_k1_phase2_certificate.sql
          grep -q 'force row level security' supabase/rollbacks/20260814_kronia_k1_phase2_safe_recovery.sql

          git add \
            supabase/migrations/20260814170000_kronia_k1_private_credentials_auth_v3.sql \
            supabase/migrations/20260814171000_kronia_k1_app_token_control_plane.sql \
            supabase/migrations/20260814171800_kronia_k1_auth_v3_branded_alignment.sql \
            supabase/rollbacks/20260814_kronia_k1_phase2_safe_recovery.sql \
            ci/kronia-k1-phase2/fixture_pre_k1.sql \
            ci/kronia-k1-phase2/001_k1_phase2_certificate.sql \
            ci/kronia-k1-phase2/runtime_contract.py \
            app/public/k1-browser-security.js \
            app/public/admin-team.html

          git config user.name 'ASCENDA Zero-Cost Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'security(k1): close provider-secret and sensitive identity boundaries'
          git push origin HEAD:security/kronia-k1-current-final-v3-20260815

      - name: Confirm materialization
        run: echo 'KRONIA_K1_CURRENT_SECURITY_HARDENING_MATERIALIZED=PASS'
