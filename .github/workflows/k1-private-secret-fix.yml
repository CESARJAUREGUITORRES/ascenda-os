name: K1 private secret alignment

on:
  push:
    branches: [security/kronia-k1-current-final-v3-20260815]
    paths:
      - '.github/workflows/k1-private-secret-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: security/kronia-k1-current-final-v3-20260815
      - name: Apply CURRENT private provider-secret alignment
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/k1_private_secret_fix.py
          git diff --check
          python3 -m py_compile ci/kronia-k1-phase2/runtime_contract.py scripts/ci/k1_private_secret_fix.py
          grep -q 'from public.aos_integration_secrets_v1 s' supabase/migrations/20260814170000_kronia_k1_private_credentials_auth_v3.sql
          ! grep -q 'select i.api_key into v_api_key from public.aos_integraciones' supabase/migrations/20260814170000_kronia_k1_private_credentials_auth_v3.sql
          git add supabase/migrations/20260814170000_kronia_k1_private_credentials_auth_v3.sql ci/kronia-k1-phase2/fixture_pre_k1.sql ci/kronia-k1-phase2/runtime_contract.py
          git config user.name 'ASCENDA Zero-Cost Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'security(k1): use CURRENT private provider-secret vault'
          git push origin HEAD:security/kronia-k1-current-final-v3-20260815
