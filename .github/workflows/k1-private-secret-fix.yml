name: K1 CURRENT security hardening materializer

on:
  push:
    branches: [security/kronia-k1-current-final-v3-20260815]
    paths:
      - '.github/workflows/k1-private-secret-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: security/kronia-k1-current-final-v3-20260815

      - name: Materialize CURRENT K1 security hardening
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $lfTargets = @(
            'supabase/migrations/20260814170000_kronia_k1_private_credentials_auth_v3.sql',
            'supabase/migrations/20260814171000_kronia_k1_app_token_control_plane.sql',
            'supabase/migrations/20260814171800_kronia_k1_auth_v3_branded_alignment.sql',
            'supabase/rollbacks/20260814_kronia_k1_phase2_safe_recovery.sql',
            'ci/kronia-k1-phase2/fixture_pre_k1.sql',
            'ci/kronia-k1-phase2/001_k1_phase2_certificate.sql',
            'ci/kronia-k1-phase2/runtime_contract.py',
            'app/public/k1-browser-security.js',
            'app/public/admin-team.html',
            'chrome-extension/manifest.json',
            'chrome-extension/content-script.js',
            'chrome-extension/kronia-core.js'
          )
          node -e "const fs=require('fs'); for(const p of process.argv.slice(1)){const s=fs.readFileSync(p,'utf8').replace(/\r\n/g,'\n');fs.writeFileSync(p,s,'utf8')}" @lfTargets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # The private-vault UPSERT legitimately contains "api_key=case ...".
          # Scope the negative assertion to the legacy PUBLIC-column pattern only.
          $materializer = 'scripts/ci/k1_materialize_current.js'
          $mat = Get-Content -Raw $materializer
          $oldInvariant = @'
if(s.includes("api_key=case when p_data ? 'api_key'")||s.includes("api_secret=case when p_data ? 'api_secret'")) die('K1-B public secret write survived');
'@
          $newInvariant = @'
if(s.includes("else api_key end")||s.includes("else api_secret end")) die('K1-B public secret write survived');
'@
          $oldRuntime = @'
assert "api_key=case when p_data ? 'api_key'" not in _k1b and "api_secret=case when p_data ? 'api_secret'" not in _k1b
'@
          $newRuntime = @'
assert "else api_key end" not in _k1b and "else api_secret end" not in _k1b
'@
          if (-not $mat.Contains($oldInvariant.Trim())) { throw 'materializer K1-B invariant anchor missing' }
          if (-not $mat.Contains($oldRuntime.Trim())) { throw 'materializer runtime invariant anchor missing' }
          $mat = $mat.Replace($oldInvariant.Trim(), $newInvariant.Trim()).Replace($oldRuntime.Trim(), $newRuntime.Trim())
          [System.IO.File]::WriteAllText((Resolve-Path $materializer), $mat, [System.Text.UTF8Encoding]::new($false))

          node scripts/ci/k1_materialize_current.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check scripts/ci/k1_materialize_current.js
          node --check app/public/k1-browser-security.js
          node --check chrome-extension/kronia-core.js
          node --check chrome-extension/k1-extension-auth.js
          node --check chrome-extension/content-script.js
          node --check chrome-extension/popup.js

          $a = Get-Content -Raw supabase/migrations/20260814170000_kronia_k1_private_credentials_auth_v3.sql
          $b = Get-Content -Raw supabase/migrations/20260814171000_kronia_k1_app_token_control_plane.sql
          $e = Get-Content -Raw supabase/migrations/20260814171800_kronia_k1_auth_v3_branded_alignment.sql
          $r = Get-Content -Raw supabase/rollbacks/20260814_kronia_k1_phase2_safe_recovery.sql
          $browser = Get-Content -Raw app/public/k1-browser-security.js
          $team = Get-Content -Raw app/public/admin-team.html
          $manifest = Get-Content -Raw chrome-extension/manifest.json
          $content = Get-Content -Raw chrome-extension/content-script.js
          $core = Get-Content -Raw chrome-extension/kronia-core.js
          $cert = Get-Content -Raw ci/kronia-k1-phase2/001_k1_phase2_certificate.sql
          $runtime = Get-Content -Raw ci/kronia-k1-phase2/runtime_contract.py

          if ($a -notmatch 'from public\.aos_integration_secrets_v1 s' -or $a -match 'select i\.api_key into v_api_key from public\.aos_integraciones') { throw 'K1-A provider-secret boundary failed' }
          if ($e -notmatch 'from public\.aos_integration_secrets_v1 s' -or $e -match 'select i\.api_key into v_api_key') { throw 'K1-E provider-secret boundary failed' }
          if ($b -notmatch "api_key='',api_secret=''" -or $b -match 'else api_key end' -or $b -match 'else api_secret end') { throw 'K1-B public secret columns not fail-closed' }
          if ($b -notmatch 'insert into public\.aos_integration_secrets_v1' -or $b -notmatch 'aos_team_feed_v3' -or $b -notmatch 'revoke all on table public\.aos_team_full from public,anon,authenticated') { throw 'K1-B secret/PII boundary failed' }
          if ($browser -notmatch 'SAFE_USER_COLUMNS' -or $browser -notmatch 'SAFE_RRHH_COLUMNS') { throw 'browser PII compatibility boundary missing' }
          if ($team -match 'aos_si_token' -or $team -notmatch 'aos_app_token') { throw 'canonical admin-team token boundary failed' }
          if ($manifest -notmatch 'k1-extension-auth\.js' -or $content -notmatch 'core\.loginRequest\(u, pw\)') { throw 'Chrome Auth V3 boundary failed' }
          if ($core -match 'historial: state\.historial' -or $core -match 'data\.historial') { throw 'persistent Chrome conversation history survived' }
          if ($cert -notmatch 'KRONIA_K1_CURRENT_SENSITIVE_READ_BOUNDARY=PASS') { throw 'PII SQL certificate missing' }
          if ($runtime -notmatch 'KRONIA_K1_CURRENT_NODE_MATERIALIZED_CONTRACT') { throw 'permanent runtime contract missing' }
          if ($r -notmatch 'force row level security' -or $r -notmatch 'Sensitive identity reads remain least-privilege during recovery') { throw 'safe recovery hardening missing' }

          git add -- `
            supabase/migrations/20260814170000_kronia_k1_private_credentials_auth_v3.sql `
            supabase/migrations/20260814171000_kronia_k1_app_token_control_plane.sql `
            supabase/migrations/20260814171800_kronia_k1_auth_v3_branded_alignment.sql `
            supabase/rollbacks/20260814_kronia_k1_phase2_safe_recovery.sql `
            ci/kronia-k1-phase2/fixture_pre_k1.sql `
            ci/kronia-k1-phase2/001_k1_phase2_certificate.sql `
            ci/kronia-k1-phase2/runtime_contract.py `
            app/public/k1-browser-security.js `
            app/public/admin-team.html `
            chrome-extension/manifest.json `
            chrome-extension/content-script.js `
            chrome-extension/kronia-core.js

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'expected K1 hardening diff missing' }
          git config user.name 'ASCENDA FAST Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'security(k1): close secrets PII and Chrome Auth V3 boundaries'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:security/kronia-k1-current-final-v3-20260815
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Confirm materialization
        run: echo 'KRONIA_K1_CURRENT_SECURITY_HARDENING_MATERIALIZED=PASS'
