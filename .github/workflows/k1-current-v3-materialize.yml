name: K1 CURRENT v3 materializer

on:
  push:
    branches: [security/kronia-k1-current-certified-20260815-v3]
    paths:
      - '.github/workflows/k1-current-v3-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: security/kronia-k1-current-certified-20260815-v3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Port recovered K1 onto CURRENT main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin security/kronia-k1-current-final-20260815:refs/remotes/origin/k1-recovered
          src=origin/k1-recovered
          paths=(
            .github/workflows/kronia-k1-phase2-security.yml
            app/server-k1.js
            app/public/k1-browser-security.js
            chrome-extension/k1-extension-auth.js
            chrome-extension/popup.html
            chrome-extension/popup.js
            ci/kronia-k1-phase2/001_k1_phase2_certificate.sql
            ci/kronia-k1-phase2/002_k1_safe_recovery.sql
            ci/kronia-k1-phase2/fixture_pre_k1.sql
            ci/kronia-k1-phase2/runtime_contract.py
            ci/kronia-k1-phase2/test_proxy_security.js
            supabase/migrations/20260814170000_kronia_k1_private_credentials_auth_v3.sql
            supabase/migrations/20260814171000_kronia_k1_app_token_control_plane.sql
            supabase/migrations/20260814171500_kronia_k1_identity_sync.sql
            supabase/migrations/20260814171600_kronia_k1_feed_schema_alignment.sql
            supabase/migrations/20260814171800_kronia_k1_auth_v3_branded_alignment.sql
            supabase/migrations/20260814172000_kronia_k1_team_profile_alignment.sql
            supabase/migrations/20260814172100_kronia_k1_authority_session_revocation.sql
            supabase/rollbacks/20260814_kronia_k1_phase2_safe_recovery.sql
          )
          for p in "${paths[@]}"; do
            mkdir -p "$(dirname "$p")"
            git show "$src:$p" > "$p"
          done
          python3 scripts/ci/k1_current_v3_patch.py
          git diff --check
          node --check app/server-k1.js
          node --check app/public/k1-browser-security.js
          node --check chrome-extension/k1-extension-auth.js
          node --check chrome-extension/popup.js
          python3 -m py_compile app/k1_phase2_materialize.py ci/kronia-k1-phase2/runtime_contract.py scripts/ci/k1_current_v3_patch.py
          (cd app && python3 k1_phase2_materialize.py)
          python3 ci/kronia-k1-phase2/runtime_contract.py
          rm -f app/k1-phase2-runtime-manifest.json
          git add .github/workflows/kronia-k1-phase2-security.yml app chrome-extension ci/kronia-k1-phase2 scripts/ci/k1_current_v3_patch.py supabase
          git config user.name 'ASCENDA Zero-Cost Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'security(k1): port recovered K1 onto current certified runtime'
          git push origin HEAD:security/kronia-k1-current-certified-20260815-v3

      - name: Retire one-shot materializer
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/k1-current-v3-materialize.yml
          git config user.name 'ASCENDA Zero-Cost Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'ci(k1): retire current v3 materializer'
          git push origin HEAD:security/kronia-k1-current-certified-20260815-v3
