name: K1 CURRENT v4 port

on:
  push:
    branches: [security/kronia-k1-current-main-20260817-v4]
    paths:
      - '.github/workflows/k1-v4-port.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: k1-current-v4-port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  port:
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: security/kronia-k1-current-main-20260817-v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Port exact hardened K1 source onto CURRENT main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin security/kronia-k1-current-final-v3-20260815
          node scripts/ci/k1_copy_source_v4.js 57d8ddd6b4c9554a167224369e71f9544c863151
          node scripts/ci/k1_v4_fixture_bootstrap_fix.js
          node scripts/ci/k1_port_current_v4.js
          node scripts/ci/k1_v4_runtime_contract_fix.js

          git diff --check
          node --check app/server-k1.js
          node --check app/server-phase-s.js
          node --check app/server-f5.js
          node --check app/public/k1-browser-security.js
          node --check chrome-extension/kronia-core.js
          node --check chrome-extension/k1-extension-auth.js
          node --check chrome-extension/content-script.js
          node --check chrome-extension/popup.js
          node --check ci/phase5-historical-identity/f5_upload_contract.js
          node ci/phase5-historical-identity/f5_upload_contract.js

          python3 -m py_compile app/k1_phase2_materialize.py ci/kronia-k1-phase2/runtime_contract.py ci/kronia-k1-phase2/security_static_contract.py
          (cd app && python3 k1_phase2_materialize.py)
          python3 ci/kronia-k1-phase2/runtime_contract.py
          python3 ci/kronia-k1-phase2/security_static_contract.py
          rm -f app/k1-phase2-runtime-manifest.json

          grep -q "sentinel-sentry-init.cjs.*server-k1.js" app/railway.json
          grep -q "server-phase-s.js" app/server-k1.js
          ! grep -q "spawn(process.execPath,\['server-f5.js'\]" app/server-k1.js
          grep -q "server-f5.js" app/server-phase-s.js
          ! grep -q "create table if not exists public.aos_integration_secrets_v1" ci/kronia-k1-phase2/fixture_pre_k1.sql
          grep -q "K1 CURRENT private provider vault bootstrap" supabase/migrations/20260814170000_kronia_k1_private_credentials_auth_v3.sql

          git status --short
          git add -A
          if git diff --cached --quiet; then
            echo 'KRONIA_K1_CURRENT_V4_ALREADY_MATERIALIZED=PASS'
            exit 0
          fi
          git config user.name 'ASCENDA Zero-Cost Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'security(k1): rebuild hardened K1 over CURRENT Phase S runtime'
          git push origin HEAD:security/kronia-k1-current-main-20260817-v4

      - name: Confirm CURRENT v4 port
        run: echo 'KRONIA_K1_CURRENT_V4_PORT=PASS'

# line-bounded-grant-parser-rerun
