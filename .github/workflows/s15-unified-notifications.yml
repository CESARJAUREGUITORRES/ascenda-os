name: S15 Unified Notification Events
on:
  pull_request:
    paths:
      - 'app/server-phase-s-f17.js'
      - 'app/server-phase-s.js'
      - 'app/server-f17.js'
      - 'app/server-f5.js'
      - 'app/railway.json'
      - 'app/push-notifications-s14.js'
      - 'app/public/phase2-service-worker.js'
      - 'app/public/notification-push-s14.js'
      - 'app/public/notification-center-s15.js'
      - 'app/public/icons/channel-*.svg'
      - 'supabase/migrations/20260817224500_s15_unified_notification_events.sql'
      - 'supabase/migrations/20260817224600_s15_topbar_notification_bridge.sql'
      - 'supabase/migrations/20260817224700_s15_legacy_notification_bridge.sql'
      - 'supabase/migrations/20260817235500_s15_notification_auth_boundary.sql'
      - 'supabase/rollback/20260817224500_s15_unified_notification_events_rollback.sql'
      - 'supabase/rollback/20260817224600_s15_topbar_notification_bridge_rollback.sql'
      - 'supabase/rollback/20260817224700_s15_legacy_notification_bridge_rollback.sql'
      - 'supabase/rollback/20260817235500_s15_notification_auth_boundary_rollback.sql'
      - 'ci/s15/**'
      - '.github/workflows/s15-unified-notifications.yml'
  push:
    branches: [main]
    paths:
      - 'app/server-phase-s-f17.js'
      - 'app/server-phase-s.js'
      - 'app/server-f17.js'
      - 'app/server-f5.js'
      - 'app/railway.json'
      - 'app/push-notifications-s14.js'
      - 'app/public/phase2-service-worker.js'
      - 'app/public/notification-push-s14.js'
      - 'app/public/notification-center-s15.js'
      - 'app/public/icons/channel-*.svg'
      - 'supabase/migrations/20260817224500_s15_unified_notification_events.sql'
      - 'supabase/migrations/20260817224600_s15_topbar_notification_bridge.sql'
      - 'supabase/migrations/20260817224700_s15_legacy_notification_bridge.sql'
      - 'supabase/migrations/20260817235500_s15_notification_auth_boundary.sql'
      - 'ci/s15/**'
      - '.github/workflows/s15-unified-notifications.yml'
  workflow_dispatch:

concurrency:
  group: s15-notifications-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install runtime dependencies
        working-directory: app
        shell: powershell
        run: npm.cmd install --no-audit --no-fund
      - name: JavaScript syntax
        shell: powershell
        run: |
          node --check app/server-phase-s-f17.js
          node --check app/server-f17.js
          node --check app/push-notifications-s14.js
          node --check app/public/notification-push-s14.js
          node --check app/public/notification-center-s15.js
          node --check app/public/phase2-service-worker.js
          node --check app/public/wa-human-alerts.js
      - name: Historical S12 safety contract
        shell: powershell
        run: node ci/wa-s12/contract.js
      - name: Historical S13 UX contract
        shell: powershell
        run: node ci/wa-s13/contract.js
      - name: Historical S14 Web Push contract
        shell: powershell
        run: node ci/wa-s14/contract.js
      - name: S15 unified notification contract
        shell: powershell
        run: node ci/s15/contract.js
      - name: S15 topbar bridge contract
        shell: powershell
        run: node ci/s15/topbar_contract.js
      - name: S15 legacy producer bridge contract
        shell: powershell
        run: node ci/s15/legacy_bridge_contract.js
      - name: S15.1 actor-bound notification authorization contract
        shell: powershell
        run: node ci/s15/auth_boundary_contract.js
      - name: S15.2 production runtime chain contract
        shell: powershell
        run: node ci/s15/production_chain_contract.js
