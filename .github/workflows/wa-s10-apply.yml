name: WA S10 Apply Customer Window Patch
on:
  push:
    branches:
      - wa-s10-customer-window-20260817
    paths:
      - 'ci/phase-s/apply_s10_customer_window_patch.js'
      - 'ci/phase-s/wa_customer_window_s10_contract.js'
      - '.github/workflows/wa-s10-apply.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wa-s10-customer-window-20260817
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply S10 patch
        shell: powershell
        run: |
          node ci/phase-s/apply_s10_customer_window_patch.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate syntax and S10 contract
        shell: powershell
        run: |
          node --check app/server-phase-s.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/server-wa3.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/public/wa-native-panel.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ci/phase-s/wa_customer_window_s10_contract.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit patched runtime
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/server-phase-s.js app/server-wa3.js app/public/wa-native-panel.js .github/workflows/phase-s-wa3-stabilization.yml
          if (git diff --cached --quiet) { Write-Host 'No runtime changes to commit'; exit 0 }
          git commit -m 'fix(wa): enforce 24h window and preserve Meta diagnostics'
          git push origin HEAD:wa-s10-customer-window-20260817
