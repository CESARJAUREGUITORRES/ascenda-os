name: Zero-Cost Runner Read-Only Probe

on:
  push:
    branches: ['ops/zero-cost-runner-probe-20260816']
    paths: ['.github/workflows/zero-cost-runner-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 5
    steps:
      - name: Probe WSL runner without mutation
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          Write-Host '=== WINDOWS ==='
          Write-Host ('COMPUTERNAME=' + $env:COMPUTERNAME)
          if (-not (Get-Command wsl.exe -ErrorAction SilentlyContinue)) { Write-Host 'WSL_EXE=ABSENT'; exit 0 }
          Write-Host 'WSL_EXE=PRESENT'
          Write-Host '=== DISTROS ==='
          wsl.exe -l -v
          Write-Host '=== LINUX PROBE ==='
          wsl.exe -- bash -lc @'
          set +e
          echo "LINUX_HOST=$(hostname)"
          echo "CURRENT_USER=$(id -un)"
          for p in /home/ascenda-runner/actions-runner/actions-runner /home/ascenda-runner/actions-runner; do
            if [ -d "$p" ]; then echo "RUNNER_DIR=$p"; fi
          done
          if pgrep -af 'Runner.Listener|Runner.Worker|run.sh' >/tmp/aos_runner_probe.txt 2>/dev/null; then
            echo RUNNER_PROCESS=PRESENT
            sed -E 's/(token|secret|password|authorization)=[^ ]+/<redacted>/Ig' /tmp/aos_runner_probe.txt
          else
            echo RUNNER_PROCESS=ABSENT
          fi
          if command -v docker >/dev/null 2>&1; then
            echo DOCKER_BIN=PRESENT
            docker info >/dev/null 2>&1 && echo DOCKER_DAEMON=UP || echo DOCKER_DAEMON=DOWN
          else
            echo DOCKER_BIN=ABSENT
          fi
          '@
