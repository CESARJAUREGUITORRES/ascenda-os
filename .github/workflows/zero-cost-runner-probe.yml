name: Zero-Cost Runner Read-Only Probe

on:
  push:
    branches: ['ops/zero-cost-runner-probe-20260816']
    paths: ['.github/workflows/zero-cost-runner-probe.yml']

permissions:
  contents: read

jobs:
  probe-a:
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 5
    steps:
      - name: Probe local capabilities A
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          Write-Host ('COMPUTERNAME=' + $env:COMPUTERNAME)
          if (Get-Command docker.exe -ErrorAction SilentlyContinue) {
            Write-Host 'DOCKER_EXE=PRESENT'
            docker version --format '{{.Server.Os}}' 2>$null
            Write-Host ('DOCKER_EXIT=' + $LASTEXITCODE)
            docker info --format '{{.OSType}}' 2>$null
            Write-Host ('DOCKER_INFO_EXIT=' + $LASTEXITCODE)
          } else { Write-Host 'DOCKER_EXE=ABSENT' }
          if (-not (Get-Command wsl.exe -ErrorAction SilentlyContinue)) { Write-Host 'WSL_EXE=ABSENT'; exit 0 }
          wsl.exe -l -q 2>$null
          Write-Host ('WSL_LIST_EXIT=' + $LASTEXITCODE)
          exit 0

  probe-b:
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 5
    steps:
      - name: Probe local capabilities B
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          Write-Host ('COMPUTERNAME=' + $env:COMPUTERNAME)
          if (Get-Command docker.exe -ErrorAction SilentlyContinue) {
            Write-Host 'DOCKER_EXE=PRESENT'
            docker version --format '{{.Server.Os}}' 2>$null
            Write-Host ('DOCKER_EXIT=' + $LASTEXITCODE)
            docker info --format '{{.OSType}}' 2>$null
            Write-Host ('DOCKER_INFO_EXIT=' + $LASTEXITCODE)
          } else { Write-Host 'DOCKER_EXE=ABSENT' }
          if (-not (Get-Command wsl.exe -ErrorAction SilentlyContinue)) { Write-Host 'WSL_EXE=ABSENT'; exit 0 }
          wsl.exe -l -q 2>$null
          Write-Host ('WSL_LIST_EXIT=' + $LASTEXITCODE)
          exit 0
