name: Zero-Cost Runner Read-Only Probe

on:
  push:
    branches: ['ops/zero-cost-runner-probe-20260816']
    paths: ['.github/workflows/zero-cost-runner-probe.yml']

permissions:
  contents: read

jobs:
  probe-a:
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 5
    steps:
      - name: Probe WSL runner without mutation A
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          Write-Host ('COMPUTERNAME=' + $env:COMPUTERNAME)
          if (-not (Get-Command wsl.exe -ErrorAction SilentlyContinue)) { Write-Host 'WSL_EXE=ABSENT'; exit 0 }
          Write-Host 'WSL_EXE=PRESENT'
          wsl.exe -l -v
          if ($LASTEXITCODE -ne 0) { Write-Host ('WSL_LIST_EXIT=' + $LASTEXITCODE); exit 0 }
          wsl.exe -- bash -lc "set +e; echo LINUX_HOST=\$(hostname); echo CURRENT_USER=\$(id -un); for p in /home/ascenda-runner/actions-runner/actions-runner /home/ascenda-runner/actions-runner; do [ -d \"\$p\" ] && echo RUNNER_DIR=\$p; done; pgrep -af 'Runner.Listener|Runner.Worker|run.sh' >/tmp/aos_runner_probe.txt 2>/dev/null && { echo RUNNER_PROCESS=PRESENT; cat /tmp/aos_runner_probe.txt; } || echo RUNNER_PROCESS=ABSENT; command -v docker >/dev/null 2>&1 && { echo DOCKER_BIN=PRESENT; docker info >/dev/null 2>&1 && echo DOCKER_DAEMON=UP || echo DOCKER_DAEMON=DOWN; } || echo DOCKER_BIN=ABSENT"
          exit 0

  probe-b:
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 5
    steps:
      - name: Probe WSL runner without mutation B
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          Write-Host ('COMPUTERNAME=' + $env:COMPUTERNAME)
          if (-not (Get-Command wsl.exe -ErrorAction SilentlyContinue)) { Write-Host 'WSL_EXE=ABSENT'; exit 0 }
          Write-Host 'WSL_EXE=PRESENT'
          wsl.exe -l -v
          if ($LASTEXITCODE -ne 0) { Write-Host ('WSL_LIST_EXIT=' + $LASTEXITCODE); exit 0 }
          wsl.exe -- bash -lc "set +e; echo LINUX_HOST=\$(hostname); echo CURRENT_USER=\$(id -un); for p in /home/ascenda-runner/actions-runner/actions-runner /home/ascenda-runner/actions-runner; do [ -d \"\$p\" ] && echo RUNNER_DIR=\$p; done; pgrep -af 'Runner.Listener|Runner.Worker|run.sh' >/tmp/aos_runner_probe.txt 2>/dev/null && { echo RUNNER_PROCESS=PRESENT; cat /tmp/aos_runner_probe.txt; } || echo RUNNER_PROCESS=ABSENT; command -v docker >/dev/null 2>&1 && { echo DOCKER_BIN=PRESENT; docker info >/dev/null 2>&1 && echo DOCKER_DAEMON=UP || echo DOCKER_DAEMON=DOWN; } || echo DOCKER_BIN=ABSENT"
          exit 0
