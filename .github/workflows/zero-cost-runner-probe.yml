name: Sentinel F9 Production Read-Only Probe

on:
  push:
    branches: ['ops/zero-cost-runner-probe-20260816']
    paths: ['.github/workflows/zero-cost-runner-probe.yml']

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 5
    steps:
      - name: Probe Railway health and F9 assets
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $base='https://ascenda-os-production.up.railway.app'
          function Get-Body([string]$path) {
            $r=Invoke-WebRequest -UseBasicParsing -Uri ($base+$path) -TimeoutSec 20 -Headers @{'Cache-Control'='no-cache'}
            if ($r.StatusCode -ne 200) { throw "HTTP_$($r.StatusCode):$path" }
            Write-Host ("PASS_HTTP_200="+$path)
            return [string]$r.Content
          }
          $health=Get-Body '/health'
          Write-Host ('HEALTH_BODY='+$health)
          $asset=Get-Body '/sentinel-inapp-notifications.js'
          if ($asset -notmatch 'AOS_sentinelPollNow') { throw 'SENTINEL_ASSET_SIGNATURE_MISSING' }
          Write-Host 'PASS_SENTINEL_ASSET_SIGNATURE=true'
          $sw=Get-Body '/phase2-service-worker.js'
          if ($sw -notmatch '/sentinel-inapp-notifications.js') { throw 'SENTINEL_SW_INJECTION_MISSING' }
          Write-Host 'PASS_SENTINEL_SW_INJECTION=true'
          $app=Get-Body '/app.html'
          if ($app -notmatch 'btn-notif' -or $app -notmatch 'np-list') { throw 'ASCENDA_NOTIFICATION_SHELL_MISSING' }
          Write-Host 'PASS_ASCENDA_NOTIFICATION_SHELL=true'
          Write-Host 'SENTINEL_F9_PRODUCTION_HTTP_SMOKE=PASS'
