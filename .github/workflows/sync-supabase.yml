name: Sync Supabase → GitHub (LEGACY / MANUAL)

on:
  workflow_dispatch:
    inputs:
      confirm_legacy_sync:
        description: 'Type SYNC_LEGACY to run the historical aos_codigo_fuente sync'
        required: true
        default: 'NO'

permissions:
  contents: write

concurrency:
  group: legacy-supabase-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm_legacy_sync == 'SYNC_LEGACY'
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install transient dependency
        run: npm install --no-save --no-audit --no-fund node-fetch@2

      - name: Sync historical source from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -euo pipefail
          node << 'EOF'
          const fetch = require('node-fetch');
          const fs = require('fs');
          const path = require('path');
          const ADN = ['SOUL.md','AGENTS.md','SKILLS.md','ULTRAPROMPMT_MAESTRO.md'];

          function getPath(nombre, tipo) {
            if (tipo === 'gs')   return `src/backend/${nombre}`;
            if (tipo === 'html') return `src/frontend/${nombre}`;
            if (tipo === 'md')   return ADN.includes(nombre) ? `docs/adn/${nombre}` : `docs/${nombre}`;
            return `src/${nombre}`;
          }

          async function main() {
            const resp = await fetch(
              `${process.env.SUPABASE_URL}/rest/v1/aos_codigo_fuente?select=nombre,tipo,contenido&order=tipo.asc,nombre.asc`,
              { headers: { apikey: process.env.SUPABASE_KEY, Authorization: `Bearer ${process.env.SUPABASE_KEY}` } }
            );
            if (!resp.ok) throw new Error(`Supabase sync HTTP ${resp.status}`);
            const archivos = await resp.json();
            console.log(`Supabase historical source: ${archivos.length} files`);
            let cambios = 0;
            for (const a of archivos) {
              if (!a.contenido || a.contenido === 'PENDIENTE_CONTENIDO_COMPLETO') continue;
              const fp = getPath(a.nombre, a.tipo);
              fs.mkdirSync(path.dirname(fp), { recursive: true });
              let actual = '';
              try { actual = fs.readFileSync(fp, 'utf8'); } catch(e) {}
              if (actual !== a.contenido) {
                fs.writeFileSync(fp, a.contenido, 'utf8');
                console.log(`  updated ${fp}`);
                cambios++;
              }
            }
            console.log(`Changes: ${cambios}`);
            fs.writeFileSync('sync_result.txt', String(cambios));
          }
          main().catch(e => { console.error(e.message); process.exit(1); });
          EOF

      - name: Commit and push historical changes only
        run: |
          set -euo pipefail
          CAMBIOS=$(cat sync_result.txt 2>/dev/null || echo "0")
          if [ "$CAMBIOS" -gt "0" ]; then
            git config user.email "sync@creactive.os"
            git config user.name "AscendaOS Sync"
            git add src/ docs/
            git commit -m "sync(legacy): $CAMBIOS archivos desde aos_codigo_fuente [$(date +'%Y-%m-%d %H:%M')]"
            git push
            echo "LEGACY_SYNC_PUSHED=$CAMBIOS"
          else
            echo "LEGACY_SYNC_NO_CHANGES=PASS"
          fi

      - name: Cleanup transient dependency
        if: always()
        run: |
          rm -rf node_modules sync_result.txt
