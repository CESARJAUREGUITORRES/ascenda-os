name: Marketing V2 KPI patch

on:
  push:
    branches:
      - fix/marketing-v2-kpi-consistency
    paths:
      - scripts/apply_marketing_v2_kpi_patch.mjs
      - .github/workflows/marketing-v2-kpi-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/marketing-v2-kpi-consistency
          fetch-depth: 0
      - run: node scripts/apply_marketing_v2_kpi_patch.mjs
      - run: node --check app/public/admin-marketing-v2.js
      - run: git diff --check
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/public/admin-marketing-v2.js
          git commit -m "fix(marketing): align KPI and funnel with Attribution V2"
          git push origin HEAD:fix/marketing-v2-kpi-consistency
