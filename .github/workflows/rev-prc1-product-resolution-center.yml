name: ASCENDA REV-PRC1 Product Resolution Center

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/*prc1*'
      - 'app/public/rev-prc1-product-resolution-center.js'
      - 'app/public/rev-prc1-auth-bridge.js'
      - 'app/public/f4-production-canary-hotfix.js'
      - 'app/server-phase-s-f17.js'
      - 'ci/rev-prc1/**'
      - 'ci/phase4-revenue/schema_contract.sql'
      - '.github/workflows/rev-prc1-product-resolution-center.yml'
  push:
    branches: ['feature/**','feat/**','fix/**']
    paths:
      - 'supabase/migrations/*prc1*'
      - 'app/public/rev-prc1-product-resolution-center.js'
      - 'app/public/rev-prc1-auth-bridge.js'
      - 'app/public/f4-production-canary-hotfix.js'
      - 'app/server-phase-s-f17.js'
      - 'ci/rev-prc1/**'
      - 'ci/phase4-revenue/schema_contract.sql'
      - '.github/workflows/rev-prc1-product-resolution-center.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rev-prc1-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  certify:
    name: PRC1 runtime + DB + governance
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 30
    env:
      DB_URL: postgresql://postgres:postgres@127.0.0.1:59422/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Enforce zero-cost runner
        run: |
          set -euo pipefail
          test "${{ runner.environment }}" = "self-hosted"
          python3 scripts/ci/enforce-zero-cost-policy.py

      - name: Runtime syntax and UI governance
        run: |
          set -euo pipefail
          node --check app/public/rev-prc1-product-resolution-center.js
          node --check app/public/rev-prc1-auth-bridge.js
          node --check app/public/f4-production-canary-hotfix.js
          node --check app/server-phase-s-f17.js
          node --check ci/rev-prc1/ui_contract.js
          node --check ci/rev-prc1/auth_bridge_contract.js
          node ci/rev-prc1/ui_contract.js
          node ci/rev-prc1/auth_bridge_contract.js

      - name: Configure isolated Supabase ports
        working-directory: ci/zero-cost-staging
        run: |
          set -euo pipefail
          sed -i 's/project_id = "ascenda-zero-cost-staging"/project_id = "ascenda-rev-prc1"/' supabase/config.toml
          sed -i 's/port = 54321/port = 59421/' supabase/config.toml
          sed -i 's/port = 54322/port = 59422/' supabase/config.toml
          sed -i 's/shadow_port = 54320/shadow_port = 59420/' supabase/config.toml

      - name: Start isolated Supabase
        working-directory: ci/zero-cost-staging
        run: |
          set -euo pipefail
          supabase stop --no-backup || true
          docker ps -aq --filter 'name=ascenda-rev-prc1' | xargs -r docker rm -f || true
          rm -rf supabase/.temp supabase/.branches
          supabase db start
          for i in $(seq 1 40); do
            if pg_isready -h 127.0.0.1 -p 59422 -U postgres >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo 'REV-PRC1 isolated Postgres did not become ready on 59422' >&2
          exit 1

      - name: Build synthetic production-shaped prerequisites
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/phase4-revenue/schema_contract.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-prc1/prereq.sql

      - name: Apply F4 and exact PRC1 migrations
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260814223000_f4_revenue_operations_core_v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260821122500_f4_revenue_prc1_product_resolution_center_v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260821130000_f4_revenue_prc1_product_resolution_center_v2.sql

      - name: Database lint
        working-directory: ci/zero-cost-staging
        run: supabase db lint --local --schema public --level error

      - name: pgTAP PRC1 governance contract
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -c "create extension if not exists pgtap with schema extensions"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-prc1/001_product_resolution.sql | tee /tmp/prc1-pgtap.txt
          grep -q '1..20' /tmp/prc1-pgtap.txt
          if grep -q 'not ok' /tmp/prc1-pgtap.txt; then exit 1; fi
          if grep -q 'Looks like you planned' /tmp/prc1-pgtap.txt; then exit 1; fi

      - name: Browser ACL remains token-gated
        run: |
          set -euo pipefail
          test "$(psql "$DB_URL" -X -qAt -c "select has_function_privilege('anon','public.aos_product_review_admin_v2(text,text,integer,integer,text,text)','EXECUTE')")" = "t"
          test "$(psql "$DB_URL" -X -qAt -c "select has_function_privilege('anon','public.aos_product_review_resolve_v2(text,text,text,integer,text,text,text,numeric,boolean,text)','EXECUTE')")" = "t"
          test "$(psql "$DB_URL" -X -qAt -c "select has_function_privilege('anon','public.aos_product_review_reopen_v1(text,text,text,text,text)','EXECUTE')")" = "t"
          test "$(psql "$DB_URL" -X -qAt -c "select (public.aos_product_review_admin_v2('bad','ALL',null,null,'','')->>'error')='UNAUTHORIZED'")" = "t"

      - name: Stop isolated Supabase
        if: always()
        working-directory: ci/zero-cost-staging
        run: supabase stop --no-backup || true
