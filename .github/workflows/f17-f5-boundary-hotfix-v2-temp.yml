name: F17 F5 Boundary Hotfix V2 Temp

on:
  push:
    branches:
      - ops/f17-f5-boundary-hotfix-20260817-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply and certify
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node ci/f17/materialize_f5_template_boundary.js
          node --check app/server-f5.js
          node --check app/f17-whatsapp-legacy-gateway.js
          $src=Get-Content app/server-f5.js -Raw
          if($src -notmatch '/api/f17/whatsapp/templates'){throw 'F17 route missing'}
          if($src -notmatch 'f5Recovery'){throw 'F5 recovery regressed'}
          if($src -notmatch 'createLegacyWhatsAppGateway'){throw 'gateway missing'}
          $changed=git diff --name-only
          if(($changed|Measure-Object).Count -ne 1 -or $changed -ne 'app/server-f5.js'){throw "unexpected scope: $changed"}
      - name: Commit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'ASCENDA F17 Bot'
          git config user.email 'f17-bot@users.noreply.github.com'
          git add app/server-f5.js
          git commit -m 'fix(f17): bind template gateway at effective F5 runtime'
          git push origin HEAD:ops/f17-f5-boundary-hotfix-20260817-v2
