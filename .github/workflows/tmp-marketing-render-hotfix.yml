name: TEMP Marketing render pipeline hotfix

on:
  push:
    branches:
      - fix/marketing-render-pipeline-20260821
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 10
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/marketing-render-pipeline-20260821
          fetch-depth: 0
      - name: Patch Marketing loaders without touching data
        shell: powershell
        run: |
          $patchFile = Join-Path $env:RUNNER_TEMP 'patch-marketing-render.cjs'
          @'
          const fs = require('fs');

          const htmlPaths = ['app/public/admin-marketing.html','src/admin-marketing.html'];

          function patchHtml(path) {
            let text = fs.readFileSync(path, 'utf8');
            const eol = text.includes('\r\n') ? '\r\n' : '\n';

            const annual = /rpc\('aos_marketing_dashboard_anio',\{p_anio:anio\},function\(d\)\{if\(!d\|\|d\.error\)return;\r?\n\s*rpc\('aos_ltv_cohortes',\{p_anio:anio,p_hasta_mes:12\},function\(ltv\)\{\r?\n\s*rKPI\(d\.kpis\);rEmb\(d\.embudo\);rHist\(d\.historial\|\|\[\]\);rLTV\(d\.kpis,d\.historial\|\|\[\],ltv\|\|\{\}\);rGest\(d\.gestion\);\r?\n\s*rAn\(d\.porAnuncio\|\|\[\]\);rCamp\(d\.porTratamiento\|\|\[\]\);rVL\(d\.ventasLeads\|\|\[\]\);rVF\(d\.ventasLeadsFuera\|\|\[\]\);\r?\n\s*\}\);\r?\n\s*\}\);/;
            const month = /rpc\('aos_marketing_dashboard',\{p_mes:mes,p_anio:anio\},function\(d\)\{if\(!d\|\|d\.error\)return;\r?\n\s*rpc\('aos_ltv_cohortes',\{p_anio:anio,p_hasta_mes:mes\},function\(ltv\)\{\r?\n\s*rKPI\(d\.kpis\);rEmb\(d\.embudo\);rHist\(d\.historial\|\|\[\]\);rLTV\(d\.kpis,d\.historial\|\|\[\],ltv\|\|\{\}\);rGest\(d\.gestion\);\r?\n\s*rAn\(d\.porAnuncio\|\|\[\]\);rCamp\(d\.porTratamiento\|\|\[\]\);rVL\(d\.ventasLeads\|\|\[\]\);rVF\(d\.ventasLeadsFuera\|\|\[\]\);\r?\n\s*\}\);\r?\n\s*\}\);/;

            function block(kind) {
              const annualMode = kind === 'annual';
              const dashboard = annualMode ? 'aos_marketing_dashboard_anio' : 'aos_marketing_dashboard';
              const args = annualMode ? '{p_anio:anio}' : '{p_mes:mes,p_anio:anio}';
              const until = annualMode ? '12' : 'mes';
              return [
                `rpc('${dashboard}',${args},function(d){if(!d||d.error)return;`,
                '      /* Operational tables must not wait for LTV/history. */',
                '      rKPI(d.kpis);rEmb(d.embudo);rGest(d.gestion);',
                '      rAn(d.porAnuncio||[]);rCamp(d.porTratamiento||[]);rVL(d.ventasLeads||[]);rVF(d.ventasLeadsFuera||[]);',
                `      rpc('aos_ltv_cohortes',{p_anio:anio,p_hasta_mes:${until}},function(ltv){`,
                '        rHist(d.historial||[]);rLTV(d.kpis,d.historial||[],ltv||{});',
                '      });',
                '    });'
              ].join(eol);
            }

            if (!annual.test(text)) throw new Error(`${path}: annual legacy block not found exactly once`);
            text = text.replace(annual, block('annual'));
            if (!month.test(text)) throw new Error(`${path}: month legacy block not found exactly once`);
            text = text.replace(month, block('month'));
            if ((text.match(/Operational tables must not wait for LTV\/history\./g)||[]).length !== 2) throw new Error(`${path}: operational guards != 2`);
            fs.writeFileSync(path, text, 'utf8');
            console.log('patched', path);
          }

          htmlPaths.forEach(patchHtml);

          const ctl = 'app/public/admin-marketing-v2.js';
          let data = fs.readFileSync(ctl, 'utf8');
          const replacements = [
            ["var RELEASE='2026-08-12-v4.2';", "var RELEASE='2026-08-21-v4.2.1';"],
            ['L(loadAll,20);', 'L(loadAll,1200);'],
            ['traceBox();insights();L(loadAll,50);', 'traceBox();insights();L(loadAll,1200);']
          ];
          for (const [oldText,newText] of replacements) {
            const count = data.split(oldText).length - 1;
            if (count !== 1) throw new Error(`${ctl}: expected one ${oldText}, got ${count}`);
            data = data.replace(oldText,newText);
          }
          fs.writeFileSync(ctl,data,'utf8');
          console.log('patched',ctl);
          '@ | Set-Content -Path $patchFile -Encoding UTF8
          node $patchFile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --numstat
      - name: Commit functional patch
        shell: powershell
        run: |
          git config user.name "ascenda-automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/public/admin-marketing.html src/admin-marketing.html app/public/admin-marketing-v2.js
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "fix(marketing): decouple operational render from LTV pipeline"
          git push origin HEAD:fix/marketing-render-pipeline-20260821
