name: BOOKING WEB · Production Smoke

on:
  push:
    branches: [main]
    paths:
      - 'app/ascenda-connect-booking-v1.js'
      - 'app/booking-v33-preload.js'
      - '.github/workflows/booking-web-production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Health + complete bootstrap · no write
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 5
    steps:
      - name: Wait for Railway rollout
        run: sleep 35
      - name: Health
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --retry 8 --retry-delay 8 --max-time 20 \
            -H 'Origin: https://zivital.pe' \
            'https://ascenda-os-production.up.railway.app/api/ascenda-connect/booking/v1/health')"
          printf '%s\n' "$body"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.ok!==true||x.service!=="ascenda-connect-booking"||x.version!=="1.0.1") process.exit(1)' "$body"
      - name: Bootstrap completeness
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --retry 8 --retry-delay 8 --max-time 25 \
            -H 'Origin: https://zivital.pe' \
            'https://ascenda-os-production.up.railway.app/api/ascenda-connect/booking/v1/bootstrap')"
          node -e '
            const x=JSON.parse(process.argv[1]);
            const expected={FACIAL:{approaches:3,treatments:12},CORPORAL:{approaches:3,treatments:9},CAPILAR:{approaches:2,treatments:4}};
            if(x.ok!==true||x.site!=="SAN ISIDRO"||x.attribution_default?.source_channel!=="WEB") process.exit(1);
            const rows={}; let total=0;
            for(const d of (x.domains||[])){
              const approaches=Array.isArray(d.approaches)?d.approaches:[];
              const treatments=approaches.reduce((n,a)=>n+(Array.isArray(a.treatments)?a.treatments.length:0),0);
              rows[d.code]={approaches:approaches.length,treatments}; total+=treatments;
            }
            for(const [code,e] of Object.entries(expected)) if(!rows[code]||rows[code].approaches!==e.approaches||rows[code].treatments!==e.treatments) process.exit(1);
            if(total!==25) process.exit(1);
            console.log(JSON.stringify({ok:x.ok,site:x.site,version:x.version,total_treatments:total,domains:rows,attribution:x.attribution_default}));
          ' "$body"
