name: ASCENDA Performance Guard Patch

on:
  push:
    branches:
      - fix/performance-guard

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'chore: remove performance patch workflow')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/performance-guard
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply deterministic performance patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match in {path}, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('patched', label)

          # 1) Shell: track and destroy intervals created by dynamically loaded panels.
          path = 'app/public/app.html'
          old = "var AOS = { token:'', ctx:{}, role:'ASESOR', collapsed:false, activeView:'', estadoBloqueo:'', bloqueoInicio:0 };"
          new = """var AOS = { token:'', ctx:{}, role:'ASESOR', collapsed:false, activeView:'', estadoBloqueo:'', bloqueoInicio:0, panelTimers:[], _capturePanelTimers:false };

/* PERFORMANCE GUARD: lifecycle de timers de paneles dinámicos.
   Solo captura timers creados mientras se ejecuta el JS de un panel; no toca timers del shell. */
var _AOS_NATIVE_SET_INTERVAL = window.setInterval;
var _AOS_NATIVE_CLEAR_INTERVAL = window.clearInterval;
window.setInterval = function(){
  var id = _AOS_NATIVE_SET_INTERVAL.apply(window, arguments);
  if(AOS._capturePanelTimers) AOS.panelTimers.push(id);
  return id;
};
window.clearInterval = function(id){
  AOS.panelTimers = (AOS.panelTimers||[]).filter(function(x){return x!==id;});
  return _AOS_NATIVE_CLEAR_INTERVAL.call(window, id);
};
function aosCleanupPanelRuntime(){
  AOS._capturePanelTimers = false;
  (AOS.panelTimers||[]).forEach(function(id){ try{_AOS_NATIVE_CLEAR_INTERVAL.call(window,id);}catch(e){} });
  AOS.panelTimers = [];
  if(typeof window.AOS_PANEL_CLEANUP === 'function'){
    try{ window.AOS_PANEL_CLEANUP(); }catch(e){ console.warn('[AOS] panel cleanup',e); }
  }
  window.AOS_PANEL_CLEANUP = null;
}"""
          replace_once(path, old, new, 'shell timer registry')

          replace_once(path,
              "      .then(function(panelHtml) {\n        ws.innerHTML = panelHtml;",
              "      .then(function(panelHtml) {\n        aosCleanupPanelRuntime();\n        ws.innerHTML = panelHtml;",
              'cleanup before panel swap')

          replace_once(path,
              "        // Ejecutar scripts del panel\n        var scripts = ws.querySelectorAll('script');",
              "        // Ejecutar scripts del panel\n        AOS._capturePanelTimers = true;\n        var scripts = ws.querySelectorAll('script');",
              'enable panel timer capture')

          replace_once(path,
              "            s.onload = function() { URL.revokeObjectURL(burl); };\n            document.head.appendChild(s);\n          }\n        }\n        loadNext();",
              "            s.onload = function() { URL.revokeObjectURL(burl); AOS._capturePanelTimers = false; };\n            s.onerror = function() { URL.revokeObjectURL(burl); AOS._capturePanelTimers = false; };\n            document.head.appendChild(s);\n          } else {\n            AOS._capturePanelTimers = false;\n          }\n        }\n        loadNext();",
              'close panel timer capture')

          # 2) Home Admin: remove duplicate 30s chart polling and stagger expensive reads.
          path = 'app/public/admin-home.html'
          old = "var _D={rkTab:'ranking',rkD:null,pg:null,timer:null,prev:{ventas:-1,citas:-1},loadCount:0,chartRaw:null,chartAsesor:null,chartMode:'llamadas'};"
          new = "var _D={rkTab:'ranking',rkD:null,pg:null,timer:null,prev:{ventas:-1,citas:-1},loadCount:0,chartRaw:null,chartAsesor:null,chartMode:'llamadas',loading:false,lastLoad:0,onVis:null};"
          replace_once(path, old, new, 'admin state guard')

          p = Path(path)
          text = p.read_text(encoding='utf-8')
          retry_old = "setTimeout(function(){go(a+1);},800)"
          retry_count = text.count(retry_old)
          if retry_count != 2:
              raise SystemExit(f'admin retry backoff: expected 2 matches, found {retry_count}')
          text = text.replace(retry_old, "setTimeout(function(){go(a+1);},5000)")
          p.write_text(text, encoding='utf-8')
          print('patched admin retry backoff')

          replace_once(path,
              "  ahTicker();ahRank();ahChart();\n  // Benchmark histórico (solo primera vez o cada 5 recargas)\n  if(_D.loadCount===1||_D.loadCount%5===0){ahBench();}\n  ahSparklines();",
              "  // PERFORMANCE GUARD: core cada ciclo; lecturas pesadas escalonadas.\n  ahTicker();\n  if(_D.loadCount===0||_D.loadCount%5===0){ahRank();}\n  if(_D.loadCount===0||_D.loadCount%2===0){ahChart();ahSparklines();}\n  if(_D.loadCount===0||_D.loadCount%10===0){ahBench();}",
              'admin stagger expensive reads')

          replace_once(path,
              "// ── INICIALIZACIÓN ──\nahLoad();\nahChart();\nahBench();\n_D.timer = setInterval(ahLoad, 30000);\n_D.timerChart = setInterval(ahChart, 30000);",
              """// ── INICIALIZACIÓN — PERFORMANCE GUARD ──
function ahSafeLoad(force){
  if(document.hidden)return;
  var now=Date.now();
  if(_D.loading)return;
  if(!force && _D.lastLoad && (now-_D.lastLoad)<45000)return;
  _D.loading=true;_D.lastLoad=now;
  ahLoad();
  // watchdog: evita solapamiento si Supabase se degrada.
  setTimeout(function(){_D.loading=false;},25000);
}
_D.onVis=function(){if(!document.hidden)ahSafeLoad(true);};
document.addEventListener('visibilitychange',_D.onVis);
ahSafeLoad(true);
_D.timer=setInterval(function(){ahSafeLoad(false);},60000);
window.AOS_PANEL_CLEANUP=function(){
  if(_D.timer)clearInterval(_D.timer);
  if(_D.onVis)document.removeEventListener('visibilitychange',_D.onVis);
  _D.timer=null;_D.onVis=null;
};""",
              'admin single adaptive scheduler')

          # 3) Railway: background jobs get lower check frequency and overlap guards.
          path = 'app/server.js'
          replace_once(path,
              """// Regenerar snapshot cada 5 min en Railway
setInterval(function() {
  sbRpc('aos_generar_snapshot', {})
    .then(function(snap) { _cachedSnapshot = snap; _snapshotAge = Date.now(); console.log('[SNAPSHOT] Regenerado OK') })
    .catch(function(e) { console.error('[SNAPSHOT] Error:', e.message) })
}, 300000) // 5 min""",
              """// PERFORMANCE GUARD — trabajos background compartidos
var _bgFailures = 0
var _bgOpenUntil = 0
function bgCanRun() { return Date.now() >= _bgOpenUntil }
function bgOk() { _bgFailures = 0; _bgOpenUntil = 0 }
function bgFail() {
  _bgFailures++
  var wait = _bgFailures >= 3 ? 600000 : (_bgFailures === 2 ? 120000 : 30000)
  _bgOpenUntil = Math.max(_bgOpenUntil, Date.now() + wait)
  console.warn('[PERF-GUARD] background backoff', wait, 'ms; failures=', _bgFailures)
}

// Snapshot global: 30 min en background. getSnapshot() mantiene cache/on-demand.
var _snapshotJobRunning = false
function backgroundSnapshotRun() {
  if (_snapshotJobRunning || !bgCanRun()) return
  _snapshotJobRunning = true
  sbRpc('aos_generar_snapshot', {})
    .then(function(snap) { _cachedSnapshot = snap; _snapshotAge = Date.now(); bgOk(); console.log('[SNAPSHOT] Regenerado OK') })
    .catch(function(e) { bgFail(); console.error('[SNAPSHOT] Error:', e.message) })
    .finally(function() { _snapshotJobRunning = false })
}
setInterval(backgroundSnapshotRun, 1800000) // 30 min""",
              'server snapshot guard')

          # Make agent list failures open the shared backoff circuit.
          replace_once(path,
              "  }).catch(function(e) { console.error('[TICK] Error:', e.message) })",
              "  }).catch(function(e) { bgFail(); console.error('[TICK] Error:', e.message) })",
              'agent failure backoff')

          replace_once(path,
              """  // Auto-tick every 60 seconds for cron agents
  setInterval(function() { autoTick() }, 30000) // cada 30s — más visible
  console.log('Agents: Auto-tick every 60s started')""",
              """  // PERFORMANCE GUARD: comprobar cron cada 60s; el cron de negocio no cambia.
  var _autoTickRunning = false
  function guardedAutoTick() {
    if (_autoTickRunning || !bgCanRun()) return
    _autoTickRunning = true
    try { autoTick() } catch(e) { bgFail(); console.error('[TICK] Guard error:', e.message) }
    setTimeout(function(){ _autoTickRunning = false }, 50000)
  }
  setInterval(guardedAutoTick, 60000)
  setTimeout(guardedAutoTick, 15000)
  console.log('Agents: guarded auto-tick every 60s started')""",
              'agent scheduler guard')

          replace_once(path,
              """// Ejecutar scheduler cada 60 segundos
setInterval(studioSchedulerRun, 60000)
// Primera ejecución 10 segundos después del boot
setTimeout(studioSchedulerRun, 10000)
console.log('[STUDIO-CRON] Scheduler iniciado — revisa contenido programado cada 60s')""",
              """// PERFORMANCE GUARD: Studio mantiene publicación automática con anti-solapamiento.
var _studioSchedulerRunning = false
function guardedStudioSchedulerRun() {
  if (_studioSchedulerRunning || !bgCanRun()) return
  _studioSchedulerRunning = true
  try { studioSchedulerRun() } catch(e) { bgFail(); console.error('[STUDIO-CRON] Guard error:', e.message) }
  setTimeout(function(){ _studioSchedulerRunning = false }, 45000)
}
setInterval(guardedStudioSchedulerRun, 120000)
setTimeout(guardedStudioSchedulerRun, 10000)
console.log('[STUDIO-CRON] Scheduler protegido — revisión cada 120s')""",
              'studio scheduler guard')

          print('All deterministic patches applied successfully.')
          PY

      - name: Validate Node syntax and performance invariants
        shell: bash
        run: |
          node --check app/server.js
          python3 - <<'PY'
          from pathlib import Path
          app=Path('app/public/app.html').read_text(encoding='utf-8')
          home=Path('app/public/admin-home.html').read_text(encoding='utf-8')
          server=Path('app/server.js').read_text(encoding='utf-8')
          checks={
            'panel cleanup': 'aosCleanupPanelRuntime();' in app,
            'panel timer registry': 'panelTimers:[]' in app,
            'no admin 30s timer': 'setInterval(ahLoad, 30000)' not in home,
            'no duplicate chart timer': 'timerChart = setInterval' not in home,
            'admin 60s scheduler': '},60000);' in home,
            'snapshot 30m': 'setInterval(backgroundSnapshotRun, 1800000)' in server,
            'agent guarded 60s': 'setInterval(guardedAutoTick, 60000)' in server,
            'studio guarded 120s': 'setInterval(guardedStudioSchedulerRun, 120000)' in server,
          }
          bad=[k for k,v in checks.items() if not v]
          for k,v in checks.items(): print(('OK ' if v else 'FAIL ')+k)
          if bad: raise SystemExit('Invariant failures: '+', '.join(bad))
          PY

      - name: Commit guarded patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/public/app.html app/public/admin-home.html app/server.js
          git commit -m 'fix: guard panel polling and background workers'
          git push origin HEAD:fix/performance-guard
