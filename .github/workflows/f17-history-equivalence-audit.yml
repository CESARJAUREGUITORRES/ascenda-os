name: F17 history equivalence audit

on:
  push:
    branches:
      - 'audit/f17-history-equivalence-20260817-v1'
    paths:
      - '.github/workflows/f17-history-equivalence-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compare:
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Compare final F17 canonical SQL against live migration statement
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re

          path=Path('supabase/migrations/20260815223000_cia_phase17_whatsapp_adapter_contracts_v1.sql')
          sql=path.read_text(encoding='utf-8')

          def norm(s):
              s=re.sub(r'(?m)--[^\n]*',' ',s)
              return re.sub(r'\s+','',s)
          def md5(s):
              return hashlib.md5(s.encode()).hexdigest()

          expected={
            'aos_cia_channel_prepare_send_v1':('4f543dc1cdd14ff5de45cbfb2e46bf22',3929),
            'aos_cia_channel_register_canary_recipient_v1':('414bbc58a5cac480d8d8d25b4b9046ad',1813),
            'aos_cia_channel_mark_dispatch_v1':('ec44383bc5d55171a077ec275ca07c0a',2589),
            'aos_cia_channel_ingest_inbound_v1':('658086ad3f58013642ef56c97013c8a6',1794),
            'aos_cia_channel_record_provider_event_v1':('ba6cc31ed74e9199e135d75ef1178d2f',1354),
          }
          rows=[]
          mismatch=False
          lower=sql.lower()
          for name,(remote_md5,remote_len) in expected.items():
              marker='create or replace function public.'+name
              pos=lower.find(marker)
              if pos < 0:
                  rows.append((name,remote_md5,'MISSING',remote_len,0,'MISSING'))
                  mismatch=True
                  continue
              tail=sql[pos:]
              if '$$;' not in tail:
                  rows.append((name,remote_md5,'NO_END',remote_len,0,'MISSING'))
                  mismatch=True
                  continue
              block=tail.split('$$;',1)[0]+'$$;'
              local_md5=md5(norm(block))
              status='PASS' if local_md5==remote_md5 else 'DIFF'
              mismatch |= status!='PASS'
              rows.append((name,remote_md5,local_md5,remote_len,len(block),status))

          first_marker='create or replace function public.aos_cia_channel_prepare_send_v1'
          first_pos=lower.find(first_marker)
          prefix=sql[:first_pos]
          prefix_md5=md5(norm(prefix))
          prefix_expected='5600c40c0f56929e8e79500b2553864a'
          prefix_status='PASS' if prefix_md5==prefix_expected else 'DIFF'

          acl_marker='revoke all on function public.aos_cia_channel_register_canary_recipient_v1'
          acl_pos=lower.find(acl_marker)
          suffix=sql[acl_pos:]
          # Production final statement ends after the four service-only grants.
          # Repository adds COMMENT ON metadata afterwards. Remove only those
          # metadata statements before comparing security-significant ACL SQL.
          acl_only=re.sub(r'(?is)comment\s+on\s+function\s+public\.[^;]+;',' ',suffix)
          acl_md5=md5(norm(acl_only))
          acl_expected='0f6f2a8e7b7dee77d4b7f820fbac20ee'
          acl_status='PASS' if acl_md5==acl_expected else 'DIFF'

          comments=re.findall(r'(?is)comment\s+on\s+function\s+public\.[^;]+;',suffix)
          comments_count=len(comments)
          aux_mismatch = prefix_status!='PASS' or acl_status!='PASS'

          out=Path('docs/control/F17_HISTORY_EQUIVALENCE_AUDIT_20260817.md')
          lines=[
            '# F17 History Equivalence Audit', '',
            '**Mode:** static, read-only comparison of the canonical repository migration against hashes derived from the already-applied production migration statement.', '',
            '## Function blocks', '',
            '| Function | Live normalized MD5 | Local normalized MD5 | Live raw length | Local raw length | Result |',
            '|---|---|---|---:|---:|---|',
          ]
          for row in rows:
              lines.append('| `{}` | `{}` | `{}` | {} | {} | **{}** |'.format(*row))
          lines += [
            '', '## Auxiliary DDL / ACL', '',
            '| Surface | Live normalized MD5 | Local normalized MD5 | Result |',
            '|---|---|---|---|',
            f'| `ALTER TABLE expires_at` prefix | `{prefix_expected}` | `{prefix_md5}` | **{prefix_status}** |',
            f'| service-only ACL revoke/grant block | `{acl_expected}` | `{acl_md5}` | **{acl_status}** |',
            '', f'Repository-only descriptive `COMMENT ON FUNCTION` statements after the ACL block: **{comments_count}**.',
            '', '## Decision', ''
          ]
          if mismatch or aux_mismatch:
              lines.append('**NOT CANONICALLY EQUIVALENT.** Do not version-repair the final F17 migration until the differing durable/security surface is resolved.')
          else:
              lines.append('**DURABLE/SECURITY SQL EQUIVALENT.** All five function blocks, the `expires_at` DDL and service-only ACL block match production after comment/whitespace normalization. Whole-file MD5 drift is attributable to formatting and repository-only descriptive comments. The final F17 file is eligible for version alignment, subject to replay-order validation with the four superseded intermediate production migrations represented as explicit no-op history tombstones.')
          out.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print(out.read_text())
          PY
          git diff --check
      - name: Commit audit evidence
        run: |
          set -euo pipefail
          git config user.name 'ASCENDA Zero-Cost CI'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/control/F17_HISTORY_EQUIVALENCE_AUDIT_20260817.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs(audit): extend F17 history equivalence to DDL and ACL'
          git push origin HEAD:${GITHUB_REF_NAME}
