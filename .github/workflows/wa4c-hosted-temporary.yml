name: ASCENDA WA-4C TEMP HOSTED

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/server-wa4.js'
      - 'app/server-wa3-v2.js'
      - 'app/server-wa3.js'
      - 'app/server-wa2.js'
      - 'app/server-f4.js'
      - 'app/wa-gateway.js'
      - 'app/wa-interactive.js'
      - 'app/wa4-copilot.js'
      - 'app/wa4-playbook.js'
      - 'app/wa4-knowledge.js'
      - 'app/wa4-conversation-runtime-v2.js'
      - 'app/wa4-conversation-runtime-v2.test.js'
      - 'app/wa4-campaign-context-adapter.js'
      - 'app/wa4-patient-identity-adapter.js'
      - 'app/wa4-booking-resolver.js'
      - 'app/wa4-adapters-v1.test.js'
      - 'app/wa4-response-quality-guard.js'
      - 'app/wa4-response-quality-guard.test.js'
      - 'app/contracts/wa4*.json'
      - 'app/ai-router.js'
      - 'app/public/wa4-copilot-experience.js'
      - 'app/public/wa-shell-integration.js'
      - 'supabase/migrations/*wa4*'
      - 'supabase/rollbacks/*wa4*'
      - 'ci/wa4c-full-local/**'
      - 'ci/performance/**'
      - 'tools/perf-audit/**'
      - '.github/workflows/wa4c-hosted-temporary.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wa4c-hosted-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hosted-full-local:
    name: TEMP HOSTED · WA-4C release-gate parity
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ASCENDA_FULL_LOCAL: '1'
      AOS_STUDIO_BACKGROUND_ENABLED: 'false'
      WA4C_RUNTIME_URL: 'http://127.0.0.1:60300'
      WHATSAPP_VERIFY_TOKEN: 'wa4c-hosted-verify-token'
      WHATSAPP_APP_SECRET: 'wa4c-hosted-app-secret'
      WHATSAPP_ACCESS_TOKEN: 'wa4c-hosted-meta-token'
      WHATSAPP_PHONE_NUMBER_ID: 'hosted-local-phone-id'
      WHATSAPP_GRAPH_VERSION: 'v23.0'
      WA_CANARY_MODE: 'true'
      WA_CANARY_ALLOW_TO: '51911111111'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package.json
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Hosted temporary boundary
        run: |
          set -euo pipefail
          test "${{ runner.environment }}" = "github-hosted"
          node --check app/server-wa4.js
          node --check app/server-wa3.js
          node --check app/wa-interactive.js
          node --check app/wa4-conversation-runtime-v2.js
          node --check app/wa4-conversation-runtime-v2.test.js
          node --check app/wa4-campaign-context-adapter.js
          node --check app/wa4-patient-identity-adapter.js
          node --check app/wa4-booking-resolver.js
          node --check app/wa4-adapters-v1.test.js
          node --check app/wa4-response-quality-guard.js
          node --check app/wa4-response-quality-guard.test.js
          node --check app/wa4-copilot.js
          node --check app/public/wa4-copilot-experience.js
          node --check app/public/wa-shell-integration.js
          node --check ci/wa4c-full-local/local-network-preload.cjs
          node --check ci/wa4c-full-local/local-supabase-auth-preload.cjs
          node --check ci/wa4c-full-local/run-canaries.js
          node --check ci/wa4c-full-local/run-booking-canary.js
          node --check ci/wa4c-full-local/run-conversation-beta.js
          bash -n ci/wa4c-full-local/bootstrap.sh
          ! grep -Eq 'ituyqwstonmhnfshnaqz|SUPABASE_ACCESS_TOKEN' ci/wa4c-full-local/*.js ci/wa4c-full-local/*.sh ci/wa4c-full-local/*.sql
          ! grep -Eq '(auto_reply_enabled|ai_send_enabled|auto_routing_enabled)[[:space:]]*=[[:space:]]*true' ci/wa4c-full-local/*.sql

      - name: TEMP HOSTED · Ascenda CI parity
        run: |
          set -euo pipefail
          test "${{ runner.environment }}" = "github-hosted"
          cd app
          npm install --no-audit --no-fund
          cd ..
          for f in \
            app/server.js \
            app/server-phase2.js \
            app/server-f4.js \
            app/server-wa4.js \
            app/email-runtime-env-compat.cjs \
            app/supabase-runtime-auth.cjs \
            app/supabase-quota-target.cjs \
            app/supabase-quota-circuit-preload.cjs; do
            if [ -f "$f" ]; then node --check "$f"; fi
          done
          node ci/wa4c-runtime/env-compat.test.js
          node ci/wa4c-runtime/supabase-auth-header.test.js
          node ci/wa4c-runtime/quota-target.test.js
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find app/public -maxdepth 1 -type f -name '*.js' -print0)
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          let checked=0;
          function walk(dir){
            for(const e of fs.readdirSync(dir,{withFileTypes:true})){
              if(e.name==='node_modules'||e.name==='dist') continue;
              const p=path.join(dir,e.name);
              if(e.isDirectory()) walk(p);
              else if(e.isFile()&&e.name.endsWith('.json')){JSON.parse(fs.readFileSync(p,'utf8'));checked++;}
            }
          }
          walk('app');
          console.log(`Validated ${checked} JSON files`);
          NODE
          for f in app/server.js app/package.json app/railway.json app/nixpacks.toml app/public/app.html app/public/login.html; do
            test -s "$f"
          done
          echo 'ASCENDA_TEMP_HOSTED_CI_PARITY_PASS'

      - name: TEMP HOSTED · Performance + ASC-PERF parity
        run: |
          set -euo pipefail
          test "${{ runner.environment }}" = "github-hosted"
          grep -q 'AOS_STUDIO_BACKGROUND_ENABLED=false' app/railway.json
          grep -q "process.env.AOS_STUDIO_BACKGROUND_ENABLED || 'false'" app/server.js
          node --check app/supabase-quota-circuit.js
          node --check app/supabase-quota-circuit-preload.cjs
          node ci/performance/wa-supabase-quota-circuit-contract.js
          node tools/perf-audit/runtime-census.mjs app sentinel | tee /tmp/asc-perf-hosted-census.log
          grep -q '^ASC-PERF-1A STATIC CENSUS$' /tmp/asc-perf-hosted-census.log
          grep -q '^candidate_files_end$' /tmp/asc-perf-hosted-census.log
          test -s "$RUNNER_TEMP/asc-perf-runtime-census.json"
          node ci/performance/performance-guard.mjs "$RUNNER_TEMP/asc-perf-runtime-census.json"
          node - <<'NODE'
          const fs=require('fs');
          const p=process.env.RUNNER_TEMP+'/asc-perf-runtime-census.json';
          const d=JSON.parse(fs.readFileSync(p,'utf8'));
          if(d.schema!=='asc-perf-runtime-census/v1') throw new Error('bad schema');
          if(!Number.isInteger(d.filesScanned)||d.filesScanned<1) throw new Error('empty census');
          if(!Array.isArray(d.findings)||!Array.isArray(d.recurrentNetworkCandidates)) throw new Error('missing arrays');
          console.log(JSON.stringify({filesScanned:d.filesScanned,linesScanned:d.linesScanned,findings:d.findingsCount,recurrentNetworkCandidateFiles:d.recurrentNetworkCandidateCount,fastIntervals:d.fastIntervalCandidateCount,broadReads:d.broadReadCandidateCount}));
          NODE
          rm -f "$RUNNER_TEMP/asc-perf-runtime-census.json" /tmp/asc-perf-hosted-census.log
          echo 'ASCENDA_TEMP_HOSTED_PERF_PARITY_PASS'

      - name: Conversation Runtime V2 deterministic regression corpus
        run: node app/wa4-conversation-runtime-v2.test.js

      - name: Campaign identity and booking adapter regression corpus
        run: node --test app/wa4-adapters-v1.test.js

      - name: Response quality guard regression corpus
        run: node --test app/wa4-response-quality-guard.test.js

      - name: Interactive payload and advisor UI contracts
        run: |
          set -euo pipefail
          node --test ci/wa4c-full-local/interactive-contract.test.js
          node --test ci/wa4c-full-local/ui-contract.test.js
          node --test ci/wa1-secure-gateway/wa-gateway.test.js
          node --test ci/wa4c-full-local/team-skill-authority-v2.test.js
          node --test ci/wa4c-full-local/catalog-role-product-authority-v2.test.js

      - name: Start full local Supabase and rebuild CURRENT
        run: bash ci/wa4c-full-local/bootstrap.sh

      - name: Local DB lint
        working-directory: ci/wa4c-full-local
        run: |
          set -euo pipefail
          supabase db lint --local --schema public --level error 2>&1 | tee /tmp/wa4c-hosted-lint.txt
          if grep -q '\[ERROR\]' /tmp/wa4c-hosted-lint.txt; then exit 1; fi

      - name: Start real WA runtime with local provider shims
        working-directory: app
        run: |
          set -euo pipefail
          export PORT=60300
          export NODE_OPTIONS="--require $GITHUB_WORKSPACE/ci/wa4c-full-local/local-network-preload.cjs --require $GITHUB_WORKSPACE/ci/wa4c-full-local/local-supabase-auth-preload.cjs"
          nohup node server-wa4.js >/tmp/wa4c-hosted-runtime.log 2>&1 &
          echo $! >/tmp/wa4c-hosted-runtime.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:60300/api/wa4/health >/tmp/wa4c-hosted-health.json 2>/dev/null; then cat /tmp/wa4c-hosted-health.json; exit 0; fi
            if ! kill -0 "$(cat /tmp/wa4c-hosted-runtime.pid)" 2>/dev/null; then cat /tmp/wa4c-hosted-runtime.log >&2; exit 1; fi
            sleep 1
          done
          cat /tmp/wa4c-hosted-runtime.log >&2
          exit 1

      - name: Seven official WA-4C end-to-end canaries
        run: node ci/wa4c-full-local/run-canaries.js 2>&1 | tee /tmp/wa4c-hosted-canaries.txt

      - name: Governed WhatsApp transactional booking canary
        run: node ci/wa4c-full-local/run-booking-canary.js 2>&1 | tee /tmp/wa4c-hosted-booking.txt

      - name: Complete client advisor Copilot conversation beta
        run: node ci/wa4c-full-local/run-conversation-beta.js 2>&1 | tee /tmp/wa4c-hosted-conversation.txt

      - name: Hosted parity certification assertions
        run: |
          set -euo pipefail
          grep -q 'WA4C_FULL_LOCAL_CANARIES_PASS' /tmp/wa4c-hosted-canaries.txt
          grep -q 'WA4C_GOVERNED_BOOKING_CANARY_PASS' /tmp/wa4c-hosted-booking.txt
          grep -q 'WA4C_FULL_LOCAL_CONVERSATION_BETA_PASS' /tmp/wa4c-hosted-conversation.txt
          ! grep -q '\[ERROR\]' /tmp/wa4c-hosted-lint.txt
          test "$(psql "$WA4C_LOCAL_DB_URL" -X -qAt -c "select count(*) from public.aos_wa4_booking_actions_v1 where status='BOOKED'")" = "1"
          test "$(psql "$WA4C_LOCAL_DB_URL" -X -qAt -c "select count(*) from public.aos_agenda_citas where origen_cita='WHATSAPP' and llamada_id_origen is null")" = "1"
          test "$(psql "$WA4C_LOCAL_DB_URL" -X -qAt -c "select count(*) from public.aos_wa_routing_control_v1 where human_send_enabled is true and ai_send_enabled is false and auto_routing_enabled is false")" = "1"
          test "$(psql "$WA4C_LOCAL_DB_URL" -X -qAt -c "select count(*) from public.aos_wa_ai_control_v1 where copilot_enabled is true and auto_reply_enabled is false")" = "1"
          echo 'WA-4C TEMP HOSTED RELEASE-GATE PARITY PASS. GitHub-hosted fallback substitutes offline self-hosted validation for this change only; production remains HUMAN_ONLY / SAFE-OFF.' >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: |
          set +e
          if [ -f /tmp/wa4c-hosted-runtime.pid ]; then kill -TERM "$(cat /tmp/wa4c-hosted-runtime.pid)" 2>/dev/null || true; fi
          cd ci/wa4c-full-local
          supabase stop --no-backup || true
