name: ASCENDA WA-3.5 Closeout

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/public/wa-multiagent-final-panel.js'
      - 'app/public/wa-revenue-inbox-closeout.js'
      - 'app/public/wa-shell-integration.js'
      - 'ci/wa3-5-closeout/**'
      - 'ci/wa3-5-revenue-inbox/p0_contract.js'
      - 'ci/wa3-5-advisor-productivity/p1a_contract.js'
      - 'ci/wa3-boxes-routing-handoff/ui_contract_v2.js'
      - 'ci/wa3-boxes-routing-handoff/ui_contract_final.js'
      - 'docs/control/WHATSAPP_REVENUE_HUB_WA_3_5_OFFLINE_CERTIFICATE.md'
      - 'docs/control/WHATSAPP_REVENUE_HUB_CURRENT.md'
      - 'docs/control/WHATSAPP_REVENUE_HUB_V2_ROADMAP_CURRENT.md'
      - 'docs/control/ASCENDA_WORKSTREAM_LOCK_CURRENT.md'
      - 'docs/MEMORY_CURRENT.md'
      - '.github/workflows/wa3-5-closeout.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wa35-closeout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closeout:
    name: ZERO-COST · WA-3.5 closeout contract
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enforce Zero-Cost lane
        run: |
          set -euo pipefail
          test "${{ runner.environment }}" = "self-hosted"
          python3 scripts/ci/enforce-zero-cost-policy.py
      - name: Syntax
        run: |
          set -euo pipefail
          node --check app/public/wa-multiagent-final-panel.js
          node --check app/public/wa-revenue-inbox-closeout.js
          node --check app/public/wa-shell-integration.js
          node --check ci/wa3-5-closeout/closeout_contract.js
      - name: WA-3.5 P2 closeout contract
        run: node ci/wa3-5-closeout/closeout_contract.js
      - name: Preserve P0 Revenue Inbox
        run: node ci/wa3-5-revenue-inbox/p0_contract.js
      - name: Preserve P1A advisor productivity
        run: node ci/wa3-5-advisor-productivity/p1a_contract.js
      - name: Preserve WA-3 authority
        run: |
          set -euo pipefail
          node ci/wa3-boxes-routing-handoff/ui_contract_v2.js
          node ci/wa3-boxes-routing-handoff/ui_contract_final.js
      - name: Preserve Supabase quota fail-closed circuit
        run: node ci/performance/wa-supabase-quota-circuit-contract.js
      - name: Certification boundary
        run: echo "WA-3.5 CODE/CI/ZERO-COST closeout only; LIVE remains held by Supabase HTTP 402 and current production canary."
