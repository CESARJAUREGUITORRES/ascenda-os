name: WA S10 Cache Bump Apply
on:
  push:
    branches:
      - wa-s10-cache-bump-20260817
    paths:
      - 'ci/phase-s/apply_s10_cache_bump.js'
      - '.github/workflows/wa-s10-cache-bump.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wa-s10-cache-bump-20260817
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply cache bump
        shell: powershell
        run: |
          node ci/phase-s/apply_s10_cache_bump.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/server-phase-s.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ci/phase-s/wa_native_s8_contract.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ci/phase-s/wa_customer_window_s10_contract.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit Phase S cache bump
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/server-phase-s.js
          if (git diff --cached --quiet) { Write-Host 'No Phase S changes'; exit 0 }
          git commit -m 'fix(wa): serve S10 assets from Phase S'
          git push origin HEAD:wa-s10-cache-bump-20260817
