name: KronIA K1 Security Certificate

on:
  push:
    branches: ['security/kronia-k1-hardening-*']
    paths:
      - 'supabase/migrations/20260814051*.sql'
      - 'supabase/migrations/20260814052*.sql'
      - 'supabase/rollbacks/20260814_kronia_k1_rollback.sql'
      - 'ci/kronia-k1/**'
      - 'app/k1_*.py'
      - 'app/railway.json'
      - 'app/nixpacks.toml'
      - 'app/server.js'
      - 'app/public/**'
      - 'chrome-extension/**'
      - '.github/workflows/kronia-k1-security.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20260814051*.sql'
      - 'supabase/migrations/20260814052*.sql'
      - 'supabase/rollbacks/20260814_kronia_k1_rollback.sql'
      - 'ci/kronia-k1/**'
      - 'app/k1_*.py'
      - 'app/railway.json'
      - 'app/nixpacks.toml'
      - 'app/server.js'
      - 'app/public/**'
      - 'chrome-extension/**'
      - '.github/workflows/kronia-k1-security.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kronia-k1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-contract:
    name: K1 identity / session / secrets / RPC boundary
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize exact Railway K1 runtime v4
        run: |
          set -euo pipefail
          (cd app && python3 k1_materialize_runtime.py && python3 k1_internal_boundary_v2.py && python3 k1_identity_boundary.py && python3 k1_config_boundary.py)
          test -s app/k1-runtime-manifest.json
          cp app/k1-runtime-manifest.json /tmp/kronia-k1-runtime-manifest.json
          grep -q 'python3 k1_materialize_runtime.py && python3 k1_internal_boundary_v2.py && python3 k1_identity_boundary.py && python3 k1_config_boundary.py' app/railway.json
          git diff --check

      - name: Runtime syntax and contract preflight
        run: |
          set -euo pipefail
          node --check app/server.js
          node --check app/public/kronia-core.js
          node --check chrome-extension/kronia-core.js
          node --check chrome-extension/popup.js
          python3 -m py_compile \
            app/k1_runtime_base.py app/k1_materialize_runtime.py app/k1_internal_boundary.py \
            app/k1_internal_boundary_v2.py app/k1_identity_boundary.py app/k1_config_boundary.py
          python3 ci/kronia-k1/check_runtime_contract.py
          python3 ci/kronia-k1/check_compat_contract.py
          python3 ci/kronia-k1/check_internal_boundary.py
          python3 ci/kronia-k1/check_identity_boundary.py
          python3 ci/kronia-k1/check_config_boundary.py

      - name: Dynamic privileged API security smoke
        run: |
          set -euo pipefail
          node ci/kronia-k1/test_runtime_security.js

      - name: Railway deployment equivalence
        run: |
          set -euo pipefail
          grep -q '"startCommand": "node server.js"' app/railway.json
          grep -q 'providers = \["\.\.\.", "python"\]' app/nixpacks.toml
          grep -q 'cmds = \["npm install"\]' app/nixpacks.toml
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('/tmp/kronia-k1-runtime-manifest.json').read_text())
          assert m.get('contract') == 'kronia-k1-runtime-v4'
          expected={'server.js','public/app.html','public/kronia-core.js','public/login.html','public/admin-sales.html','public/admin-config.html','public/agents.html','public/cerebro.html','public/admin-team.html'}
          assert set(m.get('files',{})) == expected
          assert all(len(v)==64 for v in m['files'].values())
          print('KRONIA_K1_RAILWAY_EQUIVALENCE=PASS')
          PY

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Start isolated Supabase
        working-directory: ci/zero-cost-staging
        run: |
          set -euo pipefail
          supabase db start

      - name: Build production-shaped K1 contracts
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/kronia-k1/schema_contract.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/kronia-k1/auth_primitives.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/kronia-k1/internal_primitives.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/kronia-k1/identity_primitives.sql

      - name: Compile exact K1 migrations 515-527
        run: |
          set -euo pipefail
          shopt -s nullglob
          migrations=(supabase/migrations/20260814051*.sql supabase/migrations/20260814052*.sql)
          test "${#migrations[@]}" -eq 13
          printf '%s\n' "${migrations[@]}" | sort > /tmp/kronia-k1-migrations.txt
          while IFS= read -r f; do
            echo "APPLY $f"
            psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$f"
          done < /tmp/kronia-k1-migrations.txt

      - name: Install post-migration CI-only auth helper
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/kronia-k1/test_helpers_post_migration.sql

      - name: K1 v5 authorization / credential / identity certificate
        run: |
          set -euo pipefail
          : > /tmp/kronia-k1-certificate.txt
          for t in \
            ci/kronia-k1/test_k1_core_v5.sql \
            ci/kronia-k1/test_k1_extended_v2.sql \
            ci/kronia-k1/test_k1_identity.sql \
            ci/kronia-k1/test_k1_config.sql \
            ci/kronia-k1/test_k1_authority.sql; do
              psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$t" | tee -a /tmp/kronia-k1-certificate.txt
          done
          grep -q 'KRONIA_K1_CORE_V5_CERTIFICATE=PASS' /tmp/kronia-k1-certificate.txt
          grep -q 'KRONIA_K1_EXTENDED_V2_CERTIFICATE=PASS' /tmp/kronia-k1-certificate.txt
          grep -q 'KRONIA_K1_IDENTITY_CERTIFICATE=PASS' /tmp/kronia-k1-certificate.txt
          grep -q 'KRONIA_K1_CONFIG_CERTIFICATE=PASS' /tmp/kronia-k1-certificate.txt
          grep -q 'KRONIA_K1_AUTHORITY_CERTIFICATE=PASS' /tmp/kronia-k1-certificate.txt

      - name: Database lint
        working-directory: ci/zero-cost-staging
        run: |
          set -euo pipefail
          supabase db lint --local --schema public --level error

      - name: Security-preserving rollback certificate
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/rollbacks/20260814_kronia_k1_rollback.sql | tee -a /tmp/kronia-k1-certificate.txt
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/kronia-k1/test_rollback.sql | tee -a /tmp/kronia-k1-certificate.txt
          grep -q 'KRONIA_K1_ROLLBACK_CERTIFICATE=PASS' /tmp/kronia-k1-certificate.txt

      - name: Secret / plaintext regression gates
        run: |
          set -euo pipefail
          ! grep -nE "process\.env\.(RESEND_API_KEY|GROQ_API_KEY|GEMINI_API_KEY)[[:space:]]*\|\|[[:space:]]*['\"][^'\"]+" app/server.js
          ! grep -n "const VERIFY_TOKEN = '" app/server.js
          ! grep -n "select=api_key" app/server.js
          ! grep -nE "password_hash[[:space:]]*:[[:space:]]*(pw|np|password)" app/public/admin-team.html
          ! grep -nE "grant execute on function public\.aos_(login_v2|verificar_2fa|kronia_emitir_token|kronia_verify_token).* to anon" supabase/rollbacks/20260814_kronia_k1_rollback.sql

      - name: Build immutable K1 evidence digest
        run: |
          set -euo pipefail
          sha256sum \
            /tmp/kronia-k1-certificate.txt \
            /tmp/kronia-k1-runtime-manifest.json \
            /tmp/kronia-k1-migrations.txt \
            > /tmp/kronia-k1-evidence.sha256
          sha256sum /tmp/kronia-k1-evidence.sha256 | tee /tmp/kronia-k1-evidence-root.sha256
          echo 'KRONIA_K1_V5_ZERO_COST_CERTIFIED=PASS'

      - name: Upload K1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kronia-k1-security-evidence
          path: |
            /tmp/kronia-k1-certificate.txt
            /tmp/kronia-k1-runtime-manifest.json
            /tmp/kronia-k1-migrations.txt
            /tmp/kronia-k1-evidence.sha256
            /tmp/kronia-k1-evidence-root.sha256
          if-no-files-found: ignore
          retention-days: 30

      - name: Stop isolated Supabase
        if: always()
        working-directory: ci/zero-cost-staging
        run: supabase stop --no-backup || true
