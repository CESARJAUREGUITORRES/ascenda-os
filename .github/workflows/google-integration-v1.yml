name: ASCENDA Google Integration V1 Zero-Cost Gate

on:
  push:
    branches: ['feature/google-integration-v1']
    paths:
      - 'app/google-integration-v1.js'
      - 'app/server.js'
      - 'app/public/admin-config.html'
      - 'app/public/agenda.js'
      - 'app/public/calls.js'
      - 'app/public/calls.html'
      - 'app/public/citas.html'
      - 'app/public/attendance.html'
      - 'supabase/migrations/20260912220000_google_integration_v1.sql'
      - 'supabase/rollback/20260912220000_google_integration_v1_rollback.sql'
      - 'ci/google-integration-v1/**'
      - 'docs/control/ASCENDA_GOOGLE_INTEGRATION_V1*'
      - '.github/workflows/google-integration-v1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/google-integration-v1.js'
      - 'app/server.js'
      - 'app/public/admin-config.html'
      - 'app/public/agenda.js'
      - 'app/public/calls.js'
      - 'app/public/calls.html'
      - 'app/public/citas.html'
      - 'app/public/attendance.html'
      - 'supabase/migrations/20260912220000_google_integration_v1.sql'
      - 'supabase/rollback/20260912220000_google_integration_v1_rollback.sql'
      - 'ci/google-integration-v1/**'
      - 'docs/control/ASCENDA_GOOGLE_INTEGRATION_V1*'
      - '.github/workflows/google-integration-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-integration-v1-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  google-integration-v1:
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 18
    env:
      DB_URL: postgresql://postgres:postgres@127.0.0.1:59337/postgres
      DB_CONTAINER: ascenda-google-v1-db
    steps:
      - uses: actions/checkout@v4
      - name: Zero-Cost policy
        run: python3 scripts/ci/enforce-zero-cost-policy.py
      - name: Runner health
        run: bash scripts/ci/runner-healthcheck.sh
      - name: Expose trusted runner Node
        run: bash scripts/ci/expose-runner-node.sh
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Runtime and browser contracts
        run: |
          set -euo pipefail
          node --check app/google-integration-v1.js
          node --check app/server.js
          node --check app/public/agenda.js
          node --check app/public/calls.js
          node ci/google-integration-v1/contract.js
      - name: Start isolated PostgreSQL 17
        run: |
          set -euo pipefail
          docker rm -f "$DB_CONTAINER" >/dev/null 2>&1 || true
          docker run -d --name "$DB_CONTAINER" -e POSTGRES_PASSWORD=postgres -p 127.0.0.1:59337:5432 postgres:17-alpine
          for i in $(seq 1 40); do
            docker exec "$DB_CONTAINER" pg_isready -U postgres -d postgres >/dev/null 2>&1 && exit 0
            sleep 1
          done
          docker logs "$DB_CONTAINER" || true
          exit 1
      - name: Build synthetic authorities
        run: psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/google-integration-v1/fixture.sql
      - name: Apply exact migration twice
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260912220000_google_integration_v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260912220000_google_integration_v1.sql
      - name: DB security and outbox contracts
        run: psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/google-integration-v1/db_contract.sql
      - name: PostgreSQL lint
        run: supabase db lint --db-url "$DB_URL" --schema public --level error
      - name: Exact rollback / zero residue
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/rollback/20260912220000_google_integration_v1_rollback.sql
          test "$(psql "$DB_URL" -X -qAt -c \"select to_regclass('public.aos_google_connections_v1') is null\")" = "t"
          test "$(psql "$DB_URL" -X -qAt -c \"select to_regclass('public.aos_google_sync_outbox_v1') is null\")" = "t"
          test "$(psql "$DB_URL" -X -qAt -c \"select count(*) from pg_trigger where tgname in ('trg_aos_google_enqueue_agenda_v1','trg_aos_google_enqueue_patient_v1') and not tgisinternal\")" = "0"
          echo GOOGLE_INTEGRATION_V1_ROLLBACK=PASS
      - name: Cleanup
        if: always()
        run: docker rm -f "$DB_CONTAINER" >/dev/null 2>&1 || true
