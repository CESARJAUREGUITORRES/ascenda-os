name: ASCENDA WA-4A.1 Zi Vital Governed Knowledge

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/wa4-knowledge.js'
      - 'supabase/migrations/*wa4a1_zi_vital*'
      - 'supabase/rollbacks/*wa4a1_zi_vital*'
      - 'ci/wa4a1-zi-vital-knowledge/**'
      - 'docs/control/WHATSAPP_REVENUE_HUB_WA4A1_*'
      - '.github/workflows/wa4a1-zi-vital-governed-knowledge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wa4a1-zi-vital-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: ZERO-COST · Zi Vital audience-governed knowledge
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 35
    env:
      DB_URL: postgresql://postgres:postgres@127.0.0.1:59962/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Enforce Zero-Cost lane
        run: |
          set -euo pipefail
          test "${{ runner.environment }}" = "self-hosted"
          python3 scripts/ci/enforce-zero-cost-policy.py

      - name: Adapter syntax and audience isolation
        run: |
          set -euo pipefail
          node --check app/wa4-knowledge.js
          node --test ci/wa4a-knowledge-fabric/wa4-knowledge.test.js
          node --test ci/wa4a1-zi-vital-knowledge/wa4a1-zi-knowledge.test.js
          node --check app/wa4-copilot.js
          node --check app/ai-router.js

      - name: Source provenance least-data and no-canonical-mutation contracts
        run: |
          set -euo pipefail
          M=supabase/migrations/20260828001500_wa4a1_zi_vital_governed_knowledge_v1.sql
          grep -q 'PUBLIC_CLIENT' "$M"
          grep -q 'ADVISOR_INTERNAL' "$M"
          grep -q 'OWNER_ADMIN' "$M"
          grep -q 'CLINICAL_RESTRICTED' "$M"
          grep -q 'SYSTEM_REFERENCE' "$M"
          grep -q 'cbb2a3cf2ff0458203004d41522595d5322c30dc1d084eb4e9c4f591b81ad901' "$M"
          grep -q 'ac9a61cfd19368a308f78e900b37108c24021ee419fe578cc7635f1000af3254' "$M"
          grep -R -q 'Pink Glow' supabase/migrations/*wa4a1_zi_vital*
          grep -R -q 'Hair Revival' supabase/migrations/*wa4a1_zi_vital*
          grep -R -q 'Hair Guard' supabase/migrations/*wa4a1_zi_vital*
          ! grep -REiq '(insert into|update|delete from)[[:space:]]+public\.(aos_catalogo_servicios|aos_promociones|aos_sedes_geo|aos_config_horarios|aos_catalogo_categorias)' supabase/migrations/*wa4a1_zi_vital*
          ! grep -REiq 'public\.(aos_pacientes|aos_ventas|aos_leads|aos_rev_)' supabase/migrations/*wa4a1_zi_vital*
          ! grep -REiq '(auto_routing|ai_send|auto_reply|copilot)[[:space:]]*=[[:space:]]*true' supabase/migrations/*wa4a1_zi_vital* app/wa4-knowledge.js
          ! grep -q "wa4-knowledge" app/server-wa4.js app/wa4-copilot.js

      - name: Configure isolated Supabase ports
        working-directory: ci/zero-cost-staging
        run: |
          set -euo pipefail
          sed -i 's/project_id = "ascenda-zero-cost-staging"/project_id = "ascenda-wa4a1-zivital"/' supabase/config.toml
          sed -i 's/port = 54321/port = 59961/' supabase/config.toml
          sed -i 's/port = 54322/port = 59962/' supabase/config.toml
          sed -i 's/shadow_port = 54320/shadow_port = 59960/' supabase/config.toml

      - name: Start isolated Supabase
        working-directory: ci/zero-cost-staging
        run: |
          set -euo pipefail
          supabase stop --no-backup || true
          docker ps -aq --filter 'name=ascenda-wa4a1-zivital' | xargs -r docker rm -f || true
          rm -rf supabase/.temp supabase/.branches
          supabase db start
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 59962 -U postgres >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo 'WA-4A.1 isolated Postgres did not become ready' >&2
          exit 1

      - name: Build base WA-4A and Zi Vital governed source
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/wa4a-knowledge-fabric/source_contract.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260827185000_wa4a_knowledge_fabric_v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260828001500_wa4a1_zi_vital_governed_knowledge_v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260828001510_wa4a1_zi_vital_core_seed_v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260828001520_wa4a1_zi_vital_facial_seed_v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260828001530_wa4a1_zi_vital_corporal_capilar_seed_v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260828001540_wa4a1_zi_vital_care_seed_v1.sql

      - name: Database lint
        working-directory: ci/zero-cost-staging
        run: supabase db lint --local --schema public --level error

      - name: Zi Vital provenance audience retrieval and safety contracts
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/wa4a1-zi-vital-knowledge/tests/001_zi_vital_governed_knowledge.sql | tee /tmp/wa4a1-db.txt
          grep -q 'WA4A1_ZI_VITAL_GOVERNED_KNOWLEDGE_PASS' /tmp/wa4a1-db.txt

      - name: Base WA-4A regression
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/wa4a-knowledge-fabric/tests/001_knowledge_fabric.sql | tee /tmp/wa4a-regression.txt
          grep -q 'WA4A_KNOWLEDGE_FABRIC_PASS' /tmp/wa4a-regression.txt

      - name: Derived rollback preserves base Knowledge Fabric and canonical sources
        run: |
          set -euo pipefail
          CATALOG_BEFORE=$(psql "$DB_URL" -X -qAt -c 'select count(*) from public.aos_catalogo_servicios')
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/rollbacks/20260828001500_wa4a1_zi_vital_governed_knowledge_v1.rollback.sql
          test "$(psql "$DB_URL" -X -qAt -c "select to_regclass('public.aos_zi_knowledge_entities_v1') is null")" = "t"
          test "$(psql "$DB_URL" -X -qAt -c "select to_regclass('public.aos_wa4a_knowledge_items_v1') is not null")" = "t"
          test "$(psql "$DB_URL" -X -qAt -c 'select count(*) from public.aos_catalogo_servicios')" = "$CATALOG_BEFORE"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260828001500_wa4a1_zi_vital_governed_knowledge_v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260828001510_wa4a1_zi_vital_core_seed_v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260828001520_wa4a1_zi_vital_facial_seed_v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260828001530_wa4a1_zi_vital_corporal_capilar_seed_v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260828001540_wa4a1_zi_vital_care_seed_v1.sql
          test "$(psql "$DB_URL" -X -qAt -c "select to_regprocedure('public.aos_wa4a1_zi_knowledge_search_v1(text,text,integer)') is not null")" = "t"
          test "$(psql "$DB_URL" -X -qAt -c 'select count(*) from public.aos_zi_knowledge_entities_v1')" = "26"

      - name: Safety boundary
        run: |
          set -euo pipefail
          echo 'WA-4A.1 TEST CERTIFICATION ONLY: derived Zi Vital source is PROD-ready but unapplied to production.'
          echo 'Audience is mandatory for Zi Vital retrieval. PUBLIC_CLIENT cannot retrieve internal or clinical projections.'
          echo 'CLINICAL_RESTRICTED is evidence for human clinical escalation, never autonomous diagnosis/prescription.'
          echo 'Knowledge Fabric adapter accepts the new governed domain; Copilot remains unwired and SAFE-OFF.'

      - name: Stop isolated Supabase
        if: always()
        working-directory: ci/zero-cost-staging
        run: supabase stop --no-backup || true
