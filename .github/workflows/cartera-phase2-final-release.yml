name: ASCENDA Cartera Phase 2 Final Release

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20260814030000_phase2_auth_v3_additive.sql'
      - 'supabase/migrations/20260814034401_cartera_phase2_reconciliation.sql'
      - 'supabase/migrations/20260814050000_cartera_phase2_security_cleanup.sql'
      - 'supabase/migrations/20260814060000_phase2_production_hardening.sql'
      - 'supabase/migrations/20260814061000_phase2_secure_write_defaults_fix.sql'
      - 'supabase/migrations/20260814062000_phase2_auth_provider_boundary.sql'
      - 'supabase/migrations/20260814063000_phase2_identity_admin_hardening.sql'
      - 'supabase/migrations/20260814064000_phase2_owner_canary_access.sql'
      - 'ci/phase2-cartera/**'
      - '.github/workflows/cartera-phase2-final-release.yml'
  push:
    branches: ['agent/**','feature/**','fix/**','security/**']
    paths:
      - 'supabase/migrations/20260814030000_phase2_auth_v3_additive.sql'
      - 'supabase/migrations/20260814034401_cartera_phase2_reconciliation.sql'
      - 'supabase/migrations/20260814050000_cartera_phase2_security_cleanup.sql'
      - 'supabase/migrations/20260814060000_phase2_production_hardening.sql'
      - 'supabase/migrations/20260814061000_phase2_secure_write_defaults_fix.sql'
      - 'supabase/migrations/20260814062000_phase2_auth_provider_boundary.sql'
      - 'supabase/migrations/20260814063000_phase2_identity_admin_hardening.sql'
      - 'supabase/migrations/20260814064000_phase2_owner_canary_access.sql'
      - 'ci/phase2-cartera/**'
      - '.github/workflows/cartera-phase2-final-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cartera-phase2-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-release-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DB_URL: postgresql://postgres:postgres@127.0.0.1:57322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Configure isolated ports
        working-directory: ci/zero-cost-staging
        run: |
          set -euo pipefail
          sed -i 's/project_id = "ascenda-zero-cost-staging"/project_id = "ascenda-phase2-final"/' supabase/config.toml
          sed -i 's/port = 54321/port = 57321/' supabase/config.toml
          sed -i 's/port = 54322/port = 57322/' supabase/config.toml
          sed -i 's/shadow_port = 54320/shadow_port = 57320/' supabase/config.toml

      - name: Start isolated Supabase
        working-directory: ci/zero-cost-staging
        run: supabase db start

      - name: Build synthetic prerequisite state
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/zero-cost-staging/schema_contract.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260813164711_fix_otros_service_type.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260813173000_sales_intelligence_v2_summary.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260813174500_sales_intelligence_v2_summary_optimize.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260814021609_fix_2fa_context_canary.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260814024619_sales_intelligence_admin_activation.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/phase2-cartera/schema_contract.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/phase2-cartera/schema_hardening_contract.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/phase2-cartera/fixture_pre_migration.sql

      - name: Apply complete production chain exactly
        run: |
          set -euo pipefail
          for f in \
            20260814030000_phase2_auth_v3_additive.sql \
            20260814034401_cartera_phase2_reconciliation.sql \
            20260814050000_cartera_phase2_security_cleanup.sql \
            20260814060000_phase2_production_hardening.sql \
            20260814061000_phase2_secure_write_defaults_fix.sql \
            20260814062000_phase2_auth_provider_boundary.sql \
            20260814063000_phase2_identity_admin_hardening.sql \
            20260814064000_phase2_owner_canary_access.sql; do
              psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "supabase/migrations/$f"
          done

      - name: Final release invariants
        run: |
          set -euo pipefail
          test "$(psql "$DB_URL" -X -qAt -c "select count(*) from public.aos_usuarios where codigo_asesor='CAROWNER' and paneles_acceso @> array['admin-cartera']::text[]")" = "1"
          test "$(psql "$DB_URL" -X -qAt -c "select count(*) from public.aos_security_log where accion='PHASE2_CARTERA_CANARY_GRANTED'")" = "1"
          test "$(psql "$DB_URL" -X -qAt -c "select has_function_privilege('anon','public.aos_login_v3(text,text)','EXECUTE')")" = "t"
          test "$(psql "$DB_URL" -X -qAt -c "select has_function_privilege('anon','public.aos_login(text,text)','EXECUTE')")" = "f"
          test "$(psql "$DB_URL" -X -qAt -c "select has_function_privilege('anon','public.aos_abonar_cotizacion(text,numeric,text,text,text,text,text,text,text,text,text)','EXECUTE')")" = "f"
          test "$(psql "$DB_URL" -X -qAt -c "select has_function_privilege('anon','public.aos_abonar_cotizacion_v2(text,uuid,text,numeric,text,text,text,text,text)','EXECUTE')")" = "t"
          test "$(psql "$DB_URL" -X -qAt -c "select has_table_privilege('anon','public.aos_ventas','INSERT')")" = "f"
          test "$(psql "$DB_URL" -X -qAt -c "select to_regclass('public.aos_cartera_reconciliacion') is not null")" = "t"

      - name: Final database lint
        working-directory: ci/zero-cost-staging
        run: supabase db lint --local --schema public --level error

      - name: Stop isolated Supabase
        if: always()
        working-directory: ci/zero-cost-staging
        run: supabase stop --no-backup || true
