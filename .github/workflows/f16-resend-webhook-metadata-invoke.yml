name: F16 Post-Cleanup Production Smoke

on:
  push:
    branches:
      - ops/f16-prod-canary-trigger-20260815
    paths:
      - '.github/workflows/f16-resend-webhook-metadata-invoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    steps:
      - uses: actions/checkout@v4
      - name: Verify production runtime after F16 cleanup
        shell: powershell
        run: |
          $base = 'https://ascenda-os-production.up.railway.app'
          $health = Invoke-WebRequest -Uri "$base/health" -Method GET -UseBasicParsing
          if ($health.StatusCode -ne 200) { throw "HEALTH_EXPECTED_200_GOT_$($health.StatusCode)" }
          Write-Host 'F16_POST_CLEANUP_HEALTH=PASS'

          try {
            Invoke-WebRequest -Uri "$base/api/email-gateway" -Method POST -ContentType 'application/json' -Body '{}' -UseBasicParsing | Out-Null
            throw 'EMAIL_GATEWAY_UNAUTH_EXPECTED_401'
          } catch {
            if (-not $_.Exception.Response -or [int]$_.Exception.Response.StatusCode -ne 401) { throw }
          }
          Write-Host 'F16_POST_CLEANUP_GATEWAY_401=PASS'

          try {
            Invoke-WebRequest -Uri "$base/api/resend-webhook" -Method POST -ContentType 'application/json' -Body '{}' -UseBasicParsing | Out-Null
            throw 'RESEND_WEBHOOK_INVALID_EXPECTED_401'
          } catch {
            if (-not $_.Exception.Response -or [int]$_.Exception.Response.StatusCode -ne 401) { throw }
          }
          Write-Host 'F16_POST_CLEANUP_WEBHOOK_401=PASS'

          $canaryStatus = 0
          $canaryContent = ''
          $canaryContentType = ''
          try {
            $r = Invoke-WebRequest -Uri "$base/api/f16-live-canary" -Method POST -ContentType 'application/json' -Headers @{ 'X-ASCENDA-F16-CANARY' = 'F16_PROVIDER_CANARY_20260815' } -Body '{"confirm":"INSPECT_RESEND_WEBHOOK_CONFIG"}' -UseBasicParsing
            $canaryStatus = [int]$r.StatusCode
            $canaryContent = [string]$r.Content
            $canaryContentType = [string]$r.Headers['Content-Type']
          } catch {
            if ($_.Exception.Response) {
              $canaryStatus = [int]$_.Exception.Response.StatusCode
              $canaryContentType = [string]$_.Exception.Response.Headers['Content-Type']
            } else { throw }
          }
          if ($canaryContent -match 'matching_webhooks|signing_secret_matches_runtime|INSPECT_RESEND|F16_PROVIDER_CANARY|provider_message_id') { throw 'F16_CANARY_DIAGNOSTIC_STILL_EXPOSED' }
          if ($canaryContentType -match 'application/json' -and $canaryStatus -eq 200) { throw 'F16_CANARY_JSON_ROUTE_STILL_ACTIVE' }
          Write-Host "F16_POST_CLEANUP_CANARY_RETIRED=PASS status=$canaryStatus content_type=$canaryContentType"
