name: F16 Resend Email State Invoke

on:
  push:
    branches:
      - ops/f16-prod-canary-trigger-20260815
    paths:
      - '.github/workflows/f16-resend-webhook-metadata-invoke.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    steps:
      - uses: actions/checkout@v4
      - name: Inspect fixed production Resend canary state
        shell: powershell
        run: |
          $headers = @{ 'X-ASCENDA-F16-CANARY' = 'F16_PROVIDER_CANARY_20260815' }
          $body = '{"confirm":"INSPECT_RESEND_CANARY_EMAIL_STATE"}'
          $r = Invoke-WebRequest -Uri 'https://ascenda-os-production.up.railway.app/api/f16-live-canary' -Method POST -ContentType 'application/json' -Headers $headers -Body $body -UseBasicParsing
          Write-Host $r.Content
          $j = $r.Content | ConvertFrom-Json
          if ($r.StatusCode -ne 200 -or $j.ok -ne $true -or $j.canary_recipient_match -ne $true -or $j.canary_subject_match -ne $true) { throw 'F16_RESEND_EMAIL_STATE_PROBE=FAIL' }
          Write-Host 'F16_RESEND_EMAIL_STATE_PROBE=PASS'
