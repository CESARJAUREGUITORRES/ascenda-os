name: ASCENDA REV-F6.5 Historical Sales Plug-in

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/*rev_f6_5*'
      - 'supabase/rollbacks/*rev_f6_5*'
      - 'ci/rev-f6-5/**'
      - 'docs/control/REV_F6_5*'
      - 'docs/control/ASCENDA_WORKSTREAM_LOCK_CURRENT.md'
      - '.github/workflows/rev-f6-5-historical-sales-plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rev-f6-5-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  fast-contracts:
    name: F6.5 FAST historical plug-in contract
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enforce FAST lane
        shell: powershell
        run: |
          if ('${{ runner.environment }}' -ne 'self-hosted') { throw 'FAST lane must be self-hosted' }
      - name: Static Historical Sales Plug-in contract
        shell: powershell
        run: node ci/rev-f6-5/static_contract.js

  db-security-performance:
    name: F6.5 DB/security/semantic/performance/recovery
    needs: fast-contracts
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 35
    env:
      DB_URL: postgresql://postgres:postgres@127.0.0.1:59762/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Enforce Zero-Cost DB runner
        run: |
          set -euo pipefail
          test "${{ runner.environment }}" = "self-hosted"
          python3 scripts/ci/enforce-zero-cost-policy.py
      - name: Configure isolated Supabase
        working-directory: ci/zero-cost-staging
        run: |
          set -euo pipefail
          sed -i 's/project_id = "ascenda-zero-cost-staging"/project_id = "ascenda-rev-f6-5"/' supabase/config.toml
          sed -i 's/port = 54321/port = 59761/' supabase/config.toml
          sed -i 's/port = 54322/port = 59762/' supabase/config.toml
          sed -i 's/shadow_port = 54320/shadow_port = 59760/' supabase/config.toml
      - name: Start isolated Postgres
        working-directory: ci/zero-cost-staging
        run: |
          set -euo pipefail
          supabase stop --no-backup || true
          docker ps -aq --filter 'name=ascenda-rev-f6-5' | xargs -r docker rm -f || true
          rm -rf supabase/.temp supabase/.branches
          supabase db start
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 59762 -U postgres >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Build F6.1 synthetic prerequisite schema
        run: psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-f6-1/schema_contract.sql
      - name: Add F6.2 lifecycle fixture
        run: psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-f6-2/fixture.sql
      - name: Add F6.3 confidence fixture
        run: psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-f6-3/fixture.sql
      - name: Apply certified F6.0 prerequisite
        run: psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260820013500_rev_f6_0_data_contract_v1.sql
      - name: Apply certified F6.1 prerequisite
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260820022000_rev_f6_1_patient_commercial_360_v2.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260820022500_rev_f6_1_alias_normalization_fix.sql
      - name: Apply certified F6.2 prerequisite
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260820034000_rev_f6_2_customer_lifecycle_v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260820035500_rev_f6_2_lima_date_active_subject_fix.sql
      - name: Capture protected F6.3 baseline
        run: psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-f6-3/capture_baseline.sql
      - name: Apply certified F6.3 prerequisite
        run: psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260820172500_rev_f6_3_identity_confidence_metric_trust_v1.sql
      - name: Revalidate F6.3
        run: psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-f6-3/tests/001_identity_confidence_metric_trust.sql
      - name: Add F6.4 Sales Intelligence fixture
        run: psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-f6-4/fixture.sql
      - name: Capture protected F6.4 baseline
        run: psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-f6-4/capture_baseline.sql
      - name: Apply certified F6.4
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260820190000_rev_f6_4_sales_intelligence_3_v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260820191000_rev_f6_4_live_performance_baseline_decouple_v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260820191500_rev_f6_4_dashboard_cache_performance_v1.sql
      - name: Revalidate certified F6.4
        run: psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-f6-4/tests/001_sales_intelligence_3.sql
      - name: Capture protected F6.5 baseline
        run: psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-f6-5/capture_baseline.sql
      - name: Apply exact F6.5 migration
        run: psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260820195500_rev_f6_5_historical_sales_plugin_v1.sql
      - name: Fixtures A-J
        run: psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-f6-5/fixtures_A_J.sql
      - name: F6.5 invariants
        run: psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-f6-5/tests/001_historical_sales_plugin.sql
      - name: Full idempotent migration replay
        run: |
          set -euo pipefail
          fp1="$(psql "$DB_URL" -X -qAt -c "select public.aos_rev_f6_5_contract_v1()->>'contract_fingerprint'")"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260820195500_rev_f6_5_historical_sales_plugin_v1.sql
          fp2="$(psql "$DB_URL" -X -qAt -c "select public.aos_rev_f6_5_contract_v1()->>'contract_fingerprint'")"
          test "$fp1" = "$fp2"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-f6-5/tests/001_historical_sales_plugin.sql
      - name: Recovery restores exact F6.4 boundary
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/rollbacks/20260820195500_rev_f6_5_historical_sales_plugin_v1_recovery.sql
          test "$(psql "$DB_URL" -X -qAt -c "select to_regclass('public.aos_rev_historical_source_manifest_v1') is null")" = "t"
          test "$(psql "$DB_URL" -X -qAt -c "select to_regprocedure('public.aos_rev_f6_5_contract_v1()') is null")" = "t"
          test "$(psql "$DB_URL" -X -qAt -c "select to_regprocedure('public.aos_rev_sales_intelligence_v3_f6_4_runtime_base(integer,text,text)') is null")" = "t"
          test "$(psql "$DB_URL" -X -qAt -c "select to_regprocedure('public.aos_rev_sales_intelligence_v3(integer,text,text)') is not null")" = "t"
          test "$(psql "$DB_URL" -X -qAt -c "select to_regprocedure('public.aos_rev_f6_4_contract_v1()') is not null")" = "t"
          test "$(psql "$DB_URL" -X -qAt -c "select to_regclass('public.aos_rev_si_dashboard_cache_v1') is not null")" = "t"
          test "$(psql "$DB_URL" -X -qAt -c "select has_function_privilege('anon','public.aos_rev_sales_intelligence_v3_gateway(text,integer,text,text)','EXECUTE')")" = "t"
          test "$(psql "$DB_URL" -X -qAt -c "select has_function_privilege('anon','public.aos_paciente_360(text)','EXECUTE')")" = "f"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/rev-f6-4/tests/001_sales_intelligence_3.sql
      - name: Stop isolated Supabase
        if: always()
        working-directory: ci/zero-cost-staging
        run: supabase stop --no-backup || true
