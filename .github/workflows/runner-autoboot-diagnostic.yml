name: ASCENDA Runner Autoboot Diagnostic

on:
  push:
    branches: ['infra/runner-autoboot-diagnostic-20260901']
    paths:
      - '.github/workflows/runner-autoboot-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-autoboot-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    name: Diagnose runner boot/service state
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Host and service diagnostics
        shell: bash
        run: |
          set -u
          echo '=== IDENTITY ==='
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "user=$(id -un)"
          echo "home=$HOME"
          echo "hostname=$(hostname)"
          echo "kernel=$(uname -srmo)"
          echo "pid1=$(ps -p 1 -o comm= 2>/dev/null || true)"

          echo '=== VIRTUALIZATION ==='
          if grep -qi microsoft /proc/version 2>/dev/null; then echo 'wsl_detected=yes'; else echo 'wsl_detected=no'; fi
          echo "virt=$(systemd-detect-virt 2>/dev/null || echo unknown)"
          echo "wsl_distro_name=${WSL_DISTRO_NAME:-unknown}"
          echo "wsl_interop_env=${WSL_INTEROP:+present}"
          echo "wslinterop_binfmt=$(test -e /proc/sys/fs/binfmt_misc/WSLInterop && echo present || echo missing)"
          echo "powershell_interop=$(command -v powershell.exe >/dev/null 2>&1 && echo yes || echo no)"
          echo "cmd_interop=$(command -v cmd.exe >/dev/null 2>&1 && echo yes || echo no)"
          echo "windows_powershell_file=$(test -f /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe && echo yes || echo no)"
          echo "windows_schtasks_file=$(test -f /mnt/c/Windows/System32/schtasks.exe && echo yes || echo no)"
          echo 'wsl_conf_begin'
          cat /etc/wsl.conf 2>/dev/null || true
          echo 'wsl_conf_end'

          echo '=== SYSTEMD ==='
          echo "system_state=$(systemctl is-system-running 2>/dev/null || true)"
          echo 'runner_unit_files_begin'
          systemctl list-unit-files 'actions.runner*' --no-pager 2>/dev/null || true
          echo 'runner_unit_files_end'
          echo 'runner_units_begin'
          systemctl list-units 'actions.runner*' --all --no-pager 2>/dev/null || true
          echo 'runner_units_end'

          echo '=== RUNNER INSTALL ==='
          for d in "$HOME/actions-runner/actions-runner" "$HOME/actions-runner" /home/ascenda-runner/actions-runner/actions-runner /home/ascenda-runner/actions-runner; do
            if [ -d "$d" ]; then
              echo "runner_dir=$d"
              test -x "$d/svc.sh" && echo 'svc_sh=yes' || echo 'svc_sh=no'
              test -x "$d/run.sh" && echo 'run_sh=yes' || echo 'run_sh=no'
              if [ -x "$d/svc.sh" ]; then
                (cd "$d" && ./svc.sh status) || true
              fi
            fi
          done
          echo 'runner_processes_begin'
          ps -eo pid,ppid,user,args | grep -E 'Runner.Listener|Runner.Worker|runsvc.sh|run.sh' | grep -v grep || true
          echo 'runner_processes_end'
          echo 'runner_ancestry_begin'
          p=$(pgrep -u "$(id -u)" -f 'Runner.Listener run' | head -1 || true)
          for i in 1 2 3 4 5 6; do
            [ -n "$p" ] || break
            ps -o pid=,ppid=,user=,args= -p "$p" 2>/dev/null || true
            p=$(ps -o ppid= -p "$p" 2>/dev/null | tr -d ' ' || true)
          done
          echo 'runner_ancestry_end'

          echo '=== PRIVILEGE / DEPENDENCIES ==='
          if sudo -n true 2>/dev/null; then echo 'passwordless_sudo=yes'; else echo 'passwordless_sudo=no'; fi
          echo "docker_active=$(systemctl is-active docker 2>/dev/null || true)"
          echo "docker_enabled=$(systemctl is-enabled docker 2>/dev/null || true)"
          echo "docker_cli=$(command -v docker >/dev/null 2>&1 && echo yes || echo no)"
          echo "docker_access=$(docker info >/dev/null 2>&1 && echo yes || echo no)"

          echo '=== NON-ROOT AUTOBOOT OPTIONS ==='
          echo "crontab_cli=$(command -v crontab >/dev/null 2>&1 && echo yes || echo no)"
          echo "cron_active=$(systemctl is-active cron 2>/dev/null || true)"
          echo "cron_enabled=$(systemctl is-enabled cron 2>/dev/null || true)"
          echo 'user_crontab_begin'
          crontab -l 2>/dev/null || true
          echo 'user_crontab_end'
          echo "user_systemd=$(systemctl --user is-system-running 2>/dev/null || true)"
          echo 'user_runner_units_begin'
          systemctl --user list-unit-files 'ascenda*' --no-pager 2>/dev/null || true
          echo 'user_runner_units_end'

          echo '=== USER LINGER ==='
          loginctl show-user "$(id -un)" -p Linger 2>/dev/null || true

          echo 'RUNNER_AUTOBOOT_DIAGNOSTIC_COMPLETE'
