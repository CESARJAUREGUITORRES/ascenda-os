name: F16 Certified Cleanup Materialize

on:
  push:
    branches:
      - release/f16-certified-cleanup-20260815
    paths:
      - '.github/workflows/f16-certified-cleanup-materialize.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Zero-Cost runner health
        run: |
          set -euo pipefail
          python3 scripts/ci/enforce-zero-cost-policy.py
          bash scripts/ci/runner-healthcheck.sh
      - name: Remove certified canary and diagnostic surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'cleanup anchor missing: {path}: {old[:80]!r}')
              p.write_text(s.replace(old, new, 1))

          replace_once('app/server-f4.js', "const {createLiveCanary}=require('./f16-live-canary');\n", '')
          replace_once('app/server-f4.js', "const F16_LIVE_CANARY=createLiveCanary();\n", '')
          replace_once('app/server-f4.js', "  if(pathname==='/api/f16-live-canary'){F16_LIVE_CANARY.handleCanary(req,res);return;}\n", '')
          replace_once('app/server-f4.js', "  if(pathname==='/api/f16-live-canary-replay'){F16_LIVE_CANARY.handleReplay(req,res);return;}\n", '')

          replace_once('app/server.js', "const { createLiveCanary } = require('./f16-live-canary')\n", '')
          replace_once('app/server.js', "const F16_LIVE_CANARY = createLiveCanary()\n", '')
          replace_once('app/server.js', "  if (p === '/api/f16-live-canary') return F16_LIVE_CANARY.handleCanary(req, res)\n", '')
          replace_once('app/server.js', "  if (p === '/api/f16-live-canary-replay') return F16_LIVE_CANARY.handleReplay(req, res)\n", '')

          replace_once('app/email-gateway.js', "const { createLiveCanary } = require('./f16-live-canary')\n", '')
          replace_once('app/email-gateway.js', "const F16_LIVE_CANARY = createLiveCanary()\n", '')
          block = """      var liveCanary = await F16_LIVE_CANARY.handleSignedWebhookCanary({
        messageId: messageId,
        eventType: eventType,
        eventId: verified.eventId,
        timestamp: String(req.headers['svix-timestamp'] || ''),
        signature: String(req.headers['svix-signature'] || ''),
        rawBody: raw.toString('utf8')
      })
      if (liveCanary && liveCanary.handled) return jsonResponse(res, liveCanary.status || 200, liveCanary.body || { ok: true, canary: true })
"""
          replace_once('app/email-gateway.js', block, '')

          for path in [
              'app/f16-live-canary.js',
              '.github/workflows/f16-live-canary-certify.yml',
              'supabase/migrations/20260815223500_cia_phase16_live_canary_evidence_temp.sql',
              '.github/workflows/f16-certified-cleanup-materialize.yml'
          ]:
              p = Path(path)
              if p.exists():
                  p.unlink()
          PY
      - name: Expose runner Node
        run: bash scripts/ci/expose-runner-node.sh
      - name: Certify post-cleanup runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check app/server-f4.js
          node --check app/server.js
          node --check app/email-gateway.js
          node ci/phase16/test_email_gateway.js
          ! grep -R "f16-live-canary\|F16_LIVE_CANARY\|INSPECT_RESEND_WEBHOOK_CONFIG\|INSPECT_RESEND_CANARY_EMAIL_STATE" app --include='*.js'
          grep -F "/api/email-gateway" app/server-f4.js
          grep -F "/api/resend-webhook" app/server-f4.js
          grep -F "verifySvixSignature" app/email-gateway.js
          grep -F "aos_cia_email_ingest_provider_event_v2" app/email-gateway.js
          test ! -e app/f16-live-canary.js
          test ! -e .github/workflows/f16-live-canary-certify.yml
          test ! -e supabase/migrations/20260815223500_cia_phase16_live_canary_evidence_temp.sql
          echo 'F16_CERTIFIED_CLEANUP=PASS'
      - name: Commit certified cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'cleanup(f16): retire certified canary diagnostics'
          git push origin HEAD:release/f16-certified-cleanup-20260815
