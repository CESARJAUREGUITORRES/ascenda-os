name: ASCENDA WA-4 AI Sales Router

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/server-wa4.js'
      - 'app/ai-router.js'
      - 'app/wa4-copilot.js'
      - 'app/legacy-groq-model-hook.js'
      - 'app/railway.json'
      - 'supabase/migrations/*wa4_ai_sales_router*'
      - 'supabase/migrations/*groq_gpt_oss_model_refresh*'
      - 'supabase/migrations/*integration_secret_boundary*'
      - 'supabase/rollbacks/*wa4_ai_sales_router*'
      - 'supabase/rollbacks/*groq_gpt_oss_model_refresh*'
      - 'supabase/rollbacks/*integration_secret_boundary*'
      - 'ci/wa4-ai-sales-router/**'
      - 'ci/wa3-boxes-routing-handoff/ui_contract.py'
      - 'ci/wa2-conversation-live-inbox/ui_contract.py'
      - 'ci/phase4-revenue/ui_contract.py'
      - 'ci/phase4-revenue/ui_contract.js'
      - 'ci/phase2-cartera/ui_contract.py'
      - 'docs/control/WHATSAPP_REVENUE_HUB_WA4_*'
      - '.github/workflows/wa4-ai-sales-router.yml'
  push:
    branches: ['feature/wa4-ai-sales-router']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wa4-ai-sales-router-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: WA-4 Zero-Cost AI router certification
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 40
    env:
      DB_URL: postgresql://postgres:postgres@127.0.0.1:59832/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Enforce Zero-Cost runner policy
        run: |
          set -euo pipefail
          test "${{ runner.environment }}" = "self-hosted"
          python3 scripts/ci/enforce-zero-cost-policy.py

      - name: Runtime, model and cross-workstream contracts
        run: |
          set -euo pipefail
          node --check app/server-wa4.js
          node --check app/ai-router.js
          node --check app/wa4-copilot.js
          node --check app/legacy-groq-model-hook.js
          node --check app/server-wa3.js
          node --test ci/wa4-ai-sales-router/ai-router.test.js
          python3 ci/wa4-ai-sales-router/ui_contract.py
          python3 ci/wa3-boxes-routing-handoff/ui_contract.py
          python3 ci/wa2-conversation-live-inbox/ui_contract.py
          python3 ci/phase4-revenue/ui_contract.py
          node ci/phase4-revenue/ui_contract.js
          python3 ci/phase2-cartera/ui_contract.py

      - name: Source safety invariants
        run: |
          set -euo pipefail
          grep -q "openai/gpt-oss-20b" app/ai-router.js
          grep -q "openai/gpt-oss-120b" app/ai-router.js
          grep -q "openai/gpt-oss-safeguard-20b" app/ai-router.js
          grep -q "aos_wa4_authorize_copilot_v1" app/server-wa4.js
          grep -Eq "auto_send:[[:space:]]*false" app/server-wa4.js
          grep -q "ASCENDA_GROQ_COMPAT" app/server-wa4.js
          grep -q "\['server-wa3.js'\]" app/server-wa4.js
          ! grep -q "graph.facebook.com" app/server-wa4.js
          ! grep -q "WHATSAPP_ACCESS_TOKEN" app/server-wa4.js
          ! grep -Eq "(SUPABASE_SERVICE_ROLE_KEY|api_key)\s*=\s*['\"][^'\"]{20,}['\"]" app/server-wa4.js app/ai-router.js app/legacy-groq-model-hook.js
          ! grep -Eq "llama-3\.(1|3)" supabase/migrations/20260815203000_wa4_ai_sales_router_v1.sql
          ! grep -Eq "llama-3\.(1|3)" supabase/rollbacks/20260815204500_groq_gpt_oss_model_refresh.rollback.sql

      - name: Configure isolated Supabase ports
        working-directory: ci/zero-cost-staging
        run: |
          set -euo pipefail
          sed -i 's/project_id = "ascenda-zero-cost-staging"/project_id = "ascenda-wa4-ai-router"/' supabase/config.toml
          sed -i 's/port = 54321/port = 59831/' supabase/config.toml
          sed -i 's/port = 54322/port = 59832/' supabase/config.toml
          sed -i 's/shadow_port = 54320/shadow_port = 59830/' supabase/config.toml

      - name: Start isolated Supabase
        working-directory: ci/zero-cost-staging
        run: |
          set -euo pipefail
          supabase stop --no-backup || true
          docker ps -aq --filter 'name=ascenda-wa4-ai-router' | xargs -r docker rm -f || true
          rm -rf supabase/.temp supabase/.branches
          supabase db start
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 59832 -U postgres >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo 'WA-4 isolated Postgres did not become ready' >&2
          exit 1

      - name: Build synthetic WA prerequisite schema
        run: psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/wa3-boxes-routing-handoff/schema_contract.sql

      - name: Apply exact WA-1 through WA-4 migrations
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260815160000_wa1_secure_gateway_v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260815175500_wa2_conversation_live_inbox_v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260815190500_wa3_boxes_routing_handoff_v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260815203000_wa4_ai_sales_router_v1.sql

      - name: Database lint
        working-directory: ci/zero-cost-staging
        run: supabase db lint --local --schema public --level error

      - name: pgTAP AI ownership budget and audit contracts
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/wa4-ai-sales-router/tests/001_wa4_ai.sql | tee /tmp/wa4-pgtap.txt
          ! grep -q 'not ok' /tmp/wa4-pgtap.txt
          COUNT=$(grep -Ec '^[[:space:]]*ok [0-9]+' /tmp/wa4-pgtap.txt || true)
          echo "WA-4 pgTAP assertions: $COUNT"
          test "$COUNT" -ge 30

      - name: Model refresh and integration-secret boundary
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          create table if not exists public.aos_agentes(id text primary key,nombre text,modelo text,activo boolean default true);
          create table if not exists public.aos_integraciones(
            id uuid primary key default gen_random_uuid(),tipo text not null,nombre text not null,estado text,
            api_key text default '',api_secret text default '',config jsonb default '{}'::jsonb,updated_at timestamptz default now()
          );
          alter table public.aos_integraciones enable row level security;
          grant all on public.aos_integraciones to anon,authenticated,service_role;
          drop policy if exists anon_integ_read_non_auth_provider on public.aos_integraciones;
          drop policy if exists anon_integ_write_non_auth_provider on public.aos_integraciones;
          create policy anon_integ_read_non_auth_provider on public.aos_integraciones for select to anon using (true);
          create policy anon_integ_write_non_auth_provider on public.aos_integraciones for all to anon using (true) with check (true);
          insert into public.aos_agentes(id,nombre,modelo) values
            ('analista','Sofia','llama-3.3-70b-versatile'),('analista_mkt','Valentina','llama-3.3-70b-versatile'),
            ('clasificador','Nico','llama-3.3-70b-versatile'),('kronia','KronIA','llama-3.3-70b-versatile'),
            ('planificador','Marco','llama-3.3-70b-versatile'),('recepcion','Maya','llama-3.3-70b-versatile'),
            ('resumidor','Luna','llama-3.3-70b-versatile') on conflict(id) do update set modelo=excluded.modelo;
          insert into public.aos_integraciones(tipo,nombre,estado,api_key) values
            ('groq','Groq (Llama)','conectado','synthetic-groq-key'),
            ('gemini','Google Gemini','conectado','synthetic-gemini-key'),
            ('resend','Email Marketing','conectado','synthetic-resend-key');
          SQL
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260815204500_groq_gpt_oss_model_refresh.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260815205000_integration_secret_boundary_v1.sql
          test "$(psql "$DB_URL" -X -qAt -c "select count(*) from public.aos_agentes where modelo in ('llama-3.1-8b-instant','llama-3.3-70b-versatile')")" = "0"
          test "$(psql "$DB_URL" -X -qAt -c "select count(*) from public.aos_agentes where id in ('clasificador','resumidor','recepcion') and modelo='openai/gpt-oss-20b'")" = "3"
          test "$(psql "$DB_URL" -X -qAt -c "select count(*) from public.aos_agentes where id in ('analista','analista_mkt','kronia','planificador') and modelo='openai/gpt-oss-120b'")" = "4"
          test "$(psql "$DB_URL" -X -qAt -c "select count(*) from public.aos_integraciones where coalesce(api_key,'')<>'' or coalesce(api_secret,'')<>''")" = "0"
          test "$(psql "$DB_URL" -X -qAt -c "select count(*) from public.aos_integration_secrets_v1 where coalesce(api_key,'')<>''")" = "3"
          test "$(psql "$DB_URL" -X -qAt -c "select relforcerowsecurity from pg_class where oid='public.aos_integration_secrets_v1'::regclass")" = "t"
          test "$(psql "$DB_URL" -X -qAt -c "select has_table_privilege('anon','public.aos_integration_secrets_v1','SELECT')")" = "f"
          test "$(psql "$DB_URL" -X -qAt -c "select count(*) from pg_policies where schemaname='public' and tablename='aos_integraciones' and policyname='anon_integ_read_non_auth_provider'")" = "0"

      - name: Recovery stays fail-closed and preserves WA-3 evidence
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/rollbacks/20260815203000_wa4_ai_sales_router_v1.rollback.sql
          test "$(psql "$DB_URL" -X -qAt -c "select copilot_enabled=false and auto_reply_enabled=false from public.aos_wa_ai_control_v1 where id=1")" = "t"
          test "$(psql "$DB_URL" -X -qAt -c "select to_regprocedure('public.aos_wa4_authorize_copilot_v1(text,uuid)') is null")" = "t"
          test "$(psql "$DB_URL" -X -qAt -c "select to_regclass('public.aos_wa_ai_runs_v1') is not null")" = "t"
          test "$(psql "$DB_URL" -X -qAt -c "select relforcerowsecurity from pg_class where oid='public.aos_wa_ai_runs_v1'::regclass")" = "t"
          test "$(psql "$DB_URL" -X -qAt -c "select count(*) from pg_trigger where tgname='trg_aos_wa4_ai_run_append_guard_v1' and not tgisinternal")" = "1"
          test "$(psql "$DB_URL" -X -qAt -c "select to_regclass('public.aos_wa_assignments_v1') is not null")" = "t"
          test "$(psql "$DB_URL" -X -qAt -c "select count(*) from pg_trigger where tgname='trg_aos_wa3_auto_route_new_conversation_v1' and not tgisinternal")" = "1"

      - name: Stop isolated Supabase
        if: always()
        working-directory: ci/zero-cost-staging
        run: supabase stop --no-backup || true
