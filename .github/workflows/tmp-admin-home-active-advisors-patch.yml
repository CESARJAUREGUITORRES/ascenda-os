name: TEMP Admin Home active advisors patch

on:
  push:
    branches:
      - fix/admin-home-active-advisors-20260821
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 5
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/admin-home-active-advisors-20260821
          fetch-depth: 0

      - name: Replace hardcoded advisor roster
        shell: powershell
        run: |
          $paths = @('app/public/admin-home.html','src/admin-home.html')
          $old = "var todos=['WILMER','RUVILA','MIREYA','SRA CARMEN'],map={};`n      (sem||[]).forEach(function(s){map[s.asesor]=s;});"
          $new = "var map={};`n      (sem||[]).forEach(function(s){if(s&&s.asesor)map[s.asesor]=s;});`n      /* Dynamic operational roster: render only advisors with real activity in the selected period. */`n      var todos=(sem||[]).filter(function(s){return s&&s.asesor&&parseInt(s.llamadas||0)>0;}).map(function(s){return s.asesor;});`n      todos=todos.filter(function(n,i,a){return a.indexOf(n)===i;});"
          foreach ($p in $paths) {
            $text = [System.IO.File]::ReadAllText($p)
            if (-not $text.Contains($old)) { throw "${p}: hardcoded roster not found" }
            $text = $text.Replace($old,$new)
            [System.IO.File]::WriteAllText($p,$text,[System.Text.UTF8Encoding]::new($false))
            Write-Host "Patched $p"
          }
          foreach ($p in $paths) {
            $text = [System.IO.File]::ReadAllText($p)
            if ($text.Contains("var todos=['WILMER','RUVILA','MIREYA','SRA CARMEN']")) { throw "${p}: stale hardcode remains" }
            if (-not $text.Contains('Dynamic operational roster')) { throw "${p}: dynamic roster guard missing" }
          }

      - name: Commit patched runtime and source mirror
        shell: powershell
        run: |
          git config user.name "ascenda-automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/public/admin-home.html src/admin-home.html
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'No patch required'; exit 0 }
          git commit -m "ADMIN-HOME: derive call monitor roster from real activity"
          git push origin HEAD:fix/admin-home-active-advisors-20260821
