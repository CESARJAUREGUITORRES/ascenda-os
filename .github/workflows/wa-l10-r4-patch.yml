name: WA-L10 R4 continuity patch

on:
  push:
    branches:
      - wa-l10-r4-continuity-presentation-fix-20260905
    paths:
      - .github/workflows/wa-l10-r4-patch.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wa-l10-r4-continuity-presentation-fix-20260905
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply R4 scoped continuity patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/wa4-copilot.js')
          s=p.read_text()
          def once(old,new,label):
              global s
              if new in s:
                  return
              if old not in s:
                  raise SystemExit('PATCH_ANCHOR_MISSING:'+label)
              s=s.replace(old,new,1)

          quality="const qualityGuard = require('./wa4-response-quality-guard');\n"
          constants="""const qualityGuard = require('./wa4-response-quality-guard');

          const APPROVED_FIRST_CONTACT_COPY = 'Hablas con el asistente de WhatsApp de Zi Vital. Brindamos embellecimiento facial y corporal, tratamientos que ayudan a sentirte mejor y verte mejor. ¿En qué podemos ayudarte hoy?';
          const APPROVED_FIRST_CONTACT_PREFIX = 'Hablas con el asistente de WhatsApp de Zi Vital. Brindamos embellecimiento facial y corporal, tratamientos que ayudan a sentirte mejor y verte mejor.';
          """
          once(quality,constants,'brand-constants')

          s=s.replace(
            "Si PLAYBOOK exige humano, respétalo. Escribe español natural de WhatsApp: breve, profesional, cálido, pocos emojis funcionales y máximo una pregunta útil al final cuando corresponda.",
            "Si PLAYBOOK exige humano, respétalo. La capa de salida agrega de forma determinística la presentación inicial aprobada cuando corresponde; no la dupliques. Escribe español natural de WhatsApp: breve, profesional, cálido, pocos emojis funcionales y máximo una pregunta útil al final cuando corresponda. No uses Markdown con doble asterisco; usa texto plano o formato WhatsApp simple."
          )
          s=s.replace(
            "const SAFETY_POLICY = `Evalúa TURNO SEMÁNTICO DEL CLIENTE + RESPUESTA PROPUESTA contra política ASCENDA, hechos PUBLIC_CLIENT y ADAPTER_CONTEXTS permitidos.",
            "const SAFETY_POLICY = `Evalúa TURNO SEMÁNTICO DEL CLIENTE + RESPUESTA PROPUESTA contra política ASCENDA, hechos PUBLIC_CLIENT y ADAPTER_CONTEXTS permitidos. APPROVED_BRAND_COPY es texto fijo aprobado por el owner para la presentación inicial de Zi Vital y no requiere evidencia de catálogo."
          )
          s=s.replace(
            "Permite información pública aprobada, CTA, pasos de booking gobernados y derivación humana.",
            "Permite información pública aprobada, CTA, pasos de booking gobernados, APPROVED_BRAND_COPY y derivación humana."
          )

          hist="function history(ms,max){ return ms.slice(-max).map(m=>({role:String(m.direction||'').toUpperCase().includes('IN')?'user':'assistant',content:ai.redactPII(String(m.message_body||'').slice(0,1800))})).filter(m=>m.content.trim()); }\n"
          helpers=hist+"""function normalizeText(v){return String(v||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase().replace(/\\s+/g,' ').trim();}
          function renderWhatsAppText(value){
            return String(value||'').trim()
              .replace(/\\*\\*([^*\\n]+)\\*\\*/g,'*$1*')
              .replace(/__([^_\\n]+)__/g,'_$1_')
              .replace(/^#{1,6}\\s+/gm,'')
              .trim();
          }
          function isGreetingOnly(inbound){
            const t=normalizeText(inbound).replace(/[^\\p{L}\\p{N}\\s]/gu,' ').replace(/\\s+/g,' ').trim();
            return /^(hola|buenas|buenos dias|buenas tardes|buenas noches|hello|hi|ola)$/.test(t);
          }
          function hasApprovedIntro(messages){
            const marker=normalizeText('Hablas con el asistente de WhatsApp de Zi Vital');
            return (Array.isArray(messages)?messages:[]).some(m=>
              String(m&&m.direction||'').toUpperCase().includes('OUT') &&
              normalizeText(m&&m.message_body).includes(marker)
            );
          }
          function stripLeadingGreeting(value){
            return String(value||'').replace(/^\\s*(?:¡?\\s*hola\\s*[!¡.,:]?\\s*)+/i,'').trim();
          }
          function composePatientReply(reply,messages,inbound){
            const formatted=renderWhatsAppText(reply);
            if(hasApprovedIntro(messages))return stripLeadingGreeting(formatted).slice(0,900);
            if(isGreetingOnly(inbound))return APPROVED_FIRST_CONTACT_COPY;
            const body=stripLeadingGreeting(formatted);
            return (APPROVED_FIRST_CONTACT_PREFIX+(body?'\\n\\n'+body:'')).slice(0,900);
          }
          """
          once(hist,helpers,'reply-helpers')

          qc="""function qualityCheck(reply,runtime,contexts,inbound,publicBundle){
            return qualityGuard.validate({reply,runtime:runtimeSummary(runtime),contexts,inbound,approved_public_knowledge:publicBundle});
          }
          """
          fallback=qc+"""function moneyLabel(currency,value){
            const n=Number(value);
            if(!Number.isFinite(n))return null;
            const amount=Number.isInteger(n)?String(n):n.toFixed(2);
            return String(currency||'').toUpperCase()==='USD'?'USD '+amount:'S/ '+amount;
          }
          function deterministicNoPromotionDraft(playbook,publicBundle,processContexts,inbound){
            const reason=String(playbook&&playbook.policy_escalation&&playbook.policy_escalation.reason||'');
            if(reason!=='NO_READY_PROMOTION_EVIDENCE')return null;
            const zoneMatch=normalizeText(inbound).match(/\\b([1-9])\\s+zonas?\\b/);
            if(!zoneMatch)return null;
            const wanted=zoneMatch[1]+' zona';
            const wantsToxin=/\\b(toxina|botox|botulinica)\\b/.test(normalizeText(inbound));
            const ctx=new Map((Array.isArray(processContexts)?processContexts:[]).filter(x=>x&&x.entity_id).map(x=>[String(x.entity_id),x]));
            const options=[];
            for(const item of (publicBundle&&Array.isArray(publicBundle.items)?publicBundle.items:[])){
              const id=playbooks.catalogId(item),p=id?ctx.get(id):null;
              if(!id||!p||!normalizeText(p.entity_name||item.title).includes(wanted))continue;
              if(wantsToxin&&!normalizeText(p.category||(item.facts&&item.facts.categoria)).includes('toxina'))continue;
              const currency=String(p.moneda||'').toUpperCase();
              if(p.ready_for_quote!==true||String(p.price_state||'')!=='READY'||String(p.freshness_state||'')==='STALE_REVIEW'||!['PEN','USD'].includes(currency))continue;
              const price=p.quote_price!=null?p.quote_price:(p.precio_oferta!=null?p.precio_oferta:p.precio_base);
              const label=moneyLabel(currency,price);
              if(!label)continue;
              options.push({knowledge_id:String(item.knowledge_id),name:String(p.entity_name||item.title||'').trim(),price:label});
              if(options.length>=2)break;
            }
            if(!options.length)return null;
            const list=options.map(o=>o.name+': '+o.price).join('; ');
            return {
              reply:'No tengo una promoción vigente confirmada en el sistema para esa consulta. Como precio regular, tengo estas opciones confirmadas: '+list+'. Si deseas, puedo seguir contigo para avanzar con la cita.',
              intent:'PROMO',next_action:'REPLY',confidence:1,cited_knowledge_ids:options.map(o=>o.knowledge_id),needs_human:false,
              reason:'Ausencia de promoción READY; continuidad con precio regular gobernado.'
            };
          }
          """
          once(qc,fallback,'no-promo-helper')

          pbguard="      if(!pb||pb.status!=='READY'||String(pb.recommended_next_action||'').startsWith('HUMAN_')){\n"
          beforeguard="""      if(runtime.booking_readiness==='HIGH'){
                const bookingDraft=deterministicBookingDraft(bookingCtx,runtime);
                if(bookingDraft){
                  const patientReply=composePatientReply(bookingDraft.reply,messages,inbound);
                  const quality=qualityCheck(patientReply,runtime,contexts,inbound,governed.publicBundle);
                  const finalSuggestion=Object.assign({},bookingDraft,{reply:patientReply});
                  if(quality.ok){
                    return writeJson(res,200,{ok:true,playbook:pb,runtime:runtimeSummary(runtime),contexts,quality,suggestion:finalSuggestion,needs_human:bookingDraft.needs_human===true,next_action:bookingDraft.next_action,model:'DETERMINISTIC_BOOKING_GUARD',estimated_cost_usd:0,auto_send:false});
                  }
                }
              }

              const noPromoPriceBundle=gatePublicCatalogMoney(governed.publicBundle,governed.processContexts,'PRICE_QUOTE',runtime);
              const noPromoDraft=deterministicNoPromotionDraft(pb,noPromoPriceBundle,governed.processContexts,inbound);
              if(noPromoDraft){
                const grounded=knowledge.validateGroundedSuggestion(noPromoDraft,noPromoPriceBundle);
                if(grounded.ok){
                  const patientReply=composePatientReply(grounded.reply,messages,inbound);
                  const quality=qualityCheck(patientReply,runtime,contexts,inbound,noPromoPriceBundle);
                  if(quality.ok){
                    await log({conversation_id:id,actor_id:auth.actor_id,task:'SALES_PLAYBOOK',provider:'deterministic',model:'DETERMINISTIC_NO_PROMO_CONTINUITY',safety_model:null,outcome:'SUGGESTED',input_messages:messages.length,input_chars:inbound.length,output_chars:patientReply.length,prompt_tokens:0,completion_tokens:0,total_tokens:0,estimated_cost_usd:0,latency_ms:Date.now()-started,safety_action:'REPLY',safety_category:'NO_READY_PROMOTION_EVIDENCE'});
                    return writeJson(res,200,{ok:true,playbook:pb,runtime:runtimeSummary(runtime),contexts,quality,suggestion:Object.assign({},noPromoDraft,{reply:patientReply,cited_knowledge_ids:grounded.citations}),needs_human:false,next_action:'REPLY',model:'DETERMINISTIC_NO_PROMO_CONTINUITY',estimated_cost_usd:0,auto_send:false});
                  }
                }
              }

          """+pbguard
          once(pbguard,beforeguard,'continuity-before-failclosed')

          safety_marker="      const safety=await resilience.chat"
          if "const patientReply=composePatientReply(valid.reply,messages,inbound);" not in s:
              if safety_marker not in s: raise SystemExit('PATCH_ANCHOR_MISSING:patient-reply')
              s=s.replace(safety_marker,"      const patientReply=composePatientReply(valid.reply,messages,inbound);\n"+safety_marker,1)
          s=s.replace('proposed_reply:valid.reply,approved_public_knowledge:promptKnowledge','proposed_reply:patientReply,approved_brand_copy:APPROVED_FIRST_CONTACT_COPY,approved_public_knowledge:promptKnowledge')
          s=s.replace('output_chars:valid.reply.length','output_chars:patientReply.length')
          s=s.replace('qualityCheck(valid.reply,runtime,contexts,inbound,governed.publicBundle)','qualityCheck(patientReply,runtime,contexts,inbound,governed.publicBundle)')
          s=s.replace('reply:valid.reply,next_action:finalAction','reply:patientReply,next_action:finalAction')

          oldexp="module.exports={createCopilot,buildGovernedContext,gatePublicCatalogMoney,adapterSummary,deterministicBookingDraft,qualityCheck,SALES_SCHEMA,SAFETY_SCHEMA};"
          newexp="module.exports={createCopilot,buildGovernedContext,gatePublicCatalogMoney,adapterSummary,deterministicBookingDraft,deterministicNoPromotionDraft,qualityCheck,renderWhatsAppText,composePatientReply,hasApprovedIntro,isGreetingOnly,APPROVED_FIRST_CONTACT_COPY,APPROVED_FIRST_CONTACT_PREFIX,SALES_SCHEMA,SAFETY_SCHEMA};"
          once(oldexp,newexp,'exports')
          p.write_text(s)

          test_path=Path('ci/wa4-ai-sales-router/r4-continuity-presentation.test.js')
          test_path.write_text(r'''\
          'use strict';
          const test=require('node:test');
          const assert=require('node:assert/strict');
          const copilot=require('../../app/wa4-copilot');
          const knowledge=require('../../app/wa4-knowledge');
          const quality=require('../../app/wa4-response-quality-guard');

          const NABOTA='11111111-1111-4111-8111-111111111111';
          const HUTOX='22222222-2222-4222-8222-222222222222';
          function item(id,name){return {knowledge_id:'service:'+id,domain:'CATALOG',title:name,facts:{tipo:'SERVICIO',nombre:name,categoria:'TOXINA',descripcion_comercial:'Opción gobernada de toxina.'},authority_tier:10,freshness_state:'FRESH',conflict_state:'CLEAR',retrieval_state:'READY',evidence_ref:{relation:'public.aos_catalogo_servicios',pk:id,version:'v1'}};}
          function ctx(id,name,price,ready=true){return {entity_id:id,entity_type:'SERVICIO',entity_name:name,category:'TOXINA',quote_price:price,precio_base:price,precio_oferta:price,moneda:'PEN',price_state:ready?'READY':'REVIEW_REQUIRED',freshness_state:'FRESH',ready_for_quote:ready,price_evidence_ref:'aos_catalogo_servicios:'+id+':PEN:v1'};}
          function bundle(){return {version:'TEST',audience:'PUBLIC_CLIENT',authority:'GOVERNED_SOURCE_ONLY',generic_llm_authority:false,items:[item(NABOTA,'NABOTA 3 ZONAS 50U'),item(HUTOX,'HUTOX 3 ZONAS 50U')]};}
          const pb={status:'FAIL_CLOSED',commercial_stage:'PROMOTION',recommended_next_action:'HUMAN_COMMERCIAL',policy_escalation:{required:true,reason:'NO_READY_PROMOTION_EVIDENCE'}};

          test('R4 WhatsApp renderer converts double-markdown and headings to WhatsApp-safe text',()=>{const out=copilot.renderWhatsAppText('## Precio\\nEl valor es **S/ 399** y __vigente__.');assert.equal(out,'Precio\\nEl valor es *S/ 399* y _vigente_.');assert.equal(out.includes('**'),false);});
          test('R4 greeting-only first contact uses the exact owner-approved presentation',()=>{assert.equal(copilot.composePatientReply('Hola, ¿en qué te ayudo?',[],'Hola'),copilot.APPROVED_FIRST_CONTACT_COPY);});
          test('R4 substantive first contact prepends approved brand copy without adding a second generic question',()=>{const out=copilot.composePatientReply('Hola! Nabota 1 zona cuesta **S/ 399**. ¿Quieres avanzar con una cita?',[],'Quiero precio de toxina');assert.ok(out.startsWith(copilot.APPROVED_FIRST_CONTACT_PREFIX+'\\n\\n'));assert.equal((out.match(/\\?/g)||[]).length,1);assert.equal(out.includes('**'),false);assert.ok(out.includes('*S/ 399*'));});
          test('R4 approved presentation is not duplicated after it already appeared outbound',()=>{const messages=[{direction:'OUTBOUND',message_body:copilot.APPROVED_FIRST_CONTACT_COPY}];const out=copilot.composePatientReply('Hola! Claro, seguimos con tu consulta.',messages,'Otra pregunta');assert.equal(out,'Claro, seguimos con tu consulta.');assert.equal(out.includes(copilot.APPROVED_FIRST_CONTACT_PREFIX),false);});
          test('R4 no-promo continuity answers governed regular prices for an explicit 3-zone request instead of human handoff',()=>{const contexts=[ctx(NABOTA,'NABOTA 3 ZONAS 50U',999),ctx(HUTOX,'HUTOX 3 ZONAS 50U',799)];const priced=copilot.gatePublicCatalogMoney(bundle(),contexts,'PRICE_QUOTE',{intents:[]});const draft=copilot.deterministicNoPromotionDraft(pb,priced,contexts,'y si quiero 3 zonas de toxina? hay alguna promocion?');assert.ok(draft);assert.equal(draft.needs_human,false);assert.equal(draft.next_action,'REPLY');assert.deepEqual(draft.cited_knowledge_ids,['service:'+NABOTA,'service:'+HUTOX]);assert.match(draft.reply,/No tengo una promoción vigente confirmada/i);assert.match(draft.reply,/S\\/ 999/);assert.match(draft.reply,/S\\/ 799/);const grounded=knowledge.validateGroundedSuggestion(draft,priced);assert.equal(grounded.ok,true);const q=quality.validate({reply:draft.reply,runtime:{intents:['PROMOTION_REQUEST'],state:{}},contexts:{booking:{}},inbound:'y si quiero 3 zonas de toxina? hay alguna promocion?',approved_public_knowledge:priced});assert.equal(q.ok,true,q.violations.join(','));});
          test('R4 booking deterministic branch is evaluated before generic playbook fail-closed',()=>{const fs=require('node:fs');const src=fs.readFileSync(require.resolve('../../app/wa4-copilot'),'utf8');assert.ok(src.indexOf("if(runtime.booking_readiness==='HIGH')")<src.indexOf("if(!pb||pb.status!=='READY'"));});
          test('R4 no-promo continuity stays fail-closed without explicit zone count or READY regular price',()=>{const contexts=[ctx(NABOTA,'NABOTA 3 ZONAS 50U',999,false),ctx(HUTOX,'HUTOX 3 ZONAS 50U',799,false)];const priced=copilot.gatePublicCatalogMoney(bundle(),contexts,'PRICE_QUOTE',{intents:[]});assert.equal(copilot.deterministicNoPromotionDraft(pb,priced,contexts,'hay alguna promoción?'),null);assert.equal(copilot.deterministicNoPromotionDraft(pb,priced,contexts,'quiero 3 zonas, hay promoción?'),null);});
          ''')

          ai_test=Path('ci/wa4-ai-sales-router/ai-router.test.js')
          a=ai_test.read_text()
          req="require('./r4-continuity-presentation.test.js');\n"
          if req not in a:
              a=a.rstrip()+"\n"+req
              ai_test.write_text(a)
          PY
      - name: R4 syntax and focal tests
        run: |
          node --check app/wa4-copilot.js
          node --test ci/wa4-ai-sales-router/r4-continuity-presentation.test.js
          node --test ci/wa4-ai-sales-router/ai-router.test.js
      - name: Commit scoped patch
        shell: bash
        run: |
          git config user.name "ascenda-r4-bot"
          git config user.email "ascenda-r4-bot@users.noreply.github.com"
          git add app/wa4-copilot.js ci/wa4-ai-sales-router/r4-continuity-presentation.test.js ci/wa4-ai-sales-router/ai-router.test.js
          git diff --cached --check
          git commit -m "WA-L10 R4: preserve conversation continuity and approved presentation"
          git push origin HEAD:wa-l10-r4-continuity-presentation-fix-20260905
