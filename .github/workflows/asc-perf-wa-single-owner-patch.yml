name: ASC-PERF WA Single Owner Patch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/asc-perf-wa-single-owner-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/asc-perf-wa-single-owner-20260824
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply exact byte-safe WA ownership patch
        shell: powershell
        run: |
          @'
          const fs=require('fs');
          function replaceOne(path,oldText,newText){
            const src=fs.readFileSync(path),oldBuf=Buffer.from(oldText,'ascii'),newBuf=Buffer.from(newText,'ascii');
            const first=src.indexOf(oldBuf);
            if(first<0)throw new Error(path+': target not found: '+oldText.slice(0,90));
            if(src.indexOf(oldBuf,first+1)>=0)throw new Error(path+': target not unique: '+oldText.slice(0,90));
            const out=Buffer.concat([src.subarray(0,first),newBuf,src.subarray(first+oldBuf.length)]);
            fs.writeFileSync(path,out);
          }
          const p='app/public/wa-native-panel.js';
          replaceOne(p,
            "function refreshInbox(){return api('/api/wa3/inbox?limit=120').then(function(d){S.rows=d.rows||[];",
            "function publishInbox(){try{window.dispatchEvent(new CustomEvent('aos:wa3-inbox',{detail:{rows:S.rows.slice()}}));}catch(_){}}\nfunction refreshInbox(){return api('/api/wa3/inbox?limit=120').then(function(d){S.rows=d.rows||[];publishInbox();");
          replaceOne(p,
            "S.boot=xs[0];S.rows=xs[1].rows||[];if(S.selected)",
            "S.boot=xs[0];S.rows=xs[1].rows||[];publishInbox();if(S.selected)");
          replaceOne(p,
            "if(force||changed||S.heartbeatTick%3===0)return loadMessages();",
            "if(force||changed)return loadMessages();");
          replaceOne(p,
            "S.pollInbox=setInterval(function(){heartbeat(false);},1500);heartbeat(true);",
            "S.pollInbox=setInterval(function(){heartbeat(false);},2500);");
          replaceOne(p,
            "S.boot=xs[1];S.rows=xs[2].rows||[];renderList();",
            "S.boot=xs[1];S.rows=xs[2].rows||[];publishInbox();renderList();");
          replaceOne(p,
            "window.AOS_WA_NATIVE={mount:mount,unmount:unmount,api:api};",
            "window.AOS_WA_NATIVE={mount:mount,unmount:unmount,api:api,getInboxSnapshot:function(){return S.rows.slice();}};");

          const m='app/public/wa-multiagent-final-panel.js';
          replaceOne(m,
            "var X={mounted:false,actor:null,boot:null,queue:null,team:null,inbox:[],timer:null,busy:false,filter:'all',observer:null,toastObserver:null,fetchPatched:false,baseFetch:null,remounting:false,teamSeen:false,teamState:{}};",
            "var X={mounted:false,actor:null,boot:null,queue:null,team:null,inbox:[],timer:null,busy:false,filter:'all',observer:null,toastObserver:null,fetchPatched:false,baseFetch:null,remounting:false,teamSeen:false,teamState:{},inboxHandler:null};");
          replaceOne(m,
            "function refresh(){if(!X.mounted||X.busy)return Promise.resolve();X.busy=true;var jobs=[api('/api/wa3/queue-summary').then(function(d){X.queue=d;}),api('/api/wa3/inbox?limit=120').then(function(d){X.inbox=d.rows||[];})];",
            "function syncInbox(){if(window.AOS_WA_NATIVE&&typeof AOS_WA_NATIVE.getInboxSnapshot==='function')X.inbox=AOS_WA_NATIVE.getInboxSnapshot();}\nfunction refresh(){if(!X.mounted||X.busy||document.hidden)return Promise.resolve();X.busy=true;syncInbox();var jobs=[api('/api/wa3/queue-summary').then(function(d){X.queue=d;})];");
          replaceOne(m,
            "function mount(){css();X.mounted=true;X.teamSeen=false;X.teamState={};installOwnershipGuard();api('/api/wa3/bootstrap')",
            "function mount(){css();X.mounted=true;X.teamSeen=false;X.teamState={};installOwnershipGuard();syncInbox();if(X.inboxHandler)window.removeEventListener('aos:wa3-inbox',X.inboxHandler);X.inboxHandler=function(e){var rows=e&&e.detail&&Array.isArray(e.detail.rows)?e.detail.rows:null;X.inbox=rows?rows.slice():(window.AOS_WA_NATIVE&&typeof AOS_WA_NATIVE.getInboxSnapshot==='function'?AOS_WA_NATIVE.getInboxSnapshot():[]);if(X.mounted)render();};window.addEventListener('aos:wa3-inbox',X.inboxHandler);api('/api/wa3/bootstrap')");
          replaceOne(m,
            "function unmount(){X.mounted=false;if(X.timer)",
            "function unmount(){X.mounted=false;if(X.inboxHandler){window.removeEventListener('aos:wa3-inbox',X.inboxHandler);X.inboxHandler=null;}if(X.timer)");

          const c='ci/phase-s/wa_s11_live_sync_meta_auth_contract.js';
          replaceOne(c,
            "const sh=fs.readFileSync('app/public/wa-shell-integration.js','utf8');\nconst perf=fs.readFileSync('app/public/wa-performance-hardening.js','utf8');",
            "const sh=fs.readFileSync('app/public/wa-shell-integration.js','utf8');\nconst perf=fs.readFileSync('app/public/wa-performance-hardening.js','utf8');\nconst mf=fs.readFileSync('app/public/wa-multiagent-final-panel.js','utf8');");
          replaceOne(c,
            "ok(p.includes('1500'),'native live polling cadence missing');",
            "ok(p.includes('2500'),'native fallback polling must align with 2.5s server guidance');\nok(!p.includes('S.heartbeatTick%3===0'),'timeline must not refresh on idle third ticks');\nok(p.includes('getInboxSnapshot'),'native inbox snapshot accessor missing');\nok(p.includes('aos:wa3-inbox'),'native inbox event publication missing');\nok(!mf.includes(\"api('/api/wa3/inbox?limit=120')\"),'multiagent must not own inbox network reads');\nok(mf.includes('getInboxSnapshot'),'multiagent shared inbox snapshot consumer missing');\nok(mf.includes('aos:wa3-inbox'),'multiagent inbox event subscriber missing');\nok(mf.includes('document.hidden'),'multiagent hidden-page network guard missing');");
          '@ | node -
          node --check app/public/wa-native-panel.js
          node --check app/public/wa-multiagent-final-panel.js
          node --check ci/phase-s/wa_s11_live_sync_meta_auth_contract.js
          node ci/phase-s/wa_s11_live_sync_meta_auth_contract.js
      - name: Verify bounded diff and commit
        shell: powershell
        run: |
          git diff --numstat -- app/public/wa-native-panel.js app/public/wa-multiagent-final-panel.js ci/phase-s/wa_s11_live_sync_meta_auth_contract.js
          $names = @(git diff --name-only)
          $expected = @('app/public/wa-multiagent-final-panel.js','app/public/wa-native-panel.js','ci/phase-s/wa_s11_live_sync_meta_auth_contract.js')
          foreach($n in $names){ if($expected -notcontains $n){ throw "Unexpected patch file: $n" } }
          foreach($e in $expected){ if($names -notcontains $e){ throw "Expected patch file missing: $e" } }
          git config user.name 'ASCENDA PERF Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/public/wa-native-panel.js app/public/wa-multiagent-final-panel.js ci/phase-s/wa_s11_live_sync_meta_auth_contract.js
          git commit -m 'perf(wa): establish single inbox read owner'
          git push origin HEAD:perf/asc-perf-wa-single-owner-20260824
