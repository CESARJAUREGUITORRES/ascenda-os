name: Marketing Final Release Patch
on:
  push:
    branches:
      - fix/marketing-final-production-alignment
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/marketing-final-production-alignment
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply guarded version patch
        run: node scripts/bump_marketing_final_release.mjs
      - name: Validate Marketing adapter syntax
        run: node --check app/public/admin-marketing-v2.js
      - name: Validate diff
        run: git diff --check
      - name: Commit patched app version
        run: |
          if git diff --quiet; then
            echo 'No patch needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/public/app.html
          git commit -m 'Bump app version for Marketing final release'
          git push
