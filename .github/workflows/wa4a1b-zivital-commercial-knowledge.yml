name: ASCENDA WA-4A.1B Zi Vital Commercial Knowledge

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/*wa4a1b*'
      - 'supabase/rollbacks/*wa4a1b*'
      - 'supabase/data_patches/*wa4a1b*'
      - 'ci/wa4a1b-zivital-commercial/**'
      - 'docs/control/WHATSAPP_WA4A1B_*'
      - '.github/workflows/wa4a1b-zivital-commercial-knowledge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wa4a1b-zivital-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: ZERO-COST · commercial knowledge graph
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 35
    env:
      DB_URL: postgresql://postgres:postgres@127.0.0.1:59972/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Zero-Cost and static governance
        run: |
          set -euo pipefail
          test "${{ runner.environment }}" = "self-hosted"
          python3 scripts/ci/enforce-zero-cost-policy.py
          M=supabase/migrations/20260828014500_wa4a1b_zivital_commercial_knowledge_graph_v1.sql
          P=supabase/data_patches/20260828_wa4a1b_vitaminas_detox_commercial_enrichment.sql
          grep -q 'ZV_COMMERCIAL_ARCH_2026' "$M"
          grep -q 'TAX_COMMERCIAL_PHASES' "$M"
          grep -q 'TAX_CLINICAL_LIFECYCLE' "$M"
          grep -q 'PRINCIPLE_NO_DISCOUNT' "$M"
          grep -q 'RULE_ETHICAL_UPSELL' "$M"
          grep -q 'KPI_PATIENT_CONTINUITY' "$M"
          grep -q 'aos_knowledge_entity_map_v1' "$M"
          ! grep -q 'S/' "$M"
          ! grep -Eiq 'public\.(aos_pacientes|aos_ventas|aos_leads|aos_rev_)' "$M" "$P"
          ! grep -Eiq '(auto_routing|ai_send|auto_reply|copilot)[[:space:]]*=[[:space:]]*true' "$M" "$P"
          ! grep -Eiq 'precio_(base|oferta)[[:space:]]*=' "$P"

      - name: Existing WA knowledge regressions
        run: |
          set -euo pipefail
          node --check app/wa4-knowledge.js
          node --test ci/wa4a-knowledge-fabric/wa4-knowledge.test.js
          node --test ci/wa4a1-zivital-knowledge/wa4a1-audience.test.js

      - name: Configure isolated Supabase
        working-directory: ci/zero-cost-staging
        run: |
          set -euo pipefail
          sed -i 's/project_id = "ascenda-zero-cost-staging"/project_id = "ascenda-wa4a1b-commercial"/' supabase/config.toml
          sed -i 's/port = 54321/port = 59971/' supabase/config.toml
          sed -i 's/port = 54322/port = 59972/' supabase/config.toml
          sed -i 's/shadow_port = 54320/shadow_port = 59970/' supabase/config.toml

      - name: Start isolated Supabase
        working-directory: ci/zero-cost-staging
        run: |
          set -euo pipefail
          supabase stop --no-backup || true
          docker ps -aq --filter 'name=ascenda-wa4a1b-commercial' | xargs -r docker rm -f || true
          rm -rf supabase/.temp supabase/.branches
          supabase db start
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 59972 -U postgres >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Build WA-4A V1 + WA-4A.1 + exact-shape catalog
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/wa4a-knowledge-fabric/source_contract.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/wa4a1b-zivital-commercial/catalog_fixture.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260827185000_wa4a_knowledge_fabric_v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260828001500_wa4a1_zivital_governed_knowledge_v1.sql
          echo "$(psql "$DB_URL" -X -qAt -c "select count(*) from public.aos_catalogo_servicios")" > /tmp/wa4a1b-count

      - name: Apply WA-4A.1B graph and governed business-content patch
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260828014500_wa4a1b_zivital_commercial_knowledge_graph_v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260828014600_wa4a1b_prephase_and_mapping_hardening_v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260828014700_wa4a1b_explicit_exception_mapping_v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260828014800_wa4a1b_product_composition_semantics_v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260828014900_wa4a1b_relation_reconciliation_v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/data_patches/20260828_wa4a1b_vitaminas_detox_commercial_enrichment.sql

      - name: Database lint and graph certification
        run: |
          set -euo pipefail
          (cd ci/zero-cost-staging && supabase db lint --local --schema public --level error)
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f ci/wa4a1b-zivital-commercial/tests/001_commercial_graph.sql | tee /tmp/wa4a1b.txt
          grep -q 'WA4A1B_ZIVITAL_COMMERCIAL_GRAPH_PASS' /tmp/wa4a1b.txt
          test "$(psql "$DB_URL" -X -qAt -c "select count(*) from public.aos_catalogo_servicios where estado='ACTIVO' and tipo='SERVICIO' and categoria in ('VITAMINAS','DETOX') and (nullif(btrim(descripcion_comercial),'') is null or nullif(btrim(indicaciones),'') is null)")" = "0"
          test "$(psql "$DB_URL" -X -qAt -c "select count(*) from public.aos_catalogo_servicios where info_extendida#>>'{knowledge_enrichment_v1b,sync_version}'='WA4A1B_ZV_COMMERCIAL_20260828_V1'")" = "41"

      - name: Rollback preserves catalog and WA-4A.1
        run: |
          set -euo pipefail
          BEFORE=$(cat /tmp/wa4a1b-count)
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/rollbacks/20260828014500_wa4a1b_zivital_commercial_knowledge_graph_v1.rollback.sql
          test "$(psql "$DB_URL" -X -qAt -c 'select count(*) from public.aos_catalogo_servicios')" = "$BEFORE"
          test "$(psql "$DB_URL" -X -qAt -c "select to_regclass('public.aos_knowledge_entity_map_v1') is null")" = "t"
          test "$(psql "$DB_URL" -X -qAt -c "select to_regclass('public.aos_knowledge_nodes_v1') is not null")" = "t"
          test "$(psql "$DB_URL" -X -qAt -c "select to_regprocedure('public.aos_wa4a_knowledge_search_v2(text,text,integer,text[])') is not null")" = "t"
          echo 'WA-4A.1B TEST CERTIFIED BOUNDARY: commercial graph PROD migration unapplied; Copilot remains SAFE-OFF.'

      - name: Stop isolated Supabase
        if: always()
        working-directory: ci/zero-cost-staging
        run: supabase stop --no-backup || true
