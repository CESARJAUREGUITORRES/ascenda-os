name: Ascenda CI

on:
  pull_request:
    branches:
      - main
      - staging
    paths:
      - 'app/**'
      - 'supabase/**'
      - 'ci/**'
      - 'scripts/ci/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
      - staging
      - 'feature/**'
      - 'fix/**'
      - 'security/**'
      - 'data/**'
      - 'chore/**'
      - 'audit/**'
      - 'infra/**'
    paths:
      - 'app/**'
      - 'supabase/**'
      - 'ci/**'
      - 'scripts/ci/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Push and PR validation for the same branch share one lane: keep only the newest run.
  group: ascenda-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Runtime baseline
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package.json

      - name: FAST runner healthcheck
        shell: powershell
        run: |
          if ('${{ runner.environment }}' -ne 'self-hosted') { throw 'Runner must be self-hosted' }
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $env:RUNNER_OS"
          git --version
          node --version

      - name: Install app dependencies
        shell: powershell
        working-directory: app
        run: npm.cmd install --no-audit --no-fund

      - name: Check production server syntax
        shell: powershell
        run: |
          node --check app/server.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path 'app/server-phase2.js') { node --check app/server-phase2.js }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path 'app/server-f4.js') { node --check app/server-f4.js }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path 'app/server-wa4.js') { node --check app/server-wa4.js }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path 'app/wa4-knowledge.js') { node --check app/wa4-knowledge.js }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path 'app/email-runtime-env-compat.cjs') { node --check app/email-runtime-env-compat.cjs }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path 'app/supabase-runtime-auth.cjs') { node --check app/supabase-runtime-auth.cjs }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path 'app/supabase-quota-target.cjs') { node --check app/supabase-quota-target.cjs }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path 'app/supabase-quota-circuit-preload.cjs') { node --check app/supabase-quota-circuit-preload.cjs }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: WA-4C Railway + Supabase runtime compatibility
        shell: powershell
        run: |
          node ci/wa4c-runtime/env-compat.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ci/wa4c-runtime/supabase-auth-header.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ci/wa4c-runtime/quota-target.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: WA-4 R3 focused retrieval and grounding regression
        shell: powershell
        run: |
          node --test ci/wa4-ai-sales-router/retrieval-grounding-r3.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check public JavaScript syntax
        shell: powershell
        run: |
          $files = Get-ChildItem 'app/public' -File -Filter '*.js'
          foreach ($file in $files) {
            Write-Host "Checking $($file.FullName)"
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Write-Host "Checked $($files.Count) public JavaScript files"

      - name: Validate JSON files
        shell: powershell
        run: |
          $script = @'
          const fs = require('fs');
          const path = require('path');
          const roots = ['app'];
          let checked = 0;
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.name === 'node_modules' || entry.name === 'dist') continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && entry.name.endsWith('.json')) {
                JSON.parse(fs.readFileSync(full, 'utf8'));
                console.log(`Valid JSON: ${full}`);
                checked++;
              }
            }
          }
          for (const root of roots) walk(root);
          console.log(`Validated ${checked} JSON files`);
          '@
          $script | node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify production-critical files
        shell: powershell
        run: |
          $required = @(
            'app/server.js',
            'app/package.json',
            'app/railway.json',
            'app/nixpacks.toml',
            'app/public/app.html',
            'app/public/login.html'
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file) -or (Get-Item $file).Length -eq 0) {
              throw "Missing or empty critical file: $file"
            }
          }
          Write-Host 'Production-critical files present'

      - name: Report architecture mode
        shell: powershell
        run: |
          Write-Host 'Ascenda production runtime: node app/server.js'
          Write-Host 'Frontend source of truth: app/public/'
          Write-Host 'FAST CI compute: self-hosted Windows ascenda-fast'
          Write-Host 'DB CI + Zero-Cost policy remain on self-hosted Linux ascenda-zero-cost-v2'
          Write-Host 'Vite build is intentionally not used as a blocking production check.'
