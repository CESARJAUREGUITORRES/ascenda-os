name: F16 Live Canary Materialize

on:
  push:
    branches: ['ops/f16-live-provider-canary-20260815']
    paths:
      - '.github/workflows/f16-live-canary-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Zero-Cost health
        run: |
          python3 scripts/ci/enforce-zero-cost-policy.py
          bash scripts/ci/runner-healthcheck.sh
      - name: Patch runtime with fixed-recipient canary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          eg = Path('app/email-gateway.js')
          s = eg.read_text()
          anchor = "const https = require('https')\n"
          insert = "const https = require('https')\nconst { createLiveCanary } = require('./f16-live-canary')\nconst F16_LIVE_CANARY = createLiveCanary()\n"
          if s.count(anchor) != 1:
              raise SystemExit('email-gateway import anchor not unique')
          s = s.replace(anchor, insert, 1)

          anchor2 = "      var eventType = String(event.type || '')\n      var occurredAt = event.created_at || new Date().toISOString()\n      var ingest = await rpc('aos_cia_email_ingest_provider_event_v2', {"
          insert2 = "      var eventType = String(event.type || '')\n      var occurredAt = event.created_at || new Date().toISOString()\n      var liveCanary = await F16_LIVE_CANARY.handleSignedWebhookCanary({\n        messageId: messageId,\n        eventType: eventType,\n        eventId: verified.eventId,\n        timestamp: String(req.headers['svix-timestamp'] || ''),\n        signature: String(req.headers['svix-signature'] || ''),\n        rawBody: raw.toString('utf8')\n      })\n      if (liveCanary && liveCanary.handled) return jsonResponse(res, liveCanary.status || 200, liveCanary.body || { ok: true, canary: true })\n      var ingest = await rpc('aos_cia_email_ingest_provider_event_v2', {"
          if s.count(anchor2) != 1:
              raise SystemExit('email-gateway webhook anchor not unique')
          s = s.replace(anchor2, insert2, 1)
          eg.write_text(s)

          sv = Path('app/server.js')
          t = sv.read_text()
          anchor3 = "const EMAIL_GATEWAY = createEmailGateway()\n"
          insert3 = "const EMAIL_GATEWAY = createEmailGateway()\nconst { createLiveCanary } = require('./f16-live-canary')\nconst F16_LIVE_CANARY = createLiveCanary()\n"
          if t.count(anchor3) != 1:
              raise SystemExit('server canary init anchor not unique')
          t = t.replace(anchor3, insert3, 1)

          anchor4 = "  if (p === '/api/email-gateway') return EMAIL_GATEWAY.handleAdmin(req, res)\n  if (p === '/api/send-email') return EMAIL_GATEWAY.handleAdmin(req, res)\n  if (p === '/api/resend-webhook') return EMAIL_GATEWAY.handleWebhook(req, res)\n"
          insert4 = "  if (p === '/api/email-gateway') return EMAIL_GATEWAY.handleAdmin(req, res)\n  if (p === '/api/send-email') return EMAIL_GATEWAY.handleAdmin(req, res)\n  if (p === '/api/f16-live-canary') return F16_LIVE_CANARY.handleCanary(req, res)\n  if (p === '/api/resend-webhook') return EMAIL_GATEWAY.handleWebhook(req, res)\n"
          if t.count(anchor4) != 1:
              raise SystemExit('server route anchor not unique')
          t = t.replace(anchor4, insert4, 1)
          sv.write_text(t)
          PY
      - name: Runtime safety assertions
        run: |
          set -euo pipefail
          node --check app/f16-live-canary.js
          node --check app/email-gateway.js
          node --check app/server.js
          node ci/phase16/test_email_gateway.js
          grep -q "delivered+ascenda-f16-20260815@resend.dev" app/f16-live-canary.js
          grep -q "CANARY_IDEMPOTENCY_KEY" app/f16-live-canary.js
          grep -q "x-ascenda-f16-canary" app/f16-live-canary.js
          grep -q "/api/f16-live-canary" app/server.js
          if grep -q "body\.to\|payload\.to\|req.*recipient" app/f16-live-canary.js; then
            echo 'Canary must not accept a dynamic recipient' >&2
            exit 1
          fi
          git diff --check
      - name: Commit runtime canary materialization
        run: |
          set -euo pipefail
          git config user.name 'ASCENDA Zero-Cost CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/email-gateway.js app/server.js
          git commit -m 'ops(f16): materialize fixed-recipient live provider canary'
          git push origin HEAD:${GITHUB_REF_NAME}
