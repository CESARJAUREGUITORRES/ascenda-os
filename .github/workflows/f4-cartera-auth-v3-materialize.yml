name: ASCENDA F4 Cartera Auth V3 Materializer

on:
  push:
    branches: ['fix/f4-cartera-auth-v3-current-20260815']
    paths:
      - 'scripts/ci/materialize-f4-cartera-auth-v3.js'
      - '.github/workflows/f4-cartera-auth-v3-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: f4-cartera-auth-v3-materialize-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  materialize:
    name: FAST materialize Cartera Auth V3
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/f4-cartera-auth-v3-current-20260815
          fetch-depth: 0

      - name: Materialize deterministic token-scope fix
        shell: powershell
        run: |
          node scripts/ci/materialize-f4-cartera-auth-v3.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Runtime and contract certification
        shell: powershell
        run: |
          node --check app/public/f4-revenue-ops.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check ci/phase2-cartera/ui_contract.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ci/phase2-cartera/ui_contract.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check ci/phase4-revenue/ui_contract.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ci/phase4-revenue/ui_contract.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit materialized runtime only when changed
        shell: powershell
        run: |
          $paths = @(
            'app/public/admin-cartera.html',
            'app/public/f4-revenue-ops.js',
            'ci/phase2-cartera/ui_contract.js',
            'ci/phase4-revenue/ui_contract.js'
          )
          git diff --quiet -- $paths
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'F4_CARTERA_AUTH_V3=ALREADY_CURRENT'
            exit 0
          }
          git config user.name ascenda-ci
          git config user.email ascenda-ci@users.noreply.github.com
          git add -- $paths
          git commit -m 'fix(f4): isolate Cartera on Auth V3 app token'
          git push origin HEAD:fix/f4-cartera-auth-v3-current-20260815
