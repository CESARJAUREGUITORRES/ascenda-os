name: ASCENDA WA-4C Runtime Canary

on:
  push:
    branches:
      - 'wa4c/runtime-canary-20260828'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_PROD_SHA: 3eb6e7bae5127958fe39f35a1a55b680830e1fc3

jobs:
  runtime-canary:
    name: WA-4C · Railway vault probe + model readiness + 2FA fail-closed
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 15
    steps:
      - name: Railway DNS + outer health
        shell: bash
        run: |
          set -euo pipefail
          echo "expected_prod_sha=$EXPECTED_PROD_SHA"
          HOST='ascenda-os-production.up.railway.app'
          BASE="https://${HOST}"
          getent hosts "$HOST"
          code=$(curl --silent --show-error --location --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 -o /tmp/outer-health.json -w '%{http_code}' "$BASE/health")
          echo "outer_health_http=$code"
          cat /tmp/outer-health.json
          test "$code" = '200'

      - name: Temporary non-sensitive Railway to Supabase vault probe
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ascenda-os-production.up.railway.app'
          code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 -o /tmp/vault-probe.json -w '%{http_code}' "$BASE/api/wa4c/vault-probe")
          echo "vault_probe_http=$code"
          cat /tmp/vault-probe.json
          test "$code" = '200'
          python3 -c "import json; j=json.load(open('/tmp/vault-probe.json')); assert 'code' in j; print(json.dumps(j,indent=2))"

      - name: WA-4 health snapshot
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ascenda-os-production.up.railway.app'
          code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 45 -o /tmp/wa4-health.json -w '%{http_code}' "$BASE/api/wa4/health")
          echo "wa4_health_http=$code"
          cat /tmp/wa4-health.json
          test "$code" = '200'

      - name: Auth 2FA fail-closed without token
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ascenda-os-production.up.railway.app'
          code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 -o /tmp/bootstrap-no-token.json -w '%{http_code}' "$BASE/api/wa4/bootstrap")
          echo "bootstrap_no_token_http=$code"
          cat /tmp/bootstrap-no-token.json
          test "$code" = '403'
          python3 -c "import json; j=json.load(open('/tmp/bootstrap-no-token.json')); assert j.get('ok') is False and j.get('error')=='WA4_2FA_PANEL_REQUIRED',j"
