name: K1 v4 optional legacy RPC ACL fix

on:
  push:
    branches: [security/kronia-k1-current-main-20260817-v4]
    paths:
      - '.github/workflows/k1-v4-optional-acl-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Linux, X64, ascenda-zero-cost-v2]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: security/kronia-k1-current-main-20260817-v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Make optional legacy revokes idempotent
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/k1_optional_acl_fix.js
          git diff --check
          python3 -m py_compile ci/kronia-k1-phase2/security_static_contract.py
          python3 ci/kronia-k1-phase2/security_static_contract.py
          ! grep -q "::regprocedure" supabase/migrations/20260817170100_kronia_k1_app_token_control_plane.sql
          ! grep -q "::regprocedure" supabase/rollbacks/20260814_kronia_k1_phase2_safe_recovery.sql
          grep -q "to_regprocedure(v_sig)" supabase/migrations/20260817170100_kronia_k1_app_token_control_plane.sql
          grep -q "to_regprocedure(v_sig)" supabase/rollbacks/20260814_kronia_k1_phase2_safe_recovery.sql
          git add \
            supabase/migrations/20260817170100_kronia_k1_app_token_control_plane.sql \
            supabase/rollbacks/20260814_kronia_k1_phase2_safe_recovery.sql \
            ci/kronia-k1-phase2/security_static_contract.py
          git config user.name 'ASCENDA Zero-Cost Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'security(k1): make legacy RPC ACL revocation idempotent'
          git push origin HEAD:security/kronia-k1-current-main-20260817-v4
          echo 'KRONIA_K1_OPTIONAL_RPC_ACL_MATERIALIZED=PASS'
