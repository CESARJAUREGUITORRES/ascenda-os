name: BREAK Persistence P0 Hosted Gate
on:
  push:
    branches:
      - hotfix/break-state-persistence-20260915
jobs:
  break-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: |
          node --check app/public/advisor-break-persistence-v1.js
          node --check app/public/phase2-service-worker.js
          node --check ci/break-persistence/contract.js
      - name: BREAK persistence contract
        run: node ci/break-persistence/contract.js
      - name: Existing APP-PWA V2 contract
        run: node ci/app-pwa-v2/contract.js
