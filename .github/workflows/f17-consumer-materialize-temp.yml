name: F17 Consumer Cutover Materializer Temp

on:
  push:
    branches:
      - ops/f17-consumer-materialize-20260817
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: [self-hosted, Windows, X64, ascenda-fast]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply deterministic cutover
        shell: powershell
        run: node ci/f17/materialize_calls_gateway_cutover.js
      - name: Certify consumer scope
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          node --check app/public/calls.js
          $src = Get-Content app/public/calls.js -Raw
          if ($src -match '/rest/v1/aos_plantillas_whatsapp\?activo=eq.true&order=orden') { throw 'legacy direct template fetch remains' }
          if ($src -notmatch '/api/f17/whatsapp/templates') { throw 'governed endpoint missing' }
          if ($src -notmatch 'X-ASCENDA-Session') { throw 'session header missing' }
          $changed = git diff --name-only
          if (($changed | Measure-Object).Count -ne 1 -or $changed -ne 'app/public/calls.js') { throw "unexpected changed scope: $changed" }
      - name: Commit materialized consumer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'ASCENDA F17 Bot'
          git config user.email 'f17-bot@users.noreply.github.com'
          git add app/public/calls.js
          git commit -m 'fix(f17): move WhatsApp template read behind governed gateway'
          git push origin HEAD:ops/f17-consumer-materialize-20260817
