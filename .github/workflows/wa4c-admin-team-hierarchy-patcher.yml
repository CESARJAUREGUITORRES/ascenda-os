name: TEMP WA-4C Admin Team Hierarchy Patcher

on:
  push:
    branches:
      - feat/wa4c-professional-skill-hierarchy-20260901
    paths:
      - '.github/workflows/wa4c-admin-team-hierarchy-patcher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wa4c-professional-skill-hierarchy-20260901
          fetch-depth: 0
      - name: Inject hierarchical Team UI runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/public/admin-team.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/admin-team-skill-hierarchy.js?v=20260901-1"></script>'
          if tag not in s:
              marker='</script>'
              pos=s.rfind(marker)
              if pos < 0:
                  raise SystemExit('admin-team closing script not found')
              pos += len(marker)
              s=s[:pos]+'\n'+tag+s[pos:]
              s=s.replace('admin-team.html v7 — Panel de Equipo Profesional','admin-team.html v8 — Professional Skill Hierarchy')
              p.write_text(s,encoding='utf-8')
          PY
          grep -q 'admin-team-skill-hierarchy.js?v=20260901-1' app/public/admin-team.html
      - name: Commit patch
        run: |
          if git diff --quiet -- app/public/admin-team.html; then exit 0; fi
          git config user.name 'ascenda-wa4c-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/public/admin-team.html
          git commit -m 'WA-4C: load hierarchical Team skill UI'
          git push origin HEAD:feat/wa4c-professional-skill-hierarchy-20260901
