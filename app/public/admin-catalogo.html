<!-- admin-catalogo.html v3 bootstrap — preserves v2 core and layers product FAQ UI -->
<div id="ac-v3-bootstrap" style="padding:32px;text-align:center;font:600 11px 'DM Sans',sans-serif;color:#6B7BA8">Cargando Catálogo & Repositorio…</div>
<script>
(function(){
  var host=document.getElementById('ac-v3-bootstrap');
  function fail(msg){if(host)host.innerHTML='<div style="color:#DC2626">No se pudo cargar Catálogo & Repositorio.<br><small>'+msg+'</small></div>'}
  fetch('/admin-catalogo-core.html?v=20260827-faq-ui',{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('core HTTP '+r.status);return r.text()
  }).then(function(html){
    var scripts=[];
    html=html.replace(/<script\b[^>]*>([\s\S]*?)<\/script>/gi,function(_,code){scripts.push(code);return ''});
    if(!host)return;
    host.innerHTML=html;
    scripts.forEach(function(code){var s=document.createElement('script');s.text=code;document.head.appendChild(s);s.remove()});
    var p=document.createElement('script');
    p.src='/admin-catalogo-faq-patch.js?v=20260827-faq-ui';
    p.onload=function(){if(window.AOS_showToast)AOS_showToast('✅ FAQs de productos visibles','','')};
    p.onerror=function(){fail('FAQ patch no disponible')};
    document.head.appendChild(p);
  }).catch(function(e){console.error('catalog bootstrap',e);fail(e.message||'error')})
})();
</script>
