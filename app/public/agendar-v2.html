<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Agenda tu cita — Zi Vital</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Exo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',sans-serif;background:#F0F4FC;color:#0D1B3E}.hero{background:linear-gradient(135deg,#071D4A,#0A4FBF);padding:24px 16px 44px;text-align:center;color:#fff}.hero h1{font:800 24px 'Exo 2';margin:0}.hero p{font-size:11px;opacity:.7;margin:5px 0 0}.wrap{max-width:760px;margin:-25px auto 40px;padding:0 14px}.card{background:#fff;border:1px solid #DDE4F5;border-radius:18px;padding:18px;margin-bottom:12px;box-shadow:0 8px 28px rgba(7,29,74,.07)}.section{font:800 10px 'Exo 2';letter-spacing:.8px;text-transform:uppercase;color:#0A4FBF;margin:0 0 9px}.tabs{display:flex;gap:7px;margin-bottom:14px}.tab{flex:1;border:2px solid #DDE4F5;background:#fff;border-radius:10px;padding:10px;font-weight:800;color:#6B7BA8;cursor:pointer}.tab.on{border-color:#00C9A7;background:#ECFDF8;color:#008F79}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fi{width:100%;padding:11px 12px;border:1.5px solid #DDE4F5;border-radius:9px;font:500 12px 'DM Sans';background:#fff}.fl{display:block;font-size:9px;font-weight:800;color:#6B7BA8;text-transform:uppercase;margin:0 0 4px}.btn{border:0;border-radius:11px;padding:12px 16px;font-weight:800;cursor:pointer}.btnp{background:linear-gradient(135deg,#071D4A,#0A4FBF);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.status{font-size:10px;padding:9px 11px;border-radius:9px;background:#F8FAFF;color:#6B7BA8;margin-top:10px}.provider{border:1.5px solid #DDE4F5;border-radius:13px;padding:12px;margin-top:9px}.provider h3{font:800 13px 'Exo 2';margin:0 0 3px}.provider small{color:#6B7BA8}.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:7px;margin-top:9px}.slot{border:1.5px solid #DDE4F5;background:#fff;border-radius:9px;padding:9px 5px;text-align:center;cursor:pointer;font-weight:800}.slot small{display:block;color:#00A88A;font-size:8px;margin-top:2px}.slot.sel{background:#00C9A7;color:#fff;border-color:#00C9A7}.slot.sel small{color:#fff}.hidden{display:none}.summary{background:#EBF2FF;border-radius:10px;padding:11px;font-size:11px;line-height:1.7}.ok{background:#ECFDF8;color:#007A68}.err{background:#FEF2F2;color:#B91C1C}@media(max-width:620px){.grid{grid-template-columns:1fr}.slots{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="hero"><h1>Agenda tu cita</h1><p>Zi Vital · disponibilidad real por tratamiento, sede y equipo de turno</p></div>
<div class="wrap">
  <div class="card">
    <div class="section">1. Tipo de atención y tratamiento</div>
    <div class="tabs"><button class="tab on" id="td" onclick="setRole('DOCTORA')">👩‍⚕️ Doctora</button><button class="tab" id="te" onclick="setRole('ENFERMERIA')">💆 Enfermería</button></div>
    <label class="fl">Tratamiento</label><select class="fi" id="treatment" onchange="resetAvailability()"><option value="">Cargando tratamientos...</option></select>
  </div>

  <div class="card">
    <div class="section">2. Sede y fecha</div>
    <div class="grid"><div><label class="fl">Sede</label><select class="fi" id="site" onchange="resetAvailability()"><option>SAN ISIDRO</option><option>PUEBLO LIBRE</option></select></div><div><label class="fl">Fecha</label><input class="fi" id="date" type="date" onchange="resetAvailability()"></div></div>
    <button class="btn btnp" style="margin-top:12px" onclick="loadAvailability()">Ver disponibilidad</button>
    <div id="availStatus" class="status">Selecciona tratamiento, sede y fecha.</div>
    <div id="providers"></div>
  </div>

  <div class="card hidden" id="patientCard">
    <div class="section">3. Datos de la cita</div>
    <div id="chosen" class="summary"></div>
    <div class="grid" style="margin-top:12px"><div><label class="fl">Nombre *</label><input class="fi" id="name"></div><div><label class="fl">Apellido</label><input class="fi" id="last"></div><div><label class="fl">Teléfono *</label><input class="fi" id="phone" type="tel" oninput="lookupPatient(this.value)"></div><div><label class="fl">Documento</label><input class="fi" id="dni"></div><div><label class="fl">Email</label><input class="fi" id="email" type="email"></div><div><label class="fl">Tipo de cita</label><select class="fi" id="atype"><option>CONSULTA NUEVA</option><option>APLICACION</option><option>CONTROL</option></select></div></div>
    <label class="fl" style="margin-top:10px">Nota</label><textarea class="fi" id="note" rows="2"></textarea>
    <div id="patientStatus" class="status hidden"></div>
    <button class="btn btnp" id="bookBtn" style="margin-top:12px" onclick="book()">Confirmar cita</button>
  </div>
  <div id="final"></div>
</div>
<script>
const SB='https://ituyqwstonmhnfshnaqz.supabase.co',SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0dXlxd3N0b25taG5mc2huYXF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3NDQyMTgsImV4cCI6MjA5MDMyMDIxOH0.w_pU4ecrrgekB7WzWrQrQd_7Deu_Cxm5ybUCZry5Mh0';
const H={'apikey':SK,'Authorization':'Bearer '+SK,'Content-Type':'application/json'};
const AG={role:'DOCTORA',catalog:[],slot:null,token:new URLSearchParams(location.search).get('t')||new URLSearchParams(location.search).get('token')||''};
function rpc(n,p){return fetch(SB+'/rest/v1/rpc/'+n,{method:'POST',headers:H,body:JSON.stringify(p||{})}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw j;return j;});}
function q(path){return fetch(SB+'/rest/v1/'+path,{headers:H}).then(r=>r.json())}
function E(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function today(){const d=new Date(),m=String(d.getMonth()+1).padStart(2,'0'),x=String(d.getDate()).padStart(2,'0');return d.getFullYear()+'-'+m+'-'+x}
document.getElementById('date').min=today();document.getElementById('date').value=today();
function setRole(r){AG.role=r;AG.slot=null;document.getElementById('td').classList.toggle('on',r==='DOCTORA');document.getElementById('te').classList.toggle('on',r==='ENFERMERIA');renderCatalog();resetAvailability();}
function renderCatalog(){const s=document.getElementById('treatment'),rows=AG.catalog.filter(x=>x.role===AG.role);let last='';s.innerHTML='<option value="">-- Seleccionar --</option>'+rows.map(x=>{let h='';if(x.categoria!==last){last=x.categoria;h='<optgroup label="'+E(last)+'">';}return h+'<option value="'+E(x.id)+'">'+E(x.nombre)+'</option>';}).join('')+(rows.length?'</optgroup>':'');}
function resetAvailability(){AG.slot=null;document.getElementById('providers').innerHTML='';document.getElementById('patientCard').classList.add('hidden');document.getElementById('availStatus').className='status';document.getElementById('availStatus').textContent='Pulsa “Ver disponibilidad”.';}
function selectedTreatment(){return AG.catalog.find(x=>x.id===document.getElementById('treatment').value)||null}
async function loadAvailability(){const t=selectedTreatment(),date=document.getElementById('date').value,site=document.getElementById('site').value,st=document.getElementById('availStatus');if(!t||!date){st.className='status err';st.textContent='Selecciona tratamiento y fecha.';return;}st.className='status';st.textContent='Consultando agenda real...';document.getElementById('providers').innerHTML='';try{const a=await rpc('aos_booking_availability_v2',{p_treatment_id:t.id,p_fecha:date,p_sede:site,p_profesional_id:null});if(!a.ok||!a.slots||!a.slots.length){st.className='status err';st.textContent='No hay disponibilidad real para esa combinación. '+(a.status||'');return;}st.className='status ok';st.textContent=a.mode==='SITE_POOL'?'Enfermería de turno disponible. No necesitas elegir un enfermero específico.':'Selecciona doctora y horario.';renderSlots(a,t);}catch(e){st.className='status err';st.textContent='No se pudo consultar la disponibilidad.';}}
function renderSlots(a,t){const root=document.getElementById('providers');if(a.mode==='SITE_POOL'){root.innerHTML='<div class="provider"><h3>💆 Enfermería de turno</h3><small>'+E(a.sede)+' · capacidad según personal habilitado y presente</small><div class="slots">'+a.slots.map((s,i)=>slotHtml(s,i,'')).join('')+'</div></div>';root.querySelectorAll('.slot').forEach((e,i)=>e.onclick=()=>chooseSlot(e,a.slots[i],t,a));return;}const groups={};a.slots.forEach(s=>{(groups[s.professional_id]||(groups[s.professional_id]={name:s.professional_name,slots:[]})).slots.push(s)});root.innerHTML=Object.keys(groups).map(id=>'<div class="provider"><h3>👩‍⚕️ '+E(groups[id].name)+'</h3><small>'+E(a.sede)+' · profesional habilitado para '+E(a.capability)+'</small><div class="slots">'+groups[id].slots.map((s,i)=>slotHtml(s,i,id)).join('')+'</div></div>').join('');root.querySelectorAll('.slot').forEach(e=>{e.onclick=()=>{const pid=e.dataset.pid||null,idx=Number(e.dataset.idx),s=pid?groups[pid].slots[idx]:a.slots[idx];chooseSlot(e,s,t,a)}})}
function slotHtml(s,i,pid){return '<button class="slot" data-pid="'+E(pid)+'" data-idx="'+i+'"><b>'+E(s.hora)+'</b><small>'+E(String(s.libres))+' cupo'+(Number(s.libres)===1?'':'s')+'</small></button>'}
function chooseSlot(el,s,t,a){AG.slot={...s,treatment:t,mode:a.mode,role:a.role,site:a.sede,date:a.fecha,capability:a.capability};document.querySelectorAll('.slot').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');const c=document.getElementById('patientCard');c.classList.remove('hidden');document.getElementById('chosen').innerHTML='<b>'+E(t.nombre)+'</b><br>'+E(a.sede)+' · '+E(a.fecha)+' · '+E(s.hora)+'<br>'+(a.mode==='SITE_POOL'?'Enfermería de turno':E(s.professional_name));c.scrollIntoView({behavior:'smooth',block:'start'});}
let lt=null;function lookupPatient(v){clearTimeout(lt);const n=String(v||'').replace(/\D/g,'');const st=document.getElementById('patientStatus');if(n.length<7){st.classList.add('hidden');return;}lt=setTimeout(async()=>{try{const r=await rpc('aos_buscar_por_numero',{p_numero:n});if(r&&r[0]){document.getElementById('name').value=r[0].nombre||'';document.getElementById('last').value=r[0].apellido||'';document.getElementById('dni').value=r[0].documento||'';document.getElementById('email').value=r[0].email||'';st.textContent='Paciente encontrado';st.className='status ok';}else st.classList.add('hidden');}catch(_){st.classList.add('hidden')}},450)}
async function book(){if(!AG.slot)return;const n=document.getElementById('name').value.trim(),p=document.getElementById('phone').value.trim(),btn=document.getElementById('bookBtn');if(!n||p.replace(/\D/g,'').length<7){alert('Completa nombre y teléfono.');return;}btn.disabled=true;btn.textContent='Agendando...';try{const r=await rpc('aos_agendar_publica_v2',{p_token:AG.token||'__permanent__',p_nombre:n,p_apellido:document.getElementById('last').value.trim(),p_telefono:p,p_treatment_id:AG.slot.treatment.id,p_fecha:AG.slot.date,p_hora:AG.slot.hora,p_sede:AG.slot.site,p_profesional_id:AG.slot.mode==='EXACT_PROVIDER'?AG.slot.professional_id:null,p_dni:document.getElementById('dni').value.trim(),p_email:document.getElementById('email').value.trim(),p_nota:document.getElementById('note').value.trim(),p_tipo_cita:document.getElementById('atype').value});if(!r.ok)throw r;document.getElementById('patientCard').classList.add('hidden');document.getElementById('final').innerHTML='<div class="card"><div class="status ok"><b>✅ Cita agendada</b><br>'+E(AG.slot.treatment.nombre)+' · '+E(AG.slot.date)+' '+E(AG.slot.hora)+' · '+E(AG.slot.site)+'<br>'+E(r.professional_name||'')+'</div></div>';const email=document.getElementById('email').value.trim();if(email)fetch('https://ascenda-os-production.up.railway.app/api/send-template',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:email,template:'confirmacion_cita',nombre:n,tratamiento:AG.slot.treatment.nombre,hora:AG.slot.hora,sede:AG.slot.site,fecha:AG.slot.date})}).catch(()=>{});}catch(e){alert((e&&e.error)||'No se pudo agendar. Actualiza la disponibilidad e intenta otra vez.');btn.disabled=false;btn.textContent='Confirmar cita';}}
(async()=>{try{if(AG.token){const r=await q('aos_links_agenda?token=eq.'+encodeURIComponent(AG.token)+'&select=expira_at');if(!r.length||new Date(r[0].expira_at)<new Date())throw new Error('LINK_EXPIRED')}AG.catalog=await rpc('aos_booking_public_catalog_v2',{});renderCatalog();}catch(e){document.querySelector('.wrap').innerHTML='<div class="card"><div class="status err">El enlace no está disponible o la agenda no pudo cargarse. Solicita uno nuevo por WhatsApp.</div></div>';}})();
</script>
</body></html>
