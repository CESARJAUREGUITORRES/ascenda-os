<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AscendaOS — Recuperación de acceso</title><style>body{font-family:Arial,sans-serif;background:#f4f7fc;color:#0d1b3e;display:grid;place-items:center;min-height:100vh;margin:0}.card{width:min(420px,90vw);background:#fff;border:1px solid #dde4f5;border-radius:16px;padding:28px;text-align:center;box-shadow:0 12px 40px rgba(10,79,191,.08)}h1{font-size:20px;margin:0 0 10px}p{font-size:13px;color:#6b7ba8;line-height:1.6}.ok{color:#059669;font-weight:700}</style></head><body><div class="card"><h1>Recuperando acceso seguro</h1><p id="msg">Limpiando la sesión local anterior y preparando Auth V3…</p></div><script>(async function(){var m=document.getElementById('msg');try{try{sessionStorage.clear()}catch(e){}try{localStorage.removeItem('aos_session');localStorage.removeItem('aos_app_token');localStorage.removeItem('aos_si_token');localStorage.removeItem('aos_si_expires_at')}catch(e){}if('caches'in window){var ks=await caches.keys();await Promise.all(ks.map(function(k){return caches.delete(k)}))}if('serviceWorker'in navigator){var regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(function(r){return r.unregister()}))}m.className='ok';m.textContent='Recuperación completada. Abriendo el login actualizado…';setTimeout(function(){location.replace('/login.html?auth_recovered='+Date.now())},700)}catch(e){m.textContent='No se pudo limpiar automáticamente. Cierra esta ventana y abre Chrome nuevamente.';console.error('[AUTH-RECOVERY]',e)}})();</script></body></html>
