<!-- Security review excerpt: exact PR #74 additions to Caja. -->
<script>
function abonarReview(cotKeys,rpc,toast){
  var financeToken = '';
  try { financeToken = sessionStorage.getItem('aos_si_token') || ''; } catch(e) {}
  if (cotKeys.length && !financeToken) {
    toast('Vuelve a iniciar sesion con 2FA para registrar abonos de cotizacion','warn');
    return;
  }
  rpc('aos_abonar_cotizacion_v2',{
    p_token:financeToken,
    p_idempotency_key:crypto.randomUUID(),
    p_cotizacion_id:'FROM_EXISTING_SELECTED_QUOTE',
    p_monto:'FROM_EXISTING_PAYMENT_FORM'
  });
}
function cotizacionesReview(rpc,financeToken,numero){
  rpc('aos_caja_cotizaciones_gateway',{
    p_token:financeToken,p_mode:'LIST',p_numero_limpio:numero
  });
}
</script>
