<!-- ASCENDA Conversations — WA-2 Live Inbox / admin-chats + 2FA -->
<style>
.wa2{height:calc(100vh - 34px);min-height:620px;padding:12px;font-family:'DM Sans',sans-serif;color:#0D1B3E;box-sizing:border-box}.wa2-shell{height:100%;display:grid;grid-template-columns:360px minmax(420px,1fr);background:#fff;border:1px solid #DCE4F0;border-radius:14px;overflow:hidden}.wa2-side{border-right:1px solid #E6ECF5;display:flex;flex-direction:column;min-width:0}.wa2-head{padding:13px;border-bottom:1px solid #E6ECF5}.wa2-title{font-family:'Exo 2',sans-serif;font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}.wa2-sub{font-size:9px;color:#8291B3;margin-top:3px}.wa2-tools{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:10px}.wa2-in,.wa2-sel,.wa2-ta{border:1px solid #D9E2F1;background:#fff;color:#0D1B3E;border-radius:8px;padding:8px 9px;font:11px 'DM Sans',sans-serif;box-sizing:border-box}.wa2-list{overflow:auto;flex:1}.wa2-row{padding:11px 13px;border-bottom:1px solid #EDF1F7;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:5px}.wa2-row:hover,.wa2-row.active{background:#F4F8FF}.wa2-name{font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wa2-num{font-size:9px;color:#6B7BA8}.wa2-preview{font-size:10px;color:#5A6B8F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;grid-column:1/-1}.wa2-meta{font-size:8px;color:#94A0B9}.wa2-unread{background:#0A4FBF;color:#fff;border-radius:20px;min-width:18px;height:18px;padding:0 5px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800}.wa2-main{display:flex;flex-direction:column;min-width:0;background:#F7F9FC}.wa2-chat-head{padding:11px 14px;background:#fff;border-bottom:1px solid #E6ECF5;display:flex;justify-content:space-between;gap:10px;align-items:center}.wa2-actions{display:flex;gap:6px;align-items:center}.wa2-btn{border:0;border-radius:8px;background:#0A4FBF;color:#fff;padding:7px 10px;font-size:9px;font-weight:800;cursor:pointer}.wa2-btn.alt{background:#EEF3FA;color:#425473}.wa2-btn:disabled{opacity:.5;cursor:not-allowed}.wa2-badge{font-size:8px;font-weight:800;padding:4px 7px;border-radius:20px;background:#E7FAF4;color:#008B67}.wa2-badge.warn{background:#FFF3E1;color:#A76000}.wa2-badge.closed{background:#EEF1F5;color:#68758D}.wa2-chat{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px}.wa2-msg{max-width:72%;padding:9px 11px;border-radius:12px;background:#fff;border:1px solid #E2E8F2;font-size:11px;line-height:1.38;align-self:flex-start;box-shadow:0 2px 7px rgba(20,45,90,.04)}.wa2-msg.out{align-self:flex-end;background:#E9F3FF;border-color:#CFE3FB}.wa2-msg small{display:block;color:#8A97B0;font-size:7px;margin-top:5px}.wa2-compose{padding:10px 12px;background:#fff;border-top:1px solid #E6ECF5;display:grid;grid-template-columns:1fr auto;gap:8px}.wa2-compose textarea{resize:none;width:100%}.wa2-empty{margin:auto;text-align:center;color:#8291B3;font-size:11px;padding:30px}.wa2-empty b{display:block;color:#0D1B3E;font-family:'Exo 2';font-size:18px;margin-bottom:5px}.wa2-status{padding:5px 12px;background:#FFF9ED;color:#8A5A00;font-size:8px;display:none}.wa2-status.show{display:block}@media(max-width:900px){.wa2-shell{grid-template-columns:300px 1fr}}@media(max-width:700px){.wa2{height:auto}.wa2-shell{grid-template-columns:1fr;min-height:760px}.wa2-side{height:320px;border-right:0;border-bottom:1px solid #E6ECF5}}
</style>
<div class="wa2">
 <div class="wa2-shell">
  <aside class="wa2-side">
   <div class="wa2-head"><div class="wa2-title">💬 WhatsApp Inbox <span class="wa2-badge">LIVE V1</span></div><div class="wa2-sub">Conversaciones canónicas · ADMIN · 2FA · actualización cada 4 s</div><div class="wa2-tools"><input id="wa2-search" class="wa2-in" placeholder="Buscar nombre, número o mensaje"><select id="wa2-state" class="wa2-sel"><option value="">Todas</option><option>OPEN</option><option>WAITING_CUSTOMER</option><option>CLOSED</option></select></div></div>
   <div id="wa2-list" class="wa2-list"><div class="wa2-empty">Cargando inbox...</div></div>
  </aside>
  <main class="wa2-main">
   <div id="wa2-status" class="wa2-status"></div>
   <div id="wa2-chat-head" class="wa2-chat-head" style="display:none"><div><div id="wa2-contact" class="wa2-name"></div><div id="wa2-context" class="wa2-num"></div></div><div class="wa2-actions"><span id="wa2-window" class="wa2-badge"></span><button id="wa2-refresh" class="wa2-btn alt">Actualizar</button><button id="wa2-close" class="wa2-btn alt">Cerrar chat</button></div></div>
   <div id="wa2-chat" class="wa2-chat"><div class="wa2-empty"><b>ASCENDA Conversations</b>Selecciona una conversación para verla aquí.</div></div>
   <div id="wa2-compose" class="wa2-compose" style="display:none"><textarea id="wa2-text" class="wa2-ta" rows="2" maxlength="4000" placeholder="Escribe una respuesta..."></textarea><button id="wa2-send" class="wa2-btn">Enviar</button></div>
  </main>
 </div>
</div>
<script>
(function(){
 var SB='https://ituyqwstonmhnfshnaqz.supabase.co';
 var SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInR5cCI6IkpXVCJ9';
 // Actual anon key is injected from the canonical page bridge when present; fallback below preserves current ASCENDA convention.
 SK=(window.AOS_SUPABASE_ANON_KEY||window.SUPABASE_ANON_KEY||'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0dXlxd3N0b25taG5mc2huYXF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3NDQyMTgsImV4cCI6MjA5MDMyMDIxOH0.w_pU4ecrrgekB7WzWrQrQd_7Deu_Cxm5ybUCZry5Mh0');
 var rows=[],active=null,typingTimer=null,inboxTimer=null,chatTimer=null,loading=false;
 function e(id){return document.getElementById(id)}
 function token(){try{return sessionStorage.getItem('aos_si_token')||sessionStorage.getItem('aos_app_token')||''}catch(_){return ''}}
 function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
 function dt(v){if(!v)return '';try{return new Date(v).toLocaleString('es-PE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}catch(_){return ''}}
 function rpc(name,body){return fetch(SB+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:SK,Authorization:'Bearer '+SK,'Content-Type':'application/json'},body:JSON.stringify(body||{})}).then(function(r){if(!r.ok)throw new Error(name+' '+r.status);return r.json()})}
 function deny(){e('wa2-list').innerHTML='<div class="wa2-empty"><b>🔒 Acceso restringido</b>Inicia sesión con 2FA y permiso admin-chats.</div>'}
 function status(s){var x=e('wa2-status');x.textContent=s||'';x.classList.toggle('show',!!s)}
 function loadInbox(){if(loading)return;var t=token();if(!t){deny();return}loading=true;rpc('aos_wa_inbox_v1',{p_token:t,p_state:e('wa2-state').value||null,p_search:e('wa2-search').value||null,p_limit:80,p_before:null}).then(function(d){if(!d||d.ok===false){deny();return}rows=d.rows||[];renderList()}).catch(function(err){console.error(err);status('No se pudo actualizar el inbox. Reintentando…')}).then(function(){loading=false})}
 function renderList(){var box=e('wa2-list');if(!rows.length){box.innerHTML='<div class="wa2-empty"><b>Sin conversaciones</b>El inbox se llenará cuando WA-1 reciba mensajes válidos de Meta.</div>';return}box.innerHTML=rows.map(function(r){return '<div class="wa2-row '+(active&&active.id===r.id?'active':'')+'" data-id="'+esc(r.id)+'"><div><div class="wa2-name">'+esc(r.contact_name||r.contact_number)+'</div><div class="wa2-num">'+esc(r.contact_number)+'</div></div>'+(Number(r.unread_count)>0?'<span class="wa2-unread">'+Number(r.unread_count)+'</span>':'<span class="wa2-meta">'+esc(dt(r.last_message_at))+'</span>')+'<div class="wa2-preview">'+esc(r.last_message_preview||'')+'</div><div class="wa2-meta">'+esc(r.state)+(r.campaign_source?' · '+esc(r.campaign_source):'')+(r.ad_id?' · AD '+esc(r.ad_id):'')+'</div></div>'}).join('');Array.prototype.forEach.call(box.querySelectorAll('[data-id]'),function(n){n.onclick=function(){open(n.getAttribute('data-id'))}})}
 function open(id){active=rows.find(function(r){return r.id===id})||{id:id};renderList();e('wa2-chat-head').style.display='flex';e('wa2-compose').style.display='grid';loadConversation(true);clearInterval(chatTimer);chatTimer=setInterval(function(){loadConversation(false)},3000)}
 function windowBadge(c){var now=Date.now(),cs=c.customer_service_window_expires_at?new Date(c.customer_service_window_expires_at).getTime():0,fe=c.free_entry_candidate_expires_at?new Date(c.free_entry_candidate_expires_at).getTime():0;if(fe>now)return '72h candidata activa';if(cs>now)return '24h servicio activa';return 'Fuera de ventana libre'}
 function loadConversation(mark){if(!active)return;rpc('aos_wa_conversation_v1',{p_token:token(),p_conversation_id:active.id,p_limit:300}).then(function(d){if(!d||!d.ok)return;active=d.conversation;e('wa2-contact').textContent=active.contact_name||active.contact_number;e('wa2-context').textContent=active.contact_number+(active.campaign_source?' · '+active.campaign_source:'')+(active.ad_id?' · AD '+active.ad_id:'');e('wa2-window').textContent=windowBadge(active);e('wa2-window').className='wa2-badge '+(active.state==='CLOSED'?'closed':'');e('wa2-close').disabled=active.state==='CLOSED';renderMessages(d.messages||[]);if(mark&&Number(active.unread_count)>0)rpc('aos_wa_mark_inbox_read_v1',{p_token:token(),p_conversation_id:active.id}).then(loadInbox)}).catch(function(err){console.error(err);status('No se pudo abrir la conversación.')})}
 function renderMessages(ms){var box=e('wa2-chat');var stick=box.scrollHeight-box.scrollTop-box.clientHeight<80;if(!ms.length){box.innerHTML='<div class="wa2-empty">Todavía no hay mensajes persistidos.</div>';return}box.innerHTML=ms.map(function(m){var body=m.message_body||('['+(m.message_type||'mensaje')+']');return '<div class="wa2-msg '+(m.direction==='OUTBOUND'?'out':'')+'">'+esc(body)+'<small>'+esc(m.direction)+' · '+esc(m.status||'')+' · '+esc(dt(m.provider_timestamp||m.created_at))+(m.billable===true?' · billable':'')+'</small></div>'}).join('');if(stick)box.scrollTop=box.scrollHeight}
 function send(){if(!active)return;var text=e('wa2-text').value.trim();if(!text)return;var btn=e('wa2-send');btn.disabled=true;var key='wa2-'+Date.now()+'-'+Math.random().toString(36).slice(2);fetch('/api/wa/send',{method:'POST',headers:{'Content-Type':'application/json','X-AOS-App-Token':token()},body:JSON.stringify({idempotency_key:key,to:active.contact_number,type:'text',text:text})}).then(function(r){return r.json().then(function(d){return {r:r,d:d}})}).then(function(x){if(!x.r.ok||!x.d.ok)throw new Error(x.d.error||('HTTP '+x.r.status));e('wa2-text').value='';loadConversation(false);loadInbox();status('')}).catch(function(err){status('No se pudo enviar: '+err.message)}).then(function(){btn.disabled=false})}
 function closeChat(){if(!active)return;if(!confirm('¿Cerrar esta conversación? Un nuevo mensaje inbound la reabrirá.'))return;rpc('aos_wa_close_conversation_v1',{p_token:token(),p_conversation_id:active.id}).then(function(d){if(!d||!d.ok)throw new Error((d&&d.error)||'CLOSE');loadInbox();loadConversation(false)}).catch(function(err){status('No se pudo cerrar: '+err.message)})}
 e('wa2-state').onchange=loadInbox;e('wa2-search').oninput=function(){clearTimeout(typingTimer);typingTimer=setTimeout(loadInbox,300)};e('wa2-refresh').onclick=function(){loadInbox();loadConversation(false)};e('wa2-send').onclick=send;e('wa2-close').onclick=closeChat;e('wa2-text').addEventListener('keydown',function(ev){if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();send()}});
 loadInbox();inboxTimer=setInterval(loadInbox,4000);window.addEventListener('beforeunload',function(){clearInterval(inboxTimer);clearInterval(chatTimer)});
})();
</script>
