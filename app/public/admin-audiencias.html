-spacing:.5px;text-transform:uppercase;color:#9AAAC8;font-weight:800;margin-top:3px}.section-title{font:800 14px 'Exo 2';margin:0 0 8px}.muted{color:#6B7BA8;font-size:10px}.dashboard-grid{grid-template-columns:1.1fr .9fr}.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.tier{padding:10px;border-radius:11px;border:1px solid #E5EAF5}.tier b{display:block;font:800 18px 'Exo 2'}.tier small{font-size:8px;font-weight:800;letter-spacing:.4px}.diamond{background:#F6F2FF;color:#6D28D9}.gold{background:#FFFBEB;color:#B45309}.premium{background:#EFF6FF;color:#1D4ED8}.standard{background:#F8FAFC;color:#475569}.preset-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.preset{border:1px solid #E3E8F3;border-radius:12px;padding:11px;cursor:pointer;transition:.12s;background:#fff}.preset:hover{border-color:#0A4FBF;box-shadow:0 5px 16px rgba(10,79,191,.08)}.preset .cat{font-size:8px;color:#7C3AED;font-weight:800;text-transform:uppercase}.preset h3{font:800 12px 'Exo 2';margin:4px 0}.preset p{font-size:9px;color:#6B7BA8;margin:0;line-height:1.4}.builder{grid-template-columns:minmax(360px,.75fr) minmax(520px,1.25fr)}.rulebar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.rule{display:grid;grid-template-columns:minmax(170px,1.3fr) minmax(120px,.8fr) minmax(150px,1fr) 30px;gap:6px;margin-bottom:6px}.ctl{width:100%;border:1px solid #DDE4F5;border-radius:8px;padding:8px 9px;background:#fff;color:#0D1B3E;font-size:10px;outline:none}.ctl:focus{border-color:#0A4FBF;box-shadow:0 0 0 3px rgba(10,79,191,.08)}.btn{border:0;border-radius:9px;padding:8px 12px;font-size:10px;font-weight:800;cursor:pointer}.btn.primary{background:#0A4FBF;color:#fff}.btn.cyan{background:#00A98E;color:#fff}.btn.ghost{background:#F1F5F9;color:#475569}.btn.purple{background:#7C3AED;color:#fff}.btn.danger{background:#FEF2F2;color:#DC2626}.btn:disabled{opacity:.45;cursor:not-allowed}.result-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}.count{font:800 24px 'Exo 2';color:#0A4FBF}.table-wrap{overflow:auto;max-height:520px;border:1px solid #E6EBF4;border-radius:10px}.tbl{width:100%;border-collapse:collapse;min-width:980px}.tbl th{position:sticky;top:0;background:#F8FAFF;z-index:2;text-align:left;font-size:8px;text-transform:uppercase;letter-spacing:.3px;color:#8A99B8;padding:8px;border-bottom:1px solid #DDE4F5}.tbl td{font-size:9px;padding:7px 8px;border-bottom:1px solid #F0F4FC;vertical-align:top}.tbl tr:hover td{background:#FAFCFF}.tag{display:inline-block;border-radius:5px;padding:2px 5px;font-size:7px;font-weight:800;background:#EBF2FF;color:#0A4FBF}.tag.warn{background:#FFF7ED;color:#C2410C}.tag.good{background:#ECFDF5;color:#047857}.empty{text-align:center;padding:42px 12px;color:#9AAAC8;font-size:11px}.hidden{display:none!important}.seg-grid{grid-template-columns:1fr 1fr}.info{padding:9px 11px;border-radius:9px;background:#F8FAFF;border:1px solid #E5EAF5;font-size:9px;color:#5E6D8A;line-height:1.5}.future{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.future .card{opacity:.65}.auth{position:fixed;inset:0;background:rgba(7,29,74,.62);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(5px)}.auth-box{width:min(430px,100%);background:#fff;border-radius:18px;padding:20px;box-shadow:0 24px 70px rgba(7,29,74,.28)}.auth-logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#071D4A,#0A4FBF);display:grid;place-items:center;color:#fff;font-size:22px;margin-bottom:12px}.auth h2{font:800 18px 'Exo 2';margin:0}.auth p{font-size:10px;color:#6B7BA8;line-height:1.5}.field{margin-top:9px}.field label{display:block;font-size:8px;font-weight:800;color:#8A99B8;text-transform:uppercase;margin-bottom:4px}.auth-error{min-height:18px;margin-top:8px;font-size:10px;color:#DC2626}.codes{display:flex;gap:5px;justify-content:center}.code{width:44px;height:48px;text-align:center;font:800 22px 'Exo 2';border:1px solid #DDE4F5;border-radius:10px;outline:none}.modal-bg{position:fixed;inset:0;background:rgba(7,29,74,.32);z-index:80;display:flex;align-items:center;justify-content:center;padding:15px}.modal{background:#fff;width:min(700px,100%);max-height:85vh;overflow:auto;border-radius:16px;padding:16px}.trace{font-size:9px}.trace-node{border-left:2px solid #DDE4F5;margin:6px 0;padding:5px 8px}.trace-MATCH{border-color:#10B981}.trace-MISS{border-color:#EF4444}.trace-UNKNOWN{border-color:#F59E0B}.state{font-size:8px;font-weight:900}.state.MATCH{color:#059669}.state.MISS{color:#DC2626}.state.UNKNOWN{color:#D97706}@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.dashboard-grid,.builder,.seg-grid{grid-template-columns:1fr}.preset-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.wrap{padding:10px}.hero{align-items:flex-start;flex-direction:column}.kpis{grid-template-columns:repeat(2,1fr)}.preset-grid,.future,.tiers{grid-template-columns:1fr 1fr}.rule{grid-template-columns:1fr}.rule .btn{width:100%}.top .phase{display:none}}

<script>
(function(){
'use strict';
var SB='https://ituyqwstonmhnfshnaqz.supabase.co';
var SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXlxd3N0b25taG5mc2huYXF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3NDQyMTgsImV4cCI6MjA5MDMyMDIxOH0.w_pU4ecrrgekB7WzWrQrQd_7Deu_Cxm5ybUCZry5Mh0';
var TOKEN_KEY='aos_cia_admin_token',EXP_KEY='aos_cia_admin_exp';
var boot=null,currentFilter=null,currentCount=null,proofUser='',proofCode='',rules=[];
var normalSession={};
try{normalSession=JSON.parse(localStorage.getItem('aos_session')||'{}')}catch(e){}
function h(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmt(n){return Number(n||0).toLocaleString('es-PE')}
function dt(v){if(!v)return '—';try{return new Date(v).toLocaleString('es-PE',{dateStyle:'short',timeStyle:'short'})}catch(e){return v}}
function isAdminNormal(){return normalSession&&normalSession.expires>Date.now()&&(normalSession.puesto==='ADMINISTRADOR'||normalSession.puesto==='DIRECTOR GENERAL'||normalSession.puesto==='JEFE DE ÁREA'||Number(normalSession.nivel||9)<=2)}
function rpc(fn,p){return fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SK,Authorization:'Bearer '+SK,'Content-Type':'application/json'},body:JSON.stringify(p||{})}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error((j&&j.message)||('HTTP '+r.status));return j})})}
function token(){var exp=Number(sessionStorage.getItem(EXP_KEY)||0);if(exp&&exp<Date.now()){sessionStorage.removeItem(TOKEN_KEY);sessionStorage.removeItem(EXP_KEY)}return sessionStorage.getItem(TOKEN_KEY)||''}
function gateway(action,payload){var t=token();if(!t){showAuth();return Promise.reject(new Error('AUTH_REQUIRED'))}return rpc('aos_cia_admin_gateway_v1',{p_token:t,p_action:action,p_payload:payload||{}}).then(function(j){if(!j||j.error==='UNAUTHORIZED'){lockCIA();throw new Error('UNAUTHORIZED')}return j})}
window.lockCIA=function(){sessionStorage.removeItem(TOKEN_KEY);sessionStorage.removeItem(EXP_KEY);showAuth()};
function showAuth(){var a=document.getElementById('auth');a.classList.remove('hidden');a.innerHTML='<div class="auth-box"><div class="auth-logo">🔐</div><h2>Reautenticación administrativa</h2><p>Bases & Audiencias exige una comprobación adicional. Tu sesión normal de ASCENDA no autoriza por sí sola este módulo.</p><div id="auth-stage"></div><div class="auth-error" id="auth-error"></div></div>';renderCreds()}
function renderCreds(){var u=normalSession.usuario||normalSession.nombre||'';document.getElementById('auth-stage').innerHTML='<div class="field"><label>Usuario</label><input id="au-user" class="ctl" value="'+h(u)+'" autocomplete="username"></div><div class="field"><label>Contraseña</label><input id="au-pass" class="ctl" type="password" autocomplete="current-password"></div><button class="btn primary" style="width:100%;margin-top:12px" id="au-go">Verificar identidad</button>';document.getElementById('au-go').onclick=startAuth}
function authErr(s){document.getElementById('auth-error').textContent=s||''}
function startAuth(){var u=document.getElementById('au-user').value.trim(),p=document.getElementById('au-pass').value;authErr('');if(!u||!p){authErr('Completa usuario y contraseña.');return}var b=document.getElementById('au-go');b.disabled=true;b.textContent='Verificando…';rpc('aos_login_v2',{p_usuario:u.toLowerCase(),p_password:p}).then(function(r){if(!r||!r.ok)throw new Error(r&&r.error||'Credenciales inválidas');if(!r.require_2fa)throw new Error('Este módulo requiere 2FA activo para el administrador.');proofUser=r.usuario||r.nombre||u;proofCode=r.code||'';return fetch('https://ascenda-os-production.up.railway.app/api/send-2fa',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:r.email_real,code:r.code,nombre:r.usuario})}).then(function(){render2FA(r.email_masked)})}).catch(function(e){b.disabled=false;b.textContent='Verificar identidad';authErr(e.message)})}
function render2FA(mask){document.getElementById('auth-stage').innerHTML='<p style="margin:10px 0">Código enviado a <b>'+h(mask||'tu email')+'</b></p><div class="codes">'+[0,1,2,3,4,5].map(function(i){return '<input class="code" maxlength="1" inputmode="numeric" data-i="'+i+'">'}).join('')+'</div><button id="au-2fa" class="btn primary" style="width:100%;margin-top:12px">Confirmar 2FA</button>';var els=[].slice.call(document.querySelectorAll('.code'));els.forEach(function(el,i){el.oninput=function(){this.value=this.value.replace(/\D/g,'');if(this.value&&els[i+1])els[i+1].focus()}});els[0].focus();document.getElementById('au-2fa').onclick=function(){var c=els.map(function(x){return x.value}).join('');if(c.length!==6){authErr('Ingresa los 6 dígitos.');return}var btn=this;btn.disabled=true;btn.textContent='Validando…';rpc('aos_verificar_2fa',{p_usuario:proofUser,p_codigo:c}).then(function(r){if(!r||!r.ok)throw new Error(r&&r.error||'Código inválido');if(c!==proofCode){proofCode=c}return rpc('aos_cia_claim_admin_session_v1',{p_usuario:proofUser,p_codigo:c})}).then(function(s){if(!s||!s.ok)throw new Error(s&&s.error||'No se pudo abrir sesión CIA');sessionStorage.setItem(TOKEN_KEY,s.token);sessionStorage.setItem(EXP_KEY,String(new Date(s.expires_at).getTime()));document.getElementById('auth').classList.add('hidden');loadBootstrap()}).catch(function(e){btn.disabled=false;btn.textContent='Confirmar 2FA';authErr(e.message)})}}
function loadBootstrap(){gateway('BOOTSTRAP',{}).then(function(j){if(!j.ok)throw new Error(j.error||'BOOTSTRAP_ERROR');boot=j;renderAll()}).catch(function(e){if(e.message!=='AUTH_REQUIRED'&&e.message!=='UNAUTHORIZED')alert('No se pudo cargar Bases & Audiencias: '+e.message)})}
function renderAll(){renderFresh();renderDashboard();renderPresets();renderBuilder();renderSegments()}
function renderFresh(){var f=boot.freshness||{};document.getElementById('fresh').innerHTML='<span class="pill live">● Operacional LIVE</span><span class="pill">Segmentos: '+h(dt(f.segment_cache_refreshed_at))+'</span><span class="pill">Email: '+h(dt(f.email_cache_refreshed_at))+'</span>'}
function tierCount(k){var x=boot.summary&&boot.summary.segments||{};return Number(x[k]||0)}
function renderDashboard(){var s=boot.summary||{};document.getElementById('tab-dashboard').innerHTML='<div class="grid kpis"><div class="card"><div class="kpi-v">'+fmt(s.contacts)+'</div><div class="kpi-l">Contactos lógicos</div></div><div class="card"><div class="kpi-v">'+fmt(s.identity_conflicts)+'</div><div class="kpi-l">Conflictos identidad</div></div><div class="card"><div class="kpi-v">'+fmt(tierCount('DIAMANTE'))+'</div><div class="kpi-l">Diamante</div></div><div class="card"><div class="kpi-v">'+fmt(tierCount('GOLD'))+'</div><div class="kpi-l">Gold</div></div><div class="card"><div class="kpi-v">'+fmt(tierCount('PREMIUM'))+'</div><div class="kpi-l">Premium</div></div><div class="card"><div class="kpi-v">'+fmt(tierCount('STANDARD'))+'</div><div class="kpi-l">Standard</div></div></div><div class="grid dashboard-grid"><div class="card"><h2 class="section-title">Motor comercial V2</h2><div class="info">Las audiencias se resuelven sobre una clave lógica de contacto. Leads, llamadas, agenda, ventas y seguimientos se leen en vivo. Segmentación y engagement de email usan caches explícitos con marca de frescura. La pertenencia a una audiencia no implica elegibilidad ni asignación.</div><div style="margin-top:10px"><button class="btn primary" onclick="goTab(\'builder\')">Construir audiencia</button> <button class="btn ghost" onclick="goTab(\'presets\')">Abrir presets</button></div></div><div class="card"><h2 class="section-title">Niveles económicos</h2><div class="tiers">'+tierHTML('DIAMANTE','diamond')+tierHTML('GOLD','gold')+tierHTML('PREMIUM','premium')+tierHTML('STANDARD','standard')+'</div></div></div>'}
function tierHTML(k,c){return '<div class="tier '+c+'"><b>'+fmt(tierCount(k))+'</b><small>'+k+'</small></div>'}
function renderPresets(){var ps=boot.presets||[];document.getElementById('tab-presets').innerHTML='<div class="card"><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><div><h2 class="section-title" style="margin:0">Presets comerciales</h2><div class="muted">Definiciones canónicas reutilizables. Clic para resolver con datos actuales.</div></div><div class="spacer"></div><span class="tag">'+ps.length+' presets</span></div><div class="preset-grid">'+ps.map(function(p,i){return '<div class="preset" data-i="'+i+'"><div class="cat">'+h(p.category||'GENERAL')+'</div><h3>'+h(p.name||p.preset_key)+'</h3><p>'+h(p.description||'')+'</p></div>'}).join('')+'</div></div>';document.querySelectorAll('#tab-presets .preset').forEach(function(x){x.onclick=function(){var p=ps[Number(this.dataset.i)];currentFilter=p.dsl;rulesFromFilter(currentFilter);goTab('builder');renderBuilder();runCountPreview()}})}
function groupedOptions(){var r=boot.registry||[],last='',out='';r.forEach(function(x){if(x.category!==last){if(last)out+='</optgroup>';last=x.category;out+='<optgroup label="'+h(last)+'">'}out+='<option value="'+h(x.field_key)+'">'+h(x.label)+'</option>'});if(last)out+='</optgroup>';return out}
function regByKey(k){return (boot.registry||[]).find(function(x){return x.field_key===k})}
function defaultRule(){var r=(boot.registry||[])[0]||{};return{field:r.field_key||'',operator:(r.allowed_operators||['eq'])[0],value:''}}
function rulesFromFilter(f){try{var root=f.root||{};rules=(root.rules||[]).filter(function(x){return x.field}).map(function(x){return JSON.parse(JSON.stringify(x))});window._rootOp=root.op||'AND'}catch(e){rules=[]}if(!rules.length)rules=[defaultRule()]}
function buildFilter(){return{version:1,root:{op:window._rootOp||'AND',rules:rules.map(function(r){var o={field:r.field,operator:r.operator};if(!['is_true','is_false','is_unknown','exists','not_exists'].includes(r.operator))o.value=r.value;return o})}}}
function renderBuilder(){if(!rules.length)rulesFromFilter(currentFilter||{version:1,root:{op:'AND',rules:[]}});var el=document.getElementById('tab-builder');el.innerHTML='<div class="grid builder"><div class="card"><h2 class="section-title">Constructor seguro</h2><div class="muted" style="margin-bottom:9px">El frontend genera DSL validado; nunca SQL.</div><div class="rulebar"><span class="muted">Combinar con</span><select id="root-op" class="ctl" style="width:auto"><option>AND</option><option>OR</option></select><button id="add-rule" class="btn ghost">+ Regla</button></div><div id="rules"></div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px"><button class="btn primary" id="validate-btn">Validar</button><button class="btn cyan" id="run-btn">Contar + Preview</button><button class="btn ghost" disabled title="Disponible en Fase 6">Guardar audiencia 🔒</button></div><div id="validation" class="info" style="margin-top:9px">Sin validar.</div></div><div class="card"><div class="result-head"><div><div class="muted">Resultado actual</div><div class="count" id="res-count">—</div></div><div class="spacer"></div><button class="btn ghost" id="prev-btn">←</button><span class="muted" id="page-txt">Página 1</span><button class="btn ghost" id="next-btn">→</button></div><div id="preview" class="empty">Construye o selecciona una audiencia para previsualizarla.</div></div></div>';document.getElementById('root-op').value=window._rootOp||'AND';document.getElementById('root-op').onchange=function(){window._rootOp=this.value};document.getElementById('add-rule').onclick=function(){if(rules.length>=25)return;rules.push(defaultRule());renderRules()};document.getElementById('validate-btn').onclick=validateFilter;document.getElementById('run-btn').onclick=function(){window._page=0;runCountPreview()};document.getElementById('prev-btn').onclick=function(){window._page=Math.max(0,(window._page||0)-1);runPreview()};document.getElementById('next-btn').onclick=function(){window._page=(window._page||0)+1;runPreview()};renderRules()}
function renderRules(){var host=document.getElementById('rules');if(!host)return;host.innerHTML=rules.map(function(r,i){var meta=regByKey(r.field)||{},ops=meta.allowed_operators||['eq'];if(ops.indexOf(r.operator)<0)r.operator=ops[0];return '<div class="rule" data-i="'+i+'"><select class="ctl fld">'+groupedOptions().replace('value="'+h(r.field)+'"','value="'+h(r.field)+'" selected')+'</select><select class="ctl op">'+ops.map(function(o){return '<option value="'+h(o)+'"'+(o===r.operator?' selected':'')+'>'+h(opLabel(o))+'</option>'}).join('')+'</select><span class="valhost">'+valueCtl(meta,r)+'</span><button class="btn danger del">×</button></div>'}).join('');host.querySelectorAll('.rule').forEach(function(row){var i=Number(row.dataset.i);row.querySelector('.fld').onchange=function(){rules[i]=defaultRule();rules[i].field=this.value;var m=regByKey(this.value)||{};rules[i].operator=(m.allowed_operators||['eq'])[0];renderRules()};row.querySelector('.op').onchange=function(){rules[i].operator=this.value;renderRules()};var v=row.querySelector('.val');if(v)v.onchange=v.oninput=function(){rules[i].value=this.value};row.querySelector('.del').onclick=function(){rules.splice(i,1);if(!rules.length)rules.push(defaultRule());renderRules()}})}
function opLabel(o){var m={eq:'igual',ne:'distinto',contains:'contiene',not_contains:'no contiene',never_contains:'nunca contiene',in:'en',gt:'>',gte:'≥',lt:'<',lte:'≤',between:'entre',last_days:'últimos N días',older_days:'más de N días',exists:'existe',not_exists:'no existe',is_true:'sí',is_false:'no',is_unknown:'desconocido'};return m[o]||o}
function valueCtl(meta,r){if(['is_true','is_false','is_unknown','exists','not_exists'].includes(r.operator))return '<input class="ctl" disabled value="—">';var en=meta.enum_values||[];if(en.length)return '<select class="ctl val"><option value="">Seleccionar…</option>'+en.map(function(x){return '<option value="'+h(x)+'"'+(String(x)===String(r.value)?' selected':'')+'>'+h(x)+'</option>'}).join('')+'</select>';var typ=meta.data_type||'text';return '<input class="ctl val" '+(typ==='number'?'type="number"':'')+' value="'+h(r.value==null?'':r.value)+'" placeholder="Valor">'}
function validateFilter(){currentFilter=buildFilter();gateway('VALIDATE',{filter:currentFilter}).then(function(j){var v=j.validation||{};document.getElementById('validation').innerHTML=v.valid?'<b style="color:#059669">✓ DSL válido</b> · '+fmt(v.rule_count||rules.length)+' reglas':'<b style="color:#DC2626">✕ DSL inválido</b><br>'+h(JSON.stringify(v.errors||v))})}
function runCountPreview(){currentFilter=buildFilter();document.getElementById('res-count').textContent='…';document.getElementById('preview').innerHTML='<div class="empty">Resolviendo audiencia…</div>';gateway('COUNT',{filter:currentFilter}).then(function(j){if(!j.ok)throw new Error(j.error||'COUNT_ERROR');currentCount=j.count;document.getElementById('res-count').textContent=fmt(j.count);return runPreview()}).catch(showResultError)}
function runPreview(){if(!currentFilter)return;var page=window._page||0,limit=50;document.getElementById('page-txt').textContent='Página '+(page+1);gateway('PREVIEW',{filter:currentFilter,limit:limit,offset:page*limit}).then(function(j){if(!j.ok)throw new Error(j.error||'PREVIEW_ERROR');currentCount=j.count;document.getElementById('res-count').textContent=fmt(j.count);renderPreview(j.items||[])}).catch(showResultError)}
function showResultError(e){document.getElementById('preview').innerHTML='<div class="empty" style="color:#DC2626">'+h(e.message)+'</div>'}
function renderPreview(items){var p=document.getElementById('preview');if(!items.length){p.innerHTML='<div class="empty">Sin contactos para estas reglas.</div>';return}p.innerHTML='<div class="table-wrap"><table class="tbl"><thead><tr><th>Contacto</th><th>Identidad</th><th>Segmento</th><th>Interés</th><th>Última llamada</th><th>Próxima cita</th><th>Ventas</th><th>Seguimientos</th><th></th></tr></thead><tbody>'+items.map(function(x){return '<tr><td><b>'+h(x.name||x.contact_key)+'</b><br><span class="muted">'+h(x.contact_key)+'</span></td><td><span class="tag '+(x.identity_conflict?'warn':'')+'">'+h(x.identity_status||'—')+'</span></td><td><b>'+h(x.value_tier||'STANDARD')+'</b><br><span class="muted">'+h(x.lifecycle||'—')+'</span></td><td>'+h(x.latest_interest||'—')+'</td><td>'+h(x.latest_call_status||'—')+'<br><span class="muted">'+h(dt(x.last_call_at))+'</span></td><td>'+h(x.next_appointment_at||'—')+'</td><td><b>'+fmt(x.sale_count)+'</b> · S/'+fmt(Math.round(Number(x.revenue_lifetime||0)))+'</td><td>Pend. '+fmt(x.pending_followups)+'<br>Venc. '+fmt(x.overdue_followups)+'</td><td><button class="btn ghost explain" data-k="'+h(x.contact_key)+'">Explicar</button></td></tr>'}).join('')+'</tbody></table></div>';p.querySelectorAll('.explain').forEach(function(b){b.onclick=function(){explain(this.dataset.k)}})}
function explain(k){gateway('EXPLAIN',{filter:currentFilter,contact_key:k}).then(function(j){if(!j.ok)throw new Error(j.error||'EXPLAIN_ERROR');var m=document.getElementById('modal');m.classList.remove('hidden');m.innerHTML='<div class="modal"><div style="display:flex;align-items:center"><div><h2 class="section-title" style="margin:0">Por qué '+(j.included?'entra':'no entra')+'</h2><div class="muted">Contacto '+h(k)+' · '+h(j.evaluation_state)+'</div></div><div class="spacer"></div><button class="btn ghost" id="close-modal">Cerrar</button></div><div class="trace">'+traceHTML(j.trace)+'</div></div>';document.getElementById('close-modal').onclick=function(){m.classList.add('hidden')}}).catch(function(e){alert(e.message)})}
function traceHTML(n){if(!n)return'';if(n.kind==='rule')return '<div class="trace-node trace-'+h(n.evaluation_state)+'"><span class="state '+h(n.evaluation_state)+'">'+h(n.evaluation_state)+'</span> · <b>'+h(n.field)+'</b> '+h(n.operator)+' → observado: <code>'+h(JSON.stringify(n.observed))+'</code>'+(n.unresolved_evidence?'<br><span class="muted">Evidencia no resuelta: '+h(n.unresolved_evidence)+'</span>':'')+'</div>';return '<div class="trace-node trace-'+h(n.evaluation_state)+'"><b>'+h(n.op||'GROUP')+'</b> <span class="state '+h(n.evaluation_state)+'">'+h(n.evaluation_state)+'</span>'+((n.children||[]).map(traceHTML).join(''))+'</div>'}
function renderSegments(){document.getElementById('tab-segments').innerHTML='<div class="grid seg-grid"><div class="card"><h2 class="section-title">Customer Tier Engine</h2><div class="tiers">'+tierHTML('DIAMANTE','diamond')+tierHTML('GOLD','gold')+tierHTML('PREMIUM','premium')+tierHTML('STANDARD','standard')+'</div><div class="info" style="margin-top:9px">El tier económico se mantiene separado de los rasgos de comportamiento. Un contacto puede ser GOLD + INACTIVO, DIAMANTE + RIESGO, etc. Fase 5 es lectura/observación; la edición de políticas no está habilitada aquí.</div></div><div class="card"><h2 class="section-title">Frescura controlada</h2><p class="muted">La actividad operativa es LIVE. Segmentación e Email Engagement se recalculan de forma explícita y auditable.</p><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn purple" id="ref-seg">Actualizar segmentos</button><button class="btn primary" id="ref-email">Actualizar email</button></div><div id="ref-msg" class="info" style="margin-top:9px">No hay refrescos pendientes solicitados.</div></div></div><div class="future" style="margin-top:10px"><div class="card"><h2 class="section-title">Distribución 🔒</h2><div class="muted">Asignación a asesores · Fase 6.</div></div><div class="card"><h2 class="section-title">Activaciones 🔒</h2><div class="muted">Canal, snapshot y resultados · fases siguientes.</div></div><div class="card"><h2 class="section-title">Gobernanza 🔒</h2><div class="muted">Solicitudes y aprobaciones · fases siguientes.</div></div></div>';document.getElementById('ref-seg').onclick=function(){refresh('REFRESH_SEGMENTS')};document.getElementById('ref-email').onclick=function(){refresh('REFRESH_EMAIL')}}
function refresh(a){var x=document.getElementById('ref-msg');x.textContent='Actualizando…';gateway(a,{}).then(function(j){if(!j.ok)throw new Error(j.error||'REFRESH_ERROR');x.textContent='✓ Actualizado: '+dt(j.refreshed_at)+' · '+fmt(j.rows)+' filas';return gateway('BOOTSTRAP',{})}).then(function(j){boot=j;renderFresh()}).catch(function(e){x.textContent='Error: '+e.message})}
window.goTab=function(name){document.querySelectorAll('.tab[data-tab]').forEach(function(b){b.classList.toggle('act',b.dataset.tab===name)});['dashboard','presets','builder','segments'].forEach(function(t){document.getElementById('tab-'+t).classList.toggle('hidden',t!==name)})};
document.querySelectorAll('.tab[data-tab]').forEach(function(b){b.onclick=function(){goTab(this.dataset.tab)}});
if(!isAdminNormal()){document.body.innerHTML='<div class="empty" style="padding-top:20vh"><h2>Acceso restringido</h2>Este módulo requiere una sesión administrativa de ASCENDA.<br><br><button class="btn primary" onclick="location.href=\'/login.html\'">Ir al login</button></div>';return}
if(token())loadBootstrap();else showAuth();
})();
</script>
