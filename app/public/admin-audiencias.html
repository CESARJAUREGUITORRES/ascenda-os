function renderBuilder(){if(!rules.length)rulesFromFilter(currentFilter||{root:{op:'AND',rules:[]}});var el=document.getElementById('tab-builder');el.innerHTML='<div class="grid builder"><div class="card"><h2 class="section-title">Constructor seguro</h2><div class="muted" style="margin-bottom:9px">DSL whitelisted; nunca SQL.</div><div class="rulebar"><span class="muted">Combinar con</span><select id="root-op" class="ctl" style="width:auto"><option>AND</option><option>OR</option></select><button id="add-rule" class="btn ghost">+ Regla</button></div><div id="rules"></div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px"><button class="btn primary" id="validate-btn">Validar</button><button class="btn green" id="run-btn">Contar + Preview</button><button class="btn ghost" disabled>Guardar audiencia 🔒</button></div><div id="validation" class="info" style="margin-top:9px">Sin validar.</div></div><div class="card"><div class="result-head"><div><div class="muted">Resultado actual</div><div class="count" id="res-count">—</div></div><div class="spacer"></div><button class="btn ghost" id="prev-btn">←</button><span class="muted" id="page-txt">Página 1</span><button class="btn ghost" id="next-btn">→</button></div><div id="preview" class="empty">Construye o selecciona una audiencia.</div></div></div>';document.getElementById('root-op').value=rootOp;document.getElementById('root-op').onchange=function(){rootOp=this.value};document.getElementById('add-rule').onclick=function(){if(rules.length<25){rules.push(defaultRule());renderRules()}};document.getElementById('validate-btn').onclick=validateFilter;document.getElementById('run-btn').onclick=function(){page=0;runCountPreview()};document.getElementById('prev-btn').onclick=function(){page=Math.max(0,page-1);runPreview()};document.getElementById('next-btn').onclick=function(){if((page+1)*50<currentCount){page++;runPreview()}};renderRules()}
function renderRules(){var host=document.getElementById('rules');if(!host)return;host.innerHTML=rules.map(function(r,i){var meta=reg(r.field)||{},ops=meta.allowed_operators||['eq'];if(ops.indexOf(r.operator)<0)r.operator=ops[0];return '<div class="rule" data-i="'+i+'"><select class="ctl fld">'+groupedOptions().replace('value="'+h(r.field)+'"','value="'+h(r.field)+'" selected')+'</select><select class="ctl op">'+ops.map(function(o){return '<option value="'+h(o)+'"'+(o===r.operator?' selected':'')+'>'+h(opLabel(o))+'</option>'}).join('')+'</select><span class="valhost">'+valueCtl(meta,r)+'</span><button class="btn danger del" aria-label="Eliminar regla">×</button></div>'}).join('');host.querySelectorAll('.rule').forEach(function(row){var i=Number(row.dataset.i);row.querySelector('.fld').onchange=function(){rules[i]=defaultRule();rules[i].field=this.value;var m=reg(this.value)||{};rules[i].operator=(m.allowed_operators||['eq'])[0];renderRules()};row.querySelector('.op').onchange=function(){rules[i].operator=this.value;renderRules()};var v=row.querySelector('.val');if(v)v.onchange=v.oninput=function(){rules[i].value=this.value};row.querySelector('.del').onclick=function(){rules.splice(i,1);if(!rules.length)rules.push(defaultRule());renderRules()}})}
function validateFilter(){currentFilter=buildFilter();gateway('VALIDATE',{filter:currentFilter}).then(function(j){var v=j.validation||{};document.getElementById('validation').innerHTML=v.valid?'<b style="color:#059669">✓ DSL válido</b> · '+fmt(v.rule_count||rules.length)+' reglas':'<b style="color:#dc2626">✕ DSL inválido</b><br>'+h(JSON.stringify(v.errors||v))}).catch(function(e){document.getElementById('validation').textContent='Error: '+e.message})}
function runCountPreview(){currentFilter=buildFilter();document.getElementById('res-count').textContent='…';document.getElementById('preview').innerHTML='<div class="empty">Resolviendo audiencia…</div>';gateway('COUNT',{filter:currentFilter}).then(function(j){if(!j.ok)throw new Error(j.error||'COUNT_ERROR');currentCount=Number(j.count||0);document.getElementById('res-count').textContent=fmt(currentCount);return runPreview()}).catch(showResultError)}
function runPreview(){if(!currentFilter)return;document.getElementById('page-txt').textContent='Página '+(page+1);gateway('PREVIEW',{filter:currentFilter,limit:50,offset:page*50}).then(function(j){if(!j.ok)throw new Error(j.error||'PREVIEW_ERROR');currentCount=Number(j.count||0);document.getElementById('res-count').textContent=fmt(currentCount);renderPreview(j.items||[])}).catch(showResultError)}
function showResultError(e){document.getElementById('preview').innerHTML='<div class="empty" style="color:#dc2626">'+h(e.message)+'</div>'}
function renderPreview(items){var p=document.getElementById('preview');if(!items.length){p.innerHTML='<div class="empty">Sin contactos para estas reglas.</div>';return}p.innerHTML='<div class="table-wrap"><table class="tbl"><thead><tr><th>Contacto</th><th>Identidad</th><th>Segmento</th><th>Interés</th><th>Última llamada</th><th>Próxima cita</th><th>Ventas</th><th>Seguimientos</th><th></th></tr></thead><tbody>'+items.map(function(x){return '<tr><td><b>'+h(x.name||x.contact_key)+'</b><br><span class="muted">'+h(x.contact_key)+'</span></td><td><span class="tag '+(x.identity_conflict?'warn':'')+'">'+h(x.identity_status||'—')+'</span></td><td><b>'+h(x.value_tier||'STANDARD')+'</b><br><span class="muted">'+h(x.lifecycle||'—')+'</span></td><td>'+h(x.latest_interest||'—')+'</td><td>'+h(x.latest_call_status||'—')+'<br><span class="muted">'+h(dt(x.last_call_at))+'</span></td><td>'+h(x.next_appointment_at||'—')+'</td><td><b>'+fmt(x.sale_count)+'</b> · S/'+fmt(Math.round(Number(x.revenue_lifetime||0)))+'</td><td>Pend. '+fmt(x.pending_followups)+'<br>Venc. '+fmt(x.overdue_followups)+'</td><td><button class="btn ghost explain" data-k="'+h(x.contact_key)+'">Explicar</button></td></tr>'}).join('')+'</tbody></table></div>';p.querySelectorAll('.explain').forEach(function(b){b.onclick=function(){explain(this.dataset.k)}})}
function explain(k){gateway('EXPLAIN',{filter:currentFilter,contact_key:k}).then(function(j){if(!j.ok)throw new Error(j.error||'EXPLAIN_ERROR');var m=document.getElementById('modal');m.classList.remove('hidden');m.innerHTML='<div class="modal"><div style="display:flex;align-items:center"><div><h2 class="section-title">Por qué '+(j.included?'entra':'no entra')+'</h2><div class="muted">Contacto '+h(k)+' · '+h(j.evaluation_state)+'</div></div><div class="spacer"></div><button class="btn ghost" id="close-modal">Cerrar</button></div><div class="trace">'+traceHTML(j.trace)+'</div></div>';document.getElementById('close-modal').onclick=function(){m.classList.add('hidden')}}).catch(function(e){notice('No se pudo explicar el contacto: '+e.message,'error')})}
function traceHTML(n){if(!n)return'';if(n.kind==='rule')return '<div class="trace-node trace-'+h(n.evaluation_state)+'"><span class="state '+h(n.evaluation_state)+'">'+h(n.evaluation_state)+'</span> · <b>'+h(n.field)+'</b> '+h(n.operator)+' → observado: <code>'+h(JSON.stringify(n.observed))+'</code>'+(n.unresolved_evidence?'<br><span class="muted">Evidencia no resuelta: '+h(n.unresolved_evidence)+'</span>':'')+'</div>';return '<div class="trace-node trace-'+h(n.evaluation_state)+'"><b>'+h(n.op||'GROUP')+'</b> <span class="state '+h(n.evaluation_state)+'">'+h(n.evaluation_state)+'</span>'+((n.children||[]).map(traceHTML).join(''))+'</div>'}
function renderSegments(){document.getElementById('tab-segments').innerHTML='<div class="grid seg-grid"><div class="card"><h2 class="section-title">Customer Tier Engine</h2><div class="tiers">'+tierHTML('DIAMANTE','diamond')+tierHTML('GOLD','gold')+tierHTML('PREMIUM','premium')+tierHTML('STANDARD','standard')+'</div><div class="info" style="margin-top:9px">Tier económico separado de rasgos conductuales. Fase 5 es lectura/observación.</div></div><div class="card"><h2 class="section-title">Frescura controlada</h2><p class="muted">Operacional LIVE; Segmentación e Email se actualizan explícitamente.</p><div style="display:flex;gap:6px"><button class="btn purple" id="ref-seg">Actualizar segmentos</button><button class="btn primary" id="ref-email">Actualizar email</button></div><div id="ref-msg" class="info" style="margin-top:9px">Sin refrescos pendientes.</div></div></div><div class="future"><div class="card"><h2 class="section-title">Distribución 🔒</h2><div class="muted">Fase 6+</div></div><div class="card"><h2 class="section-title">Activaciones 🔒</h2><div class="muted">Fase 7+</div></div><div class="card"><h2 class="section-title">Gobernanza 🔒</h2><div class="muted">Fase 13+</div></div></div>';document.getElementById('ref-seg').onclick=function(){refresh('REFRESH_SEGMENTS')};document.getElementById('ref-email').onclick=function(){refresh('REFRESH_EMAIL')}}
function refresh(action){var x=document.getElementById('ref-msg');x.textContent='Actualizando…';gateway(action,{}).then(function(j){if(!j.ok)throw new Error(j.error||'REFRESH_ERROR');x.textContent='✓ Actualizado: '+dt(j.refreshed_at)+' · '+fmt(j.rows)+' filas';return gateway('BOOTSTRAP',{})}).then(function(j){boot=j;renderFresh()}).catch(function(e){x.textContent='Error: '+e.message})}
function goTab(name){document.querySelectorAll('.tab[data-tab]').forEach(function(b){b.classList.toggle('act',b.dataset.tab===name)});['dashboard','presets','builder','segments'].forEach(function(t){document.getElementById('tab-'+t).classList.toggle('hidden',t!==name)})}
function bindGo(){document.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){goTab(this.dataset.go)}})}
document.querySelectorAll('.tab[data-tab]').forEach(function(b){b.onclick=function(){goTab(this.dataset.tab)}});
if(!isAdminNormal()){document.body.innerHTML='<div class="empty" style="padding-top:20vh"><h2>Acceso restringido</h2>Este módulo requiere una sesión administrativa de ASCENDA.<br><br><button class="btn primary" onclick="location.href=\'/login.html\'">Ir al login</button></div>';return}
if(token())loadBootstrap();else showAuth();
})();
</script>
