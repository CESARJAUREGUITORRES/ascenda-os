<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:'DM Sans',sans-serif;background:#f0f4fc;color:#0d1b3e}.wrap{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}.hero{background:linear-gradient(145deg,#071d4a,#0a4fbf 62%,#1a6fe8);padding:64px;display:flex;flex-direction:column;justify-content:center;color:#fff;position:relative;overflow:hidden}.hero:after{content:'';position:absolute;width:430px;height:430px;border-radius:50%;background:#00e5a0;opacity:.08;right:-150px;top:-110px}.brand{font:800 28px 'Exo 2';letter-spacing:1px;margin-bottom:55px}.brand span{color:#00e5a0}.ey{font-size:11px;letter-spacing:3px;opacity:.55;text-transform:uppercase}.hero h1{font:800 clamp(34px,4vw,54px)/1.08 'Exo 2';margin:18px 0}.hero h1 b{color:#00e5a0}.hero p{max-width:410px;line-height:1.7;opacity:.68}.side{display:flex;align-items:center;justify-content:center;background:#fff;padding:36px}.card{width:min(390px,100%)}.logo{width:52px;height:52px;border-radius:15px;background:#ebf2ff;display:grid;place-items:center;margin:0 auto 16px;overflow:hidden}.logo img{width:34px;height:34px;display:block;object-fit:contain}.head{text-align:center;margin-bottom:30px}.head h2{font:800 22px 'Exo 2';margin:0}.head p{font-size:13px;color:#6b7ba8}.field{margin:15px 0}.field label{display:block;font-size:10px;font-weight:800;letter-spacing:.7px;color:#8291b3;text-transform:uppercase;margin-bottom:7px}.field input{width:100%;border:1px solid #dde4f5;background:#f7f9fe;border-radius:11px;padding:13px 14px;font:14px 'DM Sans';outline:none}.field input:focus{border-color:#0a4fbf;box-shadow:0 0 0 3px rgba(10,79,191,.08);background:#fff}.input-wrap{position:relative}.input-wrap input{padding-right:48px}.pass-toggle{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:9px;background:transparent;color:#65779c;display:grid;place-items:center;cursor:pointer}.pass-toggle:hover{background:#eaf1ff;color:#0a4fbf}.pass-toggle:focus-visible{outline:2px solid #0a4fbf;outline-offset:1px}.pass-toggle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.btn{width:100%;border:0;border-radius:11px;padding:13px;background:linear-gradient(135deg,#0a4fbf,#1a6fe8);color:#fff;font:700 14px 'Exo 2';cursor:pointer;margin-top:10px;box-shadow:0 7px 20px rgba(10,79,191,.22)}.btn:disabled{opacity:.55;cursor:wait}.msg{min-height:20px;margin-top:12px;font-size:12px;text-align:center;color:#dc2626}.muted{font-size:11px;text-align:center;color:#9aaac8;margin-top:22px}.otp{display:flex;gap:7px;justify-content:center;margin:20px 0}.otp input{width:45px;height:55px;border:2px solid #dde4f5;border-radius:12px;text-align:center;font:800 25px 'Exo 2';outline:none}.otp input:focus{border-color:#0a4fbf}.ok{color:#059669}.back{border:0;background:none;color:#0a4fbf;font-weight:700;cursor:pointer;margin-top:12px;width:100%}@media(max-width:780px){.wrap{grid-template-columns:1fr}.hero{display:none}.side{min-height:100vh;padding:24px}}
</style></head><body><div class="wrap"><section class="hero"><div class="brand">ASCENDA<span>OS</span></div><div class="ey">Sistema de gestión clínica y comercial</div><h1>Tu equipo.<br>Tu <b>operación.</b><br>Tu control.</h1><p>Acceso protegido para los módulos operativos, financieros y clínicos de ASCENDA.</p></section><section class="side"><div class="card" id="card"><div class="logo"><img src="/favicon.png" alt="AscendaOS"></div><div class="head"><h2>Iniciar sesión</h2><p>Ingresa tus credenciales para continuar</p></div><div class="field"><label for="user">Usuario o email</label><input id="user" autocomplete="username" autocapitalize="none"></div><div class="field"><label for="pass">Contraseña</label><div class="input-wrap"><input id="pass" type="password" autocomplete="current-password"><button class="pass-toggle" id="togglePass" type="button" aria-label="Mostrar contraseña" aria-pressed="false" title="Mostrar contraseña"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.8"></circle></svg></button></div></div><button class="btn" id="login">Ingresar al sistema</button><div class="msg" id="msg"></div><div class="muted">AscendaOS · acceso seguro v3</div></div></section></div>
<script>
(function(){
'use strict';
var SB='https://ituyqwstonmhnfshnaqz.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXlxd3N0b25taG5mc2huYXF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3NDQyMTgsImV4cCI6MjA5MDMyMDIxOH0.w_pU4ecrrgekB7WzWrQrQd_7Deu_Cxm5ybUCZry5Mh0';
var challenge='',loginUser='',loginPass='',masked='';
function $(x){return document.getElementById(x)}
function rpc(name,p){
  var routes={aos_login_v3:'/api/auth/v3/login',aos_verificar_2fa_v3:'/api/auth/v3/verify'};
  var same=routes[name];
  var url=same||SB+'/rest/v1/rpc/'+name;
  var headers={'Content-Type':'application/json'};
  if(!same){headers.apikey=KEY;headers.Authorization='Bearer '+KEY;}
  return fetch(url,{method:'POST',headers:headers,body:JSON.stringify(p||{}),cache:'no-store',credentials:same?'same-origin':'omit'}).then(function(r){
    return r.text().then(function(t){var d={};try{d=t?JSON.parse(t):{};}catch(e){d={ok:false,error:'Respuesta de autenticación inválida'};}return {status:r.status,data:d,route:r.headers.get('X-Ascenda-Auth-Route')||'direct'};});
  });
}
function message(t,ok){var m=$('msg')||$('otpmsg');if(m){m.textContent=t||'';m.className='msg'+(ok?' ok':'')}}
function busy(on){var b=$('login')||$('verify');if(b)b.disabled=on}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function authError(d,fallback){var e=String(d&&d.error||'');if(e==='AUTH_UPSTREAM_UNAVAILABLE'||e==='PHASE_S_UPSTREAM_UNAVAILABLE'||e==='PHASE_S_AUTH_VERIFY_UNAVAILABLE')return 'El servicio de acceso está temporalmente ocupado. Intenta nuevamente en unos segundos.';return e||fallback||'No fue posible iniciar sesión.'}
function togglePassword(){var p=$('pass'),b=$('togglePass');if(!p||!b)return;var show=p.type==='password';p.type=show?'text':'password';b.setAttribute('aria-pressed',show?'true':'false');b.setAttribute('aria-label',show?'Ocultar contraseña':'Mostrar contraseña');b.title=show?'Ocultar contraseña':'Mostrar contraseña'}
function login(){loginUser=$('user').value.trim();loginPass=$('pass').value;if(!loginUser||!loginPass){message('Completa usuario y contraseña.');return}busy(true);message('');rpc('aos_login_v3',{p_usuario:loginUser.toLowerCase(),p_password:loginPass}).then(function(x){busy(false);var d=x.data||{};if(!d.ok){message(authError(d,'No fue posible iniciar sesión.'));return}if(d.require_2fa){challenge=d.challenge_id;masked=d.email_masked||'';showOtp();return}finish(d)}).catch(function(e){busy(false);console.error('[AUTH-V3] transport',e);message('El servicio de acceso está temporalmente ocupado. Intenta nuevamente en unos segundos.')})}
function showOtp(){var c=$('card');c.innerHTML='<div class="logo"><img src="/favicon.png" alt="AscendaOS"></div><div class="head"><h2>Verificación 2FA</h2><p>Código enviado a <b>'+escapeHtml(masked)+'</b></p></div><div class="otp">'+[0,1,2,3,4,5].map(function(i){return '<input class="digit" maxlength="1" inputmode="numeric" data-i="'+i+'">'}).join('')+'</div><button class="btn" id="verify">Verificar e ingresar</button><div class="msg" id="otpmsg"></div><button class="back" id="resend">↻ Reenviar código</button><button class="back" onclick="location.reload()">← Volver</button><div class="muted">El código vence en 5 minutos</div>';var ds=document.querySelectorAll('.digit');ds.forEach(function(el,i){el.addEventListener('input',function(){el.value=el.value.replace(/\D/g,'');if(el.value&&i<5)ds[i+1].focus()});el.addEventListener('keydown',function(e){if(e.key==='Backspace'&&!el.value&&i>0)ds[i-1].focus()})});ds[0].focus();$('verify').onclick=verify;$('resend').onclick=resend}
function verify(){var code='';document.querySelectorAll('.digit').forEach(function(d){code+=d.value});if(code.length!==6){message('Ingresa los 6 dígitos.');return}busy(true);rpc('aos_verificar_2fa_v3',{p_challenge_id:challenge,p_codigo:code}).then(function(x){busy(false);var d=x.data||{};if(!d.ok){message(authError(d,'Código incorrecto o expirado.'));document.querySelectorAll('.digit').forEach(function(e){e.value='' });return}message('Código verificado.',true);finish(d)}).catch(function(e){busy(false);console.error('[AUTH-V3] verify transport',e);message('No fue posible verificar el código.')})}
function resend(){message('Enviando nuevo código...');rpc('aos_login_v3',{p_usuario:loginUser.toLowerCase(),p_password:loginPass}).then(function(x){var d=x.data||{};if(d.ok&&d.require_2fa){challenge=d.challenge_id;masked=d.email_masked||masked;message('Código reenviado.',true)}else message(authError(d,'No se pudo reenviar.'))}).catch(function(){message('Error de conexión.')})}
function allowedGeo(d,cb){if((d.acceso_geo||'libre')==='libre'||!navigator.geolocation){cb(true);return}navigator.geolocation.getCurrentPosition(function(pos){var sites=[{n:'SAN_ISIDRO',lat:-12.09352,lng:-77.02721},{n:'PUEBLO_LIBRE',lat:-12.07809,lng:-77.06838}],allowed=d.sedes_permitidas||[],best=1e9;sites.forEach(function(s){if(allowed.indexOf(s.n)<0)return;var R=6371000,a=(pos.coords.latitude-s.lat)*Math.PI/180,b=(pos.coords.longitude-s.lng)*Math.PI/180,q=Math.sin(a/2)*Math.sin(a/2)+Math.cos(pos.coords.latitude*Math.PI/180)*Math.cos(s.lat*Math.PI/180)*Math.sin(b/2)*Math.sin(b/2);best=Math.min(best,R*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q)))});cb(best<=500)},function(){cb(false)},{timeout:8000,enableHighAccuracy:true})}
function finish(d){allowedGeo(d,function(ok){if(!ok){message('Acceso denegado: ubicación fuera de la sede autorizada.');return}var app=d.app_token||'',fin=d.finance_token||'';try{if(app)sessionStorage.setItem('aos_app_token',app);if(fin){sessionStorage.setItem('aos_si_token',fin);sessionStorage.setItem('aos_si_expires_at',d.expires_at||'')}else{sessionStorage.removeItem('aos_si_token')}localStorage.setItem('aos_session',JSON.stringify({codigo_asesor:d.codigo_asesor||d.usuario,nombre:d.nombre||d.usuario,apellido:d.apellido||'',puesto:d.puesto||'',sede:d.sede||'',usuario:d.usuario||d.nombre,permisos:d.permisos||{},paneles_acceso:d.paneles_acceso||[],avatar_url:d.avatar_url||'',nivel:d.nivel||4,area:d.area||'',expires:Date.now()+8*60*60*1000}))}catch(e){}registerBridge(app).then(function(){location.href='/app'})})}
function registerBridge(token){
  if(!('serviceWorker'in navigator))return Promise.resolve();
  return navigator.serviceWorker.register('/phase2-service-worker.js',{scope:'/',updateViaCache:'none'}).then(function(reg){
    return reg.update().catch(function(){return reg}).then(function(){
      var pending=reg.installing||reg.waiting;
      if(!pending)return reg;
      if(reg.waiting){try{reg.waiting.postMessage({type:'ASCENDA_ACTIVATE_NOW'})}catch(e){}}
      return new Promise(function(resolve){
        var done=false,t=setTimeout(finishActivation,4000);
        function finishActivation(){if(done)return;done=true;clearTimeout(t);navigator.serviceWorker.removeEventListener('controllerchange',finishActivation);resolve(reg)}
        navigator.serviceWorker.addEventListener('controllerchange',finishActivation);
        try{pending.addEventListener('statechange',function(){if(pending.state==='activated'||pending.state==='redundant')finishActivation()})}catch(e){}
      });
    });
  }).then(function(){return navigator.serviceWorker.ready}).then(function(){return caches.open('aos-phase2-auth')}).then(function(c){return c.put('/__aos_app_token',new Response(token||''))}).catch(function(e){console.error('[AUTH] service worker',e)})
}
$('login').onclick=login;$('togglePass').onclick=togglePassword;$('user').addEventListener('keydown',function(e){if(e.key==='Enter')login()});$('pass').addEventListener('keydown',function(e){if(e.key==='Enter')login()});try{sessionStorage.removeItem('aos_app_token');sessionStorage.removeItem('aos_si_token');}catch(e){}
})();
</script></body></html>
